# GENERATED by bin/project_deploy qa — re-run to refresh; do not hand-edit.

# Self-contained: owns its own VPC, subnets, security groups, and RDS
# instance. DATABASE_URL resolves from RDS's managed password via a
# CloudFormation dynamic reference at deploy time, never written here.

# No NAT Gateway: these private subnets reach only the RDS instance and
# AWS APIs, not the public internet.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  quality-control-webhook — dispatched through hecks's rust/host, a
  wasmtime-sandboxed Rust binary with a rehydrate-and-replay Postgres
  journal (docs/decisions/0018), backed by its own private RDS
  Postgres instance. PackageType Zip, no container.

Resources:
  QualityControlWebhookDbVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
  
  QualityControlWebhookDbSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref QualityControlWebhookDbVpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  
  QualityControlWebhookDbSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref QualityControlWebhookDbVpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
  
  
  QualityControlWebhookDbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${AWS::StackName} - private subnets for quality-control-webhook's own RDS instance"
      SubnetIds: [!Ref QualityControlWebhookDbSubnetA, !Ref QualityControlWebhookDbSubnetB]
  
  # No inline Egress/Ingress on either group: each would need the
  # other's id in its own Properties, a circular create-order
  # dependency CloudFormation refuses (cfn-lint E3004). Two standalone
  # rule resources below wire the cross-reference after both exist.
  QualityControlWebhookFunctionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref QualityControlWebhookDbVpc
      GroupDescription: QualityControlWebhookFunction - no inbound (Lambda receives no traffic via its VPC ENI), egress rule attached separately below
  
  QualityControlWebhookDbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref QualityControlWebhookDbVpc
      GroupDescription: QualityControlWebhookDb - ingress rule attached separately below, from QualityControlWebhookFunction only
  
  QualityControlWebhookFunctionEgressToDb:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref QualityControlWebhookFunctionSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref QualityControlWebhookDbSecurityGroup
  
  
  QualityControlWebhookDbIngressFromFunction:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref QualityControlWebhookDbSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref QualityControlWebhookFunctionSecurityGroup
  
  QualityControlWebhookDb:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: "16.14"
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: "20"
      StorageEncrypted: true
      DBName: qualitycontrolwebhook
      MasterUsername: postgres
      ManageMasterUserPassword: true
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref QualityControlWebhookDbSubnetGroup
      VPCSecurityGroups: [!Ref QualityControlWebhookDbSecurityGroup]

  
  # VPC-attached (needs the private RDS instance directly), sharing this
  # security group's egress-to-DB rule. Reaching QualityControlWebhookFunction needs
  # `lambda:InvokeFunction`, a public AWS API call — the VPC Interface
  # Endpoint below substitutes for a NAT Gateway.
  QualityControlWebhookDbLambdaEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref QualityControlWebhookDbVpc
      # EC2's GroupDescription rejects non-ASCII characters and
      # apostrophes (a live "Invalid security group description" error).
      GroupDescription: QualityControlWebhookDbLambdaEndpoint - HTTPS from this stacks own Lambdas only
  
  QualityControlWebhookDbLambdaEndpointIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref QualityControlWebhookDbLambdaEndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref QualityControlWebhookFunctionSecurityGroup
  
  QualityControlWebhookDbLambdaEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref QualityControlWebhookDbVpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.lambda"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref QualityControlWebhookDbSubnetA, !Ref QualityControlWebhookDbSubnetB]
      SecurityGroupIds: [!Ref QualityControlWebhookDbLambdaEndpointSecurityGroup]
  
  # Auto-generated, never typed or seen — same ManageMasterUserPassword
  # pattern as QualityControlWebhookDb, applied to the session-signing secret.
  WebFunctionSessionSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: session_secret
        PasswordLength: 64
        ExcludePunctuation: true
  
  # Auto-generated, never typed or seen — same indirection as
  # DB_SECRET_ARN/SESSION_SECRET_ARN: only the ARN reaches Lambda's
  # configuration, never a resolved plaintext value.
  WebFunctionWebhookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: value
        PasswordLength: 64
        ExcludePunctuation: true
  
  
  WebFunction:
    Type: AWS::Serverless::Function
    # No Metadata.BuildMethod: SAM's built-in Ruby bundler workflow
    # handles `Runtime: ruby3.2` automatically, unlike
    # QualityControlWebhookFunction's Rust binary above.

    # Runtime stays ruby3.2 even though `sam validate --lint` flags it
    # deprecated: patch-pg-native's build image and pg_ext.so path glob
    # (this Makefile) are hardcoded to this exact runtime. Bumping it
    # needs reworking that native pg build first.
    Properties:
      FunctionName: hecks-quality-control-webhook-web
      Runtime: ruby3.2
      Architectures: [arm64]
      # Three parts (file.Class.method), not two: aws-lambda-ric's
      # 2-part form calls a top-level function via __send__, not a
      # module method (a live "LambdaHandler is not a module" error).
      Handler: qa/lambda_handler.QaWebhookLambdaHandler.lambda_handler
      CodeUri: /Users/christopheryoung/Projects/hecks/.claude/worktrees/agent-a7ac753ca2c223e76
      MemorySize: 512
      Timeout: 15
      Environment:
        Variables:
          DOMAIN_ROOT: /var/task
          # infra_name, not declared_domain_name: RemoteDispatcher invokes
          # `hecks-#{infra_name}`, matching this stack's name — the
          # domain's business name here 404s at runtime.
          DOMAIN_NAME: quality-control-webhook
          HECKS_LAMBDA_ROUTING: "true"
          HECKS_LAMBDA_REGION: us-east-1
          # Sinatra's host_authorization is permissive only in
          # production mode; leaving RACK_ENV unset 403s on this
          # function's *.lambda-url.*.on.aws hostname.
          RACK_ENV: production
          # pg's native extension needs a newer glibc than Lambda's base
          # image; `patch-pg-native` (this Makefile) rebuilds it from
          # source. Never set LD_LIBRARY_PATH here — it replaces, not extends.

          # Same RDS instance QualityControlWebhookFunction writes its journal into,
          # but a different schema/role (Ruby's era/lineage tables, not
          # rust/host's journal).

          # DB_SECRET_ARN/SESSION_SECRET_ARN/GITHUB_WEBHOOK_SECRET_ARN are
          # ARNs only. The app's own `lambda_handler.rb` must resolve each
          # via aws-sdk-secretsmanager itself; an unupdated handler breaks.
          DB_HOST: !GetAtt QualityControlWebhookDb.Endpoint.Address
          DB_NAME: qualitycontrolwebhook
          DB_SECRET_ARN: !Sub "${QualityControlWebhookDb.MasterUserSecret.SecretArn}"
          SESSION_SECRET_ARN: !Sub "${WebFunctionSessionSecret}"
          GITHUB_WEBHOOK_SECRET_ARN: !Sub "${WebFunctionWebhookSecret}"
          # GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET/GOOGLE_REDIRECT_URI
          # deliberately unset — no real OAuth credentials configured
          # yet. Add them to .env.local and regenerate to wire this up.
      VpcConfig:
        SubnetIds: [!Ref QualityControlWebhookDbSubnetA, !Ref QualityControlWebhookDbSubnetB]
        SecurityGroupIds: [!Ref QualityControlWebhookFunctionSecurityGroup]
      # Least-privilege: scoped to each secret's own ARN, plus
      # lambda:InvokeFunction on QualityControlWebhookFunction specifically —
      # SAM's default execution role grants neither.
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub "${QualityControlWebhookDb.MasterUserSecret.SecretArn}"
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub "${WebFunctionSessionSecret}"
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub "${WebFunctionWebhookSecret}"
        
      # NONE, not AWS_IAM — sign-in needs to be reachable over plain
      # HTTPS, unlike QualityControlWebhookFunction's AWS_IAM-protected URL.
      FunctionUrlConfig:
        AuthType: NONE


Outputs:
  FunctionUrl:
    Value: !GetAtt WebFunctionUrl.FunctionUrl
  # STACK_OUTPUTS (bin/project_deploy) is the one place these output
  # names live — DatabaseEndpoint/DatabaseSecretArn feed `make
  # mint-era`; VpcId/DbSecurityGroupId feed bastion.yaml's Parameters.
  # Rename a key here and update that table too.
  VpcId:
    Value: !Ref QualityControlWebhookDbVpc
  DbSecurityGroupId:
    Value: !Ref QualityControlWebhookDbSecurityGroup
  DatabaseEndpoint:
    Value: !GetAtt QualityControlWebhookDb.Endpoint.Address
  DatabaseSecretArn:
    Value: !GetAtt QualityControlWebhookDb.MasterUserSecret.SecretArn
  FunctionSecurityGroupId:
    Value: !Ref QualityControlWebhookFunctionSecurityGroup
  PrivateSubnetAId:
    Value: !Ref QualityControlWebhookDbSubnetA
  PrivateSubnetBId:
    Value: !Ref QualityControlWebhookDbSubnetB
