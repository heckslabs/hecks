# GENERATED by bin/project_deploy qa — re-run it to refresh
# this file rather than hand-editing. Deployed and destroyed by
# `make mint-era` (this directory's own Makefile) — never left
# running: it exists only long enough for one Ruby boot to reach
# quality-control-webhook's private RDS instance and mint era 1 (see
# template.yaml's own HECKS_DOMAIN/HECKS_ERA comment for why era 1
# is knowable ahead of time).
AWSTemplateFormatVersion: '2010-09-09'
Description: >
  TEMPORARY — quality-control-webhook's era-minting bastion. Deployed and torn
  down by `make mint-era`; not meant to run continuously.

# BASTION_PARAMETERS (bin/project_deploy) — the OTHER end of the
# contract template.yaml's own Outputs comment describes; the
# Makefile's --parameter-overrides line (below, mint-era target)
# fills these from the same table.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

Resources:
  # A NEW public subnet, not the RDS's own private ones — those have
  # no internet route at all (template.yaml's own "NO NAT GATEWAY"
  # header), and the SSM agent needs to reach AWS's own SSM
  # endpoints over HTTPS. 10.0.99.0/24 is picked to sit outside
  # template.yaml's own 10.0.1.0/24 and 10.0.2.0/24 ranges inside the
  # same /16 VPC.
  BastionSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: 10.0.99.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
  
  BastionInternetGateway:
    Type: AWS::EC2::InternetGateway
  
  BastionVpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VpcId
      InternetGatewayId: !Ref BastionInternetGateway
  
  BastionRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcId
  
  BastionInternetRoute:
    Type: AWS::EC2::Route
    DependsOn: BastionVpcGatewayAttachment
    Properties:
      RouteTableId: !Ref BastionRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref BastionInternetGateway
  
  BastionSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref BastionSubnet
      RouteTableId: !Ref BastionRouteTable
  # ZERO Ingress rules — SSM Session Manager is outbound-only from
  # the instance's side (it dials out to AWS's SSM service), so
  # nothing needs to reach this instance over the network at all,
  # despite it sitting in a public subnet with a public IP.
  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VpcId
      # A plain hyphen, not an em-dash - EC2's GroupDescription field
      # rejects any non-ASCII character outright (the same class of
      # bug already caught once this session on RDS's own
      # DBSubnetGroupDescription - see template.yaml's git history).
      GroupDescription: "TEMPORARY era-minting bastion - SSM only, no inbound rules"

  BastionToRds:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref BastionSecurityGroup

  BastionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  BastionInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref BastionRole]

  BastionInstance:
    Type: AWS::EC2::Instance
    Properties:
      # Amazon Linux 2023's own SSM parameter — always the current
      # AL2023 AMI for whatever region this deploys into, never a
      # hand-copied, region-specific, staleness-prone AMI id.
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: t3.micro
      SubnetId: !Ref BastionSubnet
      SecurityGroupIds: [!Ref BastionSecurityGroup]
      IamInstanceProfile: !Ref BastionInstanceProfile
      Tags:
        - { Key: Name, Value: hecks-quality-control-webhook-bastion }

Outputs:
  InstanceId:
    Value: !Ref BastionInstance
