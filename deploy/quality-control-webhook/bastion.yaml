# GENERATED by bin/project_deploy qa; re-run it rather than hand-editing.
# Temporary bastion, deployed and destroyed by `make mint-era` so one Ruby boot can mint era 1.
AWSTemplateFormatVersion: '2010-09-09'
Description: >
  TEMPORARY — quality-control-webhook's era-minting bastion. Deployed and torn
  down by `make mint-era`; not meant to run continuously.

# Filled by the Makefile's --parameter-overrides from bin/project_deploy's stack_outputs table.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

Resources:
  # Public because the RDS subnets have no internet route and the SSM agent needs HTTPS to AWS.
  # 10.0.99.0/24 avoids template.yaml's 10.0.1.0/24 and 10.0.2.0/24.
  BastionSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: 10.0.99.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
  
  BastionInternetGateway:
    Type: AWS::EC2::InternetGateway
  
  BastionVpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VpcId
      InternetGatewayId: !Ref BastionInternetGateway
  
  BastionRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcId
  
  BastionInternetRoute:
    Type: AWS::EC2::Route
    DependsOn: BastionVpcGatewayAttachment
    Properties:
      RouteTableId: !Ref BastionRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref BastionInternetGateway
  
  BastionSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref BastionSubnet
      RouteTableId: !Ref BastionRouteTable
  # No ingress rules: SSM Session Manager only dials out.
  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VpcId
      # ASCII only: EC2 rejects non-ASCII characters in GroupDescription.
      GroupDescription: "TEMPORARY era-minting bastion - SSM only, no inbound rules"

  BastionToRds:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref BastionSecurityGroup

  BastionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  BastionInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref BastionRole]

  BastionInstance:
    Type: AWS::EC2::Instance
    Properties:
      # Resolves the current AL2023 AMI for the region rather than a hard-coded id.
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: t3.micro
      SubnetId: !Ref BastionSubnet
      SecurityGroupIds: [!Ref BastionSecurityGroup]
      IamInstanceProfile: !Ref BastionInstanceProfile
      Tags:
        - { Key: Name, Value: hecks-quality-control-webhook-bastion }

Outputs:
  InstanceId:
    Value: !Ref BastionInstance
