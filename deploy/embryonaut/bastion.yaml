AWSTemplateFormatVersion: '2010-09-09'
Description: >
  TEMPORARY — embryonaut's era-minting bastion. Deployed and torn
  down by `make mint-era`; not meant to run continuously.

# BASTION_PARAMETERS (bin/project_deploy) — the OTHER end of the
# contract template.yaml's own Outputs comment describes; the
# Makefile's --parameter-overrides line (below, mint-era target)
# fills these from the same table.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
  BastionSubnetId:
    Type: AWS::EC2::Subnet::Id

Resources:
  # BastionSubnetId, not a subnet minted here — template.yaml's own
  # EmbryonautDbBastionPublicSubnet (and the Internet Gateway it shares
  # with EmbryonautDbPublicSubnet) already exist once google_oauth_present
  # is true, and a VPC accepts only ONE attached Internet Gateway:
  # this stack's own BastionInternetGateway (below, the no-oauth
  # branch) would collide with it -- a real, live
  # "Resource.AlreadyAssociated" caught this. Its own subnet, not
  # PublicSubnetId directly, despite sharing that subnet's route
  # table -- PublicSubnetId's AZ can't launch EC2 instances at all on
  # this account (a real, live CREATE_FAILED caught THAT too); see
  # BastionSubnetId's own STACK_OUTPUTS comment for the full story.
  # ZERO Ingress rules — SSM Session Manager is outbound-only from
  # the instance's side (it dials out to AWS's SSM service), so
  # nothing needs to reach this instance over the network at all,
  # despite it sitting in a public subnet with a public IP.
  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VpcId
      # A plain hyphen, not an em-dash - EC2's GroupDescription field
      # rejects any non-ASCII character outright (the same class of
      # bug already caught once this session on RDS's own
      # DBSubnetGroupDescription - see template.yaml's git history).
      GroupDescription: "TEMPORARY era-minting bastion - SSM only, no inbound rules"

  BastionToRds:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref BastionSecurityGroup

  BastionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  BastionInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref BastionRole]

  BastionInstance:
    Type: AWS::EC2::Instance
    Properties:
      # Amazon Linux 2023's own SSM parameter — always the current
      # AL2023 AMI for whatever region this deploys into, never a
      # hand-copied, region-specific, staleness-prone AMI id.
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: t3.micro
      SubnetId: !Ref BastionSubnetId
      SecurityGroupIds: [!Ref BastionSecurityGroup]
      IamInstanceProfile: !Ref BastionInstanceProfile
      Tags:
        - { Key: Name, Value: hecksagain-embryonaut-bastion }

Outputs:
  InstanceId:
    Value: !Ref BastionInstance
