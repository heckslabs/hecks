# Standalone fixture crate for spec/fuzzing/self_consistency_rust_spec.rb, kept outside
# `rust/`'s workspace. Same setup as qa_sweep_all_found_fixture_rust.
# The feature is named exactly like the fixture directory (`build_rust_for` matches on it).
[features]
self_consistency_rust_fixture = []

[package]
name = "self_consistency_rust_fixture"
version = "0.1.0"
edition = "2021"
publish = false

# Named "rust" because `RustConformanceHelpers#build_and_pin` always looks for target/debug/rust.
[[bin]]
name = "rust"
path = "src/main.rs"
