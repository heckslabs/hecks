# GENERATED by bin/project_deploy <domain> — re-run to refresh; do not
# hand-edit. Deployed and destroyed by `make mint-era`, never left
# running — it exists only long enough for one Ruby boot to reach
# widget-shop's private RDS instance and mint era 1.
AWSTemplateFormatVersion: '2010-09-09'
Description: >
  TEMPORARY — widget-shop's era-minting bastion. Deployed and torn
  down by `make mint-era`; not meant to run continuously.

# bastion_parameters (Shared.bastion_parameters) — filled by the
# Makefile's --parameter-overrides from the same STACK_OUTPUTS table
# the main template's Outputs comment describes.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
  BastionSubnetId:
    Type: AWS::EC2::Subnet::Id

Resources:
  # BastionSubnetId, not PublicSubnetId directly: a VPC accepts only
  # one attached Internet Gateway, and PublicSubnetId's AZ can't
  # launch EC2 instances at all on this account.

  # Zero Ingress rules — SSM Session Manager is outbound-only from the
  # instance's side, so nothing needs to reach it over the network,
  # despite the public subnet and public IP.
  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VpcId
      # A plain hyphen, not an em-dash — EC2's GroupDescription
      # field rejects any non-ASCII character.
      GroupDescription: "TEMPORARY era-minting bastion - SSM only, no inbound rules"

  BastionToRds:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref BastionSecurityGroup

  BastionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  BastionInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref BastionRole]

  BastionInstance:
    Type: AWS::EC2::Instance
    Properties:
      # Amazon Linux 2023's own SSM parameter — always the current AMI
      # for whatever region this deploys into, never a hand-copied one.
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: t3.micro
      SubnetId: !Ref BastionSubnetId
      SecurityGroupIds: [!Ref BastionSecurityGroup]
      IamInstanceProfile: !Ref BastionInstanceProfile
      Tags:
        - { Key: Name, Value: acme-widget-shop-bastion }

Outputs:
  InstanceId:
    Value: !Ref BastionInstance
