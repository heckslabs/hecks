# GENERATED by bin/project_deploy <domain> — re-run it to refresh
# this file rather than hand-editing. Source: <domain>/bluebook/scratch_fixture.world's own
# deployed_to("AwsFargate") block.
#
# Plain CloudFormation, not SAM — deployed with
# `aws cloudformation deploy`, never `sam deploy`. Self-contained
# the same way `Lambda`'s own template is: this stack owns its own
# private VPC, subnets, and RDS Postgres instance (unless
# database "Shared"), not just the ECS service.
AWSTemplateFormatVersion: '2010-09-09'
Description: >
  widget-shop — dispatched through hecks's rust/host, running as a
  long-lived container on AWS Fargate, backed by its own private RDS
  Postgres instance.
Parameters:
  ImageTag:
    Type: String
    Default: latest
    Description: ECR image tag this task pulls — never hardcode latest in the TaskDefinition; a first deploy and a later rollout share this one parameter.
  # Same chicken-egg as Lambda's WebRedirectBaseUrl — CloudFront's
  # hostname does not exist until this stack does. Empty on a true
  # first deploy; `make deploy` looks up Outputs.CloudFrontDomain
  # after and self-heals.
  WebRedirectBaseUrl:
    Type: String
    Default: ""
Resources:
  WidgetShopDbVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
  
  WidgetShopDbSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref WidgetShopDbVpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  
  WidgetShopDbSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref WidgetShopDbVpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
  
  # Real Google OAuth token exchange needs real internet access --
  # see the enclosing template's own "NO NAT GATEWAY" comment for
  # why this is opt-in. One NAT Gateway, one public subnet, wired
  # only when google_oauth_present -- nothing else in this stack
  # pays for it.
  WidgetShopDbPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref WidgetShopDbVpc
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
  
  WidgetShopDbInternetGateway:
    Type: AWS::EC2::InternetGateway
  
  WidgetShopDbInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref WidgetShopDbVpc
      InternetGatewayId: !Ref WidgetShopDbInternetGateway
  
  WidgetShopDbPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref WidgetShopDbVpc
  
  WidgetShopDbPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: WidgetShopDbInternetGatewayAttachment
    Properties:
      RouteTableId: !Ref WidgetShopDbPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref WidgetShopDbInternetGateway
  
  WidgetShopDbPublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref WidgetShopDbPublicSubnet
      RouteTableId: !Ref WidgetShopDbPublicRouteTable
  
  # A second public subnet, AZ index 1 -- not where NatGateway
  # lives (that's still WidgetShopDbPublicSubnet, AZ index 0). Only
  # for bastion.yaml's own BastionInstance, a real EC2 instance
  # that a real, live CREATE_FAILED proved this account can't
  # launch in AZ index 0 at all. Same shared
  # WidgetShopDbPublicRouteTable/WidgetShopDbInternetGateway as
  # WidgetShopDbPublicSubnet, not a second IGW -- a VPC accepts only one.
  WidgetShopDbBastionPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref WidgetShopDbVpc
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
  
  WidgetShopDbBastionPublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref WidgetShopDbBastionPublicSubnet
      RouteTableId: !Ref WidgetShopDbPublicRouteTable
  
  WidgetShopDbNatEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
  
  WidgetShopDbNatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      SubnetId: !Ref WidgetShopDbPublicSubnet
      AllocationId: !GetAtt WidgetShopDbNatEip.AllocationId
  
  # WidgetShopDbSubnetA/B (private -- the compute and RDS live here)
  # have no route to the internet at all without this: routes
  # outbound through WidgetShopDbNatGateway instead of an Internet
  # Gateway directly -- the whole reason a NAT (not just an IGW)
  # exists: outbound-only, no inbound path back into these subnets.
  WidgetShopDbPrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref WidgetShopDbVpc
  
  WidgetShopDbPrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref WidgetShopDbPrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref WidgetShopDbNatGateway
  
  WidgetShopDbSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref WidgetShopDbSubnetA
      RouteTableId: !Ref WidgetShopDbPrivateRouteTable
  
  WidgetShopDbSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref WidgetShopDbSubnetB
      RouteTableId: !Ref WidgetShopDbPrivateRouteTable
  WidgetShopDbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${AWS::StackName} - private subnets for widget-shop's own RDS instance"
      SubnetIds: [!Ref WidgetShopDbSubnetA, !Ref WidgetShopDbSubnetB]
  
  # No inline SecurityGroupEgress/Ingress on either group -- each
  # would need to reference the other's id from inside its own
  # Properties, a genuine circular create-order dependency
  # CloudFormation refuses outright (cfn-lint E3004). Standard
  # fix: create both groups empty, then wire the cross-reference
  # through two standalone rule resources below, each of which
  # can legitimately depend on both groups already existing.
  WidgetShopServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref WidgetShopDbVpc
      GroupDescription: WidgetShopService - inbound from WidgetShopServiceAlbSecurityGroup only, egress rules attached separately below
  
  WidgetShopDbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref WidgetShopDbVpc
      GroupDescription: WidgetShopDb - ingress rule attached separately below, from WidgetShopService only
  
  WidgetShopServiceEgressToDb:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref WidgetShopServiceSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref WidgetShopDbSecurityGroup
  
  # A standalone AWS::EC2::SecurityGroupEgress resource for a
  # group replaces that group's own default allow-all-outbound
  # rule with only what's explicitly declared here --
  # WidgetShopServiceEgressToDb's own existence already means
  # WidgetShopServiceSecurityGroup has no other egress at
  # all. 443 to 0.0.0.0/0, not a narrower destination -- Google
  # publishes no fixed IP range for oauth2.googleapis.com an AWS
  # security group could reference instead.
  WidgetShopServiceEgressToInternet:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref WidgetShopServiceSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
  WidgetShopDbIngressFromFunction:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WidgetShopDbSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref WidgetShopServiceSecurityGroup
  
  # Aurora Serverless v2, Postgres-compatible -- the split
  # shape Aurora needs (a DBCluster carrying the managed
  # password/endpoint/subnet-group/security-group, plus at
  # least one DBInstance inside it) is the only thing
  # different from the plain-RDS path below;
  # Adapters::PostgresEra/tokio_postgres speak the identical
  # wire protocol against either endpoint.
  # Self-managed, not ManageMasterUserPassword: true --
  # CloudFormation's `{{resolve:secretsmanager:...}}` only
  # resolves an auto-rotating managed secret fresh at the
  # compute resource's own creation, and RDS's managed-
  # password feature rotates the password itself shortly
  # after standing up the cluster -- every subsequent
  # invocation would keep authenticating with the now-stale
  # original value. A self-managed secret (generated once,
  # here, never auto-rotated) has nothing to go stale.
  WidgetShopDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        SecretStringTemplate: '{"username":"postgres"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/'
  
  WidgetShopDbCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    DependsOn: WidgetShopDbSecret
    Properties:
      Engine: aurora-postgresql
      EngineVersion: "16.14"
      DatabaseName: widgetshop
      MasterUsername: postgres
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${WidgetShopDbSecret}:SecretString:password}}"
      StorageEncrypted: true
      DBSubnetGroupName: !Ref WidgetShopDbSubnetGroup
      VpcSecurityGroupIds: [!Ref WidgetShopDbSecurityGroup]
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 1
  
  WidgetShopDbInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      DBClusterIdentifier: !Ref WidgetShopDbCluster
      PubliclyAccessible: false

  WidgetShopServiceAlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref WidgetShopDbVpc
      GroupDescription: WidgetShopServiceAlbSecurityGroup - HTTP ingress from CloudFront only, forwarded to WidgetShopService only
      SecurityGroupIngress:
        # pl-3b927c52 — com.amazonaws.global.cloudfront.origin-
        # facing, AWS's own global, account-agnostic managed
        # prefix list (confirmed: `aws ec2 describe-managed-
        # prefix-lists`, OwnerId "AWS", same id in every
        # account/region). NOT 0.0.0.0/0 — the whole reason
        # WidgetShopServiceDistribution above exists is Managed-
        # CachingDisabled on every session-cookie-driven
        # route; leaving the ALB itself open to the public
        # internet on this same port would let anyone bypass
        # that distribution (and its HTTPS) entirely and hit
        # the plain-HTTP origin directly — the exact gap a
        # code review caught the first time this resource was
        # added.
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: pl-3b927c52

  WidgetShopServiceIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WidgetShopServiceSecurityGroup
      IpProtocol: tcp
      FromPort: 9000
      ToPort: 9000
      SourceSecurityGroupId: !Ref WidgetShopServiceAlbSecurityGroup

  WidgetShopServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: widget-shop
      ImageScanningConfiguration:
        ScanOnPush: true

  WidgetShopServiceCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: acme-widget-shop

  WidgetShopServiceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/acme-widget-shop
      RetentionInDays: 30

  # Always minted — HECKS_SERVE_MODE always runs web.rs, which
  # panics on an empty SESSION_SECRET (found live: hecksagain-pizzas
  # 502 after the Aurora cutover). rust/host fetches this at cold
  # start (secrets.rs), never a plain env var.
  WidgetShopServiceSessionSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: session_secret
        PasswordLength: 64
        ExcludePunctuation: true

  # Pulls the image and writes CloudWatch Logs — AWS's own managed
  # AmazonECSTaskExecutionRolePolicy already covers both (ECR auth
  # + GetDownloadUrlForLayer, and logs:CreateLogStream/PutLogEvents);
  # the one grant that policy does NOT cover is fetching this
  # domain's own database secret, added below, least-privilege,
  # scoped to the single secret ARN this stack itself depends on.
  WidgetShopServiceExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: DbSecretRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "${WidgetShopDbSecret}"

  # The container's OWN runtime permissions — rust/host fetches
  # DB_SECRET_ARN itself, over the AWS SDK, the same "never let
  # CloudFormation/ECS configuration see it resolved" posture
  # `Lambda`'s own generated template already holds to (a
  # `Secrets:` ContainerDefinition property would resolve it
  # into a plain environment variable instead).
  WidgetShopServiceTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DbSecretRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "${WidgetShopDbSecret}"
        - PolicyName: SessionSecretRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref WidgetShopServiceSessionSecret
        - PolicyName: GoogleOauthSecretRead
                      PolicyDocument:
                        Version: '2012-10-17'
                        Statement:
                          - Effect: Allow
                            Action: secretsmanager:GetSecretValue
                            Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:acme-widget-shop-web-google-oauth-*"

  WidgetShopServiceTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: widget-shop
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      # ARM64, not Fargate's own x86_64 default — matching the
      # generated Makefile's own aarch64-unknown-linux-gnu build
      # (below) and Lambda's own arm64 toolchain this reuses; a
      # container built for the wrong arch fails at task start,
      # not at build time, so this has to agree with the image
      # docker-build actually pushes.
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt WidgetShopServiceExecutionRole.Arn
      TaskRoleArn: !GetAtt WidgetShopServiceTaskRole.Arn
      ContainerDefinitions:
        - Name: widget-shop
          Image: !Sub "${WidgetShopServiceRepository.RepositoryUri}:${ImageTag}"
          PortMappings:
            - ContainerPort: 9000
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WidgetShopServiceLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: widget-shop
          Environment:
            - Name: HECKS_DOMAIN
              Value: Scratch
            - Name: HECKS_ERA
              Value: "1"
            - Name: PORT
              Value: "9000"
            # `rust/host/src/server.rs`'s own top-of-`main`
            # switch — without it, this container runs as the
            # Lambda custom-runtime process `Lambda`'s own
            # generated binary always has, which blocks
            # forever polling a Runtime API that doesn't exist
            # here, never answering the health check or
            # anything else on `port`.
            - Name: HECKS_SERVE_MODE
              Value: "1"
            # `web "Rust"` vs `web "None"` is otherwise inert
            # here today — both modes generate the identical
            # task/service/target-group shape, since a Fargate
            # task always answers HTTP on `port` for dispatch
            # requests either way. Passed through so
            # `rust/host`'s own server loop (server.rs) can
            # read it and decide whether to also serve the
            # public web UI in-process, the same `web`-shaped
            # choice `Lambda`'s own `rust_web` already makes
            # for the Lambda path.
            - Name: HECKS_WEB
              Value: Rust
            # HECKS_WASM_PATH/HECKS_IR_PATH — main.rs requires
            # both unconditionally at boot (ir::ir().ok_or(...)?,
            # no fallback, and HECKS_WASM_PATH for every
            # dispatch) regardless of `web`/HECKS_SERVE_MODE. A
            # container built with neither set crashes before
            # ever reaching its own serve loop — found live
            # deploying a real domain container, fixed here so every Fargate domain ships
            # both sidecars by default. Paths match the
            # Dockerfile's own COPY destinations, below.
            - Name: HECKS_WASM_PATH
              Value: /usr/local/bin/scratch_fixture.wasm
            - Name: HECKS_IR_PATH
              Value: /usr/local/bin/scratch_fixture.ir.json
            - Name: SESSION_SECRET_ARN
              Value: !Ref WidgetShopServiceSessionSecret
            - Name: HECKS_CHECKOUT_DOMAIN
              Value: Scratch
            - Name: GOOGLE_OAUTH_SECRET_ID
                          Value: acme-widget-shop-web-google-oauth
                        - Name: GOOGLE_REDIRECT_URI
                          Value: !Sub "${WebRedirectBaseUrl}/auth/google/callback"
            - Name: DB_HOST
              Value: !GetAtt WidgetShopDbCluster.Endpoint.Address
            - Name: DB_NAME
              Value: widgetshop
            - Name: DB_SECRET_ARN
              Value: !Sub "${WidgetShopDbSecret}"
            - Name: HECKS_SCHEMA
              Value: widgets

  WidgetShopServiceTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Port: 9000
      Protocol: HTTP
      VpcId: !Ref WidgetShopDbVpc
      HealthCheckPath: /
      HealthCheckPort: "9000"

  WidgetShopServiceAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: acme-widget-shop-alb
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref WidgetShopServiceAlbSecurityGroup]
      Subnets: [!Ref WidgetShopDbPublicSubnet, !Ref WidgetShopDbBastionPublicSubnet]

  WidgetShopServiceListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref WidgetShopServiceAlb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WidgetShopServiceTargetGroup

  WidgetShopService:
    Type: AWS::ECS::Service
    DependsOn: WidgetShopServiceListener
    Properties:
      ServiceName: acme-widget-shop
      Cluster: !Ref WidgetShopServiceCluster
      TaskDefinition: !Ref WidgetShopServiceTaskDefinition
      DesiredCount: 2
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [!Ref WidgetShopDbSubnetA, !Ref WidgetShopDbSubnetB]
          SecurityGroups: [!Ref WidgetShopServiceSecurityGroup]
      LoadBalancers:
        - ContainerName: widget-shop
          ContainerPort: 9000
          TargetGroupArn: !Ref WidgetShopServiceTargetGroup

  # Real HTTPS (the ALB's own Listener above is HTTP-only —
  # nothing else in this stack terminates TLS) and, just as
  # important, the ONE safe default this generator can offer
  # for caching it has no way to reason about: Managed-
  # CachingDisabled. This domain's own routes — including
  # every hecks-native /login, /logout, /auth/google(/callback),
  # /admin/members request (web.rs's own auth_gate/auth_route,
  # generic across every domain, not just this one's own
  # dispatch commands) — are all session-cookie-driven, and
  # this generator has no way to tell which of a domain's own
  # paths would ever be safe to cache. Found live, the hard
  # way (2026-09-21): a hand-authored CloudFront
  # stack applied the OPPOSITE default — a custom, cookie-
  # blind cache policy with a 90-120s TTL — and it served one
  # signed-in session's own response (a short-lived SSO
  # handoff token among them) back to a different, unrelated
  # request within that window. A domain that DOES know one
  # of its own paths is genuinely safe to cache (a public,
  # non-personalized page) adds its own more specific
  # CacheBehavior through the `cdn` setting's `behaviors`,
  # never by loosening this one.
  WidgetShopServiceDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        # No ACM/custom domain by default — CloudFront requires
        # an ACM cert in us-east-1 specifically to attach a
        # custom Aliases entry, a real cross-region dependency
        # this generator can't assume. CloudFront's own default
        # *.cloudfront.net certificate/hostname are what
        # Outputs.CloudFrontDomain below reports; the `cdn`
        # setting's `aliases` and `certificate_arn` attach a
        # real domain.
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Origins:
          - Id: WidgetShopServiceAlbOrigin
            DomainName: !GetAtt WidgetShopServiceAlb.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              HTTPSPort: 443
        DefaultCacheBehavior:
          TargetOriginId: WidgetShopServiceAlbOrigin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          # Managed-CachingDisabled — see this resource's own
          # header comment for why nothing else is safe here
          # by default.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # Managed-AllViewer — forwards every cookie/header/
          # query string through uncached, so rust/host's own
          # session-cookie-based auth sees the real request
          # exactly as the browser sent it.
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3

Outputs:
  ServiceUrl:
    Value: !Sub "http://${WidgetShopServiceAlb.DNSName}"
  CloudFrontDomain:
    Value: !GetAtt WidgetShopServiceDistribution.DomainName
  VpcId:
    Value: !Ref WidgetShopDbVpc
  DbSecurityGroupId:
    Value: !Ref WidgetShopDbSecurityGroup
  DatabaseEndpoint:
    Value: !GetAtt WidgetShopDbCluster.Endpoint.Address
  DatabaseSecretArn:
    Value: !Ref WidgetShopDbSecret
  FunctionSecurityGroupId:
    Value: !Ref WidgetShopServiceSecurityGroup
  PrivateSubnetAId:
    Value: !Ref WidgetShopDbSubnetA
  PrivateSubnetBId:
    Value: !Ref WidgetShopDbSubnetB
  PublicSubnetId:
    Value: !Ref WidgetShopDbPublicSubnet
  BastionSubnetId:
    Value: !Ref WidgetShopDbBastionPublicSubnet
