# GENERATED by bin/project_deploy <domain> — re-run to refresh; do not
# hand-edit. Plain CloudFormation, deployed with `aws cloudformation
# deploy`, never `sam deploy`.

# Self-contained like the Lambda template: owns its own private VPC,
# subnets, and RDS instance (unless database "Shared"), not just the
# ECS service.
AWSTemplateFormatVersion: '2010-09-09'
Description: >
  widget-shop — dispatched through hecks's rust/host, running as a
  long-lived container on AWS Fargate, backed by its own private RDS
  Postgres instance.
Parameters:
  ImageTag:
    Type: String
    Default: latest
    Description: ECR image tag this task pulls — never hardcode latest in the TaskDefinition; a first deploy and a later rollout share this one parameter.
  # Same chicken-egg as Lambda's WebRedirectBaseUrl — CloudFront's
  # hostname doesn't exist until this stack does. Empty on a first
  # deploy; `make deploy` looks up Outputs.CloudFrontDomain after and
  # self-heals.
  WebRedirectBaseUrl:
    Type: String
    Default: ""
Resources:
  WidgetShopDbVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
  
  WidgetShopDbSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref WidgetShopDbVpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  
  WidgetShopDbSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref WidgetShopDbVpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
  
  # Real Google OAuth token exchange needs real internet access, so
  # this is opt-in: one NAT Gateway, one public subnet, wired only
  # when google_oauth_present.
  WidgetShopDbPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref WidgetShopDbVpc
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
  
  WidgetShopDbInternetGateway:
    Type: AWS::EC2::InternetGateway
  
  WidgetShopDbInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref WidgetShopDbVpc
      InternetGatewayId: !Ref WidgetShopDbInternetGateway
  
  WidgetShopDbPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref WidgetShopDbVpc
  
  WidgetShopDbPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: WidgetShopDbInternetGatewayAttachment
    Properties:
      RouteTableId: !Ref WidgetShopDbPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref WidgetShopDbInternetGateway
  
  WidgetShopDbPublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref WidgetShopDbPublicSubnet
      RouteTableId: !Ref WidgetShopDbPublicRouteTable
  
  # A second public subnet, AZ index 1 (NatGateway stays in AZ index
  # 0) — this account can't launch EC2 instances in AZ index 0, which
  # bastion.yaml's BastionInstance needs. Shares the same route table
  # and Internet Gateway rather than a second IGW, since a VPC accepts
  # only one.
  WidgetShopDbBastionPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref WidgetShopDbVpc
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
  
  WidgetShopDbBastionPublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref WidgetShopDbBastionPublicSubnet
      RouteTableId: !Ref WidgetShopDbPublicRouteTable
  
  WidgetShopDbNatEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
  
  WidgetShopDbNatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      SubnetId: !Ref WidgetShopDbPublicSubnet
      AllocationId: !GetAtt WidgetShopDbNatEip.AllocationId
  
  # WidgetShopDbSubnetA/B (private — compute and RDS live here) have
  # no route to the internet without this: outbound only, through the
  # NAT Gateway rather than an Internet Gateway directly, so nothing
  # can route back in.
  WidgetShopDbPrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref WidgetShopDbVpc
  
  WidgetShopDbPrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref WidgetShopDbPrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref WidgetShopDbNatGateway
  
  WidgetShopDbSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref WidgetShopDbSubnetA
      RouteTableId: !Ref WidgetShopDbPrivateRouteTable
  
  WidgetShopDbSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref WidgetShopDbSubnetB
      RouteTableId: !Ref WidgetShopDbPrivateRouteTable
  WidgetShopDbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${AWS::StackName} - private subnets for widget-shop's own RDS instance"
      SubnetIds: [!Ref WidgetShopDbSubnetA, !Ref WidgetShopDbSubnetB]
  
  # No inline Egress/Ingress on either group: each would need the
  # other's id in its own Properties, a circular create-order
  # dependency CloudFormation refuses (cfn-lint E3004). Two standalone
  # rule resources below wire the cross-reference after both exist.
  WidgetShopServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref WidgetShopDbVpc
      GroupDescription: WidgetShopService - inbound from WidgetShopServiceAlbSecurityGroup only, egress rules attached separately below
  
  WidgetShopDbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref WidgetShopDbVpc
      GroupDescription: WidgetShopDb - ingress rule attached separately below, from WidgetShopService only
  
  WidgetShopServiceEgressToDb:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref WidgetShopServiceSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref WidgetShopDbSecurityGroup
  
  # A standalone SecurityGroupEgress resource replaces the group's
  # default allow-all-outbound with only what's declared here. 443 to
  # 0.0.0.0/0, not a narrower destination — Google publishes no fixed
  # IP range for oauth2.googleapis.com to reference instead.
  WidgetShopServiceEgressToInternet:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref WidgetShopServiceSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
  WidgetShopDbIngressFromFunction:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WidgetShopDbSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref WidgetShopServiceSecurityGroup
  
  # Aurora Serverless v2: a DBCluster carrying the managed
  # password/endpoint/subnet-group/security-group, plus at least one
  # DBInstance inside it. Adapters::PostgresEra speaks the identical
  # wire protocol against either endpoint.

  # Self-managed, not ManageMasterUserPassword: true — RDS's managed
  # password rotates shortly after cluster creation, so a
  # `{{resolve:secretsmanager:...}}` reference resolved once at create
  # time would go stale. A self-managed secret never rotates, so it can't.
  WidgetShopDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        SecretStringTemplate: '{"username":"postgres"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/'
  
  WidgetShopDbCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    DependsOn: WidgetShopDbSecret
    Properties:
      Engine: aurora-postgresql
      EngineVersion: "16.14"
      DatabaseName: widgetshop
      MasterUsername: postgres
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${WidgetShopDbSecret}:SecretString:password}}"
      StorageEncrypted: true
      DBSubnetGroupName: !Ref WidgetShopDbSubnetGroup
      VpcSecurityGroupIds: [!Ref WidgetShopDbSecurityGroup]
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 1
  
  WidgetShopDbInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      DBClusterIdentifier: !Ref WidgetShopDbCluster
      PubliclyAccessible: false

  WidgetShopServiceAlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref WidgetShopDbVpc
      GroupDescription: WidgetShopServiceAlbSecurityGroup - HTTP ingress from CloudFront only, forwarded to WidgetShopService only
      SecurityGroupIngress:
        # pl-3b927c52 — AWS's global, account-agnostic
        # CloudFront-origin-facing prefix list. Not 0.0.0.0/0: an ALB
        # open to the public internet on this port would let anyone
        # bypass the distribution's HTTPS and hit the plain-HTTP
        # origin directly.
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: pl-3b927c52

  WidgetShopServiceIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WidgetShopServiceSecurityGroup
      IpProtocol: tcp
      FromPort: 9000
      ToPort: 9000
      SourceSecurityGroupId: !Ref WidgetShopServiceAlbSecurityGroup

  WidgetShopServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: widget-shop
      ImageScanningConfiguration:
        ScanOnPush: true

  WidgetShopServiceCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: acme-widget-shop

  WidgetShopServiceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/acme-widget-shop
      RetentionInDays: 30

  # Always minted — web.rs panics on an empty SESSION_SECRET.
  # rust/host fetches this at cold start (secrets.rs), never a plain
  # env var.
  WidgetShopServiceSessionSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: session_secret
        PasswordLength: 64
        ExcludePunctuation: true

  # Pulls the image and writes CloudWatch Logs — AWS's managed
  # AmazonECSTaskExecutionRolePolicy covers both. It doesn't cover
  # fetching this domain's database secret, added below, scoped to
  # the single secret ARN this stack depends on.
  WidgetShopServiceExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: DbSecretRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "${WidgetShopDbSecret}"

  # The container's own runtime permissions — rust/host fetches
  # DB_SECRET_ARN itself over the AWS SDK, never through a `Secrets:`
  # ContainerDefinition property, which would resolve it into a plain
  # environment variable instead.
  WidgetShopServiceTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DbSecretRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "${WidgetShopDbSecret}"
        - PolicyName: SessionSecretRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref WidgetShopServiceSessionSecret
        - PolicyName: GoogleOauthSecretRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:acme-widget-shop-web-google-oauth-*"

  WidgetShopServiceTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: widget-shop
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      # ARM64, not Fargate's x86_64 default — must match the
      # Makefile's aarch64-unknown-linux-gnu build; a container built
      # for the wrong arch fails at task start, not at build time.
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt WidgetShopServiceExecutionRole.Arn
      TaskRoleArn: !GetAtt WidgetShopServiceTaskRole.Arn
      ContainerDefinitions:
        - Name: widget-shop
          Image: !Sub "${WidgetShopServiceRepository.RepositoryUri}:${ImageTag}"
          PortMappings:
            - ContainerPort: 9000
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WidgetShopServiceLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: widget-shop
          Environment:
            - Name: HECKS_DOMAIN
              Value: Scratch
            - Name: HECKS_ERA
              Value: "1"
            - Name: PORT
              Value: "9000"
            # Without this, the container runs as the Lambda
            # custom-runtime process, blocking forever polling a
            # Runtime API that doesn't exist here.
            - Name: HECKS_SERVE_MODE
              Value: "1"
            # Passed through so server.rs can decide whether to
            # also serve the public web UI in-process.
            - Name: HECKS_WEB
              Value: Rust
            # HECKS_WASM_PATH/HECKS_IR_PATH — main.rs requires both
            # unconditionally at boot, regardless of HECKS_SERVE_MODE.
            # Paths match the Dockerfile's COPY destinations.
            - Name: HECKS_WASM_PATH
              Value: /usr/local/bin/scratch_fixture.wasm
            - Name: HECKS_IR_PATH
              Value: /usr/local/bin/scratch_fixture.ir.json
            - Name: SESSION_SECRET_ARN
              Value: !Ref WidgetShopServiceSessionSecret
            - Name: HECKS_CHECKOUT_DOMAIN
              Value: Scratch
            - Name: GOOGLE_OAUTH_SECRET_ID
              Value: acme-widget-shop-web-google-oauth
            - Name: GOOGLE_REDIRECT_URI
              Value: !Sub "${WebRedirectBaseUrl}/auth/google/callback"
            - Name: DB_HOST
              Value: !GetAtt WidgetShopDbCluster.Endpoint.Address
            - Name: DB_NAME
              Value: widgetshop
            - Name: DB_SECRET_ARN
              Value: !Sub "${WidgetShopDbSecret}"
            - Name: HECKS_SCHEMA
              Value: widgets

  WidgetShopServiceTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Port: 9000
      Protocol: HTTP
      VpcId: !Ref WidgetShopDbVpc
      HealthCheckPath: /
      HealthCheckPort: "9000"

  WidgetShopServiceAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: acme-widget-shop-alb
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref WidgetShopServiceAlbSecurityGroup]
      Subnets: [!Ref WidgetShopDbPublicSubnet, !Ref WidgetShopDbBastionPublicSubnet]

  WidgetShopServiceListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref WidgetShopServiceAlb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WidgetShopServiceTargetGroup

  WidgetShopService:
    Type: AWS::ECS::Service
    DependsOn: WidgetShopServiceListener
    Properties:
      ServiceName: acme-widget-shop
      Cluster: !Ref WidgetShopServiceCluster
      TaskDefinition: !Ref WidgetShopServiceTaskDefinition
      DesiredCount: 2
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [!Ref WidgetShopDbSubnetA, !Ref WidgetShopDbSubnetB]
          SecurityGroups: [!Ref WidgetShopServiceSecurityGroup]
      LoadBalancers:
        - ContainerName: widget-shop
          ContainerPort: 9000
          TargetGroupArn: !Ref WidgetShopServiceTargetGroup

  # Real HTTPS (the ALB's Listener above is HTTP-only) and the one
  # safe caching default: Managed-CachingDisabled. Every session-
  # cookie-driven route here is a risk if cached — a cookie-blind
  # cache policy once served one signed-in session's response back to
  # a different request. A domain that knows a specific path is safe
  # to cache adds its own CacheBehavior via the `cdn` setting's
  # `behaviors`, never by loosening this default.
  WidgetShopServiceDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        # No ACM/custom domain by default — CloudFront requires an ACM
        # cert in us-east-1 to attach a custom Aliases entry. The
        # `cdn` setting's `aliases`/`certificate_arn` attach a real
        # domain instead.
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Origins:
          - Id: WidgetShopServiceAlbOrigin
            DomainName: !GetAtt WidgetShopServiceAlb.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              HTTPSPort: 443
        DefaultCacheBehavior:
          TargetOriginId: WidgetShopServiceAlbOrigin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          # Managed-CachingDisabled — see this resource's header
          # comment for why nothing else is safe by default.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # Managed-AllViewer — forwards every cookie/header/query
          # string uncached, so session-cookie auth sees the request
          # exactly as the browser sent it.
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3

Outputs:
  ServiceUrl:
    Value: !Sub "http://${WidgetShopServiceAlb.DNSName}"
  CloudFrontDomain:
    Value: !GetAtt WidgetShopServiceDistribution.DomainName
  VpcId:
    Value: !Ref WidgetShopDbVpc
  DbSecurityGroupId:
    Value: !Ref WidgetShopDbSecurityGroup
  DatabaseEndpoint:
    Value: !GetAtt WidgetShopDbCluster.Endpoint.Address
  DatabaseSecretArn:
    Value: !Ref WidgetShopDbSecret
  FunctionSecurityGroupId:
    Value: !Ref WidgetShopServiceSecurityGroup
  PrivateSubnetAId:
    Value: !Ref WidgetShopDbSubnetA
  PrivateSubnetBId:
    Value: !Ref WidgetShopDbSubnetB
  PublicSubnetId:
    Value: !Ref WidgetShopDbPublicSubnet
  BastionSubnetId:
    Value: !Ref WidgetShopDbBastionPublicSubnet
