# GENERATED by bin/project_deploy <domain> — edit the generator,
# not this file. Deployed and torn down by `make mint-era`, never left running.
AWSTemplateFormatVersion: '2010-09-09'
Description: >
  TEMPORARY — scratch_fixture's era-minting bastion. Deployed and torn
  down by `make mint-era`; not meant to run continuously.

# bastion_parameters (Shared.bastion_parameters) — the other end of
# the main template's Outputs; the Makefile's --parameter-overrides
# line fills these from the same table.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
  BastionSubnetId:
    Type: AWS::EC2::Subnet::Id

Resources:
  # Reuses the main template's own bastion subnet (BastionSubnetId),
  # not PublicSubnetId — a VPC accepts only one attached Internet
  # Gateway, and PublicSubnetId's AZ can't launch EC2 instances here.
  # No ingress rules: SSM Session Manager only dials out, so nothing
  # needs a path in despite the public IP.
  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VpcId
      # Plain hyphen, not an em-dash — EC2's GroupDescription rejects
      # any non-ASCII character outright.
      GroupDescription: "TEMPORARY era-minting bastion - SSM only, no inbound rules"

  BastionToRds:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref BastionSecurityGroup

  BastionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  BastionInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref BastionRole]

  BastionInstance:
    Type: AWS::EC2::Instance
    Properties:
      # Amazon Linux 2023's own SSM parameter — always the current
      # AMI for whatever region this deploys into, never a
      # hand-copied, region-specific AMI id.
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: t3.micro
      SubnetId: !Ref BastionSubnetId
      SecurityGroupIds: [!Ref BastionSecurityGroup]
      IamInstanceProfile: !Ref BastionInstanceProfile
      Tags:
        - { Key: Name, Value: hecks-scratch_fixture-bastion }

Outputs:
  InstanceId:
    Value: !Ref BastionInstance
