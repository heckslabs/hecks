# GENERATED by hecks deploy project <domain> — re-run it to refresh
# this file rather than hand-editing. Source: <domain>/bluebook/scratch_fixture.world's own
# deployed_to("AwsFargate") block.
#
# Plain CloudFormation, not SAM — deployed with
# `aws cloudformation deploy`, never `sam deploy`. Self-contained
# the same way `Lambda`'s own template is: this stack owns its own
# private VPC, subnets, and RDS Postgres instance (unless
# database "Shared"), not just the ECS service.
AWSTemplateFormatVersion: '2010-09-09'
Description: >
  scratch_fixture — dispatched through hecks's rust/host, running as a
  long-lived container on AWS Fargate, backed by its own private RDS
  Postgres instance.
Parameters:
  ImageTag:
    Type: String
    Default: latest
    Description: ECR image tag this task pulls — never hardcode latest in the TaskDefinition; a first deploy and a later rollout share this one parameter.
Resources:
  ScratchFixtureDbVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
  
  ScratchFixtureDbSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ScratchFixtureDbVpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  
  ScratchFixtureDbSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ScratchFixtureDbVpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
  
  # Real Google OAuth token exchange needs real internet access --
  # see the enclosing template's own "NO NAT GATEWAY" comment for
  # why this is opt-in. One NAT Gateway, one public subnet, wired
  # only when google_oauth_present -- nothing else in this stack
  # pays for it.
  ScratchFixtureDbPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ScratchFixtureDbVpc
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
  
  ScratchFixtureDbInternetGateway:
    Type: AWS::EC2::InternetGateway
  
  ScratchFixtureDbInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref ScratchFixtureDbVpc
      InternetGatewayId: !Ref ScratchFixtureDbInternetGateway
  
  ScratchFixtureDbPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ScratchFixtureDbVpc
  
  ScratchFixtureDbPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: ScratchFixtureDbInternetGatewayAttachment
    Properties:
      RouteTableId: !Ref ScratchFixtureDbPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref ScratchFixtureDbInternetGateway
  
  ScratchFixtureDbPublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ScratchFixtureDbPublicSubnet
      RouteTableId: !Ref ScratchFixtureDbPublicRouteTable
  
  # A second public subnet, AZ index 1 -- not where NatGateway
  # lives (that's still ScratchFixtureDbPublicSubnet, AZ index 0). Only
  # for bastion.yaml's own BastionInstance, a real EC2 instance
  # that a real, live CREATE_FAILED proved this account can't
  # launch in AZ index 0 at all. Same shared
  # ScratchFixtureDbPublicRouteTable/ScratchFixtureDbInternetGateway as
  # ScratchFixtureDbPublicSubnet, not a second IGW -- a VPC accepts only one.
  ScratchFixtureDbBastionPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ScratchFixtureDbVpc
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
  
  ScratchFixtureDbBastionPublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ScratchFixtureDbBastionPublicSubnet
      RouteTableId: !Ref ScratchFixtureDbPublicRouteTable
  
  ScratchFixtureDbNatEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
  
  ScratchFixtureDbNatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      SubnetId: !Ref ScratchFixtureDbPublicSubnet
      AllocationId: !GetAtt ScratchFixtureDbNatEip.AllocationId
  
  # ScratchFixtureDbSubnetA/B (private -- the compute and RDS live here)
  # have no route to the internet at all without this: routes
  # outbound through ScratchFixtureDbNatGateway instead of an Internet
  # Gateway directly -- the whole reason a NAT (not just an IGW)
  # exists: outbound-only, no inbound path back into these subnets.
  ScratchFixtureDbPrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ScratchFixtureDbVpc
  
  ScratchFixtureDbPrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref ScratchFixtureDbPrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref ScratchFixtureDbNatGateway
  
  ScratchFixtureDbSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ScratchFixtureDbSubnetA
      RouteTableId: !Ref ScratchFixtureDbPrivateRouteTable
  
  ScratchFixtureDbSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ScratchFixtureDbSubnetB
      RouteTableId: !Ref ScratchFixtureDbPrivateRouteTable
  ScratchFixtureDbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${AWS::StackName} - private subnets for scratch_fixture's own RDS instance"
      SubnetIds: [!Ref ScratchFixtureDbSubnetA, !Ref ScratchFixtureDbSubnetB]
  
  # No inline SecurityGroupEgress/Ingress on either group -- each
  # would need to reference the other's id from inside its own
  # Properties, a genuine circular create-order dependency
  # CloudFormation refuses outright (cfn-lint E3004). Standard
  # fix: create both groups empty, then wire the cross-reference
  # through two standalone rule resources below, each of which
  # can legitimately depend on both groups already existing.
  ScratchFixtureServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref ScratchFixtureDbVpc
      GroupDescription: ScratchFixtureService - inbound from ScratchFixtureServiceAlbSecurityGroup only, egress rules attached separately below
  
  ScratchFixtureDbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref ScratchFixtureDbVpc
      GroupDescription: ScratchFixtureDb - ingress rule attached separately below, from ScratchFixtureService only
  
  ScratchFixtureServiceEgressToDb:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ScratchFixtureServiceSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref ScratchFixtureDbSecurityGroup
  
  # A standalone AWS::EC2::SecurityGroupEgress resource for a
  # group replaces that group's own default allow-all-outbound
  # rule with only what's explicitly declared here --
  # ScratchFixtureServiceEgressToDb's own existence already means
  # ScratchFixtureServiceSecurityGroup has no other egress at
  # all. 443 to 0.0.0.0/0, not a narrower destination -- Google
  # publishes no fixed IP range for oauth2.googleapis.com an AWS
  # security group could reference instead.
  ScratchFixtureServiceEgressToInternet:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ScratchFixtureServiceSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
  ScratchFixtureDbIngressFromFunction:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ScratchFixtureDbSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ScratchFixtureServiceSecurityGroup
  
  ScratchFixtureDb:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: "16.14"
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: "20"
      StorageEncrypted: true
      DBName: scratchfixture
      MasterUsername: postgres
      ManageMasterUserPassword: true
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref ScratchFixtureDbSubnetGroup
      VPCSecurityGroups: [!Ref ScratchFixtureDbSecurityGroup]

  ScratchFixtureServiceAlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref ScratchFixtureDbVpc
      GroupDescription: ScratchFixtureServiceAlbSecurityGroup - HTTP ingress from CloudFront only, forwarded to ScratchFixtureService only
      SecurityGroupIngress:
        # pl-3b927c52 — com.amazonaws.global.cloudfront.origin-
        # facing, AWS's own global, account-agnostic managed
        # prefix list (confirmed: `aws ec2 describe-managed-
        # prefix-lists`, OwnerId "AWS", same id in every
        # account/region). NOT 0.0.0.0/0 — the whole reason
        # ScratchFixtureServiceDistribution above exists is Managed-
        # CachingDisabled on every session-cookie-driven
        # route; leaving the ALB itself open to the public
        # internet on this same port would let anyone bypass
        # that distribution (and its HTTPS) entirely and hit
        # the plain-HTTP origin directly — the exact gap a
        # code review caught the first time this resource was
        # added.
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: pl-3b927c52

  ScratchFixtureServiceIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ScratchFixtureServiceSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref ScratchFixtureServiceAlbSecurityGroup

  ScratchFixtureServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: scratch_fixture
      ImageScanningConfiguration:
        ScanOnPush: true

  ScratchFixtureServiceCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: hecks-scratch_fixture

  ScratchFixtureServiceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/hecks-scratch_fixture
      RetentionInDays: 30

  # Always minted — HECKS_SERVE_MODE always runs web.rs, which
  # panics on an empty SESSION_SECRET (found live: hecksagain-pizzas
  # 502 after the Aurora cutover). rust/host fetches this at cold
  # start (secrets.rs), never a plain env var.
  ScratchFixtureServiceSessionSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: session_secret
        PasswordLength: 64
        ExcludePunctuation: true

  # Pulls the image and writes CloudWatch Logs — AWS's own managed
  # AmazonECSTaskExecutionRolePolicy already covers both (ECR auth
  # + GetDownloadUrlForLayer, and logs:CreateLogStream/PutLogEvents);
  # the one grant that policy does NOT cover is fetching this
  # domain's own database secret, added below, least-privilege,
  # scoped to the single secret ARN this stack itself depends on.
  ScratchFixtureServiceExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: DbSecretRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "${ScratchFixtureDb.MasterUserSecret.SecretArn}"

  # The container's OWN runtime permissions — rust/host fetches
  # DB_SECRET_ARN itself, over the AWS SDK, the same "never let
  # CloudFormation/ECS configuration see it resolved" posture
  # `Lambda`'s own generated template already holds to (a
  # `Secrets:` ContainerDefinition property would resolve it
  # into a plain environment variable instead).
  ScratchFixtureServiceTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DbSecretRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "${ScratchFixtureDb.MasterUserSecret.SecretArn}"
        - PolicyName: SessionSecretRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref ScratchFixtureServiceSessionSecret
        

  ScratchFixtureServiceTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: scratch_fixture
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      # ARM64, not Fargate's own x86_64 default — matching the
      # generated Makefile's own aarch64-unknown-linux-gnu build
      # (below) and Lambda's own arm64 toolchain this reuses; a
      # container built for the wrong arch fails at task start,
      # not at build time, so this has to agree with the image
      # docker-build actually pushes.
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt ScratchFixtureServiceExecutionRole.Arn
      TaskRoleArn: !GetAtt ScratchFixtureServiceTaskRole.Arn
      ContainerDefinitions:
        - Name: scratch_fixture
          Image: !Sub "${ScratchFixtureServiceRepository.RepositoryUri}:${ImageTag}"
          PortMappings:
            - ContainerPort: 8080
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ScratchFixtureServiceLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: scratch_fixture
          Environment:
            - Name: HECKS_DOMAIN
              Value: Scratch
            - Name: HECKS_ERA
              Value: "1"
            - Name: PORT
              Value: "8080"
            # `rust/host/src/server.rs`'s own top-of-`main`
            # switch — without it, this container runs as the
            # Lambda custom-runtime process `Lambda`'s own
            # generated binary always has, which blocks
            # forever polling a Runtime API that doesn't exist
            # here, never answering the health check or
            # anything else on `port`.
            - Name: HECKS_SERVE_MODE
              Value: "1"
            # `web "Rust"` vs `web "None"` is otherwise inert
            # here today — both modes generate the identical
            # task/service/target-group shape, since a Fargate
            # task always answers HTTP on `port` for dispatch
            # requests either way. Passed through so
            # `rust/host`'s own server loop (server.rs) can
            # read it and decide whether to also serve the
            # public web UI in-process, the same `web`-shaped
            # choice `Lambda`'s own `rust_web` already makes
            # for the Lambda path.
            - Name: HECKS_WEB
              Value: None
            # HECKS_WASM_PATH/HECKS_IR_PATH — main.rs requires
            # both unconditionally at boot (ir::ir().ok_or(...)?,
            # no fallback, and HECKS_WASM_PATH for every
            # dispatch) regardless of `web`/HECKS_SERVE_MODE. A
            # container built with neither set crashes before
            # ever reaching its own serve loop — found live
            # deploying a real domain container, fixed here so every Fargate domain ships
            # both sidecars by default. Paths match the
            # Dockerfile's own COPY destinations, below.
            - Name: HECKS_WASM_PATH
              Value: /usr/local/bin/scratch_fixture.wasm
            - Name: HECKS_IR_PATH
              Value: /usr/local/bin/scratch_fixture.ir.json
            - Name: SESSION_SECRET_ARN
              Value: !Ref ScratchFixtureServiceSessionSecret
            - Name: HECKS_CHECKOUT_DOMAIN
              Value: Scratch
            
            - Name: DB_HOST
              Value: !GetAtt ScratchFixtureDb.Endpoint.Address
            - Name: DB_NAME
              Value: scratchfixture
            - Name: DB_SECRET_ARN
              Value: !Sub "${ScratchFixtureDb.MasterUserSecret.SecretArn}"

  ScratchFixtureServiceTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Port: 8080
      Protocol: HTTP
      VpcId: !Ref ScratchFixtureDbVpc
      HealthCheckPath: /
      HealthCheckPort: "8080"

  ScratchFixtureServiceAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: hecks-scratch_fixture-alb
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref ScratchFixtureServiceAlbSecurityGroup]
      Subnets: [!Ref ScratchFixtureDbPublicSubnet, !Ref ScratchFixtureDbBastionPublicSubnet]

  ScratchFixtureServiceListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ScratchFixtureServiceAlb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ScratchFixtureServiceTargetGroup

  ScratchFixtureService:
    Type: AWS::ECS::Service
    DependsOn: ScratchFixtureServiceListener
    Properties:
      ServiceName: hecks-scratch_fixture
      Cluster: !Ref ScratchFixtureServiceCluster
      TaskDefinition: !Ref ScratchFixtureServiceTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [!Ref ScratchFixtureDbSubnetA, !Ref ScratchFixtureDbSubnetB]
          SecurityGroups: [!Ref ScratchFixtureServiceSecurityGroup]
      LoadBalancers:
        - ContainerName: scratch_fixture
          ContainerPort: 8080
          TargetGroupArn: !Ref ScratchFixtureServiceTargetGroup

  # Real HTTPS (the ALB's own Listener above is HTTP-only —
  # nothing else in this stack terminates TLS) and, just as
  # important, the ONE safe default this generator can offer
  # for caching it has no way to reason about: Managed-
  # CachingDisabled. This domain's own routes — including
  # every hecks-native /login, /logout, /auth/google(/callback),
  # /admin/members request (web.rs's own auth_gate/auth_route,
  # generic across every domain, not just this one's own
  # dispatch commands) — are all session-cookie-driven, and
  # this generator has no way to tell which of a domain's own
  # paths would ever be safe to cache. Found live, the hard
  # way (2026-09-21): a hand-authored CloudFront
  # stack applied the OPPOSITE default — a custom, cookie-
  # blind cache policy with a 90-120s TTL — and it served one
  # signed-in session's own response (a short-lived SSO
  # handoff token among them) back to a different, unrelated
  # request within that window. A domain that DOES know one
  # of its own paths is genuinely safe to cache (a public,
  # non-personalized page) adds its own more specific
  # CacheBehavior through the `cdn` setting's `behaviors`,
  # never by loosening this one.
  ScratchFixtureServiceDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        # No ACM/custom domain by default — CloudFront requires
        # an ACM cert in us-east-1 specifically to attach a
        # custom Aliases entry, a real cross-region dependency
        # this generator can't assume. CloudFront's own default
        # *.cloudfront.net certificate/hostname are what
        # Outputs.CloudFrontDomain below reports; the `cdn`
        # setting's `aliases` and `certificate_arn` attach a
        # real domain.
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Origins:
          - Id: ScratchFixtureServiceAlbOrigin
            DomainName: !GetAtt ScratchFixtureServiceAlb.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              HTTPSPort: 443
        DefaultCacheBehavior:
          TargetOriginId: ScratchFixtureServiceAlbOrigin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          # Managed-CachingDisabled — see this resource's own
          # header comment for why nothing else is safe here
          # by default.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # Managed-AllViewer — forwards every cookie/header/
          # query string through uncached, so rust/host's own
          # session-cookie-based auth sees the real request
          # exactly as the browser sent it.
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3

Outputs:
  ServiceUrl:
    Value: !Sub "http://${ScratchFixtureServiceAlb.DNSName}"
  CloudFrontDomain:
    Value: !GetAtt ScratchFixtureServiceDistribution.DomainName
  VpcId:
    Value: !Ref ScratchFixtureDbVpc
  DbSecurityGroupId:
    Value: !Ref ScratchFixtureDbSecurityGroup
  DatabaseEndpoint:
    Value: !GetAtt ScratchFixtureDb.Endpoint.Address
  DatabaseSecretArn:
    Value: !GetAtt ScratchFixtureDb.MasterUserSecret.SecretArn
  FunctionSecurityGroupId:
    Value: !Ref ScratchFixtureServiceSecurityGroup
  PrivateSubnetAId:
    Value: !Ref ScratchFixtureDbSubnetA
  PrivateSubnetBId:
    Value: !Ref ScratchFixtureDbSubnetB
  PublicSubnetId:
    Value: !Ref ScratchFixtureDbPublicSubnet
  BastionSubnetId:
    Value: !Ref ScratchFixtureDbBastionPublicSubnet
