# GENERATED by bin/project_deploy <domain> — edit the source
# bluebook, not this file.
#
# Plain CloudFormation, not SAM. Self-contained like `Lambda`'s own
# template: owns its own VPC, subnets, and RDS Postgres instance
# (unless database "Shared"), not just the ECS service.
AWSTemplateFormatVersion: '2010-09-09'
Description: >
  scratch_fixture — dispatched through hecks's rust/host, running as a
  long-lived container on AWS Fargate, backed by its own private RDS
  Postgres instance.
Parameters:
  ImageTag:
    Type: String
    Default: latest
    Description: ECR image tag this task pulls — never hardcode latest in the TaskDefinition; a first deploy and a later rollout share this one parameter.
  # Looked up at deploy time from the owning stack's own live Outputs
  # via `aws cloudformation describe-stacks` — the same pattern
  # `Lambda`'s own generated Makefile uses for Shared-mode domains.
  OwningVpcId:
    Type: AWS::EC2::VPC::Id
  OwningSubnetAId:
    Type: AWS::EC2::Subnet::Id
  OwningSubnetBId:
    Type: AWS::EC2::Subnet::Id
  # PUBLIC subnets, not OwningSubnetAId/OwningSubnetBId — those are
  # private (MapPublicIpOnLaunch: false, no Internet Gateway route),
  # so an ALB placed there reports healthy targets from inside the
  # VPC yet stays unreachable from outside it. These two are
  # resolved from the owner stack's own PublicSubnetId/BastionSubnetId
  # Outputs. Service.NetworkConfiguration below still uses the
  # private pair for the tasks themselves — only the ALB moves.
  OwningPublicSubnetAId:
    Type: AWS::EC2::Subnet::Id
  OwningPublicSubnetBId:
    Type: AWS::EC2::Subnet::Id
  OwningSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  OwningDatabaseEndpoint:
    Type: String
  OwningDatabaseSecretArn:
    Type: String
Resources:
  

  ScratchFixtureServiceAlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref OwningVpcId
      GroupDescription: ScratchFixtureServiceAlbSecurityGroup - HTTP ingress from CloudFront only, forwarded to ScratchFixtureService only
      SecurityGroupIngress:
        # pl-3b927c52 — AWS's own global, account-agnostic managed
        # prefix list for CloudFront origin-facing traffic. Not
        # 0.0.0.0/0: this ALB sits behind ScratchFixtureServiceDistribution's
        # CachingDisabled policy for session-cookie routes, and opening
        # it to the public internet would let anyone bypass that
        # distribution (and its HTTPS) and hit the plain-HTTP origin
        # directly.
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: pl-3b927c52

  ScratchFixtureServiceIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref OwningSecurityGroupId
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref ScratchFixtureServiceAlbSecurityGroup

  ScratchFixtureServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: scratch_fixture
      ImageScanningConfiguration:
        ScanOnPush: true

  ScratchFixtureServiceCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: hecks-scratch_fixture

  ScratchFixtureServiceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/hecks-scratch_fixture
      RetentionInDays: 30

  # Always minted — HECKS_SERVE_MODE always runs web.rs, which
  # panics on an empty SESSION_SECRET. rust/host fetches this at
  # cold start (secrets.rs), never a plain env var.
  ScratchFixtureServiceSessionSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: session_secret
        PasswordLength: 64
        ExcludePunctuation: true

  # AmazonECSTaskExecutionRolePolicy already covers image pull and
  # CloudWatch Logs; the one grant it lacks is reading this domain's
  # own database secret, added below and scoped to the single ARN
  # this stack depends on.
  ScratchFixtureServiceExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: DbSecretRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "${OwningDatabaseSecretArn}"

  # The container's own runtime permissions — rust/host fetches
  # DB_SECRET_ARN itself over the AWS SDK, matching `Lambda`'s own
  # generated template's "never let ECS resolve secrets" posture
  # (a `Secrets:` ContainerDefinition property would resolve it
  # into a plain environment variable instead).
  ScratchFixtureServiceTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DbSecretRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "${OwningDatabaseSecretArn}"
        - PolicyName: SessionSecretRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref ScratchFixtureServiceSessionSecret
        

  ScratchFixtureServiceTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: scratch_fixture
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      # ARM64, not Fargate's default x86_64 — matches the generated
      # Makefile's aarch64-unknown-linux-gnu build and `Lambda`'s
      # own arm64 toolchain; a mismatched image fails at task
      # start, not build time.
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt ScratchFixtureServiceExecutionRole.Arn
      TaskRoleArn: !GetAtt ScratchFixtureServiceTaskRole.Arn
      ContainerDefinitions:
        - Name: scratch_fixture
          Image: !Sub "${ScratchFixtureServiceRepository.RepositoryUri}:${ImageTag}"
          PortMappings:
            - ContainerPort: 8080
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ScratchFixtureServiceLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: scratch_fixture
          Environment:
            - Name: HECKS_DOMAIN
              Value: Scratch
            - Name: HECKS_ERA
              Value: "1"
            - Name: PORT
              Value: "8080"
            # `server.rs`'s own top-of-`main` switch — without it
            # this container runs as `Lambda`'s custom-runtime
            # process, which blocks forever polling a Runtime API
            # that doesn't exist here and never answers this
            # port's health check.
            - Name: HECKS_SERVE_MODE
              Value: "1"
            # Otherwise inert today — a Fargate task always answers
            # HTTP on `port` for dispatch either way. Passed through
            # so `server.rs` can decide whether to also serve the
            # public web UI in-process, mirroring `Lambda`'s own
            # `rust_web` choice for the Lambda path.
            - Name: HECKS_WEB
              Value: None
            # HECKS_WASM_PATH/HECKS_IR_PATH — main.rs requires both
            # unconditionally at boot (ir::ir().ok_or(...)?, no
            # fallback), regardless of `web`/HECKS_SERVE_MODE, so
            # every Fargate domain ships both sidecars by default.
            # Paths match the Dockerfile's own COPY destinations, below.
            - Name: HECKS_WASM_PATH
              Value: /usr/local/bin/scratch_fixture.wasm
            - Name: HECKS_IR_PATH
              Value: /usr/local/bin/scratch_fixture.ir.json
            - Name: SESSION_SECRET_ARN
              Value: !Ref ScratchFixtureServiceSessionSecret
            - Name: HECKS_CHECKOUT_DOMAIN
              Value: Scratch
            
            - Name: DB_HOST
              Value: !Ref OwningDatabaseEndpoint
            - Name: DB_NAME
              Value: harbor
            - Name: DB_SECRET_ARN
              Value: !Sub "${OwningDatabaseSecretArn}"
            - Name: HECKS_SCHEMA
              Value: scratch_fixture

  ScratchFixtureServiceTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Port: 8080
      Protocol: HTTP
      VpcId: !Ref OwningVpcId
      HealthCheckPath: /
      HealthCheckPort: "8080"

  ScratchFixtureServiceAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: hecks-scratch_fixture-alb
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref ScratchFixtureServiceAlbSecurityGroup]
      Subnets: [!Ref OwningPublicSubnetAId, !Ref OwningPublicSubnetBId]

  ScratchFixtureServiceListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ScratchFixtureServiceAlb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ScratchFixtureServiceTargetGroup

  ScratchFixtureService:
    Type: AWS::ECS::Service
    DependsOn: ScratchFixtureServiceListener
    Properties:
      ServiceName: hecks-scratch_fixture
      Cluster: !Ref ScratchFixtureServiceCluster
      TaskDefinition: !Ref ScratchFixtureServiceTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [!Ref OwningSubnetAId, !Ref OwningSubnetBId]
          SecurityGroups: [!Ref OwningSecurityGroupId]
      LoadBalancers:
        - ContainerName: scratch_fixture
          ContainerPort: 8080
          TargetGroupArn: !Ref ScratchFixtureServiceTargetGroup

  # HTTPS termination (the ALB's own Listener above is HTTP-only)
  # and, more importantly, the only cache default this generator can
  # safely assume: Managed-CachingDisabled. Every hecks-native route
  # (login/logout/auth/admin) is session-cookie-driven, and a
  # cookie-blind cache with any TTL can serve one session's response
  # to a different, unrelated request. A domain that knows a
  # specific path is safe to cache adds its own CacheBehavior via
  # the `cdn` setting's `behaviors`, rather than loosening this default.
  ScratchFixtureServiceDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        # No ACM/custom domain by default — that needs an ACM cert
        # in us-east-1 specifically for a custom Aliases entry, a
        # cross-region dependency this generator can't assume. The
        # default *.cloudfront.net cert/hostname are what
        # Outputs.CloudFrontDomain below reports; the `cdn` setting's
        # `aliases` and `certificate_arn` attach a real domain.
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Origins:
          - Id: ScratchFixtureServiceAlbOrigin
            DomainName: !GetAtt ScratchFixtureServiceAlb.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              HTTPSPort: 443
        DefaultCacheBehavior:
          TargetOriginId: ScratchFixtureServiceAlbOrigin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          # Managed-CachingDisabled — see this resource's own header
          # comment for why nothing else is safe here by default.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # Managed-AllViewer — forwards every cookie/header/query
          # string through uncached, so rust/host's own session-cookie
          # auth sees the real request exactly as the browser sent it.
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3

Outputs:
  ServiceUrl:
    Value: !Sub "http://${ScratchFixtureServiceAlb.DNSName}"
  CloudFrontDomain:
    Value: !GetAtt ScratchFixtureServiceDistribution.DomainName
  
