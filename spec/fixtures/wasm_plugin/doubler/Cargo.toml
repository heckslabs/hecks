# A test plugin: the smallest module that keeps the wasm adapter plugin contract, so the Ruby
# runtime and the Rust host can each be held to calling it the same way. Built to ../doubler.wasm
# with `cargo build --release --target wasm32-wasip1`.
[package]
name = "doubler"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

[workspace]
