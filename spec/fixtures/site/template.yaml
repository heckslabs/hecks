AWSTemplateFormatVersion: "2010-09-09"
Description: A studio's site, behind one CloudFront distribution and one load balancer.

Parameters:
  OriginSecret:
    Type: String
    NoEcho: true

Resources:
  # The load balancer, its listener and target groups are the project's own. The rules that send a
  # path to one of them are generated from the route table.
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "403"

  # BEGIN GENERATED site_cdn listener_rules (hecks site site_projection.project_site; edit the Route and Edge rows). Do not hand-edit.
  ListenerRuleCms:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values: ["/cms/*"]
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Secret
            Values: [!Ref OriginSecret]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref CmsTargetGroup

  ListenerRuleDomain:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 20
      Conditions:
        - Field: path-pattern
          Values: ["/Studio/Inquiry/Submit", "/Studio/Inquiry/Recent", "/webhooks/*", "/internal/ping"]
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Secret
            Values: [!Ref OriginSecret]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref DomainTargetGroup

  ListenerRuleDomainAuth:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 21
      Conditions:
        - Field: path-pattern
          Values: ["/login", "/logout", "/auth/*"]
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Secret
            Values: [!Ref OriginSecret]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref DomainTargetGroup

  ListenerRuleWebsite:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 30
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Secret
            Values: [!Ref OriginSecret]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref WebsiteTargetGroup
  # END GENERATED site_cdn listener_rules

  # BEGIN GENERATED site_cdn edge_functions (hecks site site_projection.project_site; edit the Route and Edge rows). Do not hand-edit.
  HostRedirect:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-host-redirect"
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect the watched paths from an alias to the canonical host
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var canonical = "app.example.test";
          var aliases = ["www.example.test"];
          var watched = ["/login","/auth/start"];
          var header = request.headers.host;
          var host = header && header.value ? header.value.toLowerCase().replace(/:\d+$/, "") : "";
          var reads = request.method === "GET" || request.method === "HEAD";
          if (!reads || watched.indexOf(request.uri) < 0) { return request; }
          if (host === canonical || aliases.indexOf(host) < 0) { return request; }
          var parts = [];
          Object.keys(request.querystring).forEach(function (key) {
            var entry = request.querystring[key];
            var values = entry.multiValue ? entry.multiValue.map(function (item) { return item.value; }) : [entry.value];
            values.forEach(function (value) {
              var name = encode(key);
              parts.push(value === "" || value === undefined ? name : name + "=" + encode(value));
            });
          });
          var query = parts.length ? "?" + parts.join("&") : "";
          return {
            statusCode: 302,
            statusDescription: "Found",
            headers: {
              location: { value: "https://" + canonical + request.uri + query },
              "cache-control": { value: "no-store" }
            }
          };
        }

        // Percent-encodes what cannot stand in a query string and keeps what is already encoded, so the
        // location header carries no space, control character, "&" or "#" whether the runtime hands over
        // the raw text or the decoded one.
        function encode(text) {
          return String(text).replace(/%(?![0-9A-Fa-f]{2})|[\uD800-\uDBFF][\uDC00-\uDFFF]|[^A-Za-z0-9\-._~!$'()*,;:@\/?+%]/g, function (unit) {
            try { return encodeURIComponent(unit); } catch (error) { return "%EF%BF%BD"; }
          });
        }
  # END GENERATED site_cdn edge_functions

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Origins:
          - Id: ServerOrigin
            DomainName: !GetAtt Alb.DNSName
          - Id: AssetsOrigin
            DomainName: studio-assets.s3.amazonaws.com
            S3OriginConfig: { OriginAccessIdentity: "" }
        # BEGIN GENERATED site_cdn behaviors (hecks site site_projection.project_site; edit the Route and Edge rows). Do not hand-edit.
        DefaultCacheBehavior:
          TargetOriginId: ServerOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref PageCachePolicy
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # Managed-AllViewer
          ResponseHeadersPolicyId: !Ref SecurityHeaders
        CacheBehaviors:
          - PathPattern: "/"
            TargetOriginId: ServerOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref HomeCachePolicy
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # Managed-AllViewer
          - PathPattern: "/inquiry-received"
            TargetOriginId: ServerOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # Managed-AllViewer
            ResponseHeadersPolicyId: !Ref SecurityHeaders
          - PathPattern: "/pay/*"
            TargetOriginId: ServerOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # Managed-AllViewer
            ResponseHeadersPolicyId: !Ref SecurityHeaders
          - PathPattern: "/robots.txt"
            TargetOriginId: ServerOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref StaticCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref StaticHeaders
          - PathPattern: "/assets/*"
            TargetOriginId: AssetsOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          - PathPattern: "/Studio/Inquiry/Submit"
            TargetOriginId: ServerOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # Managed-AllViewer
            ResponseHeadersPolicyId: !Ref SecurityHeaders
          - PathPattern: "/Studio/Inquiry/Recent"
            TargetOriginId: ServerOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # Managed-AllViewer
            ResponseHeadersPolicyId: !Ref SecurityHeaders
          - PathPattern: "/_assets/*"
            TargetOriginId: ServerOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref SecurityHeaders
          - PathPattern: "/images/*"
            TargetOriginId: ServerOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref StaticCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref StaticHeaders
          - PathPattern: "/api/*"
            TargetOriginId: ServerOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: false
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # Managed-AllViewer
            ResponseHeadersPolicyId: !Ref SecurityHeaders
          - PathPattern: "/cms/_static/*"
            TargetOriginId: ServerOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref SecurityHeaders
          - PathPattern: "/cms/media/*"
            TargetOriginId: ServerOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref MediaCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
          - PathPattern: "/cms/*"
            TargetOriginId: ServerOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # Managed-AllViewer
            ResponseHeadersPolicyId: !Ref SecurityHeaders
          - PathPattern: "/videos/*"
            TargetOriginId: AssetsOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: false
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          - PathPattern: "/admin*"
            TargetOriginId: ServerOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # Managed-AllViewer
            ResponseHeadersPolicyId: !Ref SecurityHeaders
          - PathPattern: "/login"
            TargetOriginId: ServerOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # Managed-AllViewer
            ResponseHeadersPolicyId: !Ref SecurityHeaders
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt HostRedirect.FunctionARN
          - PathPattern: "/logout"
            TargetOriginId: ServerOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # Managed-AllViewer
            ResponseHeadersPolicyId: !Ref SecurityHeaders
          - PathPattern: "/auth/*"
            TargetOriginId: ServerOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # Managed-AllViewer
            ResponseHeadersPolicyId: !Ref SecurityHeaders
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt HostRedirect.FunctionARN
          - PathPattern: "/webhooks/*"
            TargetOriginId: ServerOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: false
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # Managed-AllViewer
            ResponseHeadersPolicyId: !Ref SecurityHeaders
        # END GENERATED site_cdn behaviors
