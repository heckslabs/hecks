AWSTemplateFormatVersion: "2010-09-09"
Description: A gallery's site, behind one CloudFront distribution, with no load balancer.

Resources:
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Origins:
          - Id: WebsiteOrigin
            DomainName: site.gallery.invalid
          - Id: CmsOrigin
            DomainName: cms.gallery.invalid
