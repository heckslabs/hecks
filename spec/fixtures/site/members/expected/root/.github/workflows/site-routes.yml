# Generated by hecks site site_projection.project_site. Do not edit.
# Two checks, neither needing AWS or a database:
#
#   1. the generated files are current: `bin/site_routes --check` regenerates them with the
# hecks gem
#      the Gemfile.lock pins and exits 1, naming each file, if a row was edited without
#      regenerating or a generated file was hand-edited;
#   2. `npm run check`, which holds the generated code to what the hand-written code does.
name: Site routes

on:
  push:
    branches: [main]
    paths:
      - "site-routes/**"
      - "src/**"
      - "bin/site_routes"
      - "club/Gemfile.lock"
      - ".github/workflows/site-routes.yml"
  pull_request:
    paths:
      - "site-routes/**"
      - "src/**"
      - "bin/site_routes"
      - "club/Gemfile.lock"
      - ".github/workflows/site-routes.yml"
  # Lets a GitHub merge queue run this check on each queued PR (paths are not applied to
  # merge_group).
  merge_group:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  routes-current-and-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: club

      - name: The generated files are current
        run: bin/site_routes --check

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: npm ci
        run: npm ci

      - name: Parity between the generated code and the hand-written code
        run: npm run check
