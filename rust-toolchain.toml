# Pins the toolchain so builds are reproducible across machines and CI.
#
# rust/host needs rustc >= 1.94.1 (aws-config/aws-sdk-lambda); wasmtime 47.0.3 needs >= 1.94.0.
# An exact version is pinned because a floating "stable" would drift.
#
# Only takes effect through rustup's proxies (~/.cargo/bin/{cargo,rustc}). A rustc earlier on
# PATH (Homebrew) bypasses this file; check `which cargo` before assuming the pin is broken.
[toolchain]
channel = "1.98.0"
# The lint gate (`hecks gate_run.gate stage=ci only=rust_fmt,rust_clippy`) needs both of these.
components = ["clippy", "rustfmt"]
