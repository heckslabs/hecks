name: Generated Rust
description: >-
  Checks that rust/src/generated is in the checkout. The repository commits it: it is a pure function
  of the bluebooks and the generator, `checks_codegen_drift` regenerates it and fails when the
  committed copy differs, and a job that builds, tests or hashes rust/src reads it as checked out, so
  no job regenerates, restores or caches it. The `domains` input is kept for the jobs that still
  name it and has no effect.
inputs:
  domains:
    description: Unused; the whole tree is checked out.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Check the generated Rust is committed
      shell: bash
      run: test -f rust/src/generated/mod.rs && test -d rust/src/generated/banking
