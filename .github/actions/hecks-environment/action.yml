name: Hecks journaling environment
description: >-
  Chooses where the `hecks` commands a job runs keep their journal. A run on main or in the
  merge queue journals to the PostgresEra database its `database` input names, so the history of
  every check is shared. Every other run, pull requests above all, uses Memory
  (`HECKS_ENVIRONMENT=memory`), so no pull request's code is handed database credentials and
  nothing is journaled. A main or merge-queue run with no database input falls back to Memory
  rather than fail on the default local database.
inputs:
  database:
    description: >-
      The PostgresEra URL the ledger role connects with (the HECKS_JOURNAL_DATABASE secret).
      Empty keeps the run on Memory.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Select the journal
      shell: bash
      env:
        DATABASE: ${{ inputs.database }}
        EVENT_NAME: ${{ github.event_name }}
        REF: ${{ github.ref }}
      run: |
        if [ "$REF" = "refs/heads/main" ] && [ -n "$DATABASE" ]; then
          echo "::add-mask::$DATABASE"
          echo "HECKS_DATABASE=$DATABASE" >> "$GITHUB_ENV"
          echo "hecks journals to PostgresEra ($EVENT_NAME on $REF)"
        else
          echo "HECKS_ENVIRONMENT=memory" >> "$GITHUB_ENV"
          echo "hecks runs on Memory ($EVENT_NAME on $REF)"
        fi
