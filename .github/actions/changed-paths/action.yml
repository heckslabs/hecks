name: changed-paths
description: >
  Answers whether a change touches the paths a gated job covers. The gates that call this are the
  `CiGate` rows of the Vocabulary chapter, written into the workflows by `hecks project_ci_gates`.
  The caller checks out with `fetch-depth: 0` first: the diff needs both endpoints as real objects.

inputs:
  mode:
    description: "`touches` (any changed path matches the pattern) or `skips_unless` (any changed path misses it)"
    required: true
  pattern:
    description: Extended regex over changed paths
    required: true
  push:
    description: "What a push event diffs against: `skip` (nothing; the caller gates push out) or `before_sha`"
    required: true
  label:
    description: The question the gate asks, for the log line when it cannot tell
    required: true

outputs:
  touched:
    description: "`true` when the gated job should run, `false` when it can be skipped"
    value: ${{ steps.diff.outputs.touched }}

runs:
  using: composite
  steps:
    - name: ${{ inputs.label }}
      id: diff
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        MERGE_BASE_REF: ${{ github.event.merge_group.base_ref }}
        BEFORE: ${{ github.event.before }}
        HEAD_SHA: ${{ github.sha }}
        MODE: ${{ inputs.mode }}
        PATTERN: ${{ inputs.pattern }}
        PUSH: ${{ inputs.push }}
        LABEL: ${{ inputs.label }}
      run: |
        # A MERGE GROUP DIFFS AGAINST THE TARGET BRANCH, NEVER AGAINST
        # `merge_group.base_sha`. base_sha is the PREVIOUS QUEUE ENTRY, so
        # a PR queued behind another one diffs as its own files only — and
        # the queue's HEADGREEN grouping merges the whole group on the
        # last entry's run alone. #729 (docs only) rode behind a red #730
        # that way on 2026-09-18: its gate skipped, its run went green,
        # and both merged. The group's head carries every earlier entry,
        # so its diff has to as well.
        BASE="$PR_BASE"
        if [ "$EVENT" = "merge_group" ]; then
          BASE="$(git merge-base "origin/${MERGE_BASE_REF#refs/heads/}" "$HEAD_SHA")" || BASE=""
        fi
        if [ -z "$BASE" ] && [ "$EVENT" = "push" ] && [ "$PUSH" = "before_sha" ]; then
          BASE="$BEFORE"
        fi

        # Every branch that cannot confirm a safe diff runs the job rather than skipping it.
        if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
          echo "no usable BASE to diff against ($LABEL) — running the gated job rather than guessing" >&2
          echo "touched=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        CHANGED="$(git diff --name-only "$BASE" "$HEAD_SHA")" || {
          echo "git diff itself failed ($LABEL) — running the gated job rather than guessing" >&2
          echo "touched=true" >> "$GITHUB_OUTPUT"
          exit 0
        }

        if [ -z "$CHANGED" ]; then
          echo "touched=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ "$MODE" = "touches" ]; then
          if echo "$CHANGED" | grep -qE "$PATTERN"; then touched=true; else touched=false; fi
        else
          if echo "$CHANGED" | grep -vE "$PATTERN" | grep -q .; then touched=true; else touched=false; fi
        fi
        echo "touched=$touched" >> "$GITHUB_OUTPUT"
