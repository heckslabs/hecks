name: Tuned local Postgres
description: >-
  Starts the Postgres 16 already preinstalled on ubuntu-24.04 runners
  (confirmed via actions/runner-images' own Ubuntu2404-Readme.md: "User:
  postgres / PostgreSQL service is disabled by default. Use ... 'sudo
  systemctl start postgresql.service'") instead of a `services:` Docker
  container, and tunes it for disposable test databases — durability
  settings a `services:` block has no way to set at all, since it has no
  `command:` field to pass postgres flags through. Phase 5 of the CI
  speed effort.

  UNTESTED ON REAL INFRASTRUCTURE AS WRITTEN — every other change in
  this effort was verified against a real local Postgres before it
  shipped; this one could only be checked against the runner image's own
  published software manifest (confirmed PG 16.15, confirmed the start
  command) since there is no Ubuntu box available to rehearse
  `pg_conftool`/pg_hba.conf edits against the exact package layout
  ubuntu-24.04 ships. Land this as its own PR and watch its first real
  CI run closely — do not chain other changes on top of it before that
  run is seen green.

  PGDATA ON TMPFS, ALSO UNTESTED ON REAL INFRASTRUCTURE — the durability
  settings below only skip the fsync() call; every write to a page
  evicted from `shared_buffers`, every WAL segment, every temp file
  still goes through a real filesystem underneath. Rebuilding the
  cluster on a tmpfs mount removes that layer too, since the runner's
  disk is never touched at all. Same rule applies: watch its first real
  CI run closely before building on it.
inputs:
  password:
    description: Password to set for the postgres role, matching PGPASSWORD.
    required: false
    default: postgres
runs:
  using: composite
  steps:
    - name: Start the preinstalled Postgres and tune it for disposable test databases
      shell: bash
      run: |
        set -e

        # IDENTIFY THE CLUSTER COLD — `pg_lsclusters` reads postgresql-
        # common's own /etc/postgresql/*/*/ registry, so this needs no
        # running server. Grabbing version+name here (rather than via
        # `SHOW server_version_num` after start, as before) lets the
        # tmpfs rebuild below happen before the first start instead of
        # needing a stop/rebuild/restart cycle.
        read -r PG_VERSION PG_CLUSTER _ <<<"$(pg_lsclusters | tail -n +2)"

        # REBUILD PGDATA ON TMPFS — `pg_createcluster`/`pg_dropcluster`,
        # not raw `initdb` directly against the ramdisk, so postgresql-
        # common's own /etc config-file split and systemd integration
        # (what `systemctl start postgresql.service` below depends on)
        # stay intact. The directory is chowned to `postgres` before
        # `pg_createcluster` runs because a fresh tmpfs mount is
        # root-owned, and `pg_createcluster` expects to initdb into a
        # directory it (as the cluster owner) can already write to.
        RAMDISK=/mnt/pg_ramdisk
        sudo mkdir -p "$RAMDISK"
        sudo mount -t tmpfs -o size=4g tmpfs "$RAMDISK"
        sudo chown postgres:postgres "$RAMDISK"
        sudo chmod 700 "$RAMDISK"
        sudo pg_dropcluster --stop "$PG_VERSION" "$PG_CLUSTER"
        sudo pg_createcluster "$PG_VERSION" "$PG_CLUSTER" --datadir="$RAMDISK"

        sudo systemctl start postgresql.service

        # WAIT FOR REAL READINESS — systemctl returning doesn't mean the
        # server is accepting connections yet; the `services:` block this
        # replaces had a `pg_isready` health check for the same reason.
        for _ in $(seq 1 30); do
          sudo -u postgres pg_isready -q && break
          sleep 1
        done
        sudo -u postgres pg_isready -q

        # DURABILITY OFF, DELIBERATELY — every database this workflow
        # touches is thrown away at the end of the job; nothing here is
        # ever recovered from a crash. `pg_conftool` is the standard
        # Debian/Ubuntu postgresql-common tool for editing
        # postgresql.conf without hand-parsing it. Kept even with PGDATA
        # on tmpfs: `full_page_writes off` still shrinks WAL volume, and
        # `fsync`/`synchronous_commit off` still skip a real syscall per
        # commit even when the underlying write was already to RAM.
        sudo pg_conftool "$PG_VERSION" "$PG_CLUSTER" set fsync off
        sudo pg_conftool "$PG_VERSION" "$PG_CLUSTER" set synchronous_commit off
        sudo pg_conftool "$PG_VERSION" "$PG_CLUSTER" set full_page_writes off

        # Trust for local TCP connections, scoped to this ephemeral runner's own loopback.
        # Prepended, not appended: pg_hba.conf is first-match-wins, and the distro's default
        # file already has a stricter 127.0.0.1/::1 rule earlier that would otherwise shadow ours.
        # `sudo cat`, not plain `cat`: pg_hba.conf is owned by `postgres`, mode 640, unreadable
        # by the unprivileged runner user this script otherwise runs as.
        HBA_FILE=$(sudo -u postgres psql -tAc "SHOW hba_file;")
        {
          echo "host all all 127.0.0.1/32 trust"
          echo "host all all ::1/128 trust"
          sudo cat "$HBA_FILE"
        } | sudo tee "$HBA_FILE.new" > /dev/null
        sudo mv "$HBA_FILE.new" "$HBA_FILE"

        sudo systemctl restart postgresql.service
        for _ in $(seq 1 30); do
          sudo -u postgres pg_isready -q && break
          sleep 1
        done
        sudo -u postgres pg_isready -q

        sudo -u postgres psql -c "ALTER USER postgres PASSWORD '${{ inputs.password }}';"
