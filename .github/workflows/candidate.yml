# Generated by hecks regeneration_run.project_ci_pipeline!. Do not edit; change the workflow rows.

name: Candidate

# The candidate gate (ADR 0181). The push train pushes local main's tip to `candidate`, not to
# main; CI runs there (ci.yml triggers on a push to candidate). When that run completes green, this
# workflow fast-forwards main onto the candidate's commit through the API, never forcing, and starts
# promote.yml so `stable` follows. A ref moved by the workflow's own token starts no workflow run, so
# main does not run CI again on a commit CI just judged; promote.yml judges the commit by the checks
# recorded against its sha, which the candidate run wrote. A red run promotes nothing: the
# coordinator clears it with `Candidate.reject!`. The owner's HECKS_OWNER_PUSH stays the recovery
# path when the gate itself misbehaves, and `Candidate.disable!` turns the gate off.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [candidate]

concurrency:
  group: candidate
  cancel-in-progress: false

jobs:
  # Only a green push of this repository's candidate promotes: a fork's run, a cancelled or red run,
  # and a pull request's run move nothing. `contents: write` moves main; `actions: write` starts
  # promote.yml, since a ref moved by the token starts no workflow by itself.
  promote_candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # No checkout: the commit is already on the remote as the candidate, so main is moved through the
      # API as a fast-forward (`force=false`; a diverged main refuses by name). A candidate main already
      # holds was promoted by `Candidate.promote!` from a checkout, which is not an error.
      - name: Fast-forward main onto the green candidate, then start Promote
        run: |
          SHA=${{ github.event.workflow_run.head_sha }}
          REPO=${{ github.repository }}
          STATUS=$(gh api "repos/$REPO/compare/main...$SHA" --jq .status)
          case "$STATUS" in
            identical|behind) echo "candidate $SHA is already on main ($STATUS)"; exit 0 ;;
            ahead) ;;
            *) echo "::error::candidate $SHA is not built on main ($STATUS): not promoted"; exit 1 ;;
          esac
          gh api -X PATCH "repos/$REPO/git/refs/heads/main" -f sha="$SHA" -F force=false
          echo "promoted candidate $SHA onto main"
          gh workflow run promote.yml --ref main
