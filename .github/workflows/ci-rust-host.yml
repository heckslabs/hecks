name: CI rust host (reusable)

# Reusable workflow holding the required-status-check jobs for rust/host.
# Split rationale is in ci-rust-io.yml.

on:
  workflow_call:
    secrets:
      HECKS_CI_ATTEST_KEY:
        required: false
      HECKS_JOURNAL_DATABASE:
        required: false

jobs:
  # Same detector-plus-gated-job shape as ci-rspec.yml's own ci_attestation_rspec —
  # see ci-rust-parser.yml's identical addition for the full comment. One detector
  # for both jobs below: they're one required check (rspec_rust_host), so one note
  # entry covers both.
  ci_attestation_rust_host:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      attested: ${{ steps.attest.outputs.attested }}

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/check-attestation
        id: attest
        with:
          checks: rspec_rust_host
          hmac-key: ${{ secrets.HECKS_CI_ATTEST_KEY }}

  # rust/host/ is the only Cargo project here that needs Postgres. The lineage spec
  # mints across a real era boundary in its own scratch database, created and
  # dropped by the spec, so no provisioning step is needed.
  #
  # Two jobs so `cargo test` and the rspec lineage spec run in parallel: the spec
  # builds its own `lineage_harness` binary and needs neither the wasm build nor
  # anything `cargo test` produces. Each job's tests use uniquely named scratch
  # databases, so they cannot collide.
  #
  # Only the cargo job needs the wasm build and the superuser role: `cargo test`
  # connects with tokio_postgres, which ignores PG* env vars, while the spec
  # connects through the `pg` gem, which honors them.
  # `cargo test` dispatches against banking.wasm and checkout_fixture.wasm, read at run time only
  # (rust/dist is gitignored). They are built here, beside the cargo job's cache restore and test
  # compile, and handed over as an artifact the cargo job polls for. The dev profile: the tests
  # only run the modules, and it compiles in half the time. rust/host runs them through the
  # wasmtime crate, so the wasmtime CLI is not installed.
  build_host_wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # One leg per module, side by side: building them one after another was the longest chain in
    # the cargo job's wait.
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: banking
            domain: examples/banking
          - module: checkout_fixture
            domain: spec/fixtures/rust_host/checkout_fixture

    needs: ci_attestation_rust_host
    if: always() && (needs.ci_attestation_rust_host.result != 'success' || needs.ci_attestation_rust_host.outputs.attested != 'true')

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ruby
      - uses: ./.github/actions/hecks-environment
        with:
          database: ${{ secrets.HECKS_JOURNAL_DATABASE }}

      - uses: ./.github/actions/wasm-toolchain
        with:
          install-wasmtime: "false"

      - name: Build the ${{ matrix.module }} wasm module
        env:
          HECKS_WASM_PROFILE: dev
        run: bundle exec exe/hecks build.build_wasm domain=${{ matrix.domain }} --wait

      - uses: actions/upload-artifact@v4
        with:
          name: host-wasm-${{ matrix.module }}
          path: rust/dist
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  rspec_rust_host_cargo:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      actions: read

    needs: ci_attestation_rust_host
    if: always() && (needs.ci_attestation_rust_host.result != 'success' || needs.ci_attestation_rust_host.outputs.attested != 'true')

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      # The test build's own directory, restored from its own cache (cache-warm.yml warms it), so this
      # job does not restore the lineage job's harness builds.
      CARGO_TARGET_DIR: target-test

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ruby
      - uses: ./.github/actions/hecks-environment
        with:
          database: ${{ secrets.HECKS_JOURNAL_DATABASE }}

      # Preinstalled Postgres rather than a `services:` container; see the action header.
      - uses: ./.github/actions/postgres

      - uses: ./.github/actions/cargo-cache
        with:
          name: hosttest
          crate-root: rust/host
          target-dir: target-test

      # tokio_postgres logs in as the OS user, so give the runner user a superuser
      # role; the postgres action already trusts loopback TCP.
      - name: Create a superuser role for the runner user
        run: sudo -u postgres psql -c "CREATE ROLE \"$(whoami)\" SUPERUSER LOGIN"

      # The tests read the wasm modules at run time only, so compile them first, while
      # build_host_wasm builds the modules. `bundle exec` lets the Ruby mint fixtures (spawned as
      # plain `ruby`) load `pg`.
      - name: "Compile the tests"
        run: cd rust/host && bundle exec cargo test --no-run

      # Polls for the artifact, since the job that builds it runs beside this one.
      - name: Wait for the wasm modules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 90); do
            found=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                    --jq '[.artifacts[] | select(.name | startswith("host-wasm-"))] | length')
            [ "$found" = "2" ] && exit 0
            sleep 2
          done
          echo "the host-wasm artifacts were not uploaded within 180s" >&2
          exit 1

      - uses: actions/download-artifact@v4
        with:
          pattern: host-wasm-*
          merge-multiple: true
          path: rust/dist

      - name: "cargo test (rust/host)"
        run: cd rust/host && bundle exec cargo test

  rspec_rust_host_lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: ci_attestation_rust_host
    if: always() && (needs.ci_attestation_rust_host.result != 'success' || needs.ci_attestation_rust_host.outputs.attested != 'true')

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ruby

      - uses: ./.github/actions/postgres

      # Same cache as the cargo job; only needed to build `lineage_harness`.
      - uses: ./.github/actions/cargo-cache
        with:
          name: host
          crate-root: rust/host

      - name: "rspec: Rust/Ruby lineage parity (rust/host)"
        run: bundle exec rspec --tag io spec/rust_host_lineage_conformance_spec.rb

      - name: "rspec: Rust/Ruby expression parity (rust/host)"
        run: bundle exec rspec --tag io spec/rust_host_expr_json_conformance_spec.rb

      - name: "rspec: Rust host query step (rust/host)"
        run: bundle exec rspec --tag io spec/rust_host_query_step_spec.rb

      # The Rust half of the committed approval rehearsal builds `mint_harness`, cold in a postgres
      # shard (about two minutes) but warm here, from the cache the host job restores.
      - name: "rspec: committed approval rehearsal, the Rust half (rust/host)"
        run: bundle exec rspec --tag io --example "Rust (mint_harness)" spec/committed_approval_rehearsal_spec.rb
