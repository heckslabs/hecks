name: CI rust host (reusable)

# REUSABLE-WORKFLOW SPLIT OF ci.yml, group 3 (part 4 of 4) — see
# ci-rust-io.yml's own header for the full split rationale. This file
# holds only `rspec_rust_host`, the required-status-check job.

on:
  workflow_call:

jobs:
  # rust/host/ ("mint_harness"/"lineage_harness") — the fourth
  # independent Cargo project, and the ONLY one of the four that needs
  # Postgres: rust_host_lineage_conformance_spec.rb mints across a real
  # era boundary against its own scratch database
  # (`rust_host_lineage_pizzas_#{suffix}`, created and dropped by the
  # spec itself — it never touches the shared `hecks_pizzas` database,
  # so no separate provisioning step is needed here either). Its two
  # binaries are built via the spec's own before(:context) hooks, same
  # pattern as parser/codegen.
  rspec_rust_host:
    runs-on: ubuntu-latest

    # See `rspec` job's own comment in ci.yml — cache-warming push doesn't
    # need this job.
    if: github.event_name != 'push'

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ruby

      # PREINSTALLED + TUNED, NOT A `services:` CONTAINER — Phase 5 of
      # the CI speed effort; see the action's own header.
      - uses: ./.github/actions/postgres

      - uses: ./.github/actions/cargo-cache
        with:
          name: host
          crate-root: rust/host

      # rust/host's own `cargo test` dispatches against two compiled
      # domains: rust/dist/banking.wasm (dispatch.rs) and
      # rust/dist/checkout_fixture.wasm (web.rs's checkout routes, from
      # spec/fixtures/rust_host/checkout_fixture). rust/dist is
      # gitignored, so build both here.
      - uses: ./.github/actions/wasm-toolchain

      - name: Build banking + checkout_fixture wasm
        run: |
          bundle exec bin/project_wasm examples/banking
          bundle exec bin/project_wasm spec/fixtures/rust_host/checkout_fixture
          # bin/project_wasm regenerates tracked rust/src/generated +
          # rust/Cargo.toml as a side effect; put them back.
          git checkout -- rust/src/generated rust/Cargo.toml
          git clean -fdq rust/src/generated

      # rust/host's Postgres tests connect with tokio_postgres, which
      # ignores libpq's PG* env vars and logs in as the OS user (a
      # superuser on a dev machine). Give the runner user the same role;
      # the action already trusts loopback TCP, so no password needed.
      - name: Create a superuser role for the runner user
        run: sudo -u postgres psql -c "CREATE ROLE \"$(whoami)\" SUPERUSER LOGIN"

      - name: "cargo test (rust/host)"
        run: cd rust/host && cargo test

      - name: "rspec: Rust/Ruby lineage parity (rust/host)"
        run: bundle exec rspec --tag io spec/rust_host_lineage_conformance_spec.rb
