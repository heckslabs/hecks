name: Watch lanes

# Generated by hecks project_lanes from the Lane rows of the Vocabulary chapter. Do not hand-edit.
#
# Every hour, asks `PromotionRun` whether a lane has stood behind the lane it follows for
# longer than its Lane row allows (`alert_after`, in hours). The rule is decided there, not
# here. A late lane fails the run and files a finding, one a day.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

# One watch at a time; none is cancelled.
concurrency:
  group: lane-watch
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  issues: write

jobs:
  watch_stable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the lag is read from the commits one lane has and the other lacks.
          fetch-depth: 0
      - uses: ./.github/actions/setup-ruby
      - uses: ./.github/actions/hecks-environment
        with:
          database: ${{ secrets.HECKS_JOURNAL_DATABASE }}
      - name: Watch stable
        env:
          GH_TOKEN: ${{ github.token }}
          HECKS_FINDINGS_REPO: ${{ github.repository }}
        run: >-
          bundle exec exe/hecks promotion_run.watch lane=stable
          run=watch-stable-${{ github.run_id }}-${{ github.run_attempt }}
          alert_key=stable-lag-$(date -u +%Y-%m-%d) --wait
