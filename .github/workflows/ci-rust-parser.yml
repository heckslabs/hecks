name: CI rust parser (reusable)

# Reusable workflow holding the required-status-check job for rust/parser.
# Split rationale is in ci-rust-io.yml.

on:
  workflow_call:
    secrets:
      HECKS_CI_ATTEST_KEY:
        required: false

jobs:
  # Same detector-plus-gated-job shape as ci-rspec.yml's own ci_attestation_rspec —
  # see that file's header and .github/actions/check-attestation's own header for
  # the full mechanism. ci_attest_write (ci.yml) is what now writes a note this can
  # match, right after a green pull_request run of every lineage it names.
  ci_attestation_rust_parser:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: github.event_name != 'push'

    outputs:
      attested: ${{ steps.attest.outputs.attested }}

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/check-attestation
        id: attest
        with:
          checks: rspec_rust_parser
          hmac-key: ${{ secrets.HECKS_CI_ATTEST_KEY }}

  # rust/parser/ ("hecks-parse") is an independent Cargo project that never touches
  # the main crate's tree, so this job can run beside rspec_rust_io. The specs
  # build it themselves via `build_parser!`, so no separate build step is needed.
  rspec_rust_parser:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: ci_attestation_rust_parser
    # Runs only when not already attested — see ci-rspec.yml's rspec_shard's own
    # comment for why both `always()` and `.result != 'success'` are load-bearing.
    if: always() && github.event_name != 'push' && (needs.ci_attestation_rust_parser.result != 'success' || needs.ci_attestation_rust_parser.outputs.attested != 'true')

    # `packages: write` lets this job push to GHCR; `contents: read` keeps checkout
    # working. The calling job in ci.yml must grant the same, since a reusable
    # workflow cannot exceed its caller's permissions.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ruby

      - uses: ./.github/actions/cargo-cache
        with:
          name: parser
          crate-root: rust/parser

      # Same-run cache that `actions/cache` cannot give: a hit means a sibling job
      # (likely rspec_rust_io) already pushed this build, so `build_parser!` is a no-op.
      - uses: ./.github/actions/ghcr-binary-cache-restore
        id: ghcr_cache
        with:
          name: parser
          crate-root: rust/parser
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "rspec: Rust parser parity + coverage + grammar corpus"
        run: |
          bundle exec rspec --tag io \
            spec/parser_parity_spec.rb \
            spec/parser_coverage_spec.rb \
            spec/grammar_corpus_spec.rb

      # The crate's own unit and tests/gates.rs suite; reuses the target dir built above.
      - name: "cargo test: rust/parser (hecks-parse)"
        run: cd rust/parser && cargo test

      # rust/lsp is an independent Cargo project (it shells out to the parser binary),
      # so it needs its own target-dir cache.
      - uses: ./.github/actions/cargo-cache
        with:
          name: lsp
          crate-root: rust/lsp

      - name: "cargo test: rust/lsp (hecks_lsp)"
        run: cd rust/lsp && cargo test

      # Push only on a miss; re-pushing a hit wastes upload bandwidth.
      - uses: ./.github/actions/ghcr-binary-cache-save
        if: steps.ghcr_cache.outputs.cache-hit != 'true'
        with:
          name: parser
          crate-root: rust/parser
          token: ${{ secrets.GITHUB_TOKEN }}
