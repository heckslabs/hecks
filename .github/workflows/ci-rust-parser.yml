name: CI rust parser (reusable)

# REUSABLE-WORKFLOW SPLIT OF ci.yml, group 3 (part 2 of 4) — see
# ci-rust-io.yml's own header for the full split rationale. This file
# holds only `rspec_rust_parser`, the required-status-check job.

on:
  workflow_call:

jobs:
  # rust/parser/ ("hecks-parse") — an independent Cargo project, own
  # Cargo.toml/target dir, no interaction with rust/src/generated/ or
  # rust/Cargo.toml at all. The parity and grammar-corpus specs build it
  # via their own `before(:context) { self.class.build_parser! }` (the
  # second is a no-op against the first's fresh target/), so no separate
  # build step is needed at this job level the way rspec_rust_io needs
  # one (that spec-internal build is exactly why this job is safe to run
  # concurrently with rspec_rust_io in the first place — nothing here
  # ever opens a file under the main crate's tree). grammar_corpus_spec
  # moved here from rspec_postgres_io_parallel — see that job's own
  # `--exclude-pattern` comment for the overlap failure that found it.
  rspec_rust_parser:
    runs-on: ubuntu-latest

    # See `rspec` job's own comment in ci.yml — cache-warming push doesn't
    # need this job.
    if: github.event_name != 'push'

    # PHASE 8, GHCR BINARY CACHE — `packages: write` lets this job push
    # to GHCR (see ghcr-binary-cache-save's own header); `contents: read`
    # keeps the default checkout permission a bare `permissions:` block
    # would otherwise drop. Also declared on the calling
    # `rspec_rust_parser_impl` job in ci.yml — a reusable workflow's own
    # jobs can only use what the caller's grant allows, so both sides
    # need it.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ruby

      - uses: ./.github/actions/cargo-cache
        with:
          name: parser
          crate-root: rust/parser

      # PHASE 8, GHCR BINARY CACHE — see ghcr-binary-cache-restore's own
      # header for the full design: this is the SAME-run half `actions/
      # cache` above cannot provide. A hit here means some sibling job in
      # THIS run (most likely rspec_rust_io, which also opt-in builds
      # this crate) already built the identical content and pushed it,
      # so the spec's own `build_parser!` call below becomes a fast
      # cargo no-op instead of a real cold build.
      - uses: ./.github/actions/ghcr-binary-cache-restore
        id: ghcr_cache
        with:
          name: parser
          crate-root: rust/parser
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "rspec: Rust parser parity + coverage + grammar corpus"
        run: |
          bundle exec rspec --tag io \
            spec/parser_parity_spec.rb \
            spec/parser_coverage_spec.rb \
            spec/grammar_corpus_spec.rb

      # The crate's own unit + tests/gates.rs suite — never ran in CI
      # before (only `cargo test --lib` in rust/ did). Reuses the parser
      # target dir the spec above just built.
      - name: "cargo test: rust/parser (hecks-parse)"
        run: cd rust/parser && cargo test

      # rust/lsp ("hecks_lsp") — its own independent Cargo project, no Cargo
      # dependency on hecks-parse (it shells out to the binary at runtime),
      # so it needs its own target-dir cache. Also never ran in CI before.
      - uses: ./.github/actions/cargo-cache
        with:
          name: lsp
          crate-root: rust/lsp

      - name: "cargo test: rust/lsp (hecks_lsp)"
        run: cd rust/lsp && cargo test

      # Only push on an actual miss — see ghcr-binary-cache-save's own
      # header for why re-pushing an unchanged hit would just waste
      # upload bandwidth on bytes GHCR already has.
      - uses: ./.github/actions/ghcr-binary-cache-save
        if: steps.ghcr_cache.outputs.cache-hit != 'true'
        with:
          name: parser
          crate-root: rust/parser
          token: ${{ secrets.GITHUB_TOKEN }}
