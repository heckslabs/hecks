name: CI

# The same two checks .githooks/pre-push already requires before anything
# leaves a machine — run again here so a push that skipped the hook (or
# a PR from a branch that never had it installed) can't land red. Real
# Postgres and SQLite both provisioned, not skipped: the adapter specs
# check their own reachability and skip themselves silently otherwise,
# which would mean this workflow "passing" without ever having run them.
#
# NO `push: branches: [main]` TRIGGER — removed 2026-08-28, once it
# stopped catching anything the other two triggers didn't already cover.
# main's ruleset (`merge-queue-main`) now requires every change to go
# through a PR with no bypass (`current_user_can_bypass: "never"`,
# checked live via `gh api repos/heckslabs/hecks/rulesets`) and land only
# via the merge queue, whose `merge_group` trigger below re-runs `rspec`/
# `checks` against the PR merged onto main's CURRENT tip immediately
# before the merge happens — the exact "was this actually tested against
# what it's landing on" guarantee a `push: branches: [main]` run used to
# be the only thing providing (classic protection's own
# `required_status_checks.strict` is ALSO now `true`, belt-and-suspenders
# with the ruleset, not the thing doing the work). Before this ruleset
# existed, direct pushes to main were possible with zero required
# review — that's what the push trigger was really guarding against; now
# that the ruleset closes that path structurally, testing the same
# already-merged commit a third time on `push` bought nothing but a
# duplicate full CI run on every merge.

# EIGHT JOBS, RUN CONCURRENTLY (no `needs:` between any of them, so
# GitHub Actions schedules all eight the moment the workflow starts).
# This used to be two jobs (`rspec`, `checks`) with `rspec` itself split
# into a parallel_rspec step followed by a SERIAL "io + fuzzing" step
# that ran real Postgres/cargo work on the critical path, after the
# parallel step had already finished — the two couldn't run concurrently
# because they shared one checkout, and the io/fuzzing specs do real,
# uncontrolled things to that checkout (cargo builds writing into rust/,
# before(:context)/after(:context) backup-and-restore of
# rust/src/generated and rust/Cargo.toml) that would race a second
# worker touching the same files.
#
# The fix isn't more workers inside that one job, it's more checkouts:
# `rspec`'s old serial step is now six separate jobs, split along the
# dependency edges that actually exist in the `io: true`/`fuzzing: true`
# spec set (each verified by grepping every file in the set for real
# `cargo`/`make`/Postgres/subprocess use — see the file lists inside each
# job below, not just its own header comment):
#
#   - `rspec_rust_io` — the 8 specs that touch the SHARED `rust/` crate
#     and its committed `rust/src/generated/` tree (Rust conformance,
#     numeric coercion, the rust_project generator specs, the deploy
#     parity gate's functional half). Keeps the Rust build steps; no
#     longer keeps a Postgres service — the one spec here that used to
#     need it (rust_host_lineage_conformance_spec.rb) moved to
#     `rspec_rust_host` below, along with everything else that builds a
#     genuinely separate Cargo project.
#   - `rspec_rust_parser` / `rspec_rust_codegen` / `rspec_rust_host` —
#     each of the 4 remaining cargo-touching specs builds a COMPLETELY
#     INDEPENDENT Cargo project (rust/parser/, rust/codegen/, rust/host/
#     respectively) with its own Cargo.toml/target dir, and never reads
#     or writes anything under the main crate's rust/src/generated/ or
#     rust/Cargo.toml — verified by grep, not assumed. They only ever
#     shared a runner with the main-crate group because the original
#     single `rspec_rust_io` job bundled every cargo-touching spec
#     together; nothing about them actually conflicts with each other or
#     with the main crate, so each gets its own job (and its own
#     crate-scoped cache) and runs concurrently with the rest instead of
#     serially inside one. `rspec_rust_host` is the only one of the
#     three that keeps a Postgres service, for the reason above.
#   - `rspec_postgres_io` — every other `io: true` spec: the Postgres
#     adapter suite, the tenant/deploy specs that do real filesystem I/O
#     (Makefile generation, `make` runs that are expected to refuse or
#     no-op) and the handful of specs wired to the shared
#     `hecks_pizzas` database. No Rust toolchain involved anywhere in
#     this set, so no cargo build steps here. THIS JOB IS THE DEFAULT:
#     a newly-added `io: true` spec lands here automatically unless it's
#     also added to one of the `rspec_rust_*` jobs' explicit lists AND
#     excluded here (see the comment on its `--exclude-pattern` below)
#     — so the failure mode of forgetting to update both is "runs twice,
#     one complains about no cargo," not "silently never runs."
#   - `rspec_fuzzing` — `spec/fuzzing/**`, tagged by path
#     (`define_derived_metadata`, spec/spec_helper.rb). Not `io: true`
#     itself — no subprocess, no network, all in-memory — just several
#     seeds of live-generated-history replay, worth its own runner
#     because it noticeably outweighs an average `~io ~fuzzing` example
#     (spec_helper.rb's own comment: ~8s for properties_spec.rb's two
#     passes alone, against a suite that's otherwise ~50ms/example).
#
# Each of these repeats the checkout/Ruby-setup cost the old serial step
# only paid once — real, but small next to running on separate runners
# instead of one queue. Each `rspec_rust_*` job caches its OWN crate's
# `~/.cargo` + `target` (a distinct key per job, keyed on that crate's
# own Cargo.lock) instead of one shared cache across all four — nothing
# in this workflow cached any of them before the first version of this
# split: a cold `cargo test --lib` for the main crate alone measured ~4
# minutes locally the session that added it, paid fresh on every run.
#
# `rspec` ITSELF STILL KEEPS THE POSTGRES SERVICE — confirmed live, not
# assumed: spec/diagrams_spec.rb, spec/storehouse_spec.rb, and the
# committed-OIDC-manifest spec all boot the full examples/pizzas domain
# for real, which wires real PostgresEra at boot, and none of the three
# is tagged `io: true`. A first version of this split dropped the
# service on the (wrong) assumption that only `io: true` specs ever
# touch real Postgres; that broke `rspec` with 21 `PG::ConnectionBad`
# failures the first time it actually ran. See the job's own comment
# below.
#
# No wall-clock numbers for the four-way `rspec_rust_*` split below —
# unlike the original split (measured locally before it shipped), this
# one only shows its real timing once it's actually run on Actions' own
# runners; the shape of the win (independent checkouts, nothing left
# serialized with a crate it never touches) is what's asserted here, not
# a specific number. What IS measured: the single `rspec_rust_io` job
# this replaces ran consistently ~7m23s-7m39s across the last several
# `main` runs before this split — the largest single job in the
# workflow by a wide margin.

on:
  pull_request:
  merge_group:

jobs:
  rspec:
    runs-on: ubuntu-latest

    # STILL NEEDED HERE, even though every `cargo build` and every
    # deliberately-real-I/O spec moved to `rspec_postgres_io`/
    # `rspec_rust_io` below: spec/diagrams_spec.rb, spec/storehouse_spec.rb,
    # and the committed-OIDC-manifest spec all boot the FULL
    # examples/pizzas domain for real (`Hecks.boot`/`Storehouse.validate`),
    # which wires real PostgresEra at boot time regardless of what the
    # spec itself is actually testing — none of the three is tagged
    # `io: true` (arguably a gap in that convention, not addressed here),
    # so removing this service on the assumption that only `io: true`
    # specs touch real Postgres broke this job the first time it ran
    # without one (18+2+1 failures, all `PG::ConnectionBad`). Confirmed
    # live before settling here: no other failure in that run was
    # Rust-build-related, so the Rust build steps below (moved to
    # `rspec_rust_io`) really were safe to drop from this job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # See the job-level comment above: this job's own specs (not just
      # `io: true` ones moved elsewhere) boot examples/pizzas for real.
      - name: Create the pizzas example's database
        run: createdb -h localhost -U postgres hecks_pizzas

      # Every `io: true`/`fuzzing: true` spec that does a real `cargo
      # build` — the only kind of real I/O this job no longer provisions
      # for — now runs in `rspec_rust_io` instead (including its own
      # wasm32-wasip1/wasmtime setup, main's #416); the Postgres-only
      # `io: true` specs are in `rspec_postgres_io`. Both moves are safe
      # by spec_helper.rb's own convention (`config.filter_run_excluding
      # io: true unless ENV["CI"]` means an `io: true` spec that secretly
      # needed something only `rspec` still had wouldn't be broken by
      # this — it would already be broken for every contributor running
      # a plain local `bundle exec rspec`, since none of them provision a
      # local Postgres or build Rust either).
      - name: "rspec: parallel (everything safe to run concurrently)"
        run: bundle exec parallel_rspec spec -o "--tag ~io --tag ~fuzzing"

  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # DYNAMIC — generates random-but-valid command/query sequences from
      # EVERY example domain's own IR (plus the self-hosted grammar
      # meta-domain) and replays each one, checking every declared
      # property (docs/decisions/0024) plus interpreter-crash and
      # determinism. Wired in here, not run only ad hoc, because it found
      # a real bug the first time anyone pointed it at lib/hecks/
      # grammar: a domain composing more than one bluebook (grammar is
      # Expression+Translation; banking is Banking+Governance+Identity)
      # could make a property misresolve a refusal against the wrong
      # domain, and nothing before this step ran on every push would ever
      # have caught it. No `--seeds`/`--steps` override — bin/fuzz's own
      # defaults (20 seeds, 30 steps) keep this fast enough for every
      # push while still exercising real depth; a deeper, ad hoc sweep
      # (60+ seeds) is what actually found the bug above and is a manual
      # `bin/fuzz` invocation, not this step's job. Exits non-zero the
      # same way every other gate in this workflow does — no special
      # handling here.
      - name: bin/fuzz
        run: bundle exec bin/fuzz

      # Static analysis over the IR — unreachable lifecycle states, dead
      # transitions, saga states no handler chain reaches — facts the
      # runtime itself never checks at dispatch time. Boots every corpus
      # member the same way corpus_spec does, plus the language's own
      # meta chapters.
      - name: model check
        run: bundle exec bin/model_check

      # THE MECHANICAL GUARD keeping `Ports::Query::InMemory` and
      # `Runtime::QueryInterpreter` from re-growing their own comparator
      # tables the way they already drifted twice (see this script's own
      # header) — for every comparator the grammar declares, checks both
      # that `QuerySpecification::Common::Comparison` still has a shared
      # `when` case for it AND that some cross-engine agreement spec
      # actually exercises it. Reads only already-committed Ruby source —
      # no cargo, no Postgres — so it belongs in this job right next to
      # `model check`/`rust coverage` above and below, not in `rspec`.
      - name: engine agreement (query comparators)
        run: bundle exec bin/check_engine_agreement

      # THE MECHANICAL GUARD against the H13/H14/L20 "blind trust" bug
      # class fixed in bin/project_deploy (docs/audits/
      # 2026-08-11-bug-triage.md): a generated deploy Makefile that
      # reports success without the underlying command's own exit status
      # actually gating that report, or that does real AWS/DB work with
      # no echo/validation telling the human running it what's about to
      # happen. No arguments — generates its own 3 representative fixture
      # domains (plain/Shared-mode/OAuth) via the real bin/project_deploy
      # and lints each one's Makefile TEXT; no real AWS or Postgres
      # touched by the check itself, so — like the step above — this
      # belongs here rather than in `rspec`. (No domain in this repo's own
      # CI runs `bin/project_deploy` for real yet; if one ever does, this
      # script's own header recommends a second, domain-specific lint
      # step immediately after it.)
      - name: lint generated deploy recipes
        run: bundle exec bin/lint_deploy_recipes

      # THE GATE EVERY STEP BELOW THIS ONE WAS SILENTLY TRUSTING —
      # bin/rust_coverage and the "rust coverage: <domain>" steps below
      # all read whatever's ALREADY COMMITTED under rust/src/generated/;
      # none of them regenerate. That is exactly how docs/decisions/
      # 0037-generated-sequence-fuzz-bridge-found-real-gaps-two-fixed-
      # three-catalogued.md happened: Pizzas::Order.Purchase grew a new
      # `given` in Ruby, nobody regenerated, and the compiled Rust binary
      # silently enforced fewer rules than the Bluebook declared — while
      # every coverage/conformance check that only reads the committed
      # tree stayed green throughout, because the committed tree was the
      # thing that was wrong. This step regenerates every domain whose
      # Bluebook source actually lives in THIS checkout and fails the
      # build on any diff, so that drift is caught here — on the push
      # that caused it — instead of the next time someone happens to run
      # bin/rust_coverage or ADR 0037's fuzz bridge by hand.
      #
      # embryonaut is deliberately excluded: its Bluebook source lives in
      # a separate client repo (docs/decisions/0033-... and PR #394's own
      # commit message — "embryonaut -> ~/Projects/embryonautfoundersapp/
      # deploy"), so rust/src/generated/embryonaut/ is committed here
      # with no way to regenerate it from this checkout at all. It stays
      # coverage-checked against its own committed snapshot only, same as
      # every "rust coverage: <domain>" step below already treats it —
      # see bin/rust_coverage's own "Fallback mode" header for exactly
      # what that can and can't prove.
      #
      # ORDER IS NOT ARBITRARY. Every domain below that `uses_framework
      # "Governance"` (banking, compliance, pizzas) regenerates
      # rust/src/generated/governance/ as a side effect, and each pass
      # stamps that shared output's "GENERATED by ... examples/<domain>"
      # attribution comment with whichever domain ran it last — content
      # aside, that comment is real, load-bearing text this diff check
      # would otherwise flag on every run regardless of whether anything
      # actually drifted. Likewise `rust/Cargo.toml`'s `default` feature
      # and `rust/src/generated/mod.rs`'s domain-exclusivity `cfg`s track
      # whichever domain ran LAST, period. banking, compliance, pizzas,
      # roster is the one order that reproduces the committed tree
      # byte-for-byte today (verified by hand before this step was
      # added); change it and re-verify locally (`git diff --stat rust/`
      # after running the four `bin/project_rust` lines below against a
      # clean checkout) rather than guessing.
      - name: "rust codegen: regenerate every in-repo domain, fail on drift from the committed tree"
        run: |
          bundle exec bin/project_rust examples/banking
          bundle exec bin/project_rust examples/compliance
          bundle exec bin/project_rust examples/pizzas
          bundle exec bin/project_rust examples/roster
          git diff --exit-code -- rust/src/generated/ rust/Cargo.toml

      # THE COVERAGE CHECKER, PER DOMAIN — a different question than
      # `rspec_rust_io`'s "Build the Rust conformance binary" and rspec
      # steps ask. Those check "did Ruby and Rust agree on this script";
      # this checks "did bin/project_rust generate SOMETHING for every
      # construct this domain's own IR declares, at all" — a gap class
      # equivalence checking is structurally blind to (see
      # bin/rust_coverage's own header). Reads each domain's
      # already-committed rust/src/generated/<domain>/manifest.json +
      # ir.json — no build needed first, which is exactly why this can
      # live in a job with no Rust build step of its own. Exits non-zero
      # on any un-allowlisted GAP finding; that exit code IS the gate,
      # nothing here massages it.
      - name: "rust coverage: pizzas"
        run: bundle exec bin/rust_coverage pizzas

      - name: "rust coverage: embryonaut"
        run: bundle exec bin/rust_coverage embryonaut

      - name: "rust coverage: governance"
        run: bundle exec bin/rust_coverage governance

      - name: "rust coverage: identity"
        run: bundle exec bin/rust_coverage identity

      # FORMERLY KNOWN RED — as of 2026-08-23, clean (0 GAP). Banking's two
      # `read_model` constructs (ComplianceDashboard, CustomerPortfolio) are
      # now on bin/rust_coverage's own ALLOWLIST, citing rust/project/
      # read_models.rb's header note on group_by/rootless read models being
      # a main-only concept this generator doesn't cover, plus rust/project/
      # queries.rb's own eligibility argument. The underlying gap class
      # (read_model has no Rust code path at all —
      # rust/project/domain_generator.rb's "QUERIES AND READ MODELS"
      # comment; docs/HECKS_IMPLEMENTATION_PLAN.md §8, docs/decisions/0013)
      # is unchanged; what's new is the citation that lets the allowlist
      # legitimately defer it instead of leaving it an unallowlisted GAP.
      - name: "rust coverage: banking"
        run: bundle exec bin/rust_coverage banking

      # FORMERLY ALSO KNOWN RED — as of 2026-08-23, also clean (0 GAP).
      # Bluebook's own `WholeBluebook` read_model (same whole-kind gap as
      # banking's, above) and its 19 per-instance gaps (mostly "optional
      # argument feeds a non-optional target" on `then_set append` shapes,
      # plus two commands needing an extra caller-supplied identity
      # parameter no JSON step shape carries) are now all on
      # bin/rust_coverage's ALLOWLIST with doc citations — see rust/project/
      # commands.rb's #optional_source_mismatches, rust/project/
      # read_models.rb's header, and rust/project/domain_generator.rb's
      # manifest_entry gap_class: "structural" comment. Nothing here was
      # swallowed without a citation; the allowlist's own requirement for
      # one still held.
      - name: "rust coverage: meta"
        run: bundle exec bin/rust_coverage meta

      # THE KERNEL HALF of the same guarantee. bin/project_kernel_
      # capabilities' own enums (AttributeShape/OperatorCategory) already
      # make an exhaustive match over them a compile error the moment the
      # grammar admits a new capability — enforced for free by the
      # `rspec_rust_io` job's "Build the exemplar module" step, since
      # kernel code isn't behind a domain feature flag (and that step
      # running in a different job doesn't weaken this one — every job in
      # this workflow must pass). What THIS step catches is the other
      # half: a capability whose enum variant compiles clean but has no
      # rust/src/kernel/<category>/<name>.rs file behind it at all — see
      # bin/rust_kernel_coverage's own header.
      - name: rust kernel coverage
        run: bundle exec bin/rust_kernel_coverage

      # DOC COVERAGE, ALSO HERE NOW, NOT ONLY IN .githooks/pre-push — the
      # exact gap the rubocop step's own comment below already names for
      # itself, applied to the one pre-push check that comment's own
      # audit had missed: pre-push is opt-in per clone (`git config
      # core.hooksPath .githooks`) and bypassable (`git push
      # --no-verify`), so a branch that never installed it, or a push
      # made with that flag, reached GitHub with `bin/doc_coverage`
      # never having run at all — on a project where most commits come
      # from an agent, "did this clone install the hook" isn't a safe
      # assumption. Same command pre-push already runs (`bin/doc_
      # coverage`'s own header): every live word in docs/implemented/
      # reference/ carries hand-written prose and a running example.
      - name: doc coverage
        run: bundle exec bin/doc_coverage

      # RUBOCOP, ALSO HERE NOW, NOT ONLY IN .githooks/pre-push — added in
      # this same integration pass that wired
      # Hecks/FallbackHashLookup/ThreadSharedIvarMutation/
      # SequentialHashRenameInLoop into .rubocop.yml's `require:` list
      # (docs/rubocop-custom-cops.md). Those three cops each guard a real,
      # already-shipped bug class (8+ instances of a same-receiver `||`
      # fallback silently dropping a stored `false`; a thread-shared ivar
      # mutation on Dispatcher/Registry; a hash rename loop clobbering its
      # own keys mid-pass) — pre-push is opt-in per clone
      # (`git config core.hooksPath .githooks`) and bypassable
      # (`git push --no-verify`), so a branch that never installed it, or
      # a push made with that flag, would otherwise reach GitHub with NONE
      # of those three guards (or any other rubocop cop) having run at
      # all — the exact "a push that skipped the hook... can't land red"
      # gap this workflow's own top-of-file comment already names as the
      # reason `rspec`/`checks` both exist here rather than trusting
      # pre-push alone. Same command pre-push already runs, so nothing
      # cop-specific is needed here (docs/rubocop-custom-cops.md's own
      # closing note); confirmed clean against this tree before adding
      # this step.
      - name: rubocop
        run: bundle exec rubocop -c .rubocop.yml

  rspec_postgres_io:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          # spec/adapters/driven/postgres/lineage_spec.rb creates its own
          # unprivileged roles at runtime (`CREATE ROLE ... LOGIN`, no
          # password — it's testing GRANTs, not credentials) and connects
          # as them; the official image's default password auth would
          # refuse every one of those logins since none has a password to
          # check. trust is scoped to this ephemeral service container.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # examples/pizzas/bluebook/pizzas.world wires straight at this
      # database by name — spec/dsl_spec.rb, spec/runtime/domain_refusal_spec.rb,
      # and the schema-evolution guide's own live example all boot it.
      # Nothing creates it on demand (unlike the adapter specs' own
      # scratch databases, which manage their own lifecycle); a fresh
      # Postgres needs it provisioned once, up front. (The 12 specs that
      # run in `rspec_rust_io` instead don't reference this database by
      # name — verified by grep — so that job doesn't need this step.)
      - name: Create the pizzas example's database
        run: createdb -h localhost -U postgres hecks_pizzas

      # ONLY THE THREE `io: true` FILES THAT SHARE THIS ONE DATABASE —
      # spec/dsl_spec.rb, spec/guides_spec.rb, spec/runtime/
      # domain_refusal_spec.rb (verified: `grep -rl "hecks_pizzas" spec/`
      # names exactly these three plus spec/support/doctest.rb, which
      # isn't a spec file itself). Kept single-process on purpose: unlike
      # every other `io: true` spec (see rspec_postgres_io_parallel
      # below), nothing here was verified safe under a second worker
      # concurrently reading/writing the SAME pre-seeded database in the
      # same checkout.
      - name: "rspec: shared hecks_pizzas database (serial — genuinely shared state)"
        run: bundle exec rspec --tag io --tag ~fuzzing spec/dsl_spec.rb spec/guides_spec.rb spec/runtime/domain_refusal_spec.rb

  # EVERY OTHER `io: true` SPEC — split out of what used to be one single
  # serial `rspec_postgres_io` step alongside the three files above.
  # `rspec_postgres_io`'s own former comment justified staying serial by
  # "a handful of these specs do before(:context)/after(:context)
  # backup-and-restore of shared fixture state, which a second worker in
  # THIS SAME checkout could race" — true of the three hecks_pizzas
  # files above, but checked file-by-file (not assumed) for the other
  # ~28: every one of them names its own scratch Postgres
  # database/role/schema or its own scratch fixture directory basename,
  # each namespaced by that file's own name
  # (hecks_tenant_isolation_spec vs. hecks_tenant_isolation_fuzz_spec,
  # deploy_bluebook_spec_fixture vs. project_deploy_tenant_spec_fixture,
  # etc.) — grepped across every hardcoded `"hecks_*"` name and every
  # `*_FIXTURE_BASENAME` constant in this set, zero collisions found.
  # `parallel_rspec` splits work at the FILE level (RSpec never divides
  # one file's own examples across workers), so as long as no two files
  # share a resource name — confirmed here — a second worker touching a
  # DIFFERENT file's own scratch resources cannot race the first.
  #
  # `--exclude-pattern` here is the same maintenance edge
  # rspec_postgres_io's old comment already named: a new `io: true` spec
  # added anywhere in `spec/` runs here automatically UNLESS it also
  # needs a real `cargo build` (add it to `rspec_rust_io` below AND this
  # list) OR it touches the shared `hecks_pizzas` database by name (add
  # it to the serial job above AND this list). Forgetting either fails
  # loud — a spec error, not a silent skip.
  rspec_postgres_io_parallel:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # PROVISIONED HERE TOO, EVEN THOUGH THE COMMENT ABOVE SAYS "moved to
      # the serial job" — found live (PR #488): `spec/load_hygiene_spec.rb`
      # ALSO reaches this database, via a fresh subprocess booting
      # examples/pizzas/bluebook/pizzas.world (PostgresEra's own
      # lazy-autoload path) — but never contains the literal string
      # "hecks_pizzas" itself (that name lives in the .world file, reached
      # indirectly), so grepping every spec/*.rb file for that string —
      # the check the rest of this split's safety argument relied on —
      # missed it. Rather than keep hunting for more indirect references
      # by hand (already wrong twice), this database is now simply
      # created here unconditionally: cheap, idempotent within this job's
      # own fresh Postgres service, and closes the whole CLASS of "missed
      # a hidden reference" risk rather than one instance of it. Nothing
      # in the ~28-file set was found doing more than booting/reading
      # against it (no test here asserts on persistent pizzas business
      # data the way the serial job's own three files might), so a second
      # worker also reaching it is not expected to race — but this is the
      # kind of claim this split has already been wrong about twice, so
      # treat it as provisional until it's held up across more real runs.
      - name: Create the pizzas example's database
        run: createdb -h localhost -U postgres hecks_pizzas

      # `--exclude-pattern` HERE IS parallel_tests' OWN TOP-LEVEL FLAG,
      # not RSpec's — deliberately NOT nested inside `-o`/`--test-options`.
      # A first version of this job passed it nested inside `-o "...
      # --exclude-pattern \"...\""`, relying on `-o`'s own
      # `Shellwords.shellsplit` (parallel_tests/cli.rb) to hand each
      # worker's underlying `rspec` invocation a clean comma-separated
      # glob list, the same way `rspec_postgres_io`'s own direct
      # `--exclude-pattern "..."` already works. It didn't survive the
      # trip: GitHub Actions' own YAML/shell layer had already consumed
      # one layer of the nested quoting before parallel_tests ever saw
      # the string, and confirmed live (PR #488's first CI run) that
      # NONE of the exclusions took effect — "4 processes for 285 specs"
      # (the full, unfiltered file count), with dsl_spec.rb,
      # domain_refusal_spec.rb, and every Rust-building spec all
      # running in a job with no Rust toolchain and no `hecks_pizzas`
      # database, both failing loud.
      #
      # parallel_tests' own top-level `--exclude-pattern` (a REGEX,
      # unlike RSpec's own comma-glob flag of the same name — verified
      # against the gem source, parallel_tests-4.10.1's cli.rb:210 and
      # test/runner.rb:240-247, `files -= files.grep(exclude_pattern)`)
      # applies at FILE DISCOVERY, before files are even assigned to
      # workers — no `-o` nesting, no second layer of quoting to survive.
      - name: "rspec: postgres + deploy/tenant I/O (parallel — file-level isolation, verified no shared resource names)"
        run: |
          bundle exec parallel_rspec spec \
            --exclude-pattern '(/|^)(project_rust_pipeline_spec|parser_parity_spec|project_deploy_parity_gate_spec|hecks_build_pipeline_spec|rust_conformance_spec|rust_conformance_fuzz_spec|semantics_corpus_spec|codegen_parity_spec|rust_numeric_coercion_spec|rust_host_lineage_conformance_spec|parser_coverage_spec|domain_feature_exclusivity_spec|naming_landmines_spec|dsl_spec|guides_spec|domain_refusal_spec)\.rb$' \
            -o "--tag io --tag ~fuzzing"

  # FOUR JOBS, NOT ONE — `rspec_rust_io` used to run all 12 `cargo`-
  # touching `io: true` specs serially in a single checkout. Digging into
  # what each one ACTUALLY builds (grepping every real `cargo`/`Open3`
  # invocation, not just skimming filenames) found that only 8 of the 12
  # touch the shared `rust/` crate and its committed `rust/src/generated/`
  # tree — the reason they were forced serial in the first place
  # (before(:context)/after(:context) backup-and-restore of that shared
  # tree, or read-only `cargo build --features <domain>` against it, both
  # of which a concurrent mutator could race). The other 4 build a
  # COMPLETELY SEPARATE Cargo project each — `rust/parser/`,
  # `rust/codegen/`, `rust/host/` — with their own Cargo.toml and target
  # dir, and never read or write anything under `rust/src/generated/` or
  # `rust/Cargo.toml` at all. They only ever shared a runner with the
  # main-crate group because the original serial step happened to bundle
  # every cargo-touching spec together, not because anything about them
  # actually conflicts. Splitting them into their own jobs — each its own
  # checkout, so nothing is shared to race — moves them off what was the
  # single largest chunk of this workflow's wall-clock (~7-9 minutes) and
  # lets them run concurrently with the main-crate group instead of
  # serially inside it.
  rspec_rust_io:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Scoped to just the root crate now that parser/codegen/host have
      # their own jobs/caches below — a dependency bump in, say,
      # rust/parser/Cargo.lock no longer invalidates this cache entry.
      - name: Cache Rust build artifacts (main crate)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-main-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-main-

      # bin/rust_conformance's `native` mode (0012/0013) — regenerated
      # from the CURRENT generator, not just the checked-in rust/src/
      # generated/ snapshot (which could silently drift from it), then
      # built, so spec/rust_conformance_spec.rb below has a binary to run
      # against rather than skipping itself the way it would locally
      # without one — the same "provision it for real, don't skip"
      # discipline this workflow already holds Postgres/SQLite to.
      # ubuntu-latest ships a Rust toolchain already; no separate setup
      # action needed for the native build below. The wasm32-wasip1
      # TARGET is a different story — spec/project_deploy_parity_gate_spec.rb
      # (Phase 8, the equivalence-gap plan) shells out to bin/project_wasm,
      # which cross-compiles for it, and ubuntu-latest's default rustup
      # install has no target but the host's own.
      #
      # TWO toolchains, not one — bin/project_wasm's own "is it
      # installed" check (`rustup target list --installed`, bare) runs
      # from the repo root and so resolves through rust-toolchain.toml
      # (channel 1.98.0); its actual build line is `rustup run stable
      # cargo build ...` (its own comment: a deliberate Homebrew-PATH
      # workaround, predating rust-toolchain.toml) — a DIFFERENT
      # toolchain. Installing the target on only one leaves the other
      # either failing the check (1.98.0 missing it) or failing the
      # real build with E0463 "can't find crate for `std`" (stable
      # missing it) despite the check having passed. Found live
      # shipping this very fix (main's own #416) — a `--toolchain
      # stable`-only version of this step still failed the same way
      # #416 originally did, one layer deeper.
      - name: Install the wasm32-wasip1 target
        run: |
          rustup target add wasm32-wasip1 --toolchain stable
          rustup target add wasm32-wasip1

      # The runtime half of the same gap — a compiled .wasm is only
      # useful with a WASI-preview1 host to run it under, and
      # bin/rust_conformance's own `.wasm` branch shells out to
      # `wasmtime run` (docs/decisions/0012-wasm-via-wasi-stdio.md).
      # ubuntu-latest carries neither the CLI nor a package for it —
      # confirmed live: the wasm32 target fix alone got bin/project_wasm
      # producing a real .wasm, then bin/rust_conformance failed one
      # step later with plain ENOENT on `wasmtime`. Pinned to the SAME
      # 47.0.3 rust/host/Cargo.toml already depends on (as a library,
      # separately) — not because the CLI and the embedding API need to
      # match, but because a CI failure from those two silently
      # drifting is exactly the kind of thing worth not inventing here.
      - name: Install wasmtime
        run: |
          curl -sL "https://github.com/bytecodealliance/wasmtime/releases/download/v47.0.3/wasmtime-v47.0.3-x86_64-linux.tar.xz" \
            | tar xJ -C /tmp
          sudo mv /tmp/wasmtime-v47.0.3-x86_64-linux/wasmtime /usr/local/bin/wasmtime
          wasmtime --version

      # `bundle exec` matters here even though bin/project_rust never
      # touches Bundler itself: run bare, `require "json"` resolves
      # against whatever `json` gem is highest on the default load path
      # (ruby/setup-ruby's bundled default, not Gemfile.lock's pinned
      # 2.7.2) rather than the locked one — harmless to THIS build (its
      # output feeds `cargo build`, and nothing byte-compares the ir.json/
      # metadata.rs it writes against git), but confirmed live to reformat
      # empty-array pretty-printing differently across `json` versions —
      # `[]` vs `[\n\n]` — which reads as a 900+ line "drift" against the
      # committed fixtures if anyone naively regenerates+diffs the same
      # way this step does. `bundle exec` pins it to Gemfile.lock's
      # version, matching what actually produced the committed files.
      - name: Build the Rust conformance binary
        run: |
          bundle exec bin/project_rust examples/banking
          cd rust && cargo build --release

      # rust/src/exemplar/** — real Rust the codegen in rust/project/*.rb
      # slices shapes out of, proven valid/idiomatic here BEFORE any Ruby
      # runs. `#[cfg(test)] pub mod exemplar;` (rust/src/lib.rs) means
      # plain `mod` inclusion under `cargo test` type-checks the whole
      # tree; no #[test] fn is required for that to catch a broken shape.
      - name: Build the exemplar module
        run: cd rust && cargo test --lib

      # THE 8 `io: true` SPECS THAT TOUCH THE SHARED `rust/` CRATE — via
      # before(:context)/after(:context) backup-and-restore of
      # rust/src/generated/+Cargo.toml (project_rust_pipeline_spec.rb,
      # hecks_build_pipeline_spec.rb, project_deploy_parity_gate_spec.rb's
      # functional half) or a read-only `cargo build --features <domain>`
      # against the already-committed tree (rust_conformance_spec.rb,
      # rust_conformance_fuzz_spec.rb, rust_numeric_coercion_spec.rb,
      # domain_feature_exclusivity_spec.rb, naming_landmines_spec.rb).
      # parser_parity_spec.rb, parser_coverage_spec.rb, codegen_parity_
      # spec.rb, and rust_host_lineage_conformance_spec.rb build a
      # SEPARATE crate each (rust/parser/, rust/codegen/, rust/host/) and
      # never touch this tree — verified by grep, not assumed — so they
      # moved to their own jobs below instead of running here. Listed
      # explicitly rather than by directory: spec/rust_project/ also
      # holds several fast, non-`io` specs that already run under
      # `rspec`'s parallel step, so a directory glob here would
      # double-run them. Single-process, matching the shared-file-
      # mutation discipline the old serial step already used — cargo
      # builds writing into this checkout's own rust/ tree would race a
      # second worker doing the same.
      - name: "rspec: Rust conformance + numeric coercion + deploy parity gate (serial — shared-file mutation)"
        run: |
          bundle exec rspec --tag io \
            spec/project_rust_pipeline_spec.rb \
            spec/project_deploy_parity_gate_spec.rb \
            spec/hecks_build_pipeline_spec.rb \
            spec/rust_conformance_spec.rb \
            spec/rust_conformance_fuzz_spec.rb \
            spec/semantics_corpus_spec.rb \
            spec/rust_numeric_coercion_spec.rb \
            spec/rust_project/domain_feature_exclusivity_spec.rb \
            spec/rust_project/naming_landmines_spec.rb

  # rust/parser/ ("hecks-parse") — an independent Cargo project, own
  # Cargo.toml/target dir, no interaction with rust/src/generated/ or
  # rust/Cargo.toml at all. Both specs build it via their own
  # `before(:context) { self.class.build_parser! }`, so no separate
  # build step is needed at this job level the way rspec_rust_io needs
  # one (that spec-internal build is exactly why this job is safe to run
  # concurrently with rspec_rust_io in the first place — nothing here
  # ever opens a file under the main crate's tree).
  rspec_rust_parser:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Cache Rust build artifacts (parser crate)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/parser/target
          key: ${{ runner.os }}-cargo-parser-${{ hashFiles('rust/parser/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-parser-

      - name: "rspec: Rust parser parity + coverage"
        run: |
          bundle exec rspec --tag io \
            spec/parser_parity_spec.rb \
            spec/parser_coverage_spec.rb

  # rust/codegen/ ("hecks-codegen") — same shape as rspec_rust_parser
  # above, a different independent Cargo project. codegen_parity_spec.rb
  # builds it via its own `before(:context) { self.class.build_codegen! }`.
  rspec_rust_codegen:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Cache Rust build artifacts (codegen crate)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/codegen/target
          key: ${{ runner.os }}-cargo-codegen-${{ hashFiles('rust/codegen/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-codegen-

      - name: "rspec: Rust codegen parity"
        run: bundle exec rspec --tag io spec/codegen_parity_spec.rb

  # rust/host/ ("mint_harness"/"lineage_harness") — the fourth
  # independent Cargo project, and the ONLY one of the four that needs
  # Postgres: rust_host_lineage_conformance_spec.rb mints across a real
  # era boundary against its own scratch database
  # (`rust_host_lineage_pizzas_#{suffix}`, created and dropped by the
  # spec itself — it never touches the shared `hecks_pizzas` database,
  # so no separate provisioning step is needed here either). Its two
  # binaries are built via the spec's own before(:context) hooks, same
  # pattern as parser/codegen above.
  rspec_rust_host:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Cache Rust build artifacts (host crate)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/host/target
          key: ${{ runner.os }}-cargo-host-${{ hashFiles('rust/host/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-host-

      - name: "rspec: Rust/Ruby lineage parity (rust/host)"
        run: bundle exec rspec --tag io spec/rust_host_lineage_conformance_spec.rb

  rspec_fuzzing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # `spec/fuzzing/**`, tagged by PATH not by hand
      # (`config.define_derived_metadata(file_path: %r{/spec/fuzzing/})`,
      # spec/spec_helper.rb) — no subprocess, no network, all in-memory,
      # so unlike the other two `rspec_*_io` jobs this one needs no
      # service and no Rust toolchain. Slow for a different reason: a
      # live-generated-history replay against a real domain, dispatched
      # for real, several seeds deep (spec_helper.rb's own comment: ~8s
      # for properties_spec.rb's "standard battery" + determinism check
      # alone, against a suite that's otherwise ~50ms/example) — enough
      # to be worth its own runner rather than sharing one with either
      # Postgres or cargo work it doesn't need.
      - name: "rspec: fuzzing (property replay)"
        run: bundle exec rspec spec/fuzzing --tag fuzzing

  # A FOURTH JOB, gated rather than run on every push/PR the way the
  # `rspec*`/`checks` jobs above are — bin/stress_concurrency_specs's own
  # trailing __END__ doc block is explicit about why: repeating
  # dispatcher_spec.rb/in_process_concurrent_dispatch_spec.rb/postgres_
  # concurrent_dispatch_spec.rb 30 times each (its own default), under
  # varied seeds and real process-level parallelism, exists to catch a
  # race a SINGLE ordinary run can miss (the M20 shape: a
  # schedule-dependent bug that passes every time on a quiet box and
  # fails only under genuine contention) — but that repetition is exactly
  # what makes it meaningfully more expensive per-run than the rest of
  # this suite, so its own doc recommends gating it to PRs that can
  # actually regress this class of bug rather than taxing every unrelated
  # one: changes touching `lib/hecks/runtime/**`.
  #
  # SPLIT INTO TWO JOBS rather than one job with a conditional step,
  # specifically so an unrelated PR skips paying for the job below's own
  # Postgres service container too, not just its rspec invocation —
  # `services:` are provisioned before any step runs and have no `if:`
  # of their own, so the only way to actually avoid that cost is a
  # job-level `if:`, which in turn needs this diff computed in a job
  # that ran (and finished) first.
  runtime_changed:
    runs-on: ubuntu-latest

    outputs:
      touched: ${{ steps.diff.outputs.touched }}

    steps:
      - uses: actions/checkout@v4
        with:
          # FULL HISTORY, not the default single-commit shallow clone —
          # the `git diff` below needs both endpoints (a pull request's
          # base commit, or a push's prior HEAD) present as real objects
          # in this checkout, not just the tip a shallow fetch would give
          # it alone.
          fetch-depth: 0

      # BASE — a pull request's own base commit when this run IS one
      # (github.event.pull_request.base.sha), otherwise the merge queue's
      # own base (github.event.merge_group.base_sha) when it's a
      # `merge_group` run instead. FIXED alongside removing the `push:
      # branches: [main]` trigger above (2026-08-28): this fallback used
      # to read `github.event.before`, a push event field, and never had
      # a `merge_group` case at all — meaning a queue run always hit the
      # `-z` branch, read `github.event.before` as empty (that field
      # doesn't exist on a `merge_group` event), and diffed against an
      # empty BASE. Went unnoticed only because `push` was still around
      # to run the real gate; now that `merge_group` is the ONLY
      # non-`pull_request` trigger left, that gap would've meant this
      # job silently never gating the merge-queue path at all.
      - name: does this change touch lib/hecks/runtime/**?
        id: diff
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then
            BASE="${{ github.event.merge_group.base_sha }}"
          fi

          if git diff --name-only "$BASE" "${{ github.sha }}" | grep -q '^lib/hecks/runtime/'; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi

  stress_concurrency:
    needs: runtime_changed
    if: needs.runtime_changed.outputs.touched == 'true'
    runs-on: ubuntu-latest

    # Real Postgres, same discipline this workflow's own top comment
    # already holds the `rspec_postgres_io`/`rspec_rust_io` jobs to —
    # SERIAL_ONLY_SPEC_FILES in bin/stress_concurrency_specs is
    # spec/adapters/driven/postgres_concurrent_dispatch_spec.rb alone,
    # and that spec skips itself cleanly (PostgresProbe.available?) with
    # no reachable Postgres, which here would mean this whole job
    # "passing" having exercised only its two parallel-safe specs, never
    # the Postgres-backed one repetition was supposed to stress in the
    # first place.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          # See the `rspec_postgres_io` job's own identical setting above
          # for why trust is safe here: scoped to this ephemeral service
          # container, and spec/adapters/driven/postgres_concurrent_
          # dispatch_spec.rb connects as the plain `postgres` superuser
          # anyway (it creates and drops its own scratch database, not a
          # passwordless role).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # NO FLAGS — this script's own defaults (30 runs of each group,
      # Etc.nprocessors parallel copies of the parallel-safe group, the
      # Postgres-backed group always one process at a time) are what its
      # own doc recommends for a dedicated CI leg; a developer's local
      # loop before a push is the case its own `--runs`/`--parallel`/
      # `--seed-start` flags exist to shrink or reshape, not this one.
      # Sets `CI=true` on its own child rspec invocations (see this
      # script's own comment on that), so the Postgres spec's `io: true`
      # tag is included here the same way it would be anywhere else in
      # this workflow — no extra env needed at this level.
      - name: bin/stress_concurrency_specs
        run: bundle exec bin/stress_concurrency_specs
