name: CI

# Runs the pre-push checks (.githooks/pre-push) on every PR and every push to main, against
# real Postgres and SQLite. `main` takes pushes with no gate, so this run is what reports where
# each RequiredCheck stands against a commit; promote.yml moves `stable` onto a commit only
# when every one of them passed (the Lane and RequiredCheck rows of the Vocabulary chapter).
# cache-warm.yml warms the main-scope caches. spec/ci_summary_jobs_spec.rb pins the shape of the
# required-check wrappers and that no job skips on a push.

# Jobs that touch rust/src/generated or rust/Cargo.toml need their own checkout, because their
# specs back up and restore those files. The parser, codegen and host crates are independent
# Cargo projects, so each gets its own job and crate-scoped cache.
#
# `rspec_postgres_io` is the default lane for `io: true` specs: a spec added to an
# `rspec_rust_*` list must also be excluded there, or it runs twice.
#
# `rspec` keeps a Postgres service: specs that boot examples/pizzas wire PostgresEra
# without being tagged `io: true`.

# Every PR and every push to main runs the full job set; no job skips on a push, because a
# skipped required check reports as passed and promote.yml would carry an untested commit to
# `stable`. Path gates (the CiGate rows) still skip the work a change cannot affect.
on:
  pull_request:
  push:
    branches: [main]

# Cancels a superseded PR run. Never cancels a push to main: promotion reads the checks of
# every main commit, and a cancelled run reports none.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Aggregator that keeps `rspec` a RequiredCheck name (Vocabulary chapter); the work is in
  # ci-rspec.yml. `if: always()` is required, else a failed
  # `rspec_impl` would skip this job.
  rspec:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs: rspec_impl
    # Runs only to fail: a job skipped by its own `if:` reports as passing to a required
    # check, so the wrapper runs (and fails) unless `_impl` succeeded. Nothing about a call
    # legitimately skips, so any other result fails; pinned by spec/ci_summary_jobs_spec.rb.
    if: always() && needs.rspec_impl.result != 'success'

    steps:
      # Only the action is needed from the checkout, so only .github/actions is fetched.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - name: rspec_impl (ci_attestation_rspec + both rspec shards) passed
        uses: ./.github/actions/require-result
        with:
          job: rspec_impl
          result: ${{ needs.rspec_impl.result }}

  # Calls ci-rspec.yml; secrets are passed explicitly.
  rspec_impl:
    uses: ./.github/workflows/ci-rspec.yml
    secrets:
      HECKS_CI_ATTEST_KEY: ${{ secrets.HECKS_CI_ATTEST_KEY }}
      HECKS_JOURNAL_DATABASE: ${{ secrets.HECKS_JOURNAL_DATABASE }}

  # Aggregator that keeps `checks` the required-status-check name; the work is in
  # ci-checks.yml. `if: always()` is required, else a failed `checks_impl` would skip this job.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs: checks_impl
    # Runs only to fail — see `rspec`'s own `if:` comment above.
    if: always() && needs.checks_impl.result != 'success'

    steps:
      # Only the action is needed from the checkout, so only .github/actions is fetched.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - name: checks_impl (fuzz, codegen drift, and static checks) passed
        uses: ./.github/actions/require-result
        with:
          job: checks_impl
          result: ${{ needs.checks_impl.result }}

  # Calls ci-checks.yml; secrets are passed explicitly.
  checks_impl:
    uses: ./.github/workflows/ci-checks.yml
    secrets:
      HECKS_CI_ATTEST_KEY: ${{ secrets.HECKS_CI_ATTEST_KEY }}
      HECKS_JOURNAL_DATABASE: ${{ secrets.HECKS_JOURNAL_DATABASE }}

  # Writes the same kind of attestation note .githooks/pre-push writes locally (Phase 7),
  # but for THIS run's own checked-out tree, right after a green pull_request run. When the
  # merge onto main turns out to be a no-op (main hasn't moved since this run), that tree is
  # byte-identical to what the push to main checks out, so each lineage's own
  # ci_attestation_* detector finds this note and skips re-running its heavy job — see
  # .github/actions/check-attestation's own header for why a tree-hash note survives into a
  # commit that didn't exist yet when it was written. Without this job, only a developer's own
  # local pre-push run ever wrote a note, and CI's own checked-out tree (a synthetic test-merge,
  # not the developer's raw branch) essentially never matched it.
  #
  # Covers rspec/checks (pre-push already verifies these locally too) plus the four Rust
  # lineages (pre-push never runs cargo locally, so this is their only source of a note).
  #
  # Gated on every lineage this note names being green; `needs.*.result` already treats a
  # valid attested skip as success, so this also fires (harmlessly re-signing the same tree)
  # when the tree was already attested. A fork PR gets no HECKS_CI_ATTEST_KEY, so the write
  # step no-ops there, same as the local hook without a keychain entry.
  ci_attest_write:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    needs:
      [
        rspec_impl,
        checks_impl,
        rspec_rust_io_impl,
        rspec_rust_parser_impl,
        rspec_rust_codegen_impl,
        rspec_rust_host_impl,
        rspec_fuzzing,
        rspec_postgres_io_impl,
        rspec_postgres_io_parallel_impl,
      ]
    # Only a PR run writes the note: a push to main is checked against its own tree already,
    # and nothing re-checks it against itself. checks_fuzz/checks_fuzz_postgres/
    # checks_fuzz_sqlite/checks_codegen_drift need no entry of their own here: they're not
    # independently required, so needs.checks_impl.result already covers them.
    if: >-
      github.event_name == 'pull_request' &&
      needs.rspec_impl.result == 'success' && needs.checks_impl.result == 'success' &&
      needs.rspec_rust_io_impl.result == 'success' && needs.rspec_rust_parser_impl.result == 'success' &&
      needs.rspec_rust_codegen_impl.result == 'success' && needs.rspec_rust_host_impl.result == 'success' &&
      needs.rspec_fuzzing.result == 'success' &&
      needs.rspec_postgres_io_impl.result == 'success' && needs.rspec_postgres_io_parallel_impl.result == 'success'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Write and push a CI-verified attestation note for this tree
        uses: ./.github/actions/write-attestation
        with:
          checks: doc_coverage,engine_agreement,model_check,rspec,rubocop,rspec_rust_io,rspec_rust_parser,rspec_rust_codegen,rspec_rust_host,rspec_fuzzing,checks_fuzz,checks_fuzz_postgres,checks_fuzz_sqlite,checks_codegen_drift,rspec_postgres_io,rspec_postgres_io_parallel
          hmac-key: ${{ secrets.HECKS_CI_ATTEST_KEY }}

  # Aggregator that keeps `rspec_postgres_io` the required-status-check name; the work is in
  # ci-postgres-io.yml.
  rspec_postgres_io:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs: rspec_postgres_io_impl
    # Runs only to fail — see `rspec`'s own `if:` comment above.
    if: always() && needs.rspec_postgres_io_impl.result != 'success'

    steps:
      # Only the action is needed from the checkout, so only .github/actions is fetched.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - name: rspec_postgres_io_impl passed (or was correctly gated off)
        uses: ./.github/actions/require-result
        with:
          job: rspec_postgres_io_impl
          result: ${{ needs.rspec_postgres_io_impl.result }}

  # Calls ci-postgres-io.yml; secrets are passed explicitly, same as rspec_impl/checks_impl.
  rspec_postgres_io_impl:
    uses: ./.github/workflows/ci-postgres-io.yml
    secrets:
      HECKS_CI_ATTEST_KEY: ${{ secrets.HECKS_CI_ATTEST_KEY }}

  # Aggregator that keeps `rspec_postgres_io_parallel` the required-status-check name.
  # `if: always()` is required, else a failed call would skip this job.
  #
  # Unlike the other wrappers it tolerates no skip: `postgres_io_relevant_changed` in
  # ci-postgres-io-parallel.yml always runs, so the call reports success even when every
  # shard is gated off. A skip here means the call was blocked unintentionally.
  # spec/ci_summary_jobs_spec.rb pins the shape.
  rspec_postgres_io_parallel:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs: rspec_postgres_io_parallel_impl
    # Runs only to fail — see `rspec`'s own `if:` comment above.
    if: always() && needs.rspec_postgres_io_parallel_impl.result != 'success'

    steps:
      # Only the action is needed from the checkout, so only .github/actions is fetched.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - name: rspec_postgres_io_parallel_impl passed
        uses: ./.github/actions/require-result
        with:
          job: rspec_postgres_io_parallel_impl
          result: ${{ needs.rspec_postgres_io_parallel_impl.result }}

  # Calls ci-postgres-io-parallel.yml; secrets are passed explicitly, same as rspec_impl/checks_impl.
  rspec_postgres_io_parallel_impl:
    uses: ./.github/workflows/ci-postgres-io-parallel.yml
    secrets:
      HECKS_CI_ATTEST_KEY: ${{ secrets.HECKS_CI_ATTEST_KEY }}
      HECKS_JOURNAL_DATABASE: ${{ secrets.HECKS_JOURNAL_DATABASE }}

  # Aggregator that keeps `rspec_rust_io` the required-status-check name; the work is in
  # ci-rust-io.yml. Each required name has its own reusable-workflow file, since a `uses:` job
  # reports one aggregate result for everything its file holds.
  #
  # `rspec_rust_io_build` and `rspec_rust_io_deploy` stay in this file: neither is a required
  # check, and bundling them would let their failure flip `rspec_rust_io`.
  rspec_rust_io:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs: rspec_rust_io_impl
    # Runs only to fail — see `rspec`'s own `if:` comment above.
    if: always() && needs.rspec_rust_io_impl.result != 'success'

    steps:
      # Only the action is needed from the checkout, so only .github/actions is fetched.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - name: rspec_rust_io_impl passed (or was correctly gated off)
        uses: ./.github/actions/require-result
        with:
          job: rspec_rust_io_impl
          result: ${{ needs.rspec_rust_io_impl.result }}

  # Calls ci-rust-io.yml; secrets are passed explicitly, same as rspec_impl/checks_impl.
  rspec_rust_io_impl:
    uses: ./.github/workflows/ci-rust-io.yml
    secrets:
      HECKS_CI_ATTEST_KEY: ${{ secrets.HECKS_CI_ATTEST_KEY }}
      HECKS_JOURNAL_DATABASE: ${{ secrets.HECKS_JOURNAL_DATABASE }}
    # The calling job's permissions cap the reusable workflow's; `packages: write` is for the
    # GHCR binary cache, `actions: read` for the feature binaries one job hands to another.
    permissions:
      contents: read
      packages: write
      actions: read

  # Split from rspec_rust_io: the spec backs up and restores rust/src/generated and Cargo.toml
  # itself, so it needs its own checkout. Two legs, each with its own: the five domain parity
  # examples (generated source only, no wasm), and the one that builds wasm and compares it
  # (wasm32-wasip1 and wasmtime), with the crate's own unit tests.
  rspec_rust_io_build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: parity
            example: byte for byte
            wasm: false
          - leg: wasm
            example: opted into the all-Rust pipeline
            wasm: true

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ruby

      # rust/src/generated is not committed (pizzas aside); restore or regenerate it before rust/src is used.
      - uses: ./.github/actions/generated-rust

      - uses: ./.github/actions/cargo-cache
        with:
          name: main
          crate-root: rust

      # rust/build (hecks-build) is a separate crate; only this spec builds it.
      - uses: ./.github/actions/cargo-cache
        with:
          name: build
          crate-root: rust/build
          include-registry: "false"

      - uses: ./.github/actions/wasm-toolchain
        if: matrix.wasm

      - name: "rspec: hecks-build (Rust-native orchestrator) pipeline parity (${{ matrix.leg }})"
        run: bundle exec rspec --tag io --example "${{ matrix.example }}" spec/hecks_build_pipeline_spec.rb

      # The crate's own unit tests.
      - name: "cargo test: rust/build (hecks-build)"
        if: matrix.wasm
        run: cd rust/build && cargo test

  # Split from rspec_rust_io: the spec regenerates rust/src/generated and rewrites Cargo.toml
  # via hecks build_wasm, so it needs its own checkout, plus wasm32-wasip1 and wasmtime.
  rspec_rust_io_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ruby

      # rust/src/generated is not committed (pizzas aside); restore or regenerate it before rust/src is used.
      - uses: ./.github/actions/generated-rust

      - uses: ./.github/actions/cargo-cache
        with:
          name: main
          crate-root: rust

      - uses: ./.github/actions/wasm-toolchain

      - name: "rspec: per-deploy Ruby/Rust parity gate"
        run: bundle exec rspec --tag io spec/project_deploy_parity_gate_spec.rb

  # Aggregator for `rspec_rust_parser`; rust/parser is an independent Cargo project
  # (see ci-rust-parser.yml).
  rspec_rust_parser:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs: rspec_rust_parser_impl
    # Runs only to fail — see `rspec`'s own `if:` comment above.
    if: always() && needs.rspec_rust_parser_impl.result != 'success'

    steps:
      # Only the action is needed from the checkout, so only .github/actions is fetched.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - name: rspec_rust_parser_impl passed (or was correctly gated off)
        uses: ./.github/actions/require-result
        with:
          job: rspec_rust_parser_impl
          result: ${{ needs.rspec_rust_parser_impl.result }}

  # Calls ci-rust-parser.yml; secrets are passed explicitly, same as rspec_impl/checks_impl.
  rspec_rust_parser_impl:
    uses: ./.github/workflows/ci-rust-parser.yml
    secrets:
      HECKS_CI_ATTEST_KEY: ${{ secrets.HECKS_CI_ATTEST_KEY }}
    # GHCR binary cache permissions; see rspec_rust_io_impl.
    permissions:
      contents: read
      packages: write

  # Aggregator for `rspec_rust_codegen`; rust/codegen is an independent Cargo project
  # (see ci-rust-codegen.yml).
  rspec_rust_codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs: rspec_rust_codegen_impl
    # Runs only to fail — see `rspec`'s own `if:` comment above.
    if: always() && needs.rspec_rust_codegen_impl.result != 'success'

    steps:
      # Only the action is needed from the checkout, so only .github/actions is fetched.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - name: rspec_rust_codegen_impl passed (or was correctly gated off)
        uses: ./.github/actions/require-result
        with:
          job: rspec_rust_codegen_impl
          result: ${{ needs.rspec_rust_codegen_impl.result }}

  # Calls ci-rust-codegen.yml; secrets are passed explicitly, same as rspec_impl/checks_impl.
  rspec_rust_codegen_impl:
    uses: ./.github/workflows/ci-rust-codegen.yml
    secrets:
      HECKS_CI_ATTEST_KEY: ${{ secrets.HECKS_CI_ATTEST_KEY }}
    # GHCR binary cache permissions; see rspec_rust_io_impl.
    permissions:
      contents: read
      packages: write

  # Aggregator for `rspec_rust_host`; rust/host is an independent Cargo project and the only
  # one that needs Postgres (see ci-rust-host.yml).
  rspec_rust_host:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs: rspec_rust_host_impl
    # Runs only to fail — see `rspec`'s own `if:` comment above.
    if: always() && needs.rspec_rust_host_impl.result != 'success'

    steps:
      # Only the action is needed from the checkout, so only .github/actions is fetched.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - name: rspec_rust_host_impl passed (or was correctly gated off)
        uses: ./.github/actions/require-result
        with:
          job: rspec_rust_host_impl
          result: ${{ needs.rspec_rust_host_impl.result }}

  # Calls ci-rust-host.yml; secrets are passed explicitly, same as rspec_impl/checks_impl.
  rspec_rust_host_impl:
    uses: ./.github/workflows/ci-rust-host.yml
    secrets:
      HECKS_CI_ATTEST_KEY: ${{ secrets.HECKS_CI_ATTEST_KEY }}
      HECKS_JOURNAL_DATABASE: ${{ secrets.HECKS_JOURNAL_DATABASE }}
    # The calling job's permissions cap the reusable workflow's; `actions: read` is for the cargo
    # job to find the wasm modules the sibling job uploads.
    permissions:
      contents: read
      actions: read

  # Same detector-plus-gated-job shape as ci-rspec.yml's own ci_attestation_rspec — see
  # ci-rust-parser.yml's identical addition for the full comment. rspec_fuzzing is its own
  # required-status-check name and a plain job (not a `uses:` call), so its detector lives
  # here directly rather than needing a reusable-workflow file of its own.
  ci_attestation_rspec_fuzzing:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      attested: ${{ steps.attest.outputs.attested }}

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/check-attestation
        id: attest
        with:
          checks: rspec_fuzzing
          hmac-key: ${{ secrets.HECKS_CI_ATTEST_KEY }}

  rspec_fuzzing:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: ci_attestation_rspec_fuzzing
    if: always() && (needs.ci_attestation_rspec_fuzzing.result != 'success' || needs.ci_attestation_rspec_fuzzing.outputs.attested != 'true')

    # Two fuzzing specs are `io: true` and need Postgres (concurrent_dispatch_spec.rb,
    # era_boundary_spec.rb). Every other io job runs `--tag ~fuzzing`, so only this lane runs
    # them. Both create and drop their own scratch databases.
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ruby

      # rust/src/generated is not committed (pizzas aside); restore or regenerate it before rust/src is used.
      - uses: ./.github/actions/generated-rust

      # Preinstalled and tuned, not a `services:` container; see the action's header.
      - uses: ./.github/actions/postgres

      # spec/fuzzing/** is tagged by path (spec/spec_helper.rb). Slow because each example
      # replays a live-generated history, several seeds deep. Seeds are fixed, so how files
      # are dealt to workers changes nothing; the two Postgres-backed files each create their
      # own scratch database, so they can overlap.
      - name: "rspec: fuzzing (property replay)"
        run: bundle exec parallel_rspec spec/fuzzing -n 4 -o "--tag fuzzing"

  # Gated rather than run always: hecks stress_concurrency repeats concurrency specs 30
  # times to catch schedule-dependent races, so it runs only when `lib/hecks/runtime/**`
  # changes. Split in two so an unrelated PR skips the Postgres setup too: that needs a
  # job-level `if:`, and so a diff computed in a job that finished first.
  # BEGIN GENERATED ci_gate runtime_changed (CiGate vocabulary; hecks project_ci_gates). Do not hand-edit.
  runtime_changed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      touched: ${{ steps.diff.outputs.touched }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the diff needs both endpoints present as real objects.
          fetch-depth: 0
      - uses: ./.github/actions/setup-ruby
      - uses: ./.github/actions/hecks-environment
      - id: diff
        name: 'does this change touch lib/hecks/runtime/**?'
        run: bundle exec exe/hecks regeneration_run.decide_ci_gate gate=runtime_changed --wait
  # END GENERATED ci_gate runtime_changed

  stress_concurrency:
    needs: runtime_changed
    if: needs.runtime_changed.outputs.touched == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Real Postgres: the serial-only spec (postgres_concurrent_dispatch_spec.rb) skips itself
    # without one, which would leave this job passing without applying the stress.
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ruby

      # rust/src/generated is not committed (pizzas aside); restore or regenerate it before rust/src is used.
      - uses: ./.github/actions/generated-rust

      # Preinstalled and tuned, not a `services:` container. The durability settings it turns
      # off don't affect Postgres locking or MVCC visibility, so the contention is unchanged.
      - uses: ./.github/actions/postgres

      - uses: ./.github/actions/hecks-environment
        with:
          database: ${{ secrets.HECKS_JOURNAL_DATABASE }}

      # No arguments: the command's defaults are its recommended CI settings. It sets `CI=true` on
      # its child rspec runs, so the `io: true` Postgres spec is included.
      - name: hecks stress_concurrency
        run: bundle exec exe/hecks test_suite_run.stress_concurrency --wait
