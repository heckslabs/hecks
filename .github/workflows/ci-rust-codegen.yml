name: CI rust codegen (reusable)

# Group 3 (part 3 of 4) of the ci.yml split: only `rspec_rust_codegen`, a required check.

on:
  workflow_call:

jobs:
  # rust/codegen/ (hecks-codegen), an independent Cargo project; codegen_parity_spec.rb
  # builds it via `build_codegen!`.
  rspec_rust_codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Push runs only warm caches.
    if: github.event_name != 'push'

    # GHCR binary cache; see ci-rust-parser.yml's comment on the identical block.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ruby

      - uses: ./.github/actions/cargo-cache
        with:
          name: codegen
          crate-root: rust/codegen

      # A hit means rspec_rust_io's opt-in codegen build already pushed identical content.
      - uses: ./.github/actions/ghcr-binary-cache-restore
        id: ghcr_cache
        with:
          name: codegen
          crate-root: rust/codegen
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "rspec: Rust codegen parity"
        run: bundle exec rspec --tag io spec/codegen_parity_spec.rb spec/codegen_manifest_parity_spec.rb

      - name: "cargo test: rust/codegen (hecks-codegen)"
        run: cd rust/codegen && cargo test

      - uses: ./.github/actions/ghcr-binary-cache-save
        if: steps.ghcr_cache.outputs.cache-hit != 'true'
        with:
          name: codegen
          crate-root: rust/codegen
          token: ${{ secrets.GITHUB_TOKEN }}
