name: CI rust codegen (reusable)

# REUSABLE-WORKFLOW SPLIT OF ci.yml, group 3 (part 3 of 4) — see
# ci-rust-io.yml's own header for the full split rationale. This file
# holds only `rspec_rust_codegen`, the required-status-check job.

on:
  workflow_call:

jobs:
  # rust/codegen/ ("hecks-codegen") — same shape as rspec_rust_parser,
  # a different independent Cargo project. codegen_parity_spec.rb builds
  # it via its own `before(:context) { self.class.build_codegen! }`.
  rspec_rust_codegen:
    runs-on: ubuntu-latest

    # See `rspec` job's own comment in ci.yml — cache-warming push doesn't
    # need this job.
    if: github.event_name != 'push'

    # PHASE 8, GHCR BINARY CACHE — see ci-rust-parser.yml's own comment
    # on the identical block; same reasoning applies here.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ruby

      - uses: ./.github/actions/cargo-cache
        with:
          name: codegen
          crate-root: rust/codegen

      # PHASE 8, GHCR BINARY CACHE — see ghcr-binary-cache-restore's own
      # header. A hit here means rspec_rust_io's own opt-in codegen build
      # already ran this run and pushed the identical content.
      - uses: ./.github/actions/ghcr-binary-cache-restore
        id: ghcr_cache
        with:
          name: codegen
          crate-root: rust/codegen
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "rspec: Rust codegen parity"
        run: bundle exec rspec --tag io spec/codegen_parity_spec.rb

      # The crate's own unit tests — never ran in CI before (only
      # `cargo test --lib` in rust/ did).
      - name: "cargo test: rust/codegen (hecks-codegen)"
        run: cd rust/codegen && cargo test

      - uses: ./.github/actions/ghcr-binary-cache-save
        if: steps.ghcr_cache.outputs.cache-hit != 'true'
        with:
          name: codegen
          crate-root: rust/codegen
          token: ${{ secrets.GITHUB_TOKEN }}
