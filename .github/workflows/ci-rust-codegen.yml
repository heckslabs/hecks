name: CI rust codegen (reusable)

# Group 3 (part 3 of 4) of the ci.yml split: only `rspec_rust_codegen`, a required check.

on:
  workflow_call:
    secrets:
      HECKS_CI_ATTEST_KEY:
        required: false

jobs:
  # Same detector-plus-gated-job shape as ci-rspec.yml's own ci_attestation_rspec —
  # see ci-rust-parser.yml's identical addition for the full comment.
  ci_attestation_rust_codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      attested: ${{ steps.attest.outputs.attested }}

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/check-attestation
        id: attest
        with:
          checks: rspec_rust_codegen
          hmac-key: ${{ secrets.HECKS_CI_ATTEST_KEY }}

  # rust/codegen/ (hecks-codegen), an independent Cargo project; codegen_planted_gaps_spec.rb
  # builds it before its examples.
  rspec_rust_codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: ci_attestation_rust_codegen
    if: always() && (needs.ci_attestation_rust_codegen.result != 'success' || needs.ci_attestation_rust_codegen.outputs.attested != 'true')

    # GHCR binary cache; see ci-rust-parser.yml's comment on the identical block.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ruby

      - uses: ./.github/actions/cargo-cache
        with:
          name: codegen
          crate-root: rust/codegen

      # A hit means rspec_rust_io's opt-in codegen build already pushed identical content.
      - uses: ./.github/actions/ghcr-binary-cache-restore
        id: ghcr_cache
        with:
          name: codegen
          crate-root: rust/codegen
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "rspec: Rust codegen planted-gap manifest"
        run: bundle exec rspec --tag io spec/codegen_planted_gaps_spec.rb

      - name: "cargo test: rust/codegen (hecks-codegen)"
        run: cd rust/codegen && cargo test

      - uses: ./.github/actions/ghcr-binary-cache-save
        if: steps.ghcr_cache.outputs.cache-hit != 'true'
        with:
          name: codegen
          crate-root: rust/codegen
          token: ${{ secrets.GITHUB_TOKEN }}
