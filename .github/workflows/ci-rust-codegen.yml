name: CI rust codegen (reusable)

# REUSABLE-WORKFLOW SPLIT OF ci.yml, group 3 (part 3 of 4) — see
# ci-rust-io.yml's own header for the full split rationale. This file
# holds only `rspec_rust_codegen`, the required-status-check job.

on:
  workflow_call:

jobs:
  # rust/codegen/ ("hecks-codegen") — an independent Cargo project, same
  # shape as rspec_rust_parser.
  #
  # ADR 0054a, B4 — THIS JOB NO LONGER RUNS THE RUBY-vs-RUST GENERATOR
  # PARITY SPECS. hecks-codegen became bin/project_rust's generator in B3,
  # so spec/codegen_parity_spec.rb and spec/codegen_manifest_parity_spec.rb
  # are tagged `ruby_codegen_parity` (on demand only; see spec_helper.rb)
  # until B5 deletes rust/project/. What is left here is the crate's own
  # `cargo test` (which includes the manifest writer's tests in
  # src/manifest.rs) plus the GHCR binary-cache save that rspec_rust_io
  # restores.
  #
  # The job name stays only because `rspec_rust_codegen` is a REQUIRED
  # status check in the `merge-queue-main` ruleset. A maintainer can drop
  # that ruleset entry; after that, delete this file and the
  # rspec_rust_codegen/rspec_rust_codegen_impl jobs in ci.yml, and move the
  # `cargo test` step into another job (for example rspec_rust_io_build).
  rspec_rust_codegen:
    runs-on: ubuntu-latest

    # See `rspec` job's own comment in ci.yml — cache-warming push doesn't
    # need this job.
    if: github.event_name != 'push'

    # PHASE 8, GHCR BINARY CACHE — see ci-rust-parser.yml's own comment
    # on the identical block; same reasoning applies here.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/cargo-cache
        with:
          name: codegen
          crate-root: rust/codegen

      # PHASE 8, GHCR BINARY CACHE — see ghcr-binary-cache-restore's own
      # header. A hit here means rspec_rust_io's own codegen build already
      # ran this run and pushed the identical content.
      - uses: ./.github/actions/ghcr-binary-cache-restore
        id: ghcr_cache
        with:
          name: codegen
          crate-root: rust/codegen
          token: ${{ secrets.GITHUB_TOKEN }}

      # Bare `cargo build` first, the same command hecks-build runs, so the
      # target/debug/hecks-codegen that the save step below pushes for
      # rspec_rust_io is still there (the parity spec used to build it).
      - name: "cargo build: rust/codegen (hecks-codegen)"
        run: cd rust/codegen && cargo build

      # The crate's own unit tests, the manifest writer's included.
      - name: "cargo test: rust/codegen (hecks-codegen)"
        run: cd rust/codegen && cargo test

      - uses: ./.github/actions/ghcr-binary-cache-save
        if: steps.ghcr_cache.outputs.cache-hit != 'true'
        with:
          name: codegen
          crate-root: rust/codegen
          token: ${{ secrets.GITHUB_TOKEN }}
