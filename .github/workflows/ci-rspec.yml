# Generated by hecks regeneration_run.project_ci_pipeline!. Do not edit; change the workflow rows.

name: CI rspec (reusable)

# Reusable rspec gate behind the `rspec` required check; called from ci.yml.
#
# One file per required check: a called workflow reports a single `.result` to its caller.
# Secrets are declared, not inherited: ci.yml must pass HECKS_CI_ATTEST_KEY and
# HECKS_JOURNAL_DATABASE at the call site.

on:
  workflow_call:
    secrets:
      HECKS_CI_ATTEST_KEY:
        required: false
      HECKS_JOURNAL_DATABASE:
        required: false

jobs:
  # Separate job because a job-level `if:` cannot read a step output from its own job.
  # Lets `rspec_shard` skip wholesale when a local run attested this tree.
  # Safe to skip on push: `rspec_shard` never reads this result on that trigger.
  ci_attestation_rspec:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      attested: ${{ steps.attest.outputs.attested }}
    steps:
      - uses: actions/checkout@v4
      - id: attest
        uses: ./.github/actions/check-attestation
        with:
          checks: rspec
          hmac-key: ${{ secrets.HECKS_CI_ATTEST_KEY }}

  # Splits the spec files among the shards once, so every leg reads the same plan. It runs the
  # CiSpeed bluebook's ShardPlan: the seconds the newest successful run on main recorded for each file
  # balance the legs, and file size does when that run cannot be read. The events of the plan, and the
  # policy that reacted to each, are in the job summary and the shard-plan-trace-rspec artifact.
  shard_plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: ci_attestation_rspec
    if: >-
      always() && (needs.ci_attestation_rspec.result != 'success' ||
      needs.ci_attestation_rspec.outputs.attested != 'true')
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # The plan boots the CiSpeed bluebook and splits spec files; it builds no Rust.
      - uses: ./.github/actions/setup-ruby
      - uses: ./.github/actions/hecks-environment

      # `shards` is the rspec_shard matrix's group count. A plan that cannot be made leaves tmp/plan empty and
      # each leg then splits by file size on its own, so a missing plan never fails the run.
      - name: "Plan the shards: ShardPlan.Request, from the last main run's timings or file size"
        run: |
          mkdir -p tmp/shard-plan-trace
          cat > tmp/shard-plan-steps.json <<'JSON'
          {"steps":[{"verb":"CiSpeed::ShardPlan.Request","args":{"name":{"value":"rspec"},"shards":{"value":8},"items_from":{"value":"glob:spec/**/*_spec.rb"},"timings_from":{"value":"main"},"out_dir":{"value":"tmp/plan"}}}]}
          JSON
          bundle exec exe/hecks Operation.run! subject.value=lib/hecks/ci_speed script.value=tmp/shard-plan-steps.json --wait \
            > tmp/shard-plan-trace/run.json \
            || echo "::warning::the shard plan failed; every leg splits by file size"
      - name: Publish the plan's events and the policies that reacted
        if: always()
        run: |
          jq -r -f .github/shard-plan-trace.jq tmp/shard-plan-trace/run.json \
            | tee tmp/shard-plan-trace/trace.md >> "$GITHUB_STEP_SUMMARY" \
            || echo "::warning::no shard plan trace to publish"
      - name: Upload the plan every leg reads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-plan-rspec
          path: tmp/plan
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload the plan's event trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-plan-trace-rspec
          path: tmp/shard-plan-trace
          retention-days: 14
          if-no-files-found: ignore

  # The suite is split across shards, each running parallel workers, to cut wall-clock time.
  #
  # `always()` and the `.result` check are both required: a failed detector would otherwise
  # skip this required check instead of running it. Also skipped on push (cache warming
  # needs only the postgres_io_parallel shards) and when the tree is attested.
  #
  # No Postgres service: specs that boot examples/pizzas against PostgresRevision are tagged
  # `io: true` and run in rspec_postgres_io. An untagged one fails here with
  # PG::ConnectionBad.
  rspec_shard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ci_attestation_rspec, shard_plan]
    if: >-
      always() && (needs.ci_attestation_rspec.result != 'success' ||
      needs.ci_attestation_rspec.outputs.attested != 'true')
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ruby

      # cli_completion_spec checks the zsh completion script with `zsh -n`; CI has no zsh,
      # and the skip backstop turns an unrouted skip into a failure.
      - name: Install zsh
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends zsh
      - uses: ./.github/actions/hecks-environment
        with:
          database: ${{ secrets.HECKS_JOURNAL_DATABASE }}

      # rust/src/generated is committed, so the whole tree is in the checkout and this step only checks it.
      # A shard reads only the domains named below (rust_build_kernel_input_spec); the input names them and
      # changes nothing. Specs that read the whole tree are tagged `generated_all` and run in the drift job,
      # which regenerates every domain.
      - uses: ./.github/actions/generated-rust
        with:
          domains: lease_clock nested_pieces

      # Every leg reads the one plan the shard_plan job made, so the legs agree on the partition.
      # A plan that cannot be read is no reason to fail: the leg splits by file size on its own.
      - name: Read the plan
        run: |
          mkdir -p tmp/plan
          gh run download ${{ github.run_id }} --name shard-plan-rspec --dir tmp/plan \
            || echo "::warning::no shard plan to read; this leg splits by file size"

      # `io: true` specs run elsewhere: rspec_rust_io (cargo/wasm) and rspec_postgres_io.
      - name: Determine this shard's own file list
        run: |
          if [ -s "tmp/plan/group-${{ matrix.group }}.txt" ]; then
            cp "tmp/plan/group-${{ matrix.group }}.txt" tmp/rspec_shard_files.txt
          else
            bundle exec exe/hecks test_suite_run.shard_specs group=${{ matrix.group }} groups=8 \
              > tmp/rspec_shard_files.txt
          fi

      # Grouping by runtime keeps one worker from drawing the slowest files; the plan's runtimes.log
      # prices every file, so none is missing. Without a plan the workers group by file size.
      - name: "rspec: parallel (this shard's own file list only)"
        run: |
          if [ -s tmp/plan/runtimes.log ]; then
            GROUPING=(--group-by runtime --runtime-log tmp/plan/runtimes.log --allowed-missing 100)
          else
            GROUPING=(--group-by filesize)
          fi
          FILES=()
          while IFS= read -r line; do FILES+=("$line"); done < tmp/rspec_shard_files.txt
          bundle exec parallel_rspec "${FILES[@]}" "${GROUPING[@]}" \
            -o "--tag ~io --tag ~fuzzing --tag ~generated_all --profile 15 --format documentation --format ParallelTests::RSpec::RuntimeLogger --out tmp/runtime_rspec.log"

      # Artifact only, never restored by this run: the shard_plan job of the next run downloads
      # the artifacts of the newest successful run on main and balances the legs by these seconds.
      - name: Upload this shard's runtime log (the next run's plan reads it)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rspec-runtime-group-${{ matrix.group }}
          path: tmp/runtime_rspec.log
          retention-days: 14
          if-no-files-found: ignore
