name: CI rust io (reusable)

# Reusable workflow holding only `rspec_rust_io`, a required status check.
# rspec_rust_io_build and rspec_rust_io_deploy stay in ci.yml because they are not
# required checks, and bundling them here would make their failures fail this one.

on:
  workflow_call:
    secrets:
      HECKS_CI_ATTEST_KEY:
        required: false
      HECKS_JOURNAL_DATABASE:
        required: false

jobs:
  # Same detector-plus-gated-job shape as ci-rspec.yml's own ci_attestation_rspec —
  # see ci-rust-parser.yml's identical addition for the full comment. Covers only
  # rspec_rust_io itself, not the non-required rspec_rust_io_build/_deploy jobs in
  # ci.yml — each already does its own independent checkout and build, consuming
  # nothing this job produces, so this job skipping never affects them either way.
  ci_attestation_rust_io:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      attested: ${{ steps.attest.outputs.attested }}

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/check-attestation
        id: attest
        with:
          checks: rspec_rust_io
          hmac-key: ${{ secrets.HECKS_CI_ATTEST_KEY }}

  # When the Rust sources change, the feature-binary cache below misses and rspec_rust_io would
  # build 23 binaries one after another. These legs build a quarter each, side by side, and hand
  # them over as artifacts. When the cache already holds the binaries they stop after a lookup.
  # Best effort: a feature a leg does not deliver is built by the spec that needs it.
  # Whether the feature binaries for these sources are already cached. On a hit the four builder
  # legs below do not run: each would spend 40-80s checking out and regenerating the crate to find
  # that out, on runners the longest jobs of the run queue for. The key hashes the committed
  # sources, which the regeneration does not change in any way a build depends on
  # (checks_codegen_drift fails when the committed output differs from it).
  rust_feature_binaries_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs: ci_attestation_rust_io
    if: always() && (needs.ci_attestation_rust_io.result != 'success' || needs.ci_attestation_rust_io.outputs.attested != 'true')

    outputs:
      hit: ${{ steps.probe.outputs.cache-hit }}

    steps:
      - uses: actions/checkout@v4

      # The generated Rust is not committed, so its sources' hash stands in for it in the key.
      - name: Hash the generator inputs
        id: inputs
        uses: ./.github/actions/generated-rust-inputs

      - name: Look for the cached feature binaries
        id: probe
        uses: actions/cache/restore@v4
        with:
          path: rust/target/debug/rust-*
          key: rust-feature-binaries-${{ runner.os }}-${{ hashFiles('rust/src/**', 'rust/Cargo.toml', 'rust/Cargo.lock') }}-${{ steps.inputs.outputs.hash }}
          lookup-only: true

  rust_feature_binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: [ci_attestation_rust_io, rust_feature_binaries_probe]
    if: always() && (needs.ci_attestation_rust_io.result != 'success' || needs.ci_attestation_rust_io.outputs.attested != 'true') && needs.rust_feature_binaries_probe.outputs.hit != 'true'

    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ruby
      - uses: ./.github/actions/hecks-environment
        with:
          database: ${{ secrets.HECKS_JOURNAL_DATABASE }}

      # rust/src/generated is not committed (pizzas aside); restore or regenerate it before rust/src is used.
      - uses: ./.github/actions/generated-rust

      # `hecks project_rust` runs the hecks-codegen binary, so these builds are restored.
      - uses: ./.github/actions/cargo-cache
        with:
          name: parser
          crate-root: rust/parser

      - uses: ./.github/actions/cargo-cache
        with:
          name: codegen
          crate-root: rust/codegen

      # The same regeneration rspec_rust_io runs, so the binaries are built from the same sources.
      - name: Regenerate the Rust crate
        run: bundle exec exe/hecks build.project_rust domain=examples/banking --wait

      - uses: ./.github/actions/cargo-cache
        with:
          name: main
          crate-root: rust

      # Every fourth feature of the list, from this leg's place in it. The cargo cache restore
      # above brings back every feature's binary from an earlier run, built from older sources.
      # They are removed first: the artifacts are merged into one directory downstream, and a
      # stale copy another leg uploads must not overwrite the fresh one this feature's own leg built.
      - name: Build this leg's feature binaries
        run: |
          cd rust
          mkdir -p target/debug
          rm -f target/debug/rust-*
          grep -E '^[a-z0-9_]+ = \[\]$' Cargo.toml | sed 's/ = \[\]$//' | grep -vx default \
            | awk -v leg=${{ matrix.leg }} 'NR % 4 == leg % 4' > "$RUNNER_TEMP/features"
          while read -r feature; do
            cargo build --no-default-features --features "$feature" &&
              cp target/debug/rust "target/debug/rust-$feature" || true
          done < "$RUNNER_TEMP/features"

      - uses: actions/upload-artifact@v4
        with:
          name: feature-binaries-${{ matrix.leg }}
          path: rust/target/debug/rust-*
          retention-days: 1
          if-no-files-found: ignore
          overwrite: true

  # These specs share one checkout's rust/src/generated/ and Cargo.toml, so they run
  # serially in one job. The two heaviest, hecks_build_pipeline_spec.rb and
  # project_deploy_parity_gate_spec.rb, need wasm32-wasip1 and wasmtime and run
  # in their own jobs in ci.yml (rspec_rust_io_build, rspec_rust_io_deploy).
  rspec_rust_io:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Two legs, each on its own checkout: the specs mutate rust/ and so cannot share a process or a
    # tree. The exclusivity spec runs real cargo builds for about 40s; the other five files take
    # about 20s together, so it gets a leg to itself.
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: a
            specs: spec/rust_conformance_spec.rb spec/rust_conformance_fuzz_spec.rb spec/rust_numeric_coercion_spec.rb spec/rust_generated/has_many_spec.rb spec/semantics_corpus_spec.rb
          - leg: b
            specs: spec/rust_generated/domain_feature_exclusivity_spec.rb

    needs: ci_attestation_rust_io
    if: always() && (needs.ci_attestation_rust_io.result != 'success' || needs.ci_attestation_rust_io.outputs.attested != 'true')

    # `packages: write` is for the parser/codegen GHCR restore-and-save pair below; `actions: read`
    # is for finding the feature binaries the rust_feature_binaries legs upload.
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ruby
      - uses: ./.github/actions/hecks-environment
        with:
          database: ${{ secrets.HECKS_JOURNAL_DATABASE }}

      # The feature binaries' cache key, from the committed sources: the probe job computes the same
      # one from a bare checkout, before the regeneration below adds files to rust/src.
      - name: Hash the generator inputs
        id: inputs
        uses: ./.github/actions/generated-rust-inputs

      - name: Name the feature binaries' cache entry
        id: feature_key
        run: echo "key=rust-feature-binaries-${{ runner.os }}-${{ hashFiles('rust/src/**', 'rust/Cargo.toml', 'rust/Cargo.lock') }}-${{ steps.inputs.outputs.hash }}" >> "$GITHUB_OUTPUT"

      # rust/src/generated is not committed (pizzas aside); restore or regenerate it before rust/src is used.
      - uses: ./.github/actions/generated-rust

      # Root crate only, so a dependency bump in rust/parser does not invalidate it.
      - uses: ./.github/actions/cargo-cache
        with:
          name: main
          crate-root: rust

      # The specs below build the parser and codegen crates; sharing
      # the keys of rspec_rust_parser/rspec_rust_codegen reuses their cached builds
      # from an earlier completed run.
      - uses: ./.github/actions/cargo-cache
        with:
          name: parser
          crate-root: rust/parser

      - uses: ./.github/actions/cargo-cache
        with:
          name: codegen
          crate-root: rust/codegen

      # Regenerate from the current generator, then build, so rust_conformance_spec.rb
      # has a binary to run instead of skipping. No wasm target is needed here.
      #
      # `bundle exec` pins `json` to Gemfile.lock's version; a bare run picks another
      # version that pretty-prints empty arrays differently and reads as drift.
      #
      # No `cargo build --release`: every io spec builds its own target/debug/rust
      # via RustConformanceHelpers#build_rust_for, and the exemplar step below
      # already type-checks the default feature set.
      - name: Build the Rust conformance binary
        run: bundle exec exe/hecks build.project_rust domain=examples/banking --wait

      # The specs build one binary per domain feature, one after another: 23 builds that depend on
      # nothing but the Rust sources. Restore the binaries an earlier run built from identical
      # sources, keyed on the committed sources named above. A hit is touched so every binary is newer than
      # the sources and RustBuild::NativeBuild uses it as it is; a miss builds as before and the
      # post-job step saves what the specs built. Binaries left by the cargo cache restore above
      # were built from other sources, so they are removed first.
      - name: Remove pinned feature binaries left by the cargo cache
        run: rm -f rust/target/debug/rust-*

      - name: Restore the built feature binaries
        id: feature_binaries
        uses: actions/cache@v4
        with:
          path: rust/target/debug/rust-*
          key: ${{ steps.feature_key.outputs.key }}

      - name: Mark the restored binaries as built after the sources
        if: steps.feature_binaries.outputs.cache-hit == 'true'
        run: touch rust/target/debug/rust-*

      # `cargo test --lib` skips tests/ and this file is gated on the banking feature,
      # so it needs its own step, right after the banking generation above. This step and the
      # exemplar build run in leg a only: they check that the crate compiles and tests, which
      # no leg's specs depend on.
      - name: Run the from_json round-trip test
        if: matrix.leg == 'a'
        run: cd rust && cargo test --no-default-features --features banking --test from_json_round_trip

      # rust/src/exemplar/** is compiled under `cargo test`, so a broken shape fails
      # here before any Ruby runs; no #[test] fn is required.
      - name: Build the exemplar module
        if: matrix.leg == 'a'
        run: cd rust && cargo test --lib

      # Parser and codegen are also built concurrently by their dedicated jobs, and
      # `actions/cache` only helps future runs, so restore from GHCR here. The restore
      # sits right before its consumer to give those jobs time to push first.
      - uses: ./.github/actions/ghcr-binary-cache-restore
        id: ghcr_cache_parser
        with:
          name: parser
          crate-root: rust/parser
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/ghcr-binary-cache-restore
        id: ghcr_cache_codegen
        with:
          name: codegen
          crate-root: rust/codegen
          token: ${{ secrets.GITHUB_TOKEN }}

      # On a miss the rust_feature_binaries legs are building them; wait for the artifacts, then
      # take what arrived. The post-job step saves them for the next run. Placed after the steps
      # that do not need them, so the wait overlaps their work.
      - name: Wait for the feature binaries the legs build
        if: steps.feature_binaries.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 150); do
            found=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                    --jq '[.artifacts[] | select(.name | startswith("feature-binaries-"))] | length')
            [ "$found" = "4" ] && exit 0
            sleep 2
          done
          echo "not every feature-binaries artifact arrived within 300s; the specs build the rest" >&2

      - name: Fetch the feature binaries
        if: steps.feature_binaries.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: feature-binaries-*
          merge-multiple: true
          path: rust/target/debug

      # An artifact does not keep the executable bit, and NativeBuild takes only an executable binary.
      - name: Mark the fetched binaries executable and built after the sources
        if: steps.feature_binaries.outputs.cache-hit != 'true'
        run: |
          chmod +x rust/target/debug/rust-* 2>/dev/null || true
          touch rust/target/debug/rust-* 2>/dev/null || true

      # Runs the io specs that touch the shared `rust/` crate, listed in the matrix because
      # spec/rust_generated/ also holds fast non-io specs that already run in parallel. Single
      # process within a leg: concurrent cargo builds would race on rust/.
      - name: "rspec: this leg's Rust io specs (serial — shared-file mutation)"
        run: bundle exec rspec --tag io --profile 8 ${{ matrix.specs }}

      # Push only on a miss, and from one leg: two legs pushing the same tag would race.
      # `always()` so a spec failure still publishes a freshly built crate for sibling jobs.
      - uses: ./.github/actions/ghcr-binary-cache-save
        if: always() && matrix.leg == 'a' && steps.ghcr_cache_parser.outputs.cache-hit != 'true'
        with:
          name: parser
          crate-root: rust/parser
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/ghcr-binary-cache-save
        if: always() && matrix.leg == 'a' && steps.ghcr_cache_codegen.outputs.cache-hit != 'true'
        with:
          name: codegen
          crate-root: rust/codegen
          token: ${{ secrets.GITHUB_TOKEN }}
