name: CI rust io (reusable)

# Reusable workflow holding only `rspec_rust_io`, a required status check.
# rspec_rust_io_build and rspec_rust_io_deploy stay in ci.yml because they are not
# required checks, and bundling them here would make their failures fail this one.

on:
  workflow_call:

jobs:
  # These specs share one checkout's rust/src/generated/ and Cargo.toml, so they run
  # serially in one job. The two heaviest, hecks_build_pipeline_spec.rb and
  # project_deploy_parity_gate_spec.rb, need wasm32-wasip1 and wasmtime and run
  # in their own jobs in ci.yml (rspec_rust_io_build, rspec_rust_io_deploy).
  rspec_rust_io:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The cache-warming push run does not need this job.
    if: github.event_name != 'push'

    # `packages: write` is for the parser/codegen GHCR restore-and-save pair below.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ruby

      # Root crate only, so a dependency bump in rust/parser does not invalidate it.
      - uses: ./.github/actions/cargo-cache
        with:
          name: main
          crate-root: rust

      # project_rust_pipeline_spec.rb builds the parser and codegen crates; sharing
      # the keys of rspec_rust_parser/rspec_rust_codegen reuses their cached builds
      # from an earlier completed run.
      - uses: ./.github/actions/cargo-cache
        with:
          name: parser
          crate-root: rust/parser

      - uses: ./.github/actions/cargo-cache
        with:
          name: codegen
          crate-root: rust/codegen

      # Regenerate from the current generator, then build, so rust_conformance_spec.rb
      # has a binary to run instead of skipping. No wasm target is needed here.
      #
      # `bundle exec` pins `json` to Gemfile.lock's version; a bare run picks another
      # version that pretty-prints empty arrays differently and reads as drift.
      #
      # No `cargo build --release`: every io spec builds its own target/debug/rust
      # via RustConformanceHelpers#build_rust_for, and the exemplar step below
      # already type-checks the default feature set.
      - name: Build the Rust conformance binary
        run: bundle exec bin/project_rust examples/banking

      # `cargo test --lib` skips tests/ and this file is gated on the banking feature,
      # so it needs its own step, right after the banking generation above.
      - name: Run the from_json round-trip test
        run: cd rust && cargo test --no-default-features --features banking --test from_json_round_trip

      # rust/src/exemplar/** is compiled under `cargo test`, so a broken shape fails
      # here before any Ruby runs; no #[test] fn is required.
      - name: Build the exemplar module
        run: cd rust && cargo test --lib

      # Parser and codegen are also built concurrently by their dedicated jobs, and
      # `actions/cache` only helps future runs, so restore from GHCR here. The restore
      # sits right before its consumer to give those jobs time to push first.
      - uses: ./.github/actions/ghcr-binary-cache-restore
        id: ghcr_cache_parser
        with:
          name: parser
          crate-root: rust/parser
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/ghcr-binary-cache-restore
        id: ghcr_cache_codegen
        with:
          name: codegen
          crate-root: rust/codegen
          token: ${{ secrets.GITHUB_TOKEN }}

      # Runs the io specs that touch the shared `rust/` crate, listed explicitly
      # because spec/rust_project/ also holds fast non-io specs that already run in
      # parallel. Single process: concurrent cargo builds would race on rust/.
      - name: "rspec: Rust conformance + numeric coercion + pipeline parity (serial — shared-file mutation)"
        run: |
          bundle exec rspec --tag io \
            spec/project_rust_pipeline_spec.rb \
            spec/rust_conformance_spec.rb \
            spec/rust_conformance_fuzz_spec.rb \
            spec/semantics_corpus_spec.rb \
            spec/rust_numeric_coercion_spec.rb \
            spec/rust_project/domain_feature_exclusivity_spec.rb \
            spec/rust_project/naming_landmines_spec.rb \
            spec/rust_project/has_many_spec.rb

      # Push only on a miss. `always()` so a spec failure still publishes a
      # freshly built crate for sibling jobs.
      - uses: ./.github/actions/ghcr-binary-cache-save
        if: always() && steps.ghcr_cache_parser.outputs.cache-hit != 'true'
        with:
          name: parser
          crate-root: rust/parser
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/ghcr-binary-cache-save
        if: always() && steps.ghcr_cache_codegen.outputs.cache-hit != 'true'
        with:
          name: codegen
          crate-root: rust/codegen
          token: ${{ secrets.GITHUB_TOKEN }}
