name: Release

# Cuts the release a merged release PR describes, so nobody runs `hecks publishing_run.publish
# --confirm` from a laptop. It runs after the Promote workflow, on `stable`: the commit it
# releases is the newest one on `stable` that set Hecks::VERSION, so a version bump on `main`
# releases nothing until every required check has passed on it and `stable` has reached it. It
# does what the local publish does, in the same order:
#
#   1. check that Hecks::VERSION, packages/hecks-client, rust/host/HECKS_RELEASE and a
#      `## [X.Y.Z]` heading in CHANGELOG.md all name the same version, and refuse if they do not;
#   2. tag the commit vX.Y.Z (annotated);
#   3. push the gem to rubygems.org (the API key first, then trusted publishing, see below);
#   4. start publish-client.yml for the tag, which publishes @hecks/client to npm (OIDC);
#   5. create the GitHub Release from the CHANGELOG section and mark it latest.
#
# A release commit that is not on `stable` is refused whichever way the run started, a by-hand
# run included: a release is a statement about certified code.
#
# Every step looks at what already exists first and skips it, so a run that stopped halfway, or a
# release that was already cut by hand, is finished by re-running: the workflow never tags,
# pushes or releases the same thing twice. A tag that stands on a different commit is an error,
# never moved.
#
# The npm publish is started with `gh workflow run` rather than left to the tag push: a tag
# pushed with the workflow's own GITHUB_TOKEN does not trigger other workflows, and the
# alternative (a personal access token that does) would add a long-lived credential to a
# repository that otherwise holds none for the npm side.
#
# The gem push has two paths inside the one job, so a bad credential never needs a laptop:
#
#   a. `gem push` with the RUBYGEMS_API_KEY secret, retried with backoff when the failure looks
#      transient. The key is handed to that one step, as GEM_HOST_API_KEY, and nowhere else.
#   b. If that did not push (key missing, wrong, or under-scoped: 401/403), the job asks
#      rubygems.org for a short-lived key over OIDC (trusted publishing, `id-token: write`) and
#      pushes again.
#
# A push answered with "already exists" / "Repushing of gem versions is not allowed" counts as
# done, so a re-run finishes a release whose gem went out but whose later steps did not. If both
# paths fail the job says what to configure; the next step is then `gh workflow run`, never a
# local publish.
#
# One-time setup: either a RUBYGEMS_API_KEY secret whose key may push `hecks`, or a trusted
# publisher on rubygems.org > hecks > Trusted publishers > GitHub Actions (organization
# heckslabs, repository hecks, workflow release.yml, no environment).
#
# Re-run: `gh workflow run release.yml -f tag=vX.Y.Z` (from main). If the tag already exists the
# run checks out that tag, so a missing piece of an older release can be filled in.

on:
  # Promote moves `stable` and finishes; whether the version changed is read from `stable`, and
  # every step below skips what already exists, so a promotion that releases nothing is a no-op.
  workflow_run:
    workflows: [Promote]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to cut or finish, such as v3.2.1"
        required: true
        type: string

# Releases queue behind each other and a running one is never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the tag, create the GitHub Release
  actions: write # start publish-client.yml

jobs:
  # Every promotion starts this workflow, and almost none has a release to cut. This job reads
  # only GitHub: the release of the version `stable` carries is either published or it is not, and
  # `release` below runs only when it is not, so a promotion that releases nothing makes no call to
  # a package registry. A by-hand run always goes on.
  detect:
    if: >-
      github.repository == 'heckslabs/hecks' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.check.outputs.pending }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'stable' || '' }}
          fetch-depth: 0
      - name: Is the release of this version still to cut
        id: check
        run: |
          pending=true
          if [ "$EVENT" = "workflow_run" ]; then
            commit="$(git log --first-parent -1 --format=%H -G'^ *VERSION = ' -- lib/hecks/version.rb)"
            version="$(git show "$commit:lib/hecks/version.rb" | sed -n 's/^ *VERSION = "\(.*\)".*/\1/p')"
            if [ -n "$version" ] && gh release view "v$version" > /dev/null 2>&1; then
              pending=false
            fi
          fi
          echo "pending=$pending" >> "$GITHUB_OUTPUT"

  release:
    needs: detect
    if: needs.detect.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # A job's own permissions replace the workflow's, so all three are listed here.
    permissions:
      contents: write
      actions: write
      id-token: write # trusted publishing to rubygems.org, the fallback for a failed API-key push

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REQUESTED_TAG: ${{ inputs.tag }}

    steps:
      # A promotion run reads `stable`; a by-hand run starts from main and moves to its tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'stable' || '' }}
          fetch-depth: 0

      # The commit that set the current version, so a later commit on `stable` that does not touch
      # it is not mistaken for a new release (the tag stands on the commit that set the version).
      - name: Stand on the commit that set the version
        if: github.event_name == 'workflow_run'
        run: |
          commit="$(git log --first-parent -1 --format=%H -G'^ *VERSION = ' -- lib/hecks/version.rb)"
          [ -n "$commit" ] || { echo "::error::no commit on stable sets Hecks::VERSION"; exit 1; }
          git checkout --detach "$commit"

      # A by-hand run for a tag that already exists works from that tag's tree.
      - name: Check out the requested tag
        if: env.REQUESTED_TAG != ''
        run: |
          case "$REQUESTED_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$REQUESTED_TAG' is not a release tag such as v3.2.1"; exit 1 ;;
          esac
          git fetch --force --tags origin
          if git rev-parse -q --verify "refs/tags/$REQUESTED_TAG^{commit}" > /dev/null; then
            git checkout --detach "refs/tags/$REQUESTED_TAG"
          fi

      - name: The release commit is on stable
        run: |
          git fetch --quiet origin stable
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::$(git rev-parse --short HEAD) is not on stable. A release comes from stable, never main: wait for Promote to move stable onto it, then re-run."
            exit 1
          fi

      - name: The files agree on one version
        id: release
        run: |
          version="$(sed -n 's/^ *VERSION = "\(.*\)".*/\1/p' lib/hecks/version.rb)"
          client="$(node -p "require('./packages/hecks-client/package.json').version")"
          host="$(tr -d '[:space:]' < rust/host/HECKS_RELEASE)"
          if [ -z "$version" ] || [ "$client" != "$version" ] || [ "$host" != "$version" ]; then
            echo "::error::Hecks::VERSION is '$version', packages/hecks-client is '$client', rust/host/HECKS_RELEASE is '$host'; they must all match. Fix them in the release PR."
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' heading; add the release entry in the release PR."
            exit 1
          fi
          if [ -n "$REQUESTED_TAG" ] && [ "$REQUESTED_TAG" != "v$version" ]; then
            echo "::error::$REQUESTED_TAG was requested, but this tree is release $version."
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # Read from the registries and GitHub, so a skipped step is a fact and not a memory.
      - name: What already exists
        id: state
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          remote="$(git ls-remote origin "refs/tags/$TAG^{}" "refs/tags/$TAG" | awk '{print $1}' | tail -n 1)"
          if [ -z "$remote" ]; then
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          elif [ "$remote" = "$SHA" ]; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::$TAG already points at ${remote:0:7} on origin, not at this release commit ${SHA:0:7}; it is never moved. If it was never released, delete it and re-run."
            exit 1
          fi

          gem_status="$(curl -sS -o gem.json -w '%{http_code}' https://rubygems.org/api/v1/versions/hecks.json)"
          [ "$gem_status" = "200" ] || { echo "::error::rubygems.org answered $gem_status; re-run this workflow"; exit 1; }
          if jq -e --arg v "$VERSION" 'any(.[]; .number == $v)' gem.json > /dev/null; then
            echo "gem=true" >> "$GITHUB_OUTPUT"
          else
            echo "gem=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f gem.json

          npm_status="$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@hecks%2Fclient/$VERSION")"
          case "$npm_status" in
            200) echo "npm=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "npm=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "::error::the npm registry answered $npm_status; re-run this workflow"; exit 1 ;;
          esac

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag the release commit
        if: steps.state.outputs.tagged == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $VERSION" "$SHA"
          git push origin "refs/tags/$TAG"

      - uses: ruby/setup-ruby@v1
        if: steps.state.outputs.gem == 'false'
        with:
          ruby-version: "3.3"

      # Boots Hecks once into an empty cache and ships what it wrote (`prebuilt/`, which the
      # gemspec lists), so a first run after `gem install` reads the syntax-boot and verdict caches
      # instead of judging every chapter. The caches are keyed by this very `lib/` and the Ruby
      # series, so a copy that does not match is ignored, never wrong. A failure here only costs
      # that first run its speed, so it never stops the release.
      - name: Build the caches the gem ships
        if: steps.state.outputs.gem == 'false'
        continue-on-error: true
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/prebuilt-cache
          HECKS_ENVIRONMENT: memory
        run: |
          exe/hecks > /dev/null
          mkdir -p prebuilt
          cp "$XDG_CACHE_HOME"/hecks/hecks_syntax_boot_cache/*.marshal prebuilt/
          cp "$XDG_CACHE_HOME"/hecks/hecks_verdict_cache/verdicts-*.json prebuilt/
          ls -l prebuilt

      - name: Build the gem
        if: steps.state.outputs.gem == 'false'
        run: gem build hecks.gemspec

      # Retries a few times with backoff, but only for failures that look transient; a refused
      # key is not retried. Never fails the job: it reports pushed=true/false so the OIDC path can
      # take over.
      - name: Push the gem with the API key
        id: api_key_push
        if: steps.state.outputs.gem == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          if [ -z "$GEM_HOST_API_KEY" ]; then
            echo "::warning::the repository secret RUBYGEMS_API_KEY is not set; trying trusted publishing"
            exit 0
          fi
          for attempt in 1 2 3 4; do
            if gem push "hecks-$VERSION.gem" > push.log 2>&1; then
              cat push.log
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat push.log
            if grep -qiE 'already exists|repushing of gem versions is not allowed' push.log; then
              echo "hecks $VERSION is already on rubygems.org; treating the push as done."
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if grep -qiE '401|403|unauthorized|forbidden|access denied|not authorized|invalid api key|scope' push.log; then
              echo "::warning::rubygems.org refused the RUBYGEMS_API_KEY; trying trusted publishing"
              exit 0
            fi
            [ "$attempt" = "4" ] && break
            echo "::warning::gem push attempt $attempt failed, retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::warning::gem push with the API key failed after retries; trying trusted publishing"

      # Pinned to the commit of v2.1.0, a full SHA because this job can push to the registry.
      - name: Configure RubyGems trusted publishing
        if: steps.state.outputs.gem == 'false' && steps.api_key_push.outputs.pushed != 'true'
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Push the gem with trusted publishing
        if: steps.state.outputs.gem == 'false' && steps.api_key_push.outputs.pushed != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for attempt in 1 2 3; do
            if gem push "hecks-$VERSION.gem" > push.log 2>&1; then
              cat push.log
              exit 0
            fi
            cat push.log
            if grep -qiE 'already exists|repushing of gem versions is not allowed' push.log; then
              echo "hecks $VERSION is already on rubygems.org; treating the push as done."
              exit 0
            fi
            [ "$attempt" = "3" ] && break
            sleep $((attempt * 15))
          done
          echo "::error::hecks $VERSION could not be pushed. Fix ONE of: (1) the repository secret RUBYGEMS_API_KEY, a key with the 'Push rubygem' scope that may push hecks; (2) a trusted publisher on rubygems.org > hecks > Trusted publishers > GitHub Actions: organization heckslabs, repository hecks, workflow release.yml. Then re-run: gh workflow run release.yml -f tag=v$VERSION (from main). No local publish is needed."
          exit 1

      - name: Remove the built gem
        if: always() && steps.state.outputs.gem == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: rm -f "hecks-$VERSION.gem" push.log

      # The registry lists a new version within moments; a push that was accepted but never
      # appears is a failure worth seeing, and nothing after this runs until the gem is visible.
      - name: The gem is listed
        if: steps.state.outputs.gem == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for _ in 1 2 3 4 5 6; do
            curl -sS https://rubygems.org/api/v1/versions/hecks.json -o gem.json
            if jq -e --arg v "$VERSION" 'any(.[]; .number == $v)' gem.json > /dev/null; then
              echo "hecks $VERSION is on rubygems.org."
              exit 0
            fi
            sleep 10
          done
          echo "::error::hecks $VERSION was pushed but rubygems.org does not list it yet; re-run the workflow (gh workflow run release.yml -f tag=v$VERSION), which skips what is done"
          exit 1

      - name: Start the npm publish
        if: steps.state.outputs.npm == 'false'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: gh workflow run publish-client.yml -f "tag=$TAG"

      - name: Create the GitHub Release
        if: steps.state.outputs.release == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ -z "$(tr -d '[:space:]' < "$RUNNER_TEMP/notes.md")" ]; then
            echo "::error::the CHANGELOG section for $VERSION is empty"
            exit 1
          fi
          gh release create "$TAG" --verify-tag --title "hecks $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --latest
