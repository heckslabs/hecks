name: CI checks (reusable)

# The checks_fuzz/checks_static/checks_codegen_drift jobs behind the
# "checks" required-status-check name, callable only from this repo's ci.yml.
#
# What each step runs lives in the `ci` stage of lib/hecks/gate/stages.yml: a step is
# `hecks gate_run.gate stage=ci only=<ids> --wait`. The jobs and steps stay separate, so each
# keeps its own log, its own attestation `if:` and its own runner; spec/gate_ci_stage_spec.rb
# holds this file to the stage, so a step names a check that exists and no check goes unrun.

# A called reusable workflow needs its secrets declared and passed
# explicitly (see ci.yml's call site); they don't flow in the way a
# composite action's do.
on:
  workflow_call:
    secrets:
      HECKS_CI_ATTEST_KEY:
        required: false
      HECKS_JOURNAL_DATABASE:
        required: false

jobs:
  # Same detector-plus-gated-job shape as ci-rspec.yml's own ci_attestation_rspec — see
  # ci-rust-parser.yml's identical addition for the full comment. One detector for the four
  # jobs below: none is independently required (they all feed the single `checks` name that
  # checks_static's own step-level attestation already partly covers), so one note entry
  # naming all four is enough. checks_codegen_drift regenerates code and diffs it against the
  # committed tree — deterministic given a fixed tree, so skipping it on a proven-unchanged
  # tree is exactly as safe as skipping a test job.
  ci_attestation_checks_heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      attested: ${{ steps.attest.outputs.attested }}

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/check-attestation
        id: attest
        with:
          checks: checks_fuzz,checks_fuzz_postgres,checks_fuzz_sqlite,checks_codegen_drift
          hmac-key: ${{ secrets.HECKS_CI_ATTEST_KEY }}

  # Replays random-but-valid command/query sequences from every example
  # domain's own IR, checking every declared property plus interpreter-crash
  # and determinism. hecks fuzz's own defaults (20 seeds, 30 steps) keep this
  # fast enough for every push while still exercising real depth.
  checks_fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: ci_attestation_checks_heavy
    if: always() && (needs.ci_attestation_checks_heavy.result != 'success' || needs.ci_attestation_checks_heavy.outputs.attested != 'true')

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ruby
      - uses: ./.github/actions/hecks-environment
        with:
          database: ${{ secrets.HECKS_JOURNAL_DATABASE }}

      - name: hecks fuzz
        run: bundle exec exe/hecks gate_run.gate stage=ci only=fuzz --wait

  # Runs the same corpus sweep through a real on-disk SQLite database instead
  # of the Memory adapter's hand-written Hash, so SqlQueryBuilder's
  # compilation and a real transaction are exercised too. Seeds are 1..N, so
  # the run is deterministic: a red here is a finding, not a flake.
  checks_fuzz_sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: ci_attestation_checks_heavy
    if: always() && (needs.ci_attestation_checks_heavy.result != 'success' || needs.ci_attestation_checks_heavy.outputs.attested != 'true')

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ruby
      - uses: ./.github/actions/hecks-environment
        with:
          database: ${{ secrets.HECKS_JOURNAL_DATABASE }}

      - name: hecks fuzz adapter=sqlite
        run: bundle exec exe/hecks gate_run.gate stage=ci only=fuzz_sqlite --wait

  # Runs the same sweep against real Postgres, reduced to 3 seeds of 20 steps
  # since every dispatch is a real round trip. Single worker only: every
  # ephemeral boot drops and recreates the same scratch schema in the shared
  # `hecks_fuzz` database, so a second process here would race the first
  # one's CREATE ROLE (see spec/support/fenced_owner.rb).
  checks_fuzz_postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: ci_attestation_checks_heavy
    if: always() && (needs.ci_attestation_checks_heavy.result != 'success' || needs.ci_attestation_checks_heavy.outputs.attested != 'true')

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ruby
      - uses: ./.github/actions/hecks-environment
        with:
          database: ${{ secrets.HECKS_JOURNAL_DATABASE }}
      - uses: ./.github/actions/postgres

      - name: hecks fuzz adapter=postgres
        run: bundle exec exe/hecks gate_run.gate stage=ci only=fuzz_postgres --wait

  checks_static:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # See `rspec` job's own comment in ci.yml — cache-warming push
    # doesn't need this job.

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ruby
      - uses: ./.github/actions/hecks-environment
        with:
          database: ${{ secrets.HECKS_JOURNAL_DATABASE }}

      # Only 4 of this job's 5 steps overlap .githooks/pre-push's own checks
      # (lint_deploy_recipes runs regardless); those 4 gain an `if:` against
      # this step's output. `continue-on-error: true` so a failure here can't
      # skip the real steps below — an empty `outputs.attested` is already
      # treated as "not attested, run it".
      - name: check attestation
        id: attest
        continue-on-error: true
        uses: ./.github/actions/check-attestation
        with:
          checks: model_check,engine_agreement,doc_coverage,rubocop
          hmac-key: ${{ secrets.HECKS_CI_ATTEST_KEY }}

      # Static analysis over the IR: unreachable lifecycle states, dead
      # transitions, saga states no handler chain reaches. Boots every corpus
      # member plus the language's own meta chapters.
      #
      # `hecks model_check` sweeps the corpus from the checkout it runs in when it is given no
      # domain, and exits 1 on any finding, so `--wait` only says so.
      - name: model check
        if: steps.attest.outputs.attested != 'true'
        run: bundle exec exe/hecks gate_run.gate stage=ci only=model_check --wait

      # For every comparator the grammar declares, checks both that
      # `QuerySpecification::Common::Comparison` has a shared `when` case for
      # it and that a cross-engine agreement spec exercises it. Reads only
      # already-committed Ruby source, so it belongs here rather than in
      # `rspec` or the cargo-heavy `checks_codegen_drift`.
      - name: engine agreement (query comparators)
        if: steps.attest.outputs.attested != 'true'
        run: bundle exec exe/hecks gate_run.gate stage=ci only=engine_agreement --wait

      # Lints a generated deploy Makefile's text for a command whose exit
      # status isn't checked, or real AWS/DB work with no echo/validation
      # telling the human running it what's about to happen. Generates 3
      # representative fixture domains itself; no real AWS or Postgres
      # touched, so this belongs here rather than in `rspec`.
      - name: lint generated deploy recipes
        run: bundle exec exe/hecks gate_run.gate stage=ci only=lint_deploy_recipes --wait

      # The comment linter as a gate (ADR 0069, widened by ADR 0075 ticket 01): checks every
      # comment under lib/hecks against docs/COMMENT_STYLE_GUIDE.md; the block-length cap
      # (long_block, now 12 lines) also runs over spec/ and examples/ — the same scope
      # .githooks/pre-push checks locally before a push.
      - name: comment style
        run: bundle exec exe/hecks gate_run.gate stage=ci only=comment_style,comment_blocks --wait

      # Also here, not only in .githooks/pre-push: the hook is opt-in per
      # clone and bypassable with `git push --no-verify`, so a branch that
      # never installed it can reach GitHub with this never having run.
      - name: doc coverage
        if: steps.attest.outputs.attested != 'true'
        run: bundle exec exe/hecks gate_run.gate stage=ci only=doc_coverage --wait

      # Also here, not only in .githooks/pre-push, for the same reason as
      # `doc coverage` above: the hook is opt-in and bypassable, so a branch
      # that skipped it could otherwise reach GitHub with no cop having run.
      - name: rubocop
        if: steps.attest.outputs.attested != 'true'
        run: bundle exec exe/hecks gate_run.gate stage=ci only=rubocop --wait

  checks_codegen_drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: ci_attestation_checks_heavy
    if: always() && (needs.ci_attestation_checks_heavy.result != 'success' || needs.ci_attestation_checks_heavy.outputs.attested != 'true')

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ruby
      - uses: ./.github/actions/hecks-environment
        with:
          database: ${{ secrets.HECKS_JOURNAL_DATABASE }}

      # `hecks project_rust` runs the hecks-codegen binary (ADR 0086), so the regeneration below
      # builds it; cached like every other job that builds that crate.
      - uses: ./.github/actions/cargo-cache
        with:
          name: codegen
          crate-root: rust/codegen

      # Regenerates every domain whose Bluebook source lives in this
      # checkout and fails on any diff from the committed rust/src/generated/
      # tree, so a Bluebook change with no matching regen is caught on the
      # push that caused it, not whenever someone next runs hecks ask rust_coverage
      # by hand. The domain list and order come from
      # `Hecks::Corpus.rust_regen_order` (every corpus directory that already
      # has committed generated output, sorted by full path) rather than a
      # hand-maintained list, so a new domain needs no edit here — see
      # hecks regenerate_corpus's own header for the ordering rule.
      - name: "rust codegen: regenerate every in-repo domain, fail on drift from the committed tree"
        run: bundle exec exe/hecks gate_run.gate stage=ci only=codegen_drift --wait

      # The reserved-name tables (RustReservedWord/CargoReservedName in
      # vocabulary.bluebook) are read by ModelCheck and DomainName through
      # lib/hecks/vocabulary.rb and by hecks-codegen/hecks-build through the
      # generated rust/codegen/src/reserved_names.rs and
      # rust/build/src/reserved_names.rs. Regenerate all three and refuse a
      # diff, so no generator can escape or refuse different words.
      - name: "vocabulary: regenerate reserved-name tables, fail on drift"
        run: bundle exec exe/hecks gate_run.gate stage=ci only=vocabulary_drift --wait

      # The path gates (the CiGate rows in vocabulary.bluebook) are written into marked regions of
      # ci.yml and ci-postgres-io-parallel.yml. Without --confirm the verb only compares, so a row
      # edited with no matching projection, or a region edited by hand, fails here.
      - name: "ci gates: project the CiGate rows into the workflows, fail on drift"
        run: bundle exec exe/hecks gate_run.gate stage=ci only=ci_gates --wait

      # The launcher forms of docs/tools.md are written from the RetiredScript rows in
      # vocabulary.bluebook and each command's own arguments. Without --confirm the verb only
      # compares, so a command whose arguments changed with no regenerated doc fails here.
      - name: "tools doc: project the RetiredScript rows into docs/tools.md, fail on drift"
        run: bundle exec exe/hecks gate_run.gate stage=ci only=tools_doc --wait

      # Checks whether hecks project_rust generated something for every
      # construct each domain's own IR declares, from the already-committed
      # manifest.json + ir.json — no build needed first (see
      # hecks ask rust_coverage's own header for how this differs from equivalence
      # checking). `hecks ask corpus_rust_coverage` walks every
      # rust/src/generated/ module; an entry on
      # `Hecks::Corpus::RUST_COVERAGE_PENDING` must still fail, so a fixed
      # gap breaks the build until its entry is deleted.
      #
      # `--wait` on a question makes it fail the job: a refused check exits 1, and so does a
      # report that names a gap.
      - name: "rust coverage: every generated module"
        run: bundle exec exe/hecks gate_run.gate stage=ci only=rust_coverage --wait

      # The same check against hecks-codegen's own manifest (ADR 0054a):
      # `--codegen=rust` regenerates each domain's manifest.json with
      # rust/codegen from the same committed ir.json into a scratch dir and
      # runs the identical analysis and allowlist.
      - uses: ./.github/actions/cargo-cache
        with:
          name: codegen
          crate-root: rust/codegen

      - name: "rust coverage (hecks-codegen): pizzas, governance, identity, banking, meta"
        run: bundle exec exe/hecks gate_run.gate stage=ci only=rust_coverage_codegen --wait

      # The other half of the kernel's own generated-code guarantee: a
      # capability whose enum variant compiles clean but has no
      # rust/src/kernel/<category>/<name>.rs file behind it at all — see
      # hecks measure_kernel_coverage's own header.
      - name: rust kernel coverage
        run: bundle exec exe/hecks gate_run.gate stage=ci only=kernel_coverage --wait

      # rust/src/kernel/vocab/*.rs (RefusalSite, QueryComparator, FieldHint,
      # AggregateStep, EntityStep) regenerated from vocabulary.bluebook.
      # Fails on any diff, and on any untracked file the projection emits.
      - name: "rust vocabulary: regenerate kernel vocab tables, fail on drift"
        run: bundle exec exe/hecks gate_run.gate stage=ci only=rust_vocabulary_drift --wait

      # doc coverage and rubocop run in checks_static, above — once per run,
      # not once per job.
