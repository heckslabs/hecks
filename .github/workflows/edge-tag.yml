name: Move the edge tag

# The `edge` tag always names the newest commit on main, so a project can follow main without a
# release being cut for every change:
#
#   gem "hecks", git: "https://github.com/heckslabs/hecks.git", tag: "edge"
#   deployed_to("AwsFargate") { hecks_release "edge" }   # each build re-fetches it
#
# It is not a release. It moves, nothing publishes from it (the publish workflows listen for `v*`),
# and a build from it should record the commit it got (`git rev-parse edge`). It only ever moves
# forward: a run for an older commit leaves it where it is.
#
# Re-run by hand with `gh workflow run edge-tag.yml`.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Runs queue behind each other, so the tag follows the order commits landed in.
concurrency:
  group: edge-tag
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  move_edge:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move edge forward to this commit
        run: |
          git fetch --force --tags origin
          if git rev-parse -q --verify refs/tags/edge > /dev/null \
              && ! git merge-base --is-ancestor refs/tags/edge "$GITHUB_SHA"; then
            echo "edge ($(git rev-parse --short refs/tags/edge)) is not behind ${GITHUB_SHA:0:7}; leaving it."
            exit 0
          fi
          git tag --force edge "$GITHUB_SHA"
          git push --force origin refs/tags/edge
          echo "edge is at ${GITHUB_SHA:0:7}"
