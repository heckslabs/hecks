name: Publish host-arm64

# Generated by hecks project_lanes from the PrebuiltBinary rows of the Vocabulary chapter. Do not hand-edit.
#
# Builds bootstrap from rust/host for aarch64-unknown-linux-gnu and publishes it as the release
# host-arm64-<key>, where the key is a hash of the crate's build inputs. A client that needs the same
# bytes downloads it instead of compiling (Hecks::RustBuild::PrebuiltBinary); a key that already has a
# release is left alone, so a push that changed nothing the build reads publishes nothing.
on:
  push:
    branches: [main]
    paths:
      - "rust/host/**"
      - ".github/workflows/publish-host-arm64.yml"
      - "lib/hecks/rust_build/prebuilt_binary.rb"
  workflow_dispatch: {}

concurrency:
  group: publish-host-arm64
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ruby
      - name: Name the release
        id: key
        run: |
          key=$(bundle exec ruby -Ilib -rhecks/rust_build/prebuilt_binary -e \
            'puts Hecks::RustBuild::PrebuiltBinary.key(ARGV.fetch(0))' rust/host)
          tag=host-arm64-$key
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build bootstrap
        if: steps.key.outputs.exists != 'true'
        working-directory: rust/host
        run: |
          rustup toolchain install stable --profile minimal
          rustup run stable cargo build --release --target aarch64-unknown-linux-gnu --bin bootstrap
      - name: Publish the release
        if: steps.key.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.key.outputs.tag }}
        run: |
          mkdir out
          cp rust/host/target/aarch64-unknown-linux-gnu/release/bootstrap out/bootstrap-aarch64-unknown-linux-gnu
          (cd out && sha256sum bootstrap-aarch64-unknown-linux-gnu > bootstrap-aarch64-unknown-linux-gnu.sha256)
          gh release create "$TAG" out/bootstrap-aarch64-unknown-linux-gnu out/bootstrap-aarch64-unknown-linux-gnu.sha256 --prerelease --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "bootstrap for aarch64-unknown-linux-gnu, built from rust/host at $GITHUB_SHA."
