name: Cache warm (main)

# Populates the refs/heads/main Rust build caches, which ci.yml never writes (no push trigger).
# Build only. Cache path/key/restore-keys match ci.yml verbatim so PRs restore these entries.
# Runs on the push itself, not after CI: a red main must not skip the warm.
# Only the newest main is worth warming, so a newer push cancels an in-flight warm.
on:
  push:
    branches: [main]

concurrency:
  group: cache-warm
  cancel-in-progress: true

jobs:
  # Mirrors rspec_rust_io's main-crate cache. Builds every feature combo the conformance
  # helpers use, plus the wasm32-wasip1 artifacts rspec_rust_io_build/deploy need.
  warm_main_crate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-ruby

      - uses: ./.github/actions/hecks-environment
        with:
          database: ${{ secrets.HECKS_JOURNAL_DATABASE }}

      - uses: ./.github/actions/cargo-cache
        with:
          name: main
          crate-root: rust

      - name: Warm native builds (banking, pizzas, roster)
        run: |
          cd rust
          cargo build --no-default-features --features banking
          cargo build --no-default-features --features pizzas
          cargo build --no-default-features --features roster

      - uses: ./.github/actions/wasm-toolchain

      - name: Warm wasm cross-compile builds (banking, pizzas, roster)
        run: |
          bundle exec exe/hecks build.build_wasm domain=examples/banking --wait
          bundle exec exe/hecks build.build_wasm domain=examples/pizzas --wait
          bundle exec exe/hecks build.build_wasm domain=examples/roster --wait

  # Mirrors rspec_rust_io_build's cache step.
  warm_build_crate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/cargo-cache
        with:
          name: build
          crate-root: rust/build
          include-registry: "false"

      - name: Warm rust/build (hecks-build)
        run: cd rust/build && cargo build

  # Mirrors rspec_rust_parser's cache step; bare `cargo build` is what the parity specs run.
  warm_parser_crate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/cargo-cache
        with:
          name: parser
          crate-root: rust/parser

      - name: Warm rust/parser (hecks-parse)
        run: cd rust/parser && cargo build

  # Mirrors rspec_rust_codegen's cache step; bare `cargo build` is what the parity specs run.
  warm_codegen_crate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/cargo-cache
        with:
          name: codegen
          crate-root: rust/codegen

      - name: Warm rust/codegen (hecks-codegen)
        run: cd rust/codegen && cargo build

  # Mirrors rspec_rust_parser's lsp cache step.
  warm_lsp_crate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/cargo-cache
        with:
          name: lsp
          crate-root: rust/lsp

      - name: Warm rust/lsp (hecks_lsp)
        run: cd rust/lsp && cargo build

  # Mirrors rspec_rust_host's cache step; builds the two binaries the lineage conformance
  # spec needs.
  warm_host_crate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/cargo-cache
        with:
          name: host
          crate-root: rust/host

      # `cargo test` enables the dev-dependencies' features, so it builds a different dependency
      # set than `cargo build`; warm both or every PR recompiles tokio and wasmtime.
      - name: Warm rust/host (both harness binaries and the test build)
        run: |
          cd rust/host
          cargo build --bin lineage_harness
          cargo build --bin mint_harness
          cargo test --no-run
