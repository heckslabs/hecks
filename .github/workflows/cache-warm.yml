name: Cache warm (main)

# WHY THIS FILE EXISTS — ci.yml deliberately has no `push: branches:
# [main]` trigger (see its own header comment): re-running the whole
# suite on every merge was found to buy nothing once the merge-queue
# ruleset (`merge_group`) already tests everything before the merge
# actually lands. That's the right call for the SUITE, but it has a
# real side effect nobody had checked until now: main's own ref never
# runs ci.yml at all, so none of its Rust build caches (rust/target,
# rust/build/target, rust/parser/target, rust/codegen/target,
# rust/host/target) ever get a refs/heads/main-scoped cache entry.
#
# Confirmed empirically (`gh api repos/heckslabs/hecks/actions/caches`,
# 2026-09-09) — every existing cache entry for these crates is scoped
# to either `refs/pull/<N>/merge` (warm only across pushes to THAT one
# open PR) or a one-shot `refs/heads/gh-readonly-queue/main/pr-<N>-
# <sha>` (embeds the SHA, never revisited again even by the very next
# PR) — never `refs/heads/main`. GitHub's cross-branch cache fallback
# only reaches a branch's own history or the DEFAULT branch's cache,
# never a sibling PR's, so every brand-new PR's first CI run pays a
# full cold build of every one of these crates, always — not an
# artifact of any one session's branch history, a structural gap.
#
# This workflow's only job is to exist on main's own ref (the one place
# ci.yml's own trigger set deliberately excludes) and populate that
# missing refs/heads/main scope. BUILD ONLY — no rspec, no full suite,
# so it stays cheap and doesn't reopen the "duplicate full CI run on
# every merge" question ci.yml's own header already settled. Each
# job's cache path/key/restore-keys below is copy-pasted VERBATIM from
# ci.yml's own equivalent step — deliberately, so the exact-hash key
# ci.yml computes matches this workflow's saved entry byte-for-byte,
# and the restore-keys PREFIX fallback ci.yml already has configured
# on every one of these steps picks this up automatically the moment a
# PR's own exact-hash key misses (a Cargo.lock bump between here and
# there is the only thing that would still force a cold build; that's
# a real, tolerable gap the restore-keys prefix cannot close, only the
# exact key can, once THIS workflow runs again after that bump lands).
# TRIGGER CHANGED FROM `push: branches: [main]` TO `workflow_run` —
# Phase 1 of the CI speed effort. The old trigger fired at the exact
# moment `push` also fired on ci.yml's own cache-warming job (see that
# file's top-of-file comment), meaning this workflow's 5 cargo builds and
# the NEXT merge_group run (queued right behind the push that triggered
# both) started competing for the org's 20-concurrent-runner ceiling at
# the same instant. `workflow_run` instead waits for the named upstream
# workflow to actually FINISH on `main`, so these 5 jobs start into
# whatever runner capacity is free once CI's own push-triggered job is
# already done, not fighting it for the same slots. `types: [completed]`
# plus the `if:` below (checked per-job, since `workflow_run` itself has
# no job-level trigger filter) makes sure a failed CI run on main — which
# should not happen given the merge queue, but "should not happen" is not
# the same guarantee as "cannot" — doesn't still warm caches for it.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  # Mirrors rspec_rust_io's own "Cache Rust build artifacts (main
  # crate)" step. Builds all three domain features that spec/
  # rust_conformance_spec.rb's shared RustConformanceHelpers cache
  # actually exercises (banking/pizzas/roster) — a bare `cargo build`
  # here would only warm ONE feature combo (whatever `default` in
  # rust/Cargo.toml happens to be), leaving the other two still cold.
  # Also warms the wasm32-wasip1 cross-compile artifacts (under the
  # same rust/target path) that rspec_rust_io_build/rspec_rust_io_deploy
  # need — bin/project_wasm handles the toolchain/target selection
  # itself (see rspec_rust_io_deploy's own comment on why TWO
  # toolchains need the target installed).
  warm_main_crate:
    runs-on: ubuntu-latest

    # `workflow_run` fires on ANY conclusion (success, failure, or
    # cancellation) of the named upstream workflow — this guard is what
    # actually limits warming to a main that stayed green. Checked
    # per-job (`workflow_run` has no job-level trigger filter of its own)
    # and repeated identically on every job below.
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      # `ref:` PINNED TO THE RUN THAT TRIGGERED THIS, NOT WHATEVER
      # `main` HAPPENS TO POINT AT BY THE TIME THIS JOB STARTS —
      # `actions/checkout@v4` under a `workflow_run` event defaults to
      # the workflow FILE's own ref (the default branch's current tip),
      # which a second push landing between CI finishing and this job
      # starting would silently swap out from under it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: ./.github/actions/setup-ruby

      - uses: ./.github/actions/cargo-cache
        with:
          name: main
          path: rust/target

      - name: Warm native builds (banking, pizzas, roster)
        run: |
          cd rust
          cargo build --no-default-features --features banking
          cargo build --no-default-features --features pizzas
          cargo build --no-default-features --features roster

      - uses: ./.github/actions/wasm-toolchain

      - name: Warm wasm cross-compile builds (banking, pizzas, roster)
        run: |
          ruby bin/project_wasm examples/banking
          ruby bin/project_wasm examples/pizzas
          ruby bin/project_wasm examples/roster

  # Mirrors rspec_rust_io_build's own "Cache Rust build artifacts (build
  # crate)" step exactly.
  warm_build_crate:
    runs-on: ubuntu-latest

    if: github.event.workflow_run.conclusion == 'success'

    steps:
      # `ref:` PINNED TO THE RUN THAT TRIGGERED THIS, NOT WHATEVER
      # `main` HAPPENS TO POINT AT BY THE TIME THIS JOB STARTS —
      # `actions/checkout@v4` under a `workflow_run` event defaults to
      # the workflow FILE's own ref (the default branch's current tip),
      # which a second push landing between CI finishing and this job
      # starting would silently swap out from under it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: ./.github/actions/cargo-cache
        with:
          name: build
          path: rust/build/target
          include-registry: "false"

      - name: Warm rust/build (hecks-build)
        run: cd rust/build && cargo build

  # Mirrors rspec_rust_parser's own cache step. Bare `cargo build` —
  # the exact command spec/parser_parity_spec.rb's own build_parser!
  # (and every sibling spec's copy of it) runs.
  warm_parser_crate:
    runs-on: ubuntu-latest

    if: github.event.workflow_run.conclusion == 'success'

    steps:
      # `ref:` PINNED TO THE RUN THAT TRIGGERED THIS, NOT WHATEVER
      # `main` HAPPENS TO POINT AT BY THE TIME THIS JOB STARTS —
      # `actions/checkout@v4` under a `workflow_run` event defaults to
      # the workflow FILE's own ref (the default branch's current tip),
      # which a second push landing between CI finishing and this job
      # starting would silently swap out from under it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: ./.github/actions/cargo-cache
        with:
          name: parser
          path: rust/parser/target

      - name: Warm rust/parser (hecks-parse)
        run: cd rust/parser && cargo build

  # Mirrors rspec_rust_codegen's own cache step. Bare `cargo build` —
  # the exact command spec/codegen_parity_spec.rb's build_codegen! runs.
  warm_codegen_crate:
    runs-on: ubuntu-latest

    if: github.event.workflow_run.conclusion == 'success'

    steps:
      # `ref:` PINNED TO THE RUN THAT TRIGGERED THIS, NOT WHATEVER
      # `main` HAPPENS TO POINT AT BY THE TIME THIS JOB STARTS —
      # `actions/checkout@v4` under a `workflow_run` event defaults to
      # the workflow FILE's own ref (the default branch's current tip),
      # which a second push landing between CI finishing and this job
      # starting would silently swap out from under it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: ./.github/actions/cargo-cache
        with:
          name: codegen
          path: rust/codegen/target

      - name: Warm rust/codegen (hecks-codegen)
        run: cd rust/codegen && cargo build

  # Mirrors rspec_rust_host's own cache step. Builds both binaries
  # spec/rust_host_lineage_conformance_spec.rb needs — the exact
  # `cargo build --bin <name>` commands its own lineage_harness_binary/
  # mint_harness_binary helpers run. No `rustup run 1.98.0` prefix
  # needed here the way a local machine with an earlier Homebrew rustc
  # on PATH sometimes does (see rust-toolchain.toml's own comment) —
  # ubuntu-latest's ambient rustc already resolves through rustup's own
  # proxy binaries, the same as every other job in ci.yml that builds
  # under rust/host already relies on without an explicit override.
  warm_host_crate:
    runs-on: ubuntu-latest

    if: github.event.workflow_run.conclusion == 'success'

    steps:
      # `ref:` PINNED TO THE RUN THAT TRIGGERED THIS, NOT WHATEVER
      # `main` HAPPENS TO POINT AT BY THE TIME THIS JOB STARTS —
      # `actions/checkout@v4` under a `workflow_run` event defaults to
      # the workflow FILE's own ref (the default branch's current tip),
      # which a second push landing between CI finishing and this job
      # starting would silently swap out from under it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: ./.github/actions/cargo-cache
        with:
          name: host
          path: rust/host/target

      - name: Warm rust/host (both harness binaries)
        run: |
          cd rust/host
          cargo build --bin lineage_harness
          cargo build --bin mint_harness
