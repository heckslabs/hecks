name: CI postgres io (reusable)

# Group 2 (part 2 of 3) of the ci.yml split: the single `rspec_postgres_io` job. ci.yml wraps
# it in a same-named job, since that name is the required-check string.

on:
  workflow_call:
    secrets:
      HECKS_CI_ATTEST_KEY:
        required: false

jobs:
  # Same detector-plus-gated-job shape as ci-rspec.yml's own ci_attestation_rspec — see
  # ci-rust-parser.yml's identical addition for the full comment.
  ci_attestation_postgres_io:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      attested: ${{ steps.attest.outputs.attested }}

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/check-attestation
        id: attest
        with:
          checks: rspec_postgres_io
          hmac-key: ${{ secrets.HECKS_CI_ATTEST_KEY }}

  rspec_postgres_io:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: ci_attestation_postgres_io
    # Push runs only warm caches; this job keeps none.
    if: always() && (needs.ci_attestation_postgres_io.result != 'success' || needs.ci_attestation_postgres_io.outputs.attested != 'true')

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ruby

      # rust/src/generated is not committed (pizzas aside); restore or regenerate it before rust/src is used.
      - uses: ./.github/actions/generated-rust

      # Preinstalled and tuned Postgres, not a `services:` container. Its trust rule for
      # 127.0.0.1/::1 covers the passwordless roles spec/adapters/driven/postgres/lineage_spec.rb
      # creates at runtime.
      - uses: ./.github/actions/postgres

      # examples/pizzas/bluebook/pizzas.world wires at this database by name and nothing
      # creates it on demand, so a fresh Postgres needs it provisioned up front.
      - name: Create the pizzas example's database
        run: createdb -h localhost -U postgres hecks_pizzas

      # Six `io: true` files share this one database (dsl, guides, domain_refusal, diagrams,
      # storehouse, oidc_manifest); the last three reach it indirectly by booting
      # examples/pizzas. Serial on purpose: nothing verified them safe under a second worker
      # against the same pre-seeded database.
      - name: "rspec: shared hecks_pizzas database (serial — genuinely shared state)"
        run: |
          bundle exec rspec --tag io --tag ~fuzzing \
            spec/dsl_spec.rb spec/guides_spec.rb spec/runtime/domain_refusal_spec.rb \
            spec/diagrams_spec.rb spec/storehouse_spec.rb spec/oidc_manifest_spec.rb
