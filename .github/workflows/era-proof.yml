name: Era proof

# Polls each bluebook's boot status before a deploy can gate on it: the `era_proof` gate check
# (Vocabulary GateCheck, stage `era_proof`) runs `era.boot_status` once against the committed ledger
# and requires every bluebook to be current, or behind by an implicit move the ledger records. It
# reads no database and mints nothing. It runs only when asked, by hand or from another workflow;
# nothing pushes or opens a pull request into it.

on:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  era_proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ruby
        with:
          rust-toolchain: "false"
      # Selects Memory for the hecks commands: the status is read from the ledger, never a journal.
      - uses: ./.github/actions/hecks-environment

      - name: Poll the boot status and require current or a recorded implicit move
        run: bundle exec exe/hecks gate_run.gate! stage=era_proof --wait
