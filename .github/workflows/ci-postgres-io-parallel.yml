name: CI postgres io parallel (reusable)

# Group 2 (part 3 of 3) of the ci.yml split: the skip-gate detector and the 8-way shard
# matrix behind the `rspec_postgres_io_parallel` required check.

on:
  workflow_call:
    secrets:
      HECKS_CI_ATTEST_KEY:
        required: false

# The spec files this workflow never runs — the Rust-building and shared-
# hecks_pizzas files other jobs own. One copy, read by the shards' committed
# file list check and by bin/rspec_io_parallel_files --write.
env:
  IO_PARALLEL_EXCLUDE_PATTERN: '(/|^)(project_rust_pipeline_spec|parser_parity_spec|grammar_corpus_spec|project_deploy_parity_gate_spec|hecks_build_pipeline_spec|rust_conformance_spec|rust_conformance_fuzz_spec|semantics_corpus_spec|codegen_parity_spec|codegen_manifest_parity_spec|rust_numeric_coercion_spec|rust_host_lineage_conformance_spec|parser_coverage_spec|domain_feature_exclusivity_spec|naming_landmines_spec|dsl_spec|guides_spec|domain_refusal_spec|diagrams_spec|storehouse_spec|oidc_manifest_spec)\.rb$'

jobs:
  # Skip gate for the shard job. A job-level `if:` is the only way to skip Postgres
  # provisioning too, not just the rspec step. Runs on every trigger, push included; with
  # every leg skipped the workflow still concludes `success` for the ci.yml aggregator.
  #
  # The skip list is exclude-shaped: specs `require "hecks"`, shell out to bin/, build the
  # shared rust/ crate and read examples/ and qa/, so those, Gemfile*, hecks.gemspec and
  # .rspec stay in scope. Skippable: docs, editors, release, deploy, .claude, .githooks,
  # local-dev files and rubocop config. `.github/**` is not skippable: a workflow change
  # is real doubt, so run it.
  postgres_io_relevant_changed:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      touched: ${{ steps.diff.outputs.touched }}

    env:
      # Anything not matching these prefixes/files is treated as possibly relevant (fails
      # toward running). The skipped rust/ crates are tested by their own jobs.
      POSTGRES_IO_SAFE_TO_SKIP_PATTERN: '^(docs/|editors/|release/|deploy/|\.claude/|\.githooks/|rust/(parser|codegen|host|build|lsp|web|tests|project)/|rust/project\.rb$|rust/project_rust_pipeline\.rb$|\.rubocop\.yml$|\.rubocop_todo\.yml$|\.mcp\.json$|\.rspec-local\.example$|README\.md$|CHANGELOG\.md$|CONTRIBUTING\.md$|SECURITY\.md$|LICENSE$|\.gitignore$)'

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the `git diff` needs both endpoints as real objects.
          fetch-depth: 0

      # BASE is the pull_request base, else the merge_group's; `push` falls back to
      # github.event.before. Every branch that cannot confirm a safe diff sets touched=true,
      # so a failure here runs the shards rather than skipping them.
      - name: does this change touch anything rspec_postgres_io_parallel covers?
        id: diff
        run: |
          # A MERGE GROUP DIFFS AGAINST THE TARGET BRANCH, NEVER AGAINST
          # `merge_group.base_sha` — that is the previous queue entry, and
          # the queue merges a whole group on its last entry's run alone
          # (see `runtime_changed` in ci.yml for the 2026-09-18 incident).
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            BASE_REF="${{ github.event.merge_group.base_ref }}"
            BASE="$(git merge-base "origin/${BASE_REF#refs/heads/}" "${{ github.sha }}")" || BASE=""
          fi
          if [ -z "$BASE" ] && [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no usable BASE to diff against — running rspec_postgres_io_parallel rather than guessing" >&2
            echo "touched=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BASE" "${{ github.sha }}")" || {
            echo "git diff itself failed — running rspec_postgres_io_parallel rather than guessing" >&2
            echo "touched=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ -z "$CHANGED" ]; then
            echo "touched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$CHANGED" | grep -vE "$POSTGRES_IO_SAFE_TO_SKIP_PATTERN" | grep -q .; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi

  # Same detector-plus-gated-job shape as ci-rspec.yml's own ci_attestation_rspec — see
  # ci-rust-parser.yml's identical addition for the full comment. Layers on top of, not in
  # place of, postgres_io_relevant_changed's own path gate: the shard job below skips when
  # EITHER says it can — the path is unrelated to this file's tree hash, and vice versa.
  ci_attestation_postgres_io_parallel:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: github.event_name != 'push'

    outputs:
      attested: ${{ steps.attest.outputs.attested }}

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/check-attestation
        id: attest
        with:
          checks: rspec_postgres_io_parallel
          hmac-key: ${{ secrets.HECKS_CI_ATTEST_KEY }}

  # Proves the shards' committed file list is current with one dry run per CI run. A spec
  # gaining its first `:io` example without a list refresh fails here, by name.
  postgres_io_file_list:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs: postgres_io_relevant_changed
    if: github.event_name != 'push' && needs.postgres_io_relevant_changed.outputs.touched == 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ruby

      - name: .github/postgres_io_spec_files.txt matches a real --tag io dry run
        run: bin/rspec_io_parallel_files --check .github/postgres_io_spec_files.txt "$IO_PARALLEL_EXCLUDE_PATTERN" -- --tag io --tag ~fuzzing

  # Matrix of 8 one-process legs; ci.yml's `rspec_postgres_io_parallel` aggregator owns the
  # required check name, since matrix legs report as `<job id> (<value>)`.
  #
  # Every leg computes the identical 8-way split (`-n 8`, same committed baseline) and
  # `--only-group` selects its own slice, so balancing stays parallel_tests' own.
  #
  # One process per leg is load-bearing: bin/qa_postgres_role creates the cluster-global
  # role `hecks_qa` check-then-create, and two qa_sweep_all specs provisioning at once
  # collided on `pg_authid_rolname_index`.
  #
  # `--only-group` requires `--group-by runtime`; `--allowed-missing 100` keeps a cold
  # baseline from raising RuntimeLogTooSmallError (unknown files get the average).
  rspec_postgres_io_parallel_shard:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    needs: [postgres_io_relevant_changed, ci_attestation_postgres_io_parallel]

    # Same skip gate as the detector, plus attestation: skip when the path gate says nothing
    # relevant changed, OR the tree was already proven. Not on `push`: that run only fed a
    # runtime-log cache the committed baseline replaced; cache-warm.yml warms the caches that
    # need main's scope.
    if: >-
      always() && github.event_name != 'push' && needs.postgres_io_relevant_changed.outputs.touched == 'true' &&
      (needs.ci_attestation_postgres_io_parallel.result != 'success' || needs.ci_attestation_postgres_io_parallel.outputs.attested != 'true')

    strategy:
      # A regression in one shard should not cancel the others.
      fail-fast: false
      matrix:
        # Must match the `-n 8` below: both are the group count, and `--only-group` is
        # 1-indexed against it. The slowest single file (~146s) is the floor on shard time.
        group: [1, 2, 3, 4, 5, 6, 7, 8]

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ruby

      # Preinstalled and tuned Postgres, not a `services:` container; each leg is its own runner.
      - uses: ./.github/actions/postgres

      # Also needed here: spec/load_hygiene_spec.rb reaches this database through a subprocess
      # booting examples/pizzas/bluebook/pizzas.world, never naming "hecks_pizzas" itself.
      # Creating it unconditionally closes the whole class of indirect references.
      - name: Create the pizzas example's database
        run: createdb -h localhost -U postgres hecks_pizzas

      # The committed baseline is the only grouping input: every leg must compute the split
      # from byte-identical inputs or it is not a partition (a restored per-run cache differed
      # across legs). Built by `bin/refresh_rspec_runtime_baseline --from-run <run-id>`.
      # The file list is committed too; `postgres_io_file_list` proves it matches a dry run.
      - name: "rspec: postgres + deploy/tenant I/O (this shard's own group only — see job header comment on --only-group)"
        run: |
          mkdir -p tmp
          IO_FILES=()
          while IFS= read -r line; do IO_FILES+=("$line"); done < .github/postgres_io_spec_files.txt
          bundle exec parallel_rspec "${IO_FILES[@]}" \
            -n 8 --group-by runtime --allowed-missing 100 --only-group ${{ matrix.group }} \
            --runtime-log .github/postgres_io_runtime_baseline.log \
            -o "--tag io --tag ~fuzzing --format documentation --profile 15 --format ParallelTests::RSpec::RuntimeLogger --out tmp/parallel_runtime_rspec.group${{ matrix.group }}.log"

      # Uploaded, never restored: bin/refresh_rspec_runtime_baseline --from-run needs all eight
      # legs' logs from one run. Grouping never reads it.
      - name: Upload this group's runtime log (for bin/refresh_rspec_runtime_baseline --from-run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-io-runtime-group-${{ matrix.group }}
          path: tmp/parallel_runtime_rspec.group${{ matrix.group }}.log
          retention-days: 14
          if-no-files-found: ignore
