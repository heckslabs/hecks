<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Planning</title>
<!--style--><style>
/* The Planning page: the work as the Tickets store holds it, drawn by the server and pushed from the journal.
   One colour language runs through it: a cell is one Work item, coloured by the lane it sits in. */
[hidden] { display: none !important; }
h1, h2, h3, p, ul { margin: 0; }
:focus-visible { outline: 2px solid var(--run); outline-offset: 2px; border-radius: 4px; }

header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; margin-bottom: 18px; }
.note, .counts, .facts, .area { color: var(--ink2); font-size: 12px; }

/* A cell is one Work item. The same six colours fill the bar, the key, the tracks and the rows. */
.cell { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 2.5px; }
.c-done { background: var(--done); }
.c-running { background: var(--run); }
.c-now { background: var(--ink); }
.c-next { background: color-mix(in srgb, var(--ink) 52%, transparent); }
.c-later { background: color-mix(in srgb, var(--ink) 24%, transparent); }
.c-unset { background: color-mix(in srgb, var(--ink) 7%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 22%, transparent); }
@media (prefers-reduced-motion: no-preference) {
  .cell.c-running { animation: running 1.6s ease-in-out infinite; }
  @keyframes running { 50% { opacity: .35; } }
}

.overview { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px 0; }
.headline { font-size: clamp(22px, 3.2vw, 32px); line-height: 1.15; letter-spacing: -.015em; font-weight: 400; text-wrap: balance; }
.headline b { font-weight: 650; }
.sofar { display: inline-block; margin-left: 14px; font-size: 14px; letter-spacing: 0; color: var(--done); font-weight: 600; }
.bar { display: flex; gap: 2px; height: 14px; margin-top: 18px; }
.bar i { min-width: 3px; border-radius: 3px; }
.key { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 10px; font-size: 12.5px; color: var(--ink2); }
.key li { display: flex; align-items: center; gap: 7px; }
.strip4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 20px -24px 0; border-top: 1px solid var(--line); }
.card4 { padding: 14px 24px 16px; border-left: 1px solid var(--line); min-width: 0; }
.card4:first-child { border-left: 0; }
.card4 h3 { font-size: 13px; font-weight: 600; }
.card4 ul { list-style: none; padding: 0; margin-top: 4px; font-size: 13px; color: var(--ink2); overflow-wrap: anywhere; }
.card4 li + li { margin-top: 2px; }
.card4.you { background: var(--you-wash); } .card4.you h3 { color: var(--you); }
.card4.you:last-child { border-bottom-right-radius: 13px; }

/* Planned and closed each day: a pair of bars a day. A plan that takes in more than it closes is said in amber. */
.flow { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 24px 16px; margin-top: 12px; }
.flow h3 { font-size: 14px; font-weight: 650; }
.flowline { color: var(--ink2); font-size: 13.5px; margin-top: 4px; } .flowline b { color: var(--ink); font-weight: 650; }
.flowline .grows { color: var(--you); font-weight: 600; } .flowline .shrinks { color: var(--done); font-weight: 600; }
.flowbars { display: flex; gap: 10px; height: 150px; margin-top: 14px; }
.fday { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; }
.fday .pair { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 3px; border-bottom: 1px solid var(--line); }
.fday .col { flex: 1; max-width: 26px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; }
.fday .col em { font-style: normal; font-size: 10.5px; color: var(--ink2); text-align: center; line-height: 1.5; }
.fday .col i { display: block; min-height: 0; } .fday .col i:first-of-type { border-radius: 3px 3px 0 0; }
.fday > span { font-size: 10.5px; color: var(--muted); margin-top: 4px; white-space: nowrap; }
.fday.today > span { color: var(--ink); font-weight: 600; } .fday.today .col { opacity: .6; }
.flow .planned { background: color-mix(in srgb, var(--ink) 52%, transparent); } .flow .finished { background: var(--done); }
.flow .dropped { background: color-mix(in srgb, var(--ink) 20%, transparent); }
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 22px 0 4px; font-size: 13px; color: var(--ink2); }
.filters input, .filters select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.filters input { flex: 1 1 260px; max-width: 380px; }
.filters select { max-width: 220px; }
.filters .note { margin-left: auto; }

.lane { margin-top: 26px; border-radius: 14px; outline: 2px dashed transparent; outline-offset: 8px; }
.lane.over { outline-color: var(--run); }
/* Changing the plan: a tick box on each open item, a bar of drop zones while something is carried, and a bar for what is picked. */
.filters button, .mover button { font: inherit; font-size: 13px; padding: 5px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); cursor: pointer; }
.filters button:hover, .mover button:hover { border-color: var(--run); }
.item[draggable=true], .epic summary[draggable=true] { cursor: grab; } .item.picked { background: var(--signal-soft); }
.item input.pick { align-self: center; margin: 0 2px 0 0; cursor: pointer; }
.dropbar, .mover { position: fixed; left: 50%; transform: translateX(-50%); z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px 14px; max-width: calc(100vw - 24px);
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 30px color-mix(in srgb, var(--ink) 18%, transparent); font-size: 13px; color: var(--ink2); }
.dropbar { top: 56px; } .mover { bottom: 16px; }
.dropbar[hidden], .mover[hidden] { display: none; }
.dropbar .zone { padding: 12px 26px; border: 2px dashed var(--line); border-radius: 10px; color: var(--ink); font-weight: 600; }
.dropbar .zone.over { border-color: var(--run); background: var(--signal-soft); }
.mover b { color: var(--ink); }
.mover select { font: inherit; max-width: 260px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.mover .said.bad { color: var(--critical); } .mover .said:empty { display: none; }
.lane h2 { display: flex; align-items: baseline; gap: 10px; font-size: 16px; font-weight: 650; letter-spacing: -.005em; margin: 0 4px 8px; }
.lane h2 .counts { font-weight: 400; }
.epic { background: var(--surface); border: 1px solid var(--line); border-top-width: 0; }
.epic:first-of-type { border-top-width: 1px; border-radius: 12px 12px 0 0; }
.epic:last-of-type { border-radius: 0 0 12px 12px; }
.epic:first-of-type:last-of-type { border-radius: 12px; }
.epic summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 4fr) minmax(96px, max-content); gap: 6px 22px;
  align-items: center; padding: 11px 16px 11px 34px; position: relative; }
.epic summary::-webkit-details-marker { display: none; }
.epic summary::before { content: ""; position: absolute; left: 15px; top: 18px; width: 6px; height: 6px; border-right: 1.5px solid var(--muted);
  border-bottom: 1.5px solid var(--muted); transform: rotate(-45deg); transition: transform .12s; }
.epic[open] > summary::before { transform: rotate(45deg); top: 16px; }
.epic summary:hover { background: color-mix(in srgb, var(--ink) 3%, transparent); }
.name { min-width: 0; } .name b { display: block; font-weight: 600; }
.outcome { display: block; color: var(--ink2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.epic[open] .outcome { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; line-clamp: 4; overflow: hidden; }
.track { display: flex; flex-wrap: wrap; gap: 3px; }
.epic summary .counts { text-align: right; white-space: nowrap; }
.next { margin: 0 16px 6px 34px; font-size: 12.5px; color: var(--ink2); }
.items { margin: 0 16px 12px 34px; border-top: 1px solid var(--line); }
.item { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; overflow-wrap: anywhere; }
.item:last-child { border-bottom: 0; }
.item > .cell { align-self: center; }
/* The work of an epic that is over, under what is left of it. */
.items.over { border-top: 0; margin-top: -4px; } .over-head { font-size: 12px; color: var(--ink2); padding: 8px 0 4px; margin: 0; border-bottom: 1px solid var(--line); }
.item.closed .what { color: var(--ink2); } .item.closed[data-status=dropped] .what { text-decoration: line-through; text-decoration-color: var(--muted); }
.c-dropped { background: var(--muted); } .chip.k-done { color: var(--done); border-color: currentColor; }
.what { flex: 1 1 340px; min-width: 0; }
.what code { font: 11.5px var(--mono); color: var(--muted); margin-left: 4px; }
.chip { font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 0 8px; line-height: 1.7; border: 1px solid var(--line); color: var(--ink2); white-space: nowrap; }
.pri { width: 34px; text-align: right; font-size: 12px; color: var(--ink2); }
.chip.k-started { background: var(--run); color: #fff; border-color: transparent; }
.chip.k-yielded { color: var(--you); border-color: currentColor; }
.area { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.review { flex-basis: 100%; margin-left: 20px; }
.review summary { display: block; padding: 0; cursor: pointer; font-size: 12px; color: var(--ink2); text-decoration: underline dotted; }
.review summary::before { content: none; }
.review pre { white-space: pre-wrap; background: var(--page); border-radius: 8px; padding: 8px 10px; font: 12px/1.5 var(--mono); margin: 6px 0; max-width: 78ch; }
.unknown-note { color: var(--you); }
.empty { margin-top: 26px; color: var(--ink2); }

@media (max-width: 760px) {
  .strip4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card4:nth-child(3) { border-left: 0; } .card4:nth-child(n+3) { border-top: 1px solid var(--line); }
  .epic summary { grid-template-columns: minmax(0, 1fr) auto; }
  .track { grid-column: 1 / -1; grid-row: 2; }
  .sofar { display: block; margin: 6px 0 0; }
}
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>Plan</h1>
    <!--nav-->
    <span class="note" id="live">stream: connecting</span>
  </header>
  <section id="plan"><!--tile:plan--></section>
  <section class="filters" id="filters" aria-label="Filters">
    <input id="f-text" type="search" placeholder="Find an epic or an item" aria-label="Find an epic or an item">
    <label>Priority <select id="f-priority"><option value="">any</option><option>now</option><option>next</option><option>later</option><option value="unset">not prioritised</option></select></label>
    <label>Status <select id="f-status"><option value="">any</option><option>planned</option><option>started</option><option>yielded</option></select></label>
    <label>Area <select id="f-area"><option value="">any</option></select></label>
    <button id="pick-shown" type="button">Pick what is shown</button>
    <span class="note" id="shown">Drag an item or an epic onto Now, Next or Later. Tick items to move them to an epic.</span>
  </section>
  <p class="empty" id="empty" hidden>Nothing matches. Clear the search or a filter to see the plan again.</p>
</main>
<div class="dropbar" id="dropbar" hidden aria-label="Drop here to set how soon it is wanted">
  <span id="dragging"></span>
  <span class="zone" data-drop="now">Now</span><span class="zone" data-drop="next">Next</span><span class="zone" data-drop="later">Later</span>
</div>
<div class="mover" id="mover" hidden role="region" aria-label="Move the picked items">
  <b id="picked-count"></b>
  <label>to epic <select id="to-epic"></select></label><button id="move-epic" type="button">Move</button>
  <span class="or">or want them</span>
  <button type="button" data-want="now">Now</button><button type="button" data-want="next">Next</button><button type="button" data-want="later">Later</button>
  <button id="clear-picked" type="button">Clear</button>
  <span class="said" id="moved" aria-live="polite"></span>
</div>
<script src="/stream.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const FIELDS = { "f-priority": "priority", "f-status": "status", "f-area": "area" };
const READ_ONLY = $("shown").textContent;

// The epics the owner opened or closed by hand, kept across redraws and visits.
const chosen = (() => { try { return JSON.parse(localStorage.getItem("plan-open") || "{}"); } catch (e) { return {}; } })();
function remember(epic) {
  chosen[epic.dataset.epic] = !epic.open;
  try { localStorage.setItem("plan-open", JSON.stringify(chosen)); } catch (e) { /* the choice lasts for this page only */ }
}
document.addEventListener("click", (event) => {
  const summary = event.target.closest("details.epic > summary");
  if (summary && !event.target.closest("a")) remember(summary.parentElement);
});

function matches(item, text, epicText) {
  const fields = Object.entries(FIELDS).every(([id, field]) => !$(id).value || item.dataset[field] === $(id).value);
  return fields && (!text || epicText.includes(text) || item.textContent.toLowerCase().includes(text));
}
// A filter hides the items that do not match, then every epic and lane left with nothing to show. An epic is open when
// the owner chose so, else when a filter found something in it, else as the server drew it.
function apply() {
  const text = $("f-text").value.trim().toLowerCase();
  const filtering = Boolean(text) || Object.keys(FIELDS).some((id) => $(id).value);
  let shown = 0, total = 0;
  document.querySelectorAll("#plan details.epic").forEach((epic) => {
    const epicText = epic.querySelector(".name b").textContent.toLowerCase();
    let found = 0;
    epic.querySelectorAll(".item").forEach((item) => { const ok = matches(item, text, epicText); item.hidden = !ok; found += ok; total += 1; });
    shown += found;
    epic.hidden = filtering && found === 0;
    const key = epic.dataset.epic;
    epic.open = filtering ? found > 0 : (key in chosen ? chosen[key] : epic.dataset.drawn === "open");
  });
  document.querySelectorAll("#plan .lane").forEach((lane) => { lane.hidden = !lane.querySelector("details.epic:not([hidden])"); });
  $("shown").textContent = filtering ? shown + " of " + total + " items shown" : READ_ONLY;
  $("empty").hidden = !(filtering && shown === 0);
}
// The area menu lists what the drawn tile holds.
function areas() {
  const select = $("f-area"), kept = select.value;
  const seen = [...new Set([...document.querySelectorAll("#plan .item")].map((el) => el.dataset.area).filter(Boolean))].sort();
  select.replaceChildren(new Option("any", ""), ...seen.map((v) => new Option(v, v)));
  select.value = seen.includes(kept) ? kept : "";
}
// Changing the plan from the page. Each change is one Hecks command, run through the board's one write:
// Work.prioritize! for how soon an item is wanted, Work.assign! for the epic it belongs to. An epic has no
// priority of its own (it sits in the most urgent lane of its open items), so moving an epic moves those items.
const WANTED = ["now", "next", "later"], picked = new Set();
let moving = false, carried = null;
const openItems = (within) => [...within.querySelectorAll(".item[data-slug]:not(.closed)")];
function say(text, bad) { $("moved").textContent = text; $("moved").className = "said" + (bad ? " bad" : ""); mover(); }
function send(action, target, text) {
  return fetch("/api/act", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action, target, text }) })
    .then((r) => r.json()).then((a) => { if (a.error) throw new Error(String(a.error).split(": ").pop()); });
}
// Runs one command an item, in turn, saying how far it is; a refusal is said by the item's key and the rest go on.
async function change(action, slugs, value, words) {
  if (moving || !slugs.length) return;
  moving = true; const refused = [];
  for (const [i, slug] of slugs.entries()) {
    say(words + ": " + (i + 1) + " of " + slugs.length);
    try { await send(action, slug, value); } catch (e) { refused.push(slug + " (" + e.message + ")"); }
  }
  moving = false; picked.clear(); decorate();
  say(refused.length ? words + ": " + (slugs.length - refused.length) + " moved, not " + refused.join("; ") : words + ": " + slugs.length + " moved. The plan redraws when it is read again.", refused.length > 0);
}
function mover() {
  $("mover").hidden = !picked.size && !$("moved").textContent;
  $("picked-count").textContent = picked.size ? picked.size + " picked" : "";
  for (const el of $("mover").querySelectorAll("button, select, label, .or")) if (el.id !== "moved") el.hidden = !picked.size;
}
function epicChoices() {
  const kept = $("to-epic").value, epics = [...document.querySelectorAll("#plan details.epic[data-epic]")].filter((e) => e.dataset.epic)
    .map((e) => [e.querySelector(".name b").textContent, e.dataset.epic]).sort((a, b) => a[0].localeCompare(b[0]));
  $("to-epic").replaceChildren(...epics.map(([title, key]) => new Option(title, key)));
  if (epics.some(([, key]) => key === kept)) $("to-epic").value = kept;
}
// Every open item gets a tick box and can be dragged; so can an epic's row. The tile is redrawn by the server, so
// this runs after each redraw and puts back the ticks.
function decorate() {
  for (const item of openItems($("plan"))) {
    item.draggable = true;
    let box = item.querySelector("input.pick");
    if (!box) { box = document.createElement("input"); box.type = "checkbox"; box.className = "pick"; box.setAttribute("aria-label", "Pick " + item.dataset.slug); item.prepend(box); }
    box.checked = picked.has(item.dataset.slug); item.classList.toggle("picked", box.checked);
  }
  for (const row of document.querySelectorAll("#plan details.epic > summary")) row.draggable = true;
  epicChoices(); mover();
}
document.addEventListener("change", (event) => {
  const box = event.target.closest("input.pick"); if (!box) return;
  const slug = box.closest(".item").dataset.slug; if (box.checked) picked.add(slug); else picked.delete(slug);
  $("moved").textContent = ""; decorate();
});
$("pick-shown").addEventListener("click", () => { for (const item of openItems($("plan"))) if (!item.hidden && !item.closest("[hidden]")) picked.add(item.dataset.slug); $("moved").textContent = ""; decorate(); });
$("clear-picked").addEventListener("click", () => { picked.clear(); $("moved").textContent = ""; decorate(); });
$("move-epic").addEventListener("click", () => change("assign", [...picked], $("to-epic").value, "To " + $("to-epic").selectedOptions[0].textContent));
for (const b of $("mover").querySelectorAll("[data-want]")) b.addEventListener("click", () => change("prioritize", [...picked], b.dataset.want, "Wanted " + b.dataset.want));
// Dragging: an item carries itself (or every picked item when it is one of them), an epic's row its open items.
document.addEventListener("dragstart", (event) => {
  const item = event.target.closest && event.target.closest(".item[data-slug]"), row = !item && event.target.closest && event.target.closest("details.epic > summary");
  if (!item && !row) return;
  const slugs = item ? (picked.has(item.dataset.slug) ? [...picked] : [item.dataset.slug]) : openItems(row.parentElement).map((el) => el.dataset.slug);
  const what = item ? (slugs.length > 1 ? slugs.length + " items" : item.dataset.slug) : row.querySelector(".name b").textContent + " (" + slugs.length + " open)";
  carried = { slugs, what }; event.dataTransfer.effectAllowed = "move"; event.dataTransfer.setData("text/plain", slugs.join(" "));
  $("dragging").textContent = "Drop " + what + " on"; $("dropbar").hidden = false;
});
document.addEventListener("dragend", () => { carried = null; $("dropbar").hidden = true; document.querySelectorAll(".over").forEach((el) => el.classList.remove("over")); });
// Where a drop lands: a zone of the bar, or a lane of the plan that stands for now, next or later.
function landing(target) {
  const zone = target.closest && (target.closest("[data-drop]") || target.closest(".lane[data-lane]"));
  const want = zone && (zone.dataset.drop || zone.dataset.lane);
  return WANTED.includes(want) ? { zone, want } : null;
}
document.addEventListener("dragover", (event) => {
  const to = carried && landing(event.target); document.querySelectorAll(".over").forEach((el) => { if (!to || el !== to.zone) el.classList.remove("over"); });
  if (!to) return;
  event.preventDefault(); event.dataTransfer.dropEffect = "move"; to.zone.classList.add("over");
});
document.addEventListener("drop", (event) => {
  const to = carried && landing(event.target); if (!to) return;
  event.preventDefault(); const { slugs, what } = carried;
  change("prioritize", slugs, to.want, what + " wanted " + to.want);
});
// The filters sit under the overview, which the server draws inside the tile.
function drawn() {
  document.querySelectorAll("#plan details.epic").forEach((epic) => { epic.dataset.drawn = epic.open ? "open" : "closed"; });
  const overview = document.querySelector("#plan .overview");
  const above = document.querySelector("#plan .flow") || overview;
  if (above) above.after($("filters"));
  areas(); apply(); decorate();
}
function redraw(html) {
  const filters = $("filters"), held = document.activeElement, at = held && held.selectionStart;
  $("plan").after(filters);
  $("plan").innerHTML = html;
  drawn();
  if (held && held.id && filters.contains(held)) { held.focus(); if (at != null && held.setSelectionRange) held.setSelectionRange(at, at); }
}
$("f-text").addEventListener("input", apply);
Object.keys(FIELDS).forEach((id) => $(id).addEventListener("change", apply));
drawn();
if (window.boardStream) boardStream({
  open: () => { $("live").textContent = "stream: live"; },
  error: () => { $("live").textContent = "stream: reconnecting"; },
  pause: () => { $("live").textContent = "stream: paused"; },
  tile: (t) => { if (t.id === "plan") redraw(t.html); }
});
else $("live").textContent = "stream: unsupported";
</script>
</body>
</html>
