<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Planning</title>
<!--style--><style>
/* The Planning page: the work as the Tickets store holds it, drawn by the server and pushed from the journal.
   One colour language runs through it: a cell is one Work item, coloured by the lane it sits in. */
[hidden] { display: none !important; }
h1, h2, h3, p, ul { margin: 0; }
:focus-visible { outline: 2px solid var(--run); outline-offset: 2px; border-radius: 4px; }

header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; margin-bottom: 18px; }
.note, .counts, .facts, .area { color: var(--ink2); font-size: 12px; }

/* A cell is one Work item. The same six colours fill the bar, the key, the tracks and the rows. */
.cell { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 2.5px; }
.c-done { background: var(--done); }
.c-running { background: var(--run); }
.c-now { background: var(--ink); }
.c-next { background: color-mix(in srgb, var(--ink) 52%, transparent); }
.c-later { background: color-mix(in srgb, var(--ink) 24%, transparent); }
.c-unset { background: color-mix(in srgb, var(--ink) 7%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 22%, transparent); }
@media (prefers-reduced-motion: no-preference) {
  .cell.c-running { animation: running 1.6s ease-in-out infinite; }
  @keyframes running { 50% { opacity: .35; } }
}

.overview { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px 0; }
.headline { font-size: clamp(22px, 3.2vw, 32px); line-height: 1.15; letter-spacing: -.015em; font-weight: 400; text-wrap: balance; }
.headline b { font-weight: 650; }
.sofar { display: inline-block; margin-left: 14px; font-size: 14px; letter-spacing: 0; color: var(--done); font-weight: 600; }
.bar { display: flex; gap: 2px; height: 14px; margin-top: 18px; }
.bar i { min-width: 3px; border-radius: 3px; }
.key { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 10px; font-size: 12.5px; color: var(--ink2); }
.key li { display: flex; align-items: center; gap: 7px; }
.strip4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 20px -24px 0; border-top: 1px solid var(--line); }
.card4 { padding: 14px 24px 16px; border-left: 1px solid var(--line); min-width: 0; }
.card4:first-child { border-left: 0; }
.card4 h3 { font-size: 13px; font-weight: 600; }
.card4 ul { list-style: none; padding: 0; margin-top: 4px; font-size: 13px; color: var(--ink2); overflow-wrap: anywhere; }
.card4 li + li { margin-top: 2px; }
.card4.you { background: var(--you-wash); } .card4.you h3 { color: var(--you); }
.card4.you:last-child { border-bottom-right-radius: 13px; }

/* Planned and closed each day: a pair of bars a day. A plan that takes in more than it closes is said in amber. */
.flow { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 24px 16px; margin-top: 12px; }
.flow h3 { font-size: 14px; font-weight: 650; }
.flowline { color: var(--ink2); font-size: 13.5px; margin-top: 4px; } .flowline b { color: var(--ink); font-weight: 650; }
.flowline .grows { color: var(--you); font-weight: 600; } .flowline .shrinks { color: var(--done); font-weight: 600; }
.flowbars { display: flex; gap: 10px; height: 150px; margin-top: 14px; }
.fday { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; }
.fday .pair { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 3px; border-bottom: 1px solid var(--line); }
.fday .col { flex: 1; max-width: 26px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; }
.fday .col em { font-style: normal; font-size: 10.5px; color: var(--ink2); text-align: center; line-height: 1.5; }
.fday .col i { display: block; min-height: 0; } .fday .col i:first-of-type { border-radius: 3px 3px 0 0; }
.fday > span { font-size: 10.5px; color: var(--muted); margin-top: 4px; white-space: nowrap; }
.fday.today > span { color: var(--ink); font-weight: 600; } .fday.today .col { opacity: .6; }
.flow .planned { background: color-mix(in srgb, var(--ink) 52%, transparent); } .flow .finished { background: var(--done); }
.flow .dropped { background: color-mix(in srgb, var(--ink) 20%, transparent); }
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 22px 0 4px; font-size: 13px; color: var(--ink2); }
.filters input, .filters select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.filters input { flex: 1 1 260px; max-width: 380px; }
.filters select { max-width: 220px; }
.filters .note { margin-left: auto; }

.lane { margin-top: 26px; border-radius: 14px; outline: 2px dashed transparent; outline-offset: 8px; }
.lane.over { outline-color: var(--run); }
/* Changing the plan: a Move list on each open item, a bar of drop zones while something is carried, and a notice of what was saved. */
.item[draggable=true], .epic summary[draggable=true] { cursor: grab; }
.filters button { font: inherit; font-size: 13px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); cursor: pointer; }
.filters button:hover, .filters button[aria-pressed=true] { border-color: var(--run); } .filters button[aria-pressed=true] { background: var(--signal-soft); }
.filters #to-epic { max-width: 280px; } .filters #to-epic[hidden] { display: none; }
.item input.pick { align-self: center; margin: 0 2px 0 0; cursor: pointer; } .item.picked { background: var(--signal-soft); }
.dropbar, .toast { position: fixed; left: 50%; transform: translateX(-50%); z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px 14px; max-width: calc(100vw - 24px);
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 30px color-mix(in srgb, var(--ink) 18%, transparent); font-size: 13px; color: var(--ink2); }
.dropbar, .toast { top: 56px; }
.dropbar[hidden], .toast[hidden] { display: none; }
.toast { color: var(--ink); font-weight: 600; border-color: var(--run); } .toast.bad { border-color: var(--critical); color: var(--critical); font-weight: 400; }
/* The space that opens among a lane's rows where what is carried will land: the rows under it move down. */
.slot { height: 58px; margin: 0; border: 2px dashed var(--run); border-radius: 12px; background: var(--signal-soft); display: flex; align-items: center; padding: 0 16px;
  font-size: 12.5px; color: var(--ink2); animation: slot-open .12s ease-out; }
.slot.same { border-color: var(--line); background: none; }
@keyframes slot-open { from { height: 0; opacity: 0; } to { height: 58px; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .slot { animation: none; } }
.item.saving { opacity: .55; }
.dropbar .zone { padding: 12px 26px; border: 2px dashed var(--line); border-radius: 10px; color: var(--ink); font-weight: 600; }
.dropbar .zone.over { border-color: var(--run); background: var(--signal-soft); }
.lane h2 { display: flex; align-items: baseline; gap: 10px; font-size: 16px; font-weight: 650; letter-spacing: -.005em; margin: 0 4px 8px; cursor: pointer; }
/* A lane is drawn shut: its heading and counts show, its epic rows open on a click and the choice is kept. */
.lane h2::before { content: "\25BE"; width: 1em; color: var(--ink2); }
.lane.shut h2::before { content: "\25B8"; }
.lane.shut > details.epic { display: none; }
.lane h2 .counts { font-weight: 400; }
.epic { background: var(--surface); border: 1px solid var(--line); border-top-width: 0; }
.epic:first-of-type { border-top-width: 1px; border-radius: 12px 12px 0 0; }
.epic:last-of-type { border-radius: 0 0 12px 12px; }
.epic:first-of-type:last-of-type { border-radius: 12px; }
.epic summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 4fr) 190px; gap: 6px 22px;
  align-items: center; padding: 11px 16px 11px 34px; position: relative; }
.epic summary::-webkit-details-marker { display: none; }
.epic summary::before { content: ""; position: absolute; left: 15px; top: 18px; width: 6px; height: 6px; border-right: 1.5px solid var(--muted);
  border-bottom: 1.5px solid var(--muted); transform: rotate(-45deg); transition: transform .12s; }
.epic[open] > summary::before { transform: rotate(45deg); top: 16px; }
.epic summary:hover { background: color-mix(in srgb, var(--ink) 3%, transparent); }
.name { min-width: 0; } .name b { display: block; font-weight: 600; max-height: 3em; overflow: auto; }
.outcome { display: block; color: var(--ink2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.epic[open] .outcome { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; line-clamp: 4; overflow: hidden; }
.track { display: flex; flex-wrap: wrap; gap: 3px; }
.epic summary .counts { text-align: right; white-space: nowrap; }
.next { margin: 0 16px 6px 34px; font-size: 12.5px; color: var(--ink2); max-height: 3.2em; overflow: auto; }
.items { margin: 0 16px 12px 34px; border-top: 1px solid var(--line); }
.item { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; overflow-wrap: anywhere; }
.item:last-child { border-bottom: 0; }
.item > .cell { align-self: center; }
/* The work of an epic that is over, under what is left of it. */
.items.over { border-top: 0; margin-top: -4px; } .over-head { font-size: 12px; color: var(--ink2); padding: 8px 0 4px; margin: 0; border-bottom: 1px solid var(--line); }
.item.closed .what { color: var(--ink2); } .item.closed[data-status=dropped] .what { text-decoration: line-through; text-decoration-color: var(--muted); }
.c-dropped { background: var(--muted); } .chip.k-done { color: var(--done); border-color: currentColor; }
.what { flex: 1 1 340px; min-width: 0; max-height: 4.5em; overflow: auto; }
.what code { font: 11.5px var(--mono); color: var(--muted); margin-left: 4px; }
.chip { font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 0 8px; line-height: 1.7; border: 1px solid var(--line); color: var(--ink2); white-space: nowrap; }
.pri { width: 34px; text-align: right; font-size: 12px; color: var(--ink2); }
.chip.k-started { background: var(--run); color: #fff; border-color: transparent; }
.chip.k-yielded { color: var(--you); border-color: currentColor; }
.area { font-family: var(--mono); font-size: 11.5px; color: var(--muted); max-width: 40ch; max-height: 4.5em; overflow: auto; }
.facts { max-width: 72ch; max-height: 4.5em; overflow: auto; }
#plan .item .detail { flex-basis: 100%; margin-left: 20px; }
#plan .item .detail summary { cursor: pointer; font-size: 12px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#plan .item .detail pre { white-space: pre-wrap; font: 13px/1.5 var(--body); color: var(--ink2); margin: 4px 0 0; padding: 2px 0 2px 12px; border-left: 2px solid var(--line); max-width: 72ch; max-height: 16em; overflow: auto; }
.review { flex-basis: 100%; margin-left: 20px; }
.review summary { display: block; padding: 0; cursor: pointer; font-size: 12px; color: var(--ink2); text-decoration: underline dotted; }
.review summary::before { content: none; }
.review pre { white-space: pre-wrap; background: var(--page); border-radius: 8px; padding: 8px 10px; font: 13px/1.55 var(--body); margin: 6px 0; max-width: 72ch; max-height: 22em; overflow: auto; }
.unknown-note { color: var(--you); }
.empty { margin-top: 26px; color: var(--ink2); }

@media (max-width: 760px) {
  .strip4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card4:nth-child(3) { border-left: 0; } .card4:nth-child(n+3) { border-top: 1px solid var(--line); }
  .epic summary { grid-template-columns: minmax(0, 1fr) auto; }
  .track { grid-column: 1 / -1; grid-row: 2; }
  .sofar { display: block; margin: 6px 0 0; }
}
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>Plan</h1>
    <!--nav-->
    <span class="note" id="live">stream: connecting</span>
  </header>
  <section id="plan"><!--tile:plan--></section>
  <section class="filters" id="filters" aria-label="Filters">
    <input id="f-text" type="search" placeholder="Find an epic or an item" aria-label="Find an epic or an item">
    <label>Priority <select id="f-priority"><option value="">any</option><option>now</option><option>next</option><option>later</option><option value="unset">not prioritised</option></select></label>
    <label>Status <select id="f-status"><option value="">any</option><option>planned</option><option>started</option><option>yielded</option></select></label>
    <label>Area <select id="f-area"><option value="">any</option></select></label>
    <button id="select" type="button" aria-pressed="false">Select</button>
    <select id="to-epic" aria-label="Move the ticked items to an epic" hidden disabled></select>
    <span class="note" id="shown">Drag an item or an epic to a new place, or onto Now, Next or Later. Select ticks items to move to an epic.</span>
  </section>
  <p class="empty" id="empty" hidden>Nothing matches. Clear the search or a filter to see the plan again.</p>
</main>
<div class="dropbar" id="dropbar" hidden aria-label="Drop here to set how soon it is wanted">
  <span id="dragging"></span>
  <span class="zone" data-drop="now">Now</span><span class="zone" data-drop="next">Next</span><span class="zone" data-drop="later">Later</span>
</div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
<script src="/stream.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const FIELDS = { "f-priority": "priority", "f-status": "status", "f-area": "area" };
const READ_ONLY = $("shown").textContent;

// The epics the owner opened or closed by hand, kept across redraws and visits.
const chosen = (() => { try { return JSON.parse(localStorage.getItem("plan-open") || "{}"); } catch (e) { return {}; } })();
function remember(epic) {
  chosen[epic.dataset.epic] = !epic.open;
  try { localStorage.setItem("plan-open", JSON.stringify(chosen)); } catch (e) { /* the choice lasts for this page only */ }
}
document.addEventListener("click", (event) => {
  const summary = event.target.closest("details.epic > summary");
  if (summary && !event.target.closest("a")) remember(summary.parentElement);
});

// The lanes the owner opened by hand, kept across redraws and visits; every lane is shut until then.
const laneOpen = (() => { try { return JSON.parse(localStorage.getItem("plan-lanes") || "{}"); } catch (e) { return {}; } })();
document.addEventListener("click", (event) => {
  const head = event.target.closest("#plan .lane > h2");
  if (!head || event.target.closest("a")) return;
  const lane = head.parentElement, key = lane.dataset.lane;
  laneOpen[key] = lane.classList.contains("shut");
  lane.classList.toggle("shut", !laneOpen[key]);
  try { localStorage.setItem("plan-lanes", JSON.stringify(laneOpen)); } catch (e) { /* the choice lasts for this page only */ }
});

function matches(item, text, epicText) {
  const fields = Object.entries(FIELDS).every(([id, field]) => !$(id).value || item.dataset[field] === $(id).value);
  return fields && (!text || epicText.includes(text) || item.textContent.toLowerCase().includes(text));
}
// A filter hides the items that do not match, then every epic and lane left with nothing to show. An epic is open when
// the owner chose so, else when a filter found something in it, else as the server drew it.
function apply() {
  const text = $("f-text").value.trim().toLowerCase();
  const filtering = Boolean(text) || Object.keys(FIELDS).some((id) => $(id).value);
  let shown = 0, total = 0;
  document.querySelectorAll("#plan details.epic").forEach((epic) => {
    const epicText = epic.querySelector(".name b").textContent.toLowerCase();
    let found = 0;
    epic.querySelectorAll(".item").forEach((item) => { const ok = matches(item, text, epicText); item.hidden = !ok; found += ok; total += 1; });
    shown += found;
    epic.hidden = filtering && found === 0;
    const key = epic.dataset.epic;
    epic.open = filtering ? found > 0 : (key in chosen ? chosen[key] : epic.dataset.drawn === "open");
  });
  document.querySelectorAll("#plan .lane").forEach((lane) => {
    lane.hidden = !lane.querySelector("details.epic:not([hidden])");
    // A lane is shut unless the owner opened it, or a filter found something in it.
    if (lane.querySelector(":scope > h2")) lane.classList.toggle("shut", !(filtering || laneOpen[lane.dataset.lane]));
  });
  $("shown").textContent = filtering ? shown + " of " + total + " items shown" : READ_ONLY;
  $("empty").hidden = !(filtering && shown === 0);
}
// The area menu lists what the drawn tile holds.
function areas() {
  const select = $("f-area"), kept = select.value;
  const seen = [...new Set([...document.querySelectorAll("#plan .item")].map((el) => el.dataset.area).filter(Boolean))].sort();
  select.replaceChildren(new Option("any", ""), ...seen.map((v) => new Option(v, v)));
  select.value = seen.includes(kept) ? kept : "";
}
// Changing the plan from the page. Each change is one Hecks command, run through the board's one write:
// Work.prioritize! for how soon an item is wanted, Work.assign! for the epic it belongs to. An epic has no
// priority of its own (it sits in the most urgent lane of its open items), so moving an epic moves those items.
const WANTED = ["now", "next", "later"];
let moving = false, carried = null;
const openItems = (within) => [...within.querySelectorAll(".item[data-slug]:not(.closed)")];
// What was just changed is said in a notice at the head of the page, which stays while commands run and a while after.
function say(text, bad) {
  const el = $("toast"); el.textContent = text; el.className = "toast" + (bad ? " bad" : ""); el.hidden = !text;
  clearTimeout(say.timer); if (text && !moving) say.timer = setTimeout(() => { el.hidden = true; }, bad ? 20000 : 8000);
}
// What the page was told and the board may not have read yet: each item's new priority with the one it had. The
// page shows the new one at once and keeps it over a redraw that still holds the old, for two minutes.
const pending = new Map();
const itemOf = (slug) => document.querySelector('#plan .item[data-slug="' + CSS.escape(slug) + '"]');
function paint(item, priority) { item.dataset.priority = priority; const cell = item.querySelector("i.cell"); if (cell) cell.className = "cell c-" + priority; }
function send(action, target, text) {
  return fetch("/api/act", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action, target, text }) })
    .then((r) => r.json()).then((a) => { if (a.error) throw new Error(String(a.error).split(": ").pop()); });
}
// Runs one command an item, in turn, saying how far it is; a refusal is said by the item's key and the rest go on.
async function change(action, slugs, value, words) {
  if (moving) { say("Still saving the last change. Try again in a moment.", true); return; }
  if (!slugs.length) return;
  moving = true; const refused = [], until = Date.now() + 120000;
  for (const slug of slugs) {
    const item = itemOf(slug), was = item ? item.dataset : {};
    pending.set(slug, action === "prioritize" ? { want: value, was: was.priority || "", until } : { epic: value, wasEpic: was.epic || "", until });
  }
  decorate();
  for (const [i, slug] of slugs.entries()) {
    say("Saving " + words + (slugs.length > 1 ? ": " + (i + 1) + " of " + slugs.length : ""));
    try { await send(action, slug, value); } catch (e) { refused.push(slug + " (" + e.message + ")"); undo(slug); }
  }
  moving = false; decorate();
  const many = slugs.length > 1 ? " (" + (slugs.length - refused.length) + " of " + slugs.length + " items)" : "";
  say(refused.length ? "Not all saved: " + words + many + ". Refused: " + refused.join("; ") : "Saved: " + words + many + ".", refused.length > 0);
}
// A refused item goes back to the priority, or the epic, it had.
function undo(slug) {
  const held = pending.get(slug), item = itemOf(slug); pending.delete(slug); if (!held || !item) return;
  if (held.want) paint(item, held.was); else if (held.wasEpic) rehome(item, held.wasEpic);
}
const epicOf = (key) => document.querySelector('#plan details.epic[data-epic="' + CSS.escape(key) + '"]');
const titleOf = (item) => item.querySelector(".what").firstChild.textContent.trim();
// Shows what is pending over what the server drew: an item's new priority or its new epic, and an epic whose
// items were moved in the lane those items now put it in, the most urgent lane of its open items.
function settle() {
  const epics = new Set();
  for (const [slug, held] of pending) {
    if (held.until < Date.now()) { pending.delete(slug); continue; }
    const item = itemOf(slug); if (!item) continue;
    if (held.want && item.dataset.priority !== held.want) paint(item, held.want);
    if (held.epic && item.dataset.epic !== held.epic) rehome(item, held.epic);
    item.classList.toggle("saving", moving); epics.add(item.closest("details.epic"));
  }
  for (const epic of epics) {
    const from = epic && epic.closest(".lane[data-lane]"); if (!from || !WANTED.includes(from.dataset.lane) || !epic.dataset.epic) continue;
    const want = WANTED[Math.min(...openItems(epic).map((el) => rank(el.dataset.priority)))], lane = want && document.querySelector('#plan .lane[data-lane="' + want + '"]');
    if (lane && lane !== from) lane.append(epic);
  }
}
// Puts an item's row under another epic, among its open items.
function rehome(item, key) {
  const epic = epicOf(key), list = epic && epic.querySelector(".items:not(.over)");
  if (list) { list.append(item); item.dataset.epic = key; }
}
// Where the owner left the rows: the order of the epics in each lane as they were last arranged by hand, kept
// across redraws and visits. Which lane an epic is in comes from the plan; its place among the lane's rows is this
// page's own, so the order the fill starts work in is not changed by it.
const placed = (() => { try { return JSON.parse(localStorage.getItem("plan-order") || "{}"); } catch (e) { return {}; } })();
const rowsOf = (lane) => [...lane.children].filter((el) => el.matches("details.epic"));
function keepOrder(lane) {
  if (!lane) return;
  placed[lane.dataset.lane] = rowsOf(lane).map((epic) => epic.dataset.epic);
  try { localStorage.setItem("plan-order", JSON.stringify(placed)); } catch (e) { /* the order lasts for this page only */ }
}
function arrange() {
  for (const lane of document.querySelectorAll("#plan .lane[data-lane]")) {
    const order = placed[lane.dataset.lane]; if (!order) continue;
    const rows = rowsOf(lane), at = (epic) => { const i = order.indexOf(epic.dataset.epic); return i < 0 ? order.length : i; };
    const sorted = rows.map((epic, i) => [epic, i]).sort((a, b) => at(a[0]) - at(b[0]) || a[1] - b[1]).map(([epic]) => epic);
    if (sorted.some((epic, i) => epic !== rows[i])) lane.append(...sorted);
  }
}
// Selecting: the Select button puts a tick box beside every open item, and "Move to epic" sends the ticked ones to
// the epic chosen from its list. The ticks are kept across redraws while selecting is on.
const picked = new Set();
let selecting = false;
// Every open item can be dragged, and so can an epic's row; while selecting, each open item has its tick box. The
// tile is redrawn by the server, so this runs after each redraw.
function decorate() {
  for (const item of openItems($("plan"))) {
    item.draggable = true;
    let box = item.querySelector("input.pick");
    if (selecting && !box) { box = document.createElement("input"); box.type = "checkbox"; box.className = "pick"; box.setAttribute("aria-label", "Select " + item.dataset.slug); item.prepend(box); }
    if (!selecting && box) box.remove();
    if (selecting) box.checked = picked.has(item.dataset.slug);
    item.classList.toggle("picked", selecting && picked.has(item.dataset.slug));
  }
  for (const row of document.querySelectorAll("#plan details.epic > summary")) row.draggable = true;
  settle(); arrange(); selection();
}
// The Select button, the count of what is ticked, and the list of epics to move it to.
function selection() {
  const epics = [...document.querySelectorAll("#plan details.epic[data-epic]")].filter((e) => e.dataset.epic)
    .map((e) => [e.querySelector(".name b").textContent, e.dataset.epic]).sort((a, b) => a[0].localeCompare(b[0]));
  $("select").setAttribute("aria-pressed", String(selecting)); $("select").textContent = selecting ? "Done selecting" : "Select";
  $("to-epic").hidden = !selecting; $("to-epic").disabled = !picked.size;
  $("to-epic").replaceChildren(new Option(picked.size ? "Move " + picked.size + " to epic…" : "Tick items, then move to epic…", ""), ...epics.map(([title, key]) => new Option(title, key)));
}
$("select").addEventListener("click", () => { selecting = !selecting; if (!selecting) picked.clear(); decorate(); });
document.addEventListener("change", (event) => {
  const box = event.target.closest && event.target.closest("input.pick"); if (!box) return;
  const slug = box.closest(".item").dataset.slug; if (box.checked) picked.add(slug); else picked.delete(slug);
  decorate();
});
$("to-epic").addEventListener("change", () => {
  const key = $("to-epic").value, title = $("to-epic").selectedOptions[0].textContent, slugs = [...picked]; if (!key || !slugs.length) return;
  picked.clear(); change("assign", slugs, key, (slugs.length === 1 ? "“" + titleOf(itemOf(slugs[0])) + "”" : slugs.length + " items") + " to " + title);
});
// Dragging: an item carries itself (or every ticked item when it is one of them), an epic's row carries the epic.
// While something is carried a space opens at the head of the lane under the pointer, where it will land.
const rank = (priority) => { const at = WANTED.indexOf(priority); return at < 0 ? WANTED.length : at; };
const laneOf = (el) => { const lane = el.closest(".lane[data-lane]"); return lane ? lane.dataset.lane : ""; };
// The items of an epic a move changes. An epic sits in the most urgent lane of its open items, so lowering it
// lowers every item wanted sooner than the lane it goes to, and raising it raises only the items that put it
// where it is: the others keep the order they were given.
function epicMove(epic, want) {
  const items = openItems(epic), at = Math.min(...items.map((el) => rank(el.dataset.priority)));
  if (!items.length || at === rank(want)) return [];
  return items.filter((el) => (rank(want) > at ? rank(el.dataset.priority) < rank(want) : rank(el.dataset.priority) === at));
}
const slot = document.createElement("div"); slot.className = "slot";
function clearDrag() { slot.remove(); document.querySelectorAll(".over").forEach((el) => el.classList.remove("over")); }
document.addEventListener("dragstart", (event) => {
  const item = event.target.closest && event.target.closest(".item[data-slug]"), row = !item && event.target.closest && event.target.closest("details.epic > summary");
  if (!item && !row) return;
  const epic = row && row.parentElement, slugs = item ? (picked.has(item.dataset.slug) ? [...picked] : [item.dataset.slug]) : [];
  const what = item ? (slugs.length > 1 ? slugs.length + " items" : item.querySelector(".what").firstChild.textContent.trim()) : row.querySelector(".name b").textContent;
  carried = { epic, slugs, what }; event.dataTransfer.effectAllowed = "move"; event.dataTransfer.setData("text/plain", what);
  // The bar is shown a moment later: a page that changes under the pointer as a drag starts can end the drag.
  setTimeout(() => { if (carried) { $("dragging").textContent = "Drop “" + what + "” on"; $("dropbar").hidden = false; } }, 0);
});
document.addEventListener("dragend", () => { carried = null; $("dropbar").hidden = true; clearDrag(); });
// Where a drop lands: a zone of the bar, or a lane of the plan that stands for now, next or later.
function landing(target) {
  const zone = target.closest && (target.closest("[data-drop]") || target.closest(".lane[data-lane]"));
  const want = zone && (zone.dataset.drop || zone.dataset.lane);
  return WANTED.includes(want) ? { zone, want } : null;
}
// What a drop on `want` would change: the items, by element, and why it would change nothing.
function wouldMove(want) {
  if (carried.epic) return epicMove(carried.epic, want);
  return carried.slugs.map((slug) => document.querySelector('#plan .item[data-slug="' + CSS.escape(slug) + '"]')).filter((el) => el && el.dataset.priority !== want);
}
document.addEventListener("dragover", (event) => {
  const to = carried && landing(event.target);
  if (!to) { clearDrag(); return; }
  event.preventDefault(); event.dataTransfer.dropEffect = "move";
  document.querySelectorAll(".over").forEach((el) => { if (el !== to.zone) el.classList.remove("over"); }); to.zone.classList.add("over");
  const lane = to.zone.matches(".lane") ? to.zone : document.querySelector('#plan .lane[data-lane="' + to.want + '"]'), n = wouldMove(to.want).length;
  slot.textContent = carried.epic ? "" : n ? "wanted " + to.want : "already wanted " + to.want;
  slot.classList.toggle("same", !n && !carried.epic);
  if (lane) place(lane, event);
});
// Opens the space among the lane's rows where the pointer is: before the row under it when the pointer is in the
// row's upper half, after it otherwise, and at the lane's head when it is over no row.
function place(lane, event) {
  const row = event.target.closest && event.target.closest("details.epic");
  if (row && row.parentElement === lane && row !== carried.epic) {
    const box = row.getBoundingClientRect(), before = event.clientY < box.top + box.height / 2;
    if ((before ? row.previousElementSibling : row.nextElementSibling) !== slot) row[before ? "before" : "after"](slot);
  } else if (slot.parentElement !== lane) lane.querySelector("h2").after(slot);
}
document.addEventListener("drop", (event) => {
  const to = carried && landing(event.target); if (!to) return;
  event.preventDefault();
  const { epic, what } = carried, items = wouldMove(to.want), lane = document.querySelector('#plan .lane[data-lane="' + to.want + '"]');
  // An epic sits where it was dropped, and that place is kept: in the lane it left and the one it joined.
  if (epic && lane && slot.parentElement === lane) { const from = epic.closest(".lane[data-lane]"); slot.replaceWith(epic); keepOrder(from); keepOrder(lane); }
  clearDrag();
  // A drop that changes no priority is a new place in the list and nothing more.
  if (!items.length) { if (!epic) say("“" + what + "” is already wanted " + to.want + ". Nothing changed."); return; }
  // The page shows the move at once; the commands run behind it, and the plan agrees when it is next read.
  change("prioritize", items.map((el) => el.dataset.slug), to.want, "“" + what + "” wanted " + to.want);
});
// The filters sit under the overview, which the server draws inside the tile.
function drawn() {
  document.querySelectorAll("#plan details.epic").forEach((epic) => { epic.dataset.drawn = epic.open ? "open" : "closed"; });
  const overview = document.querySelector("#plan .overview");
  const above = document.querySelector("#plan .flow") || overview;
  if (above) above.after($("filters"));
  areas(); apply(); decorate();
}
function redraw(html) {
  const filters = $("filters"), held = document.activeElement, at = held && held.selectionStart;
  $("plan").after(filters);
  $("plan").innerHTML = html;
  drawn();
  if (held && held.id && filters.contains(held)) { held.focus(); if (at != null && held.setSelectionRange) held.setSelectionRange(at, at); }
}
$("f-text").addEventListener("input", apply);
Object.keys(FIELDS).forEach((id) => $(id).addEventListener("change", apply));
drawn();
if (window.boardStream) boardStream({
  open: () => { $("live").textContent = "stream: live"; },
  error: () => { $("live").textContent = "stream: reconnecting"; },
  pause: () => { $("live").textContent = "stream: paused"; },
  tile: (t) => { if (t.id === "plan") redraw(t.html); }
});
else $("live").textContent = "stream: unsupported";
</script>
</body>
