<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Wiring</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
  --series1: #2a78d6; --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --series1: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --series1: #3987e5;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1280px; margin: 0 auto; padding: 16px; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
h1 { font-size: 20px; margin: 0; font-weight: 600; }
a { color: var(--series1); }
.meta { color: var(--ink2); font-size: 13px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--series1); outline-offset: 2px; }
section { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 16px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink2); margin-bottom: 8px; }
.legend b { color: var(--ink); font-weight: 600; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
canvas { width: 100%; height: 640px; display: block; border: 1px solid var(--grid); border-radius: 8px; background: var(--page); }
.log { list-style: none; margin: 0; padding: 0; font-size: 13px; max-height: 260px; overflow: auto; }
.log li { padding: 4px 0; border-bottom: 1px solid var(--grid); overflow-wrap: anywhere; }
.log time { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 8px; }
.log .mark { font-weight: 600; margin-left: 6px; }
h2 { font-size: 13px; margin: 0 0 8px; color: var(--ink2); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--grid); }
th { color: var(--ink2); font-size: 12px; }
.scroll { overflow: auto; max-height: 420px; }
.tables-only canvas { display: none; } body:not(.tables-only) #edgetable { display: none; }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--surface); padding: 4px 8px; border-radius: 6px; font-size: 12px; z-index: 10; display: none; max-width: 300px; }
.unknown-note { color: var(--ink2); font-style: italic; }
@media (max-width: 700px) { canvas { height: 460px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Pipeline Wiring</h1>
    <div class="meta">
      <a href="/">Board</a>
      <span id="count">loading the wiring</span>
      <span id="live">stream: connecting</span>
      <button id="bounds" type="button" aria-pressed="true">Hide boundaries</button>
      <button id="replay" type="button">Replay recent</button>
      <button id="toggle" type="button" aria-pressed="false">Show table</button>
    </div>
  </header>
  <section aria-labelledby="h-map">
    <h2 id="h-map">Aggregates, ports and adapters, with messages as they move</h2>
    <div class="legend" id="legend">
      <span><b>&#9645;</b> aggregate</span><span><b>&#9671;</b> port</span><span><b>&#11042;</b> adapter</span>
      <span><b style="color:var(--good)">&#10003;</b> delivered</span>
      <span><b style="color:var(--warning)">&#9650;</b> waiting</span>
      <span><b style="color:var(--critical)">&#10005;</b> refused</span>
    </div>
    <div class="legend" id="domains"></div>
    <canvas id="map" role="img" aria-label="Wiring diagram: policies between aggregates, ports and adapters, with live messages"></canvas>
    <div class="scroll" id="edgetable"></div>
  </section>
  <section aria-labelledby="h-log"><h2 id="h-log">Messages</h2><ul class="log" id="log" aria-live="polite"></ul></section>
</main>
<div class="tip" id="tip" role="tooltip"></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const canvas = $("map"), ctx = canvas.getContext("2d"), tip = $("tip");
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let nodes = [], edges = [], byId = new Map(), view = { s: 1, x: 0, y: 0 }, hover = null;
const pulses = new Map(), particles = [], seen = new Map();
/* Categorical slots from the reference palette, in their fixed order; a 9th domain folds to muted. */
const SLOTS = { light: ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"],
                dark: ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"] };
let domains = [], domainColour = new Map(), showBounds = true;
const dark = () => matchMedia("(prefers-color-scheme: dark)").matches && document.documentElement.dataset.theme !== "light" || document.documentElement.dataset.theme === "dark";
function colourOf(domain) { const i = domainColour.get(domain); return i === undefined || i > 7 ? css("--muted") : SLOTS[dark() ? "dark" : "light"][i]; }

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined) el.append(kid.nodeType ? kid : String(kid));
  return el;
}
function clock(iso) { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }); }

/* ---- domains: an adapter belongs to the domain of the port it answers, but sits outside its hull ---- */
function assignDomains() {
  for (const e of edges) if (e.kind === "adapter") { const p = byId.get(e.from), a = byId.get(e.to); if (p && a) a.domain = p.domain; }
  const count = new Map(); for (const n of nodes) if (n.kind !== "adapter") count.set(n.domain, (count.get(n.domain) || 0) + 1);
  domains = [...count.keys()].sort((a, b) => count.get(b) - count.get(a));
  domainColour = new Map(domains.map((d, i) => [d, i]));
}
/* ---- layout: one cluster per domain, aggregates inside, ports on the rim, adapters outside ---- */
let centre = new Map();
function layout() {
  const ring = domains.map((d, i) => [d, { x: Math.cos(i / domains.length * 6.283) * 420, y: Math.sin(i / domains.length * 6.283) * 300 }]);
  centre = new Map(ring);
  nodes.forEach((n, i) => { const c = centre.get(n.domain) || { x: 0, y: 0 }; n.x = c.x + Math.cos(i * 2.4) * 50; n.y = c.y + Math.sin(i * 2.4) * 50; n.vx = 0; n.vy = 0; });
  for (let step = 0; step < 360; step++) tick(1 - step / 380);
}
function tick(heat) {
  for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
    const a = nodes[i], b = nodes[j]; let dx = a.x - b.x, dy = a.y - b.y; const d2 = Math.max(dx * dx + dy * dy, 36);
    const f = (a.domain === b.domain ? 2200 : 5200) / d2, d = Math.sqrt(d2); dx /= d; dy /= d; a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
  }
  for (const e of edges) {
    const a = byId.get(e.from), b = byId.get(e.to); if (!a || !b) continue;
    const rest = e.kind === "adapter" ? 34 : 70, dx = b.x - a.x, dy = b.y - a.y, d = Math.max(Math.hypot(dx, dy), 1), f = (d - rest) * 0.014;
    a.vx += dx / d * f; a.vy += dy / d * f; b.vx -= dx / d * f; b.vy -= dy / d * f;
  }
  for (const n of nodes) {
    const c = centre.get(n.domain) || { x: 0, y: 0 }, dx = n.x - c.x, dy = n.y - c.y, d = Math.max(Math.hypot(dx, dy), 1);
    const pull = n.kind === "aggregate" ? 0.012 : n.kind === "port" ? 0.006 : 0.003;
    n.vx += (c.x - n.x) * pull; n.vy += (c.y - n.y) * pull;
    if (n.kind !== "aggregate") { const out = n.kind === "port" ? 0.9 : 1.6; n.vx += dx / d * out; n.vy += dy / d * out; }
    n.x += n.vx * 0.5 * heat; n.y += n.vy * 0.5 * heat; n.vx *= 0.82; n.vy *= 0.82;
  }
}
/* ---- boundaries: a padded convex hull around each domain's aggregates and ports ---- */
function hull(points) {
  const p = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]); if (p.length < 3) return p;
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = []; for (const q of p) { while (lower.length > 1 && cross(lower[lower.length - 2], lower[lower.length - 1], q) <= 0) lower.pop(); lower.push(q); }
  const upper = []; for (const q of p.slice().reverse()) { while (upper.length > 1 && cross(upper[upper.length - 2], upper[upper.length - 1], q) <= 0) upper.pop(); upper.push(q); }
  return lower.slice(0, -1).concat(upper.slice(0, -1));
}
function drawBounds() {
  for (const d of domains) {
    const members = nodes.filter((n) => n.domain === d && n.kind !== "adapter").map((n) => [sx(n), sy(n)]);
    if (!members.length) continue;
    const cx = members.reduce((s, q) => s + q[0], 0) / members.length, cy = members.reduce((s, q) => s + q[1], 0) / members.length;
    const pad = 22, ring = hull(members).map(([x, y]) => { const dx = x - cx, dy = y - cy, l = Math.max(Math.hypot(dx, dy), 1); return [x + dx / l * pad, y + dy / l * pad]; });
    if (ring.length < 2) continue;
    ctx.beginPath();
    if (ring.length === 2) ctx.ellipse(cx, cy, Math.hypot(ring[0][0] - ring[1][0], ring[0][1] - ring[1][1]) / 2 + pad, pad, Math.atan2(ring[1][1] - ring[0][1], ring[1][0] - ring[0][0]), 0, 6.283);
    else { const m = (i) => [(ring[i][0] + ring[(i + 1) % ring.length][0]) / 2, (ring[i][1] + ring[(i + 1) % ring.length][1]) / 2];
      ctx.moveTo(...m(ring.length - 1)); for (let i = 0; i < ring.length; i++) ctx.quadraticCurveTo(ring[i][0], ring[i][1], ...m(i)); }
    ctx.closePath();
    const colour = colourOf(d); ctx.globalAlpha = 0.09; ctx.fillStyle = colour; ctx.fill();
    ctx.globalAlpha = 0.7; ctx.lineWidth = 1.5; ctx.strokeStyle = colour; ctx.setLineDash([6, 4]); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    const top = Math.min(...ring.map((q) => q[1])) - 6;
    ctx.font = "600 12px system-ui, sans-serif"; ctx.fillStyle = css("--ink"); ctx.textAlign = "center"; ctx.fillText(d, cx, top); ctx.textAlign = "start";
  }
}
function fit() {
  const r = canvas.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  canvas.width = r.width * dpr; canvas.height = r.height * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!nodes.length) return;
  const xs = nodes.map((n) => n.x), ys = nodes.map((n) => n.y);
  const w = Math.max(...xs) - Math.min(...xs) + 120, hgt = Math.max(...ys) - Math.min(...ys) + 120;
  view.s = Math.min(r.width / w, r.height / hgt);
  view.x = r.width / 2 - (Math.max(...xs) + Math.min(...xs)) / 2 * view.s;
  view.y = r.height / 2 - (Math.max(...ys) + Math.min(...ys)) / 2 * view.s;
}
const sx = (n) => n.x * view.s + view.x, sy = (n) => n.y * view.s + view.y;

/* ---- drawing ---- */
function shape(n, x, y, r) {
  ctx.beginPath();
  if (n.kind === "port") { ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.closePath(); }
  else if (n.kind === "adapter") { for (let i = 0; i < 6; i++) { const a = i / 6 * 6.283; ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } ctx.closePath(); }
  else ctx.roundRect(x - r, y - r * 0.7, r * 2, r * 1.4, 3);
}
function draw(now) {
  const r = canvas.getBoundingClientRect(); ctx.clearRect(0, 0, r.width, r.height);
  if (showBounds) drawBounds();
  ctx.lineWidth = 1; ctx.strokeStyle = css("--axis");
  for (const e of edges) {
    const a = byId.get(e.from), b = byId.get(e.to); if (!a || !b) continue;
    ctx.globalAlpha = e.glow && e.glow > now ? 1 : 0.55; ctx.strokeStyle = e.glow && e.glow > now ? css("--series1") : css("--axis");
    ctx.lineWidth = e.glow && e.glow > now ? 2 : 1;
    ctx.beginPath();
    if (a === b) ctx.arc(sx(a) + 9, sy(a) - 9, 7, 0, 6.283); else { ctx.moveTo(sx(a), sy(a)); ctx.lineTo(sx(b), sy(b)); }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const n of nodes) drawNode(n, now);
  drawParticles(now);
  ctx.fillStyle = css("--ink2"); ctx.font = "12px system-ui, sans-serif";
  if (hover) label(hover, true);
  requestAnimationFrame(draw);
}
function drawNode(n, now) {
  const x = sx(n), y = sy(n), r = n.kind === "aggregate" ? 6 : 7, pulse = pulses.get(n.id);
  const live = pulse && pulse > now;
  shape(n, x, y, r + (live && !reduceMotion ? 3 * ((pulse - now) / 1800) : 0));
  ctx.fillStyle = live ? css("--series1") : css("--surface"); ctx.fill();
  ctx.lineWidth = live ? 2 : 1.2; ctx.strokeStyle = live ? css("--series1") : (showBounds ? colourOf(n.domain) : css("--ink2")); ctx.stroke();
  if (live) label(n, false);
}
function label(n, boxed) {
  const x = sx(n) + 10, y = sy(n) - 8, text = n.label + (n.domain ? "  " + n.domain : "");
  ctx.font = "12px system-ui, sans-serif";
  if (boxed) { const w = ctx.measureText(text).width + 8; ctx.fillStyle = css("--surface"); ctx.fillRect(x - 4, y - 12, w, 18); ctx.strokeStyle = css("--axis"); ctx.strokeRect(x - 4, y - 12, w, 18); }
  ctx.fillStyle = css("--ink"); ctx.fillText(text, x, y);
}
const OUTCOME = { ok: ["--good", "✓ delivered"], wait: ["--warning", "▲ waiting"], bad: ["--critical", "✕ refused"] };
function drawParticles(now) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i], t = (now - p.start) / p.ms;
    if (t >= 1) { pulses.set(p.to.id, now + 1800); particles.splice(i, 1); continue; }
    if (t < 0) continue;
    const own = p.from === p.to, angle = t * 6.283 + 1.57;
    const x = own ? sx(p.from) + 9 + Math.cos(angle) * 7 : sx(p.from) + (sx(p.to) - sx(p.from)) * t;
    const y = own ? sy(p.from) - 9 + Math.sin(angle) * 7 : sy(p.from) + (sy(p.to) - sy(p.from)) * t, [token, word] = OUTCOME[p.kind];
    ctx.beginPath(); ctx.arc(x, y, 5, 0, 6.283); ctx.fillStyle = css(token); ctx.fill(); ctx.strokeStyle = css("--surface"); ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = css("--ink"); ctx.font = "11px system-ui, sans-serif"; ctx.fillText(word.slice(0, 1) + " " + p.text, x + 8, y - 6);
  }
}

/* ---- messages ---- */
function outcomeKind(text) { return /deliver/.test(text) ? "ok" : /refus|fail/.test(text) ? "bad" : "wait"; }
function fire(ev, animate) {
  const now = performance.now(), node = byId.get(ev.aggregate);
  if (node && animate) pulses.set(node.id, now + 1800);
  for (const r of ev.reactions || []) {
    const bare = String(r.policy).split("::").pop(), kind = outcomeKind(r.outcome || "");
    const token = ev.key + "|" + bare + "|" + kind;
    if (seen.has(token)) continue; seen.set(token, true);
    for (const e of edges.filter((x) => x.label === bare)) {
      const a = byId.get(e.from), b = byId.get(e.to);
      if (a && b && animate) { particles.push({ from: a, to: b, kind, text: ev.name, start: now + 150, ms: reduceMotion ? 1 : 1400 }); e.glow = now + 2400; }
    }
    logLine(ev, r, kind);
  }
  if (!(ev.reactions || []).length) logLine(ev, null, null);
}
function logLine(ev, reaction, kind) {
  const li = h("li", {}, h("time", {}, clock(ev.at)), (ev.aggregate || "") + " ", h("b", {}, ev.name));
  if (reaction) li.append(" → " + String(reaction.policy).split("::").pop() + (reaction.command ? " → " + reaction.command : ""),
    h("span", { class: "mark", style: "color:var(" + OUTCOME[kind][0] + ")" }, OUTCOME[kind][1]));
  const log = $("log"); log.prepend(li); while (log.children.length > 60) log.lastChild.remove();
}
let backlog = [], liveStarted = false;
function listen() {
  const es = new EventSource("/api/events");
  es.onopen = () => { $("live").textContent = "stream: live"; };
  es.onerror = () => { $("live").textContent = "stream: reconnecting"; };
  es.addEventListener("board", (m) => {
    const ev = JSON.parse(m.data); if (!ev.key) return;
    if (!liveStarted) { backlog.push(ev); clearTimeout(listen.t); listen.t = setTimeout(startLive, 600); } else fire(ev, true);
  });
}
function startLive() { liveStarted = true; replay(backlog.slice(-12), true); }
function replay(list, first) {
  if (!first) seen.clear();
  list.forEach((ev, i) => setTimeout(() => fire(ev, true), i * 450));
}

/* ---- table view, hover, boot ---- */
function renderTable() {
  $("edgetable").replaceChildren(h("table", {}, h("thead", {}, h("tr", {}, ["From", "Policy", "To", "Kind"].map((t) => h("th", {}, t)))),
    h("tbody", {}, edges.map((e) => h("tr", {}, [e.from, e.label || "(bound adapter)", e.to, e.kind].map((t) => h("td", {}, t)))))));
}
canvas.addEventListener("mousemove", (e) => {
  const r = canvas.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  hover = nodes.find((n) => Math.hypot(sx(n) - mx, sy(n) - my) < 10) || null;
  canvas.style.cursor = hover ? "pointer" : "default";
});
canvas.addEventListener("mouseleave", () => { hover = null; });
$("toggle").addEventListener("click", () => { const on = document.body.classList.toggle("tables-only"); $("toggle").setAttribute("aria-pressed", String(on)); $("toggle").textContent = on ? "Show diagram" : "Show table"; });
$("replay").addEventListener("click", () => replay(backlog.slice(-12), false));
$("bounds").addEventListener("click", () => { showBounds = !showBounds; $("bounds").setAttribute("aria-pressed", String(showBounds)); $("bounds").textContent = showBounds ? "Hide boundaries" : "Show boundaries"; });
addEventListener("resize", fit);

fetch("/api/wiring", { cache: "no-store" }).then((r) => r.json()).then((g) => {
  if (g.unknown) { $("count").textContent = "unknown: " + g.unknown; return; }
  nodes = g.nodes; edges = g.edges; byId = new Map(nodes.map((n) => [n.id, n]));
  assignDomains();
  $("count").textContent = domains.length + " domains, " + nodes.filter((n) => n.kind === "aggregate").length + " aggregates, " + edges.filter((e) => e.kind !== "adapter").length + " policies";
  $("domains").replaceChildren(...domains.map((d) => h("span", {}, h("i", { class: "swatch", style: "background:" + colourOf(d) }), d)));
  layout(); fit(); renderTable(); requestAnimationFrame(draw); listen();
}).catch((e) => { $("count").textContent = "unknown: " + e.message; });
</script>
</body>
</html>
