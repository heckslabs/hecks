<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Wiring</title>
<style>
/* The wiring page: every context as one block, laid left to right in the direction its policies run, with the
   lines between contexts at rest in grey. Colour is kept for what is happening: a selection, and a message crossing. */
:root {
  color-scheme: light;
  --page: #f3f5f4; --surface: #ffffff; --ink: #16211d; --ink2: #55615c; --muted: #87928d;
  --line: rgba(22,33,29,.13); --wire: #a9b3ae; --pick: #2563d9; --good: #2f7d5b; --warning: #b87400; --critical: #c23b3b;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark; --page: #0d1311; --surface: #151c19; --ink: #e8efeb; --ink2: #a9b5af; --muted: #76827c;
    --line: rgba(232,239,235,.12); --wire: #4d5954; --pick: #6ea3ff; --good: #4fb286; --warning: #f0b040; --critical: #ef6b6b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark; --page: #0d1311; --surface: #151c19; --ink: #e8efeb; --ink2: #a9b5af; --muted: #76827c;
  --line: rgba(232,239,235,.12); --wire: #4d5954; --pick: #6ea3ff; --good: #4fb286; --warning: #f0b040; --critical: #ef6b6b;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
main { max-width: 1500px; margin: 0 auto; padding: 14px 16px 24px; }
header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 10px; }
h1 { font-size: 16px; margin: 0; font-weight: 600; }
.note { color: var(--ink2); font-size: 12.5px; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-left: auto; }
button, input { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; }
button { cursor: pointer; } button[aria-pressed="true"] { border-color: var(--pick); color: var(--pick); }
:focus-visible { outline: 2px solid var(--pick); outline-offset: 2px; }
.find { position: relative; flex: none; width: 290px; max-width: 100%; } .find input { width: 100%; }
.hits { position: absolute; z-index: 15; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 10px 28px rgba(0,0,0,.18); list-style: none; margin: 0; padding: 4px; max-height: 340px; overflow: auto; }
.hits button { display: block; width: 100%; text-align: left; border: 0; background: none; border-radius: 6px; padding: 5px 8px; }
.hits button:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); } .hits small { color: var(--muted); margin-right: 6px; }
.last { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; min-height: 20px; font-size: 12.5px; color: var(--ink2); margin: 0 2px 8px; }
.said { display: flex; gap: 8px; align-items: baseline; margin-left: auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.last b { color: var(--ink); font-weight: 600; } .ok { color: var(--good); } .wait { color: var(--warning); } .bad { color: var(--critical); }
.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
svg#map { display: block; width: 100%; height: calc(100vh - 150px); min-height: 500px; cursor: grab; touch-action: none; user-select: none; }
svg#map.dragging { cursor: grabbing; }

.link .line { fill: none; stroke: var(--wire); stroke-linecap: round; transition: stroke .6s, opacity .6s; }
.link .head { fill: var(--wire); transition: fill .6s, opacity .6s; }
.link .hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
.link.back .line { stroke-dasharray: 5 5; }
.link text { font: 600 11px system-ui, sans-serif; fill: var(--pick); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; display: none; }
.link { opacity: .6; } .link.back { opacity: .4; }
svg.picked .link { opacity: .1; } svg.picked .link.on { opacity: 1; } svg.picked .link.on text { display: block; }
.link.on .line { stroke: var(--pick); } .link.on .head { fill: var(--pick); }
.link.lit { opacity: 1 !important; }
.link.lit.ok .line { stroke: var(--good); } .link.lit.ok .head { fill: var(--good); }
.link.lit.wait .line { stroke: var(--warning); } .link.lit.wait .head { fill: var(--warning); }
.link.lit.bad .line { stroke: var(--critical); } .link.lit.bad .head { fill: var(--critical); }

.unit { cursor: pointer; transition: opacity .3s; }
.unit .box { fill: var(--page); stroke: var(--line); stroke-width: 1; transition: stroke .5s; }
.unit:hover .box { stroke: var(--muted); }
.unit .cap { font: 500 10px system-ui, sans-serif; fill: var(--muted); }
.unit .name { font: 600 13.5px system-ui, sans-serif; fill: var(--ink); }
.unit .sub { font: 400 11px system-ui, sans-serif; fill: var(--ink2); }
.unit.sel .box { stroke: var(--pick); stroke-width: 2; }
.unit.hot .box { stroke: var(--good); stroke-width: 2; }
svg.picked .unit:not(.near), svg.finding .unit:not(.match) { opacity: .3; }
.band { font: 500 11px system-ui, sans-serif; fill: var(--muted); }
.dot { stroke: var(--surface); stroke-width: 2; } .dot.ok { fill: var(--good); } .dot.wait { fill: var(--warning); } .dot.bad { fill: var(--critical); }

.key { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 9px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink2); }
.key i { display: inline-block; width: 22px; height: 0; border-top: 2px solid var(--wire); vertical-align: middle; margin-right: 6px; }
.key i.back { border-top-style: dashed; } .key i.ok { border-color: var(--good); } .key i.wait { border-color: var(--warning); } .key i.bad { border-color: var(--critical); }
.grid { overflow: auto; max-height: calc(100vh - 150px); }
.grid table { border-collapse: collapse; font-size: 12px; }
.grid th, .grid td { border: 1px solid var(--line); padding: 3px 6px; text-align: center; white-space: nowrap; }
.grid th { background: var(--surface); color: var(--ink2); font-weight: 500; position: sticky; top: 0; z-index: 2; }
.grid th.row { text-align: right; left: 0; z-index: 1; } .grid thead th.row { z-index: 3; }
.grid thead th:not(.row) { writing-mode: vertical-rl; transform: rotate(180deg); text-align: left; padding: 6px 3px; }
.grid td.n { cursor: pointer; font-weight: 600; background: color-mix(in srgb, var(--pick) calc(var(--w) * 1%), transparent); }
.grid td.own { color: var(--muted); }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--surface); padding: 4px 8px; border-radius: 6px; font-size: 12px; z-index: 30; max-width: 320px; }
.unknown-note { color: var(--ink2); font-style: italic; padding: 16px; }

.panel { position: fixed; top: 0; right: 0; width: 420px; max-width: 100vw; height: 100vh; overflow: auto; background: var(--surface); border-left: 1px solid var(--line);
  box-shadow: -8px 0 24px rgba(0,0,0,.18); padding: 14px 16px 28px; z-index: 20; }
.panel .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.panel h2 { font-size: 17px; margin: 0; font-weight: 650; } .panel h3 { font-size: 13px; margin: 18px 0 6px; font-weight: 600; }
.panel h3 small { font-weight: 400; color: var(--ink2); }
.panel .chip { display: inline-block; font-size: 11.5px; padding: 0 8px; line-height: 1.7; border-radius: 999px; border: 1px solid var(--line); color: var(--ink2); margin-right: 6px; }
.panel .desc { color: var(--ink2); font-size: 13px; margin: 8px 0; }
.panel .stat { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink2); margin-top: 10px; } .panel .stat b { font-size: 20px; font-weight: 600; display: block; color: var(--ink); }
.panel ul { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.panel li { padding: 5px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; } .panel li:last-child { border-bottom: 0; }
.panel li small { color: var(--muted); display: block; }
.panel .ev time { color: var(--muted); margin-right: 6px; font-size: 12px; } .panel .ev .re { display: block; color: var(--ink2); font-size: 12px; padding-left: 14px; }
.panel .states span { display: inline-block; border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; margin: 2px 4px 2px 0; font-size: 12px; }
.panel .go { background: none; border: none; color: var(--pick); padding: 0; cursor: pointer; text-decoration: underline; text-align: left; }
.panel .ev button.re { display: block; width: 100%; text-align: left; background: none; border: none; border-radius: 0; color: var(--ink2); font-size: 12px; padding: 2px 0 2px 14px; }
.panel .mark { font-weight: 600; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Pipeline Wiring</h1>
    <div class="tools">
      <div class="find"><input id="q" type="search" placeholder="Find a context, an aggregate or a policy" aria-label="Find a context, an aggregate or a policy" autocomplete="off"><ul class="hits" id="hits" hidden></ul></div>
      <button id="zout" type="button" aria-label="Zoom out">&minus;</button>
      <button id="zin" type="button" aria-label="Zoom in">+</button>
      <button id="fit" type="button">Fit</button>
      <button id="areas" type="button" aria-pressed="true">Areas</button>
      <button id="replay" type="button">Replay recent</button>
      <button id="toggle" type="button" aria-pressed="false">Show table</button>
    </div>
  </header>
  <p class="last"><span id="count">loading the wiring</span><span id="live">stream: connecting</span><span class="said" id="last" aria-live="polite">Messages show here as they cross.</span></p>
  <section class="stage" aria-label="Wiring">
    <svg id="map" role="img" aria-label="Each context as a block, in the direction its policies run, with a line for the policies between two contexts"></svg>
    <div class="grid" id="grid" hidden></div>
    <div class="key" id="key">
      <span><i></i>policies from one context to the next, thicker for more</span>
      <span><i class="back"></i>policies that run back against the flow</span>
      <span><i class="ok"></i>delivered</span><span><i class="wait"></i>waiting</span><span><i class="bad"></i>refused</span>
      <span>Click a block or a line to read its policies. Drag to pan.</span>
    </div>
  </section>
</main>
<div class="tip" id="tip" role="tooltip" hidden></div>
<aside class="panel" id="panel" hidden aria-label="Selected">
  <div class="top"><h2 id="ptitle"></h2><button id="pclose" type="button" aria-label="Close">&#10005;</button></div>
  <div id="pbody"></div>
</aside>
<script src="/stream.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const SVG_NS = $("map").namespaceURI;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
/* A lit line or block stays lit for LINGER ms after a message crosses it. */
const LINGER = 20000, W = 160, H = 50, GAP_X = 84, GAP_Y = 16;
const OUTCOME = { ok: "✓ delivered", wait: "▲ waiting", bad: "✕ refused" };

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) el.setAttribute(k, v);
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
}
function s(tag, attrs, ...kids) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined) el.append(kid.nodeType ? kid : String(kid));
  return el;
}
const clock = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }); };
const bare = (name) => String(name || "").split("::").pop();
/* A policy's name read as the sentence it was written as: RollWhenWorkIsPlanned, "Roll when work is planned". */
const sentence = (label) => { const words = String(label).replace(/([a-z0-9])([A-Z])/g, "$1 $2").replace(/([A-Z]+)([A-Z][a-z])/g, "$1 $2"); return words.charAt(0) + words.slice(1).toLowerCase(); };
const kept = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; } };
const keep = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* the choice lasts for this page only */ } };

/* ---- the graph as the board sends it, and the contexts it is drawn as ---- */
let nodes = [], edges = [], byId = new Map(), wiringDigest = null;
let units = new Map(), links = new Map(), order = [], splittable = [];
/* The domains drawn as one block although they declare areas. Empty: every area is its own block. */
let grouped = new Set(kept("wiring-grouped", []));
const unitKey = (n) => (n.context && !grouped.has(n.domain) ? n.domain + " / " + n.context : n.domain);

/* An adapter belongs to the context of the port it answers. */
function place() {
  for (const e of edges) if (e.kind === "adapter") { const p = byId.get(e.from), a = byId.get(e.to); if (p && a) { a.domain = p.domain; a.context = p.context; } }
  splittable = [...new Set(nodes.filter((n) => n.context).map((n) => n.domain))];
}
function gather() {
  units = new Map(); links = new Map();
  const unit = (key) => units.get(key) || units.set(key, { key, domain: key.split(" / ")[0], name: key.split(" / ")[1] || key, area: key.includes(" / "),
    aggregates: [], ports: [], adapters: [], inside: 0, ins: [], outs: [] }).get(key);
  for (const n of nodes) if (n.domain) unit(unitKey(n))[n.kind + "s"].push(n);
  for (const e of edges) {
    const a = byId.get(e.from), b = byId.get(e.to);
    if (e.kind === "adapter" || !a || !b || !a.domain || !b.domain) continue;
    const from = unitKey(a), to = unitKey(b);
    if (from === to) { units.get(from).inside++; continue; }
    const key = from + "→" + to, link = links.get(key) || links.set(key, { key, from, to, count: 0, edges: [] }).get(key);
    link.count++; link.edges.push(e);
  }
  for (const link of links.values()) { units.get(link.from).outs.push(link); units.get(link.to).ins.push(link); }
}

/* ---- layout: an order that most policies run along, then columns, then rows that keep neighbours close ---- */
/* The order: a context nothing reaches goes first, one that reaches nothing goes last, and of the rest the one
   that sends the most more than it hears. The few lines left pointing backwards are the feedback. */
function flowOrder(keys) {
  const rest = new Set(keys), left = [], right = [];
  const weigh = (key, side, end) => units.get(key)[side].reduce((sum, link) => sum + (rest.has(link[end]) ? link.count : 0), 0);
  const sent = (key) => weigh(key, "outs", "to"), heard = (key) => weigh(key, "ins", "from");
  while (rest.size) {
    let moved = true;
    while (moved) {
      moved = false;
      for (const key of [...rest]) if (rest.has(key) && sent(key) === 0) { right.unshift(key); rest.delete(key); moved = true; }
      for (const key of [...rest]) if (rest.has(key) && heard(key) === 0) { left.push(key); rest.delete(key); moved = true; }
    }
    if (!rest.size) break;
    const best = [...rest].reduce((m, key) => (sent(key) - heard(key) > sent(m) - heard(m) ? key : m));
    left.push(best); rest.delete(best);
  }
  return settle(left.concat(right));
}
/* Then each context is tried in every place, and kept where the fewest policies point backwards. */
function settle(start) {
  const against = (list) => { const at = new Map(list.map((key, i) => [key, i])); let sum = 0; for (const l of links.values()) if (at.get(l.from) > at.get(l.to)) sum += l.count; return sum; };
  let best = start, least = against(best);
  for (let pass = 0; pass < 6; pass++) {
    let better = false;
    for (const key of best.slice()) {
      const rest = best.filter((other) => other !== key);
      for (let i = 0; i <= rest.length; i++) { const trial = rest.slice(0, i).concat(key, rest.slice(i)), cost = against(trial); if (cost < least) { best = trial; least = cost; better = true; } }
    }
    if (!better) break;
  }
  return best;
}
let box = { w: 0, h: 0 };
function layout() {
  const wired = [...units.values()].filter((u) => u.ins.length || u.outs.length), alone = [...units.values()].filter((u) => !u.ins.length && !u.outs.length);
  order = flowOrder(wired.map((u) => u.key));
  const at = new Map(order.map((key, i) => [key, i]));
  for (const link of links.values()) link.back = at.get(link.from) > at.get(link.to);
  const ahead = (u) => u.outs.filter((link) => !link.back);
  for (const u of wired) u.layer = 0;
  for (const key of order) { const u = units.get(key); for (const link of ahead(u)) { const to = units.get(link.to); to.layer = Math.max(to.layer, u.layer + 1); } }
  // A context sits just before the first one it reaches, so its lines are short.
  for (const key of order.slice().reverse()) { const u = units.get(key), next = ahead(u).map((link) => units.get(link.to).layer); if (next.length) u.layer = Math.max(u.layer, Math.min(...next) - 1); }
  const cols = []; for (const key of order) { const u = units.get(key); (cols[u.layer] = cols[u.layer] || []).push(u); }
  const columns = cols.filter(Boolean);
  columns.forEach((col) => col.forEach((u, i) => { u.frac = (i + 0.5) / col.length; }));
  for (let pass = 0; pass < 8; pass++) for (const col of columns) {
    const near = (u) => [...u.ins.map((link) => units.get(link.from)), ...u.outs.map((link) => units.get(link.to))];
    const pull = (u) => { const list = near(u); return list.length ? list.reduce((sum, n) => sum + n.frac, 0) / list.length : u.frac; };
    col.map((u) => [u, pull(u)]).sort((a, b) => a[1] - b[1]).forEach(([u], i) => { u.row = i; u.frac = (i + 0.5) / col.length; });
    col.sort((a, b) => a.row - b.row);
  }
  const tall = Math.max(0, ...columns.map((col) => col.length * (H + GAP_Y) - GAP_Y));
  columns.forEach((col, c) => col.forEach((u, i) => { u.x = c * (W + GAP_X); u.y = (tall - (col.length * (H + GAP_Y) - GAP_Y)) / 2 + i * (H + GAP_Y); }));
  const backs = [...links.values()].filter((link) => link.back).sort((a, b) => Math.abs(units.get(a.from).x - units.get(a.to).x) - Math.abs(units.get(b.from).x - units.get(b.to).x));
  backs.forEach((link, i) => { link.dip = tall + 34 + i * 9; });
  const under = tall + (backs.length ? 40 + backs.length * 9 * 0.75 : 0) + 44, wide = Math.max(1, columns.length) * (W + GAP_X) - GAP_X;
  const perRow = Math.max(1, Math.floor((wide + 16) / (W + 16)));
  alone.sort((a, b) => a.key.localeCompare(b.key)).forEach((u, i) => { u.x = (i % perRow) * (W + 16); u.y = under + Math.floor(i / perRow) * (H + GAP_Y); u.layer = -1; });
  box = { w: wide, h: alone.length ? under + Math.ceil(alone.length / perRow) * (H + GAP_Y) : under - 44, alone: alone.length ? under - 12 : null };
  for (const u of units.values()) slots(u);
}
/* Where each line leaves and enters a block: spread down its side in the order of the blocks at the other end. */
function slots(u) {
  const spread = (list, end, set) => list.filter((link) => !link.back).sort((a, b) => units.get(a[end]).y - units.get(b[end]).y)
    .forEach((link, i, all) => { link[set] = u.y + H / 2 + (i - (all.length - 1) / 2) * Math.min(8, (H - 14) / Math.max(1, all.length - 1)); });
  spread(u.outs, "to", "y1"); spread(u.ins, "from", "y2");
}
function pathOf(link) {
  const a = units.get(link.from), b = units.get(link.to);
  if (link.back) { const x1 = a.x + W / 2 - 12, x2 = b.x + W / 2 + 12; return { d: `M${x1} ${a.y + H} C${x1} ${link.dip + 30} ${x2} ${link.dip + 30} ${x2} ${b.y + H + 6}`, head: `M${x2 - 5} ${b.y + H + 7} L${x2} ${b.y + H} L${x2 + 5} ${b.y + H + 7}Z` }; }
  const x1 = a.x + W, x2 = b.x - 6, bend = Math.max(34, (x2 - x1) / 2);
  return { d: `M${x1} ${link.y1} C${x1 + bend} ${link.y1} ${x2 - bend} ${link.y2} ${x2} ${link.y2}`, head: `M${x2 - 1} ${link.y2 - 5} L${x2 + 6} ${link.y2} L${x2 - 1} ${link.y2 + 5}Z` };
}

/* ---- drawing: built once for a layout; what is picked, found or lit is classes on what was built ---- */
const map = $("map");
function draw() {
  const lines = s("g", {}), blocks = s("g", {}), dots = s("g", { id: "dots" });
  const most = Math.max(1, ...[...links.values()].map((link) => link.count));
  for (const link of [...links.values()].sort((a, b) => a.count - b.count)) {
    const { d, head } = pathOf(link), width = 1 + 4 * Math.sqrt(link.count / most);
    link.el = s("g", { class: "link" + (link.back ? " back" : ""), "data-link": link.key },
      s("path", { class: "line", d, "stroke-width": width.toFixed(1) }), s("path", { class: "head", d: head }), s("path", { class: "hit", d }), s("text", {}, String(link.count)));
    lines.append(link.el);
  }
  for (const u of units.values()) {
    const parts = [u.aggregates.length + (u.aggregates.length === 1 ? " aggregate" : " aggregates"), u.inside ? u.inside + " inside" : null].filter(Boolean).join(", ");
    u.el = s("g", { class: "unit", "data-unit": u.key, transform: `translate(${u.x} ${u.y})`, tabindex: "0", role: "button", "aria-label": u.key },
      s("rect", { class: "box", width: W, height: H, rx: 9 }),
      u.area ? s("text", { class: "cap", x: W - 10, y: 16, "text-anchor": "end" }, u.domain) : null,
      s("text", { class: "name", x: 12, y: 21 }, u.name), s("text", { class: "sub", x: 12, y: 38 }, parts));
    blocks.append(u.el);
  }
  const band = box.alone === null ? [] : [s("text", { class: "band", x: 0, y: box.alone }, "Wired to no other context")];

/* ---- the view: fitted to the map, moved by dragging and the buttons ---- */
let view = { x: 0, y: 0, w: 100, h: 100 }, touched = false;
const show = () => map.setAttribute("viewBox", [view.x, view.y, view.w, view.h].join(" "));

map.addEventListener("keydown", (e) => { const unit = e.target.closest(".unit"); if (unit && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pick({ unit: unit.dataset.unit }); } });

/* ---- what is picked, found and lit ---- */

function pick(what) {

/* ---- the side panel: a context, a line between two, or one aggregate ---- */
const recent = [];
let waiting = null;
function remember(ev) { const i = recent.findIndex((held) => held.key === ev.key); if (i >= 0) recent[i] = ev; else { recent.push(ev); if (recent.length > 800) recent.shift(); } }
const section = (title, ...kids) => [h("h3", {}, title), ...kids];
const go = (what, text) => { const b = h("button", { class: "go", type: "button" }, text); b.addEventListener("click", () => pick(what)); return b; };
/* One policy as a sentence, with the two aggregates it joins. */
function said(e) {

}
let slid = false;

}

}
function unitPanel(u) {

    u.ports.length ? section("Ports", h("ul", {}, u.ports.map((p) => h("li", {}, go({ node: p.id }, p.label), h("small", {}, edges.filter((e) => e.kind === "adapter" && e.from === p.id).map((e) => bare(byId.get(e.to) ? byId.get(e.to).label : e.to)).join(", ") || "no adapter bound"))))) : null,
  ]];
}

    h("div", {}, h("span", { class: "chip" }, l.count + (l.count === 1 ? " policy" : " policies")), l.back ? h("span", { class: "chip" }, "against the flow") : null),

}

    section("Live", h("div", { class: "stat" }, h("span", {}, h("b", {}, String(mine.filter((ev) => now - Date.parse(ev.at) < 600000).length)), "events, 10 min"),
      h("span", {}, h("b", {}, String(outcomes.length - refused)), "delivered"), h("span", {}, h("b", { class: refused ? "bad" : null }, String(refused)), "refused"), h("span", {}, h("b", {}, last ? clock(last) : "—"), "last seen")),

/* A reaction in the panel. A waiting one is a button that opens its read-only detail; the rest are labels. */

/* The read-only view of one waiting reaction. It reads the newest copy of the event while it is still held. */

  const back = h("button", { type: "button" }, "Back"); back.addEventListener("click", () => { waiting = null; renderPanel(); });

    h("ul", {}, fact("Policy", String(r.policy)), fact("Command it reached", r.command ? String(r.command) : "none"), fact("Outcome", r.outcome ? String(r.outcome) : "no outcome recorded"),
      fact("Event it answered", String(live.name)), fact("Aggregate", String(live.aggregate || "")), fact("Event at", live.at ? clock(live.at) + " (" + live.at + ")" : ""))];
}
$("pclose").addEventListener("click", () => { waiting = null; pick(null); });
addEventListener("keydown", (e) => { if (e.key === "Escape") { waiting = null; pick(null); $("hits").hidden = true; } });

/* ---- find: a context, an aggregate or a policy, by any part of its name ---- */
function find() {
  const text = $("q").value.trim().toLowerCase(), hits = $("hits");
  if (!text) { found = null; hits.hidden = true; mark(); return; }
  const rows = [], has = (value) => String(value).toLowerCase().includes(text);
  found = new Set();
  for (const u of units.values()) if (has(u.key)) { found.add(u.key); rows.push(["context", u.key, { unit: u.key }]); }
  for (const n of nodes) if (n.domain && n.kind !== "adapter" && has(n.label)) { found.add(unitKey(n)); rows.push([n.kind, n.label, { node: n.id }]); }
  // A policy between two contexts opens their line; one inside a context opens the aggregate it starts from.
  for (const e of edges) {
    const a = byId.get(e.from), b = byId.get(e.to);
    if (e.kind === "adapter" || !a || !b || !a.domain || !b.domain || !(has(e.label) || has(sentence(e.label)))) continue;
    const from = unitKey(a), to = unitKey(b); found.add(from); found.add(to);
    rows.push(["policy", sentence(e.label), from === to ? { node: a.id } : { link: from + "→" + to }]);
  }
  hits.replaceChildren(...(rows.length ? rows.slice(0, 14).map(([kind, label, what]) => { const b = h("button", { type: "button" }, h("small", {}, kind), label); b.addEventListener("click", () => { hits.hidden = true; pick(what); }); return h("li", {}, b); })
    : [h("li", { class: "note", style: "padding:6px 8px" }, "Nothing in the wiring has that name.")]));

}
$("q").addEventListener("input", find);
$("q").addEventListener("focus", () => { if ($("q").value.trim()) $("hits").hidden = false; });
document.addEventListener("pointerdown", (e) => { if (!e.target.closest(".find")) $("hits").hidden = true; });

/* ---- the table: how many policies run from each context (row) to each other (column) ---- */
function renderGrid() {
  const keys = order.concat([...units.keys()].filter((key) => !order.includes(key))), most = Math.max(1, ...[...links.values()].map((l) => l.count));
  const cell = (from, to) => {
    if (from === to) return h("td", { class: "own", title: from + ": policies inside" }, units.get(from).inside || "");
    const l = links.get(from + "→" + to); if (!l) return h("td", {});
    const td = h("td", { class: "n", style: "--w:" + Math.round(12 + 60 * l.count / most), title: from + " → " + to }, String(l.count)); td.addEventListener("click", () => pick({ link: l.key })); return td;
  };
  $("grid").replaceChildren(h("table", {}, h("thead", {}, h("tr", {}, h("th", { class: "row" }, "from ↓  to →"), keys.map((key) => h("th", {}, key)))),
    h("tbody", {}, keys.map((from) => h("tr", {}, h("th", { class: "row" }, from), keys.map((to) => cell(from, to)))))));
}

/* ---- messages: a policy that ran lights the line it crosses, in its outcome's colour ---- */
const seen = new Map(), dots = [];
const outcomeKind = (text) => (/deliver/.test(text) ? "ok" : /refus|fail/.test(text) ? "bad" : "wait");
function heat(u, now) { u.hot = now + LINGER; u.el.classList.add("hot"); }
function fire(ev, animate) {
  const now = performance.now(), node = byId.get(ev.aggregate);

    const name = bare(r.policy), kind = outcomeKind(r.outcome || ""), token = ev.key + "|" + name + "|" + kind;
    if (seen.has(token)) continue; seen.set(token, true);

    $("last").replaceChildren(h("time", {}, clock(ev.at)), h("b", {}, ev.name), sentence(name), h("span", { class: kind }, OUTCOME[kind]));

}

}

    pause: () => { $("live").textContent = "stream: paused"; },
    wiring: (m) => { if (m && wiringDigest && m.digest !== wiringDigest) loadWiring(false); },

    } });
}

/* ---- buttons, and the graph: read at load and again whenever the stream says the bluebooks are drawn differently ---- */
function redraw() {

  $("count").textContent = units.size + " contexts, " + nodes.filter((n) => n.kind === "aggregate").length + " aggregates, " + policies + " policies, " + between + " of them between contexts";
