<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Settings</title>
<!--style--><style>
/* The Settings page: the limits this machine runs the pipeline under. One row is one setting: what it does, where
   its value sits between the least and the most it may be, and a field to change it. */
h1, h2, p, ul { margin: 0; }
:focus-visible { outline: 2px solid var(--run); outline-offset: 2px; border-radius: 4px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; margin-bottom: 18px; }
.note { color: var(--ink2); font-size: 12.5px; }
.overview { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; }
.headline { font-size: clamp(20px, 2.8vw, 28px); line-height: 1.2; letter-spacing: -.015em; font-weight: 400; text-wrap: balance; }
.headline b { font-weight: 650; }
.headline small { display: block; margin-top: 8px; font-size: 14px; letter-spacing: 0; color: var(--ink2); }
section.group { margin-top: 26px; }
section.group > h2 { font-size: 16px; font-weight: 650; margin: 0 4px 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 18px; }
.card ul { list-style: none; padding: 0; }
.dial { display: grid; grid-template-columns: minmax(0, 1fr) minmax(120px, 240px) auto; gap: 6px 24px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.dial:last-child { border-bottom: 0; }
.dial .what { font-size: 14px; } .dial .what small { display: block; font: 11.5px var(--mono); color: var(--muted); margin-top: 2px; }
.dial .what .mark { font: inherit; font-family: inherit; display: inline-block; margin-left: 8px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink2); font-size: 11px; }
/* Where the value stands between its bounds. */
.range { font-size: 11.5px; color: var(--muted); }
.range .track { position: relative; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 8%, transparent); margin-bottom: 4px; }
.range .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--run); }
.range .ends { display: flex; justify-content: space-between; }
.turn { display: flex; gap: 6px; }
.turn input, .turn select { width: 92px; font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.turn button { font: inherit; font-size: 13px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); cursor: pointer; }
.turn button:hover { border-color: var(--run); } .turn button:disabled { opacity: .5; cursor: default; }
.dial .said { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink2); } .dial .said:empty { display: none; } .dial .said.bad { color: var(--critical); }
/* Each group answers one question, and shows the live numbers its settings move beside them. */
section.group > h2 small { font-weight: 400; font-size: 12.5px; color: var(--ink2); margin-left: 8px; }
.moves { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 0 0 10px; }
.move { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.move b { display: block; font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.move span { display: block; font-size: 12px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.move.none b { color: var(--muted); font-size: 14px; font-weight: 500; }
.move svg { display: block; width: 100%; height: 28px; margin-top: 4px; }
.dial .what .mark.out { border-color: var(--critical); color: var(--critical); }
.dial .now { display: inline-block; min-width: 3ch; text-align: right; font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; }
.dial .now.changed, .dial select.changed { color: var(--run); }
.power { display: flex; align-items: center; gap: 14px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.power b { display: block; font-size: 15px; } .power span { display: block; font-size: 13px; color: var(--ink2); }
#power-switch { position: relative; width: 52px; height: 30px; border-radius: 999px; border: 1px solid var(--line); background: color-mix(in srgb, var(--ink) 14%, transparent); cursor: pointer; padding: 0; flex: none; }
#power-switch i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .15s; }
#power-switch[aria-checked="true"] { background: var(--run); border-color: var(--run); } #power-switch[aria-checked="true"] i { left: 25px; }
#power-switch.changed { outline: 2px solid var(--run); outline-offset: 2px; }
.savebar { position: sticky; bottom: 0; display: flex; align-items: center; gap: 10px; margin-top: 26px; padding: 12px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px 12px 0 0; }
.savebar #pending { margin-right: auto; font-size: 13.5px; color: var(--ink2); }
.savebar button { padding: 7px 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; }
.savebar button.primary { background: var(--run); border-color: var(--run); color: #fff; font-weight: 600; }
.savebar button:disabled { opacity: .45; cursor: default; }
.range input[type=range] { width: 100%; margin: 0 0 2px; accent-color: var(--run); cursor: pointer; }
.dial .turn input.changed { outline: 2px solid var(--run); }
/* Whether each setting is in force now, standing by, or without effect, and Signalbox's marks beside the numbers they mirror. */
.dial .force { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink2); }
.dial .force b { font-weight: 650; margin-right: 6px; }
.dial.without_effect .what, .dial.without_effect .range { opacity: .55; }
.dial.without_effect .force b { color: var(--critical); }
.dial.standing_by .force b { color: var(--muted); }
.dial.mark .now { font-size: 14px; }
.dial.mark .beside { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink2); }
.governs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 14px; }
.governs div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 12.5px; color: var(--ink2); }
.governs b { display: block; font-size: 13.5px; color: var(--ink); }
@media (max-width: 760px) { .dial { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>Settings</h1>
    <!--nav-->
    <span class="note" id="updated"></span>
  </header>
  <div class="overview"><p class="headline" id="headline">Reading the settings</p>
    <div class="power" id="power" hidden><button type="button" id="power-switch" role="switch" aria-checked="false"><i></i></button>
      <div><b id="power-word"></b><span id="power-says"></span></div></div>
    <div class="governs" id="governs"></div></div>
  <div id="groups"></div>
  <footer class="savebar"><span id="pending">No unsaved changes.</span><button type="button" id="cancel" disabled>Cancel</button><button type="button" id="save" class="primary" disabled>Save</button></footer>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) el.setAttribute(k, v);
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
}
const unset = (v) => v === null || v === undefined;
/* The value as words: a switch is on or off, a whole number has no point. */
const shown = (d) => (unset(d.value) ? "not set" : d.kind === "switch" ? (d.value ? "on" : "off") : d.kind === "choice" ? String(d.value) : String(Number(d.value)));
/* What the owner has moved and not yet saved: setting name to the new value as text. */
const pending = new Map();
function changed(d, value) {
  const same = d.kind === "switch" ? (value === "on") === (d.value === true) : d.kind === "choice" ? value === d.value : Number(value) === Number(d.value);
  if (same) pending.delete(d.setting); else pending.set(d.setting, value);
  bar();
}
/* A slider between the setting's bounds with its value beside it; nothing is set until Save. */
function control(d) {
  if (d.kind === "choice") {
    const words = d.least.split("|"), said = (d.means || "").split("|");
    const pick = h("select", { "aria-label": d.says }, words.map((w) => h("option", w === d.value ? { selected: "" } : {}, w)));
    pick.addEventListener("change", () => { pick.classList.toggle("changed", pick.value !== d.value); changed(d, pick.value); });
    return [h("div", { class: "range" }, h("ul", { class: "means" }, said.map((m) => h("li", {}, m)))), h("div", { class: "turn" }, pick)];
  }
  if (d.kind === "switch") {
    const pick = h("select", { "aria-label": d.says }, ["on", "off"].map((w) => h("option", (d.value === true) === (w === "on") ? { selected: "" } : {}, w)));
    pick.addEventListener("change", () => { pick.classList.toggle("changed", (pick.value === "on") !== (d.value === true)); changed(d, pick.value); });
    return [h("div", { class: "range" }), h("div", { class: "turn" }, pick)];
  }
  const least = Number(d.least), most = Number(d.most), at = unset(d.value) ? least : Math.min(most, Math.max(least, Number(d.value)));
  const slider = h("input", { type: "range", min: d.least, max: d.most, step: d.kind === "integer" ? "1" : "0.5", value: at, "aria-label": d.says });
  const now = h("output", { class: "now" }, shown(d));
  slider.addEventListener("input", () => { now.textContent = String(Number(slider.value)); now.classList.toggle("changed", Number(slider.value) !== Number(d.value)); changed(d, slider.value); });
  return [h("div", { class: "range", title: "between " + d.least + " and " + d.most }, slider, h("div", { class: "ends" }, h("span", {}, d.least), h("span", {}, d.most))),
    h("div", { class: "turn" }, now)];
}
function row(d, note) {
  const said = h("p", { class: "said" + (note && note.bad ? " bad" : ""), "aria-live": "polite" }, note ? note.text : "");
  const f = d.force || { state: "in_force", why: "" };
  return h("li", { class: "dial " + f.state }, h("div", { class: "what" }, SAYS[d.setting] || d.says, d.turned ? h("span", { class: "mark" }, "set here") : null, outside(d) ? h("span", { class: "mark out" }, "outside " + d.least + " to " + d.most) : null, h("small", {}, d.setting)),
    ...control(d), h("p", { class: "force" }, h("b", {}, STATE[f.state] || f.state), f.why), said);
}
/* The words for a setting's state, and the rows whose declared words hold only while their side governs. */
const STATE = { in_force: "In force now.", standing_by: "Standing by.", without_effect: "Without effect now." };
const SAYS = { "dispatch_max_load.limit": "The load above which Tickets' own guard starts no session (Signalbox's short mark replaces it while its signal is current)",
  "work_limit.cap": "Work items that may be started at once while the work cap is fixed and Signalbox does not admit" };
/* One side per question: which number governs a start at this moment. */
function governs(g) {
  const names = { load: "Load", admission: "Admission", protection: "Protection", reaping: "Reaping" };
  $("governs").replaceChildren(...Object.keys(names).filter((k) => g && g[k]).map((k) => h("div", {}, h("b", {}, names[k] + ": " + g[k].side), g[k].says)));
}
/* A Signalbox mark as a read-only row beside the Tickets setting that means the same. */
function markRow(m, dials) {
  const twin = m.beside && dials.find((x) => x.setting === m.beside.setting);
  const load = m.beside && m.beside.load !== null && m.beside.load !== undefined ? " (a load of " + m.beside.load + ")" : "";
  const said = m.beside ? "Beside " + m.beside.setting + (twin ? " " + shown(twin) : "") + load + "." : "";
  return h("li", { class: "dial mark" }, h("div", { class: "what" }, m.name.replaceAll("_", " "), h("span", { class: "mark" }, "Signalbox, read only"), h("small", {}, "Signalbox " + m.verb + "." + m.name)),
    h("div", {}), h("div", { class: "turn" }, h("output", { class: "now" }, String(m.value) + (m.unit ? " " + m.unit : ""))), said ? h("p", { class: "beside" }, said) : null);
}
/* The bar at the foot of the page: how many settings are moved, Save and Cancel. */
function bar() {
  const n = pending.size;
  $("save").disabled = $("cancel").disabled = n === 0;
  $("pending").textContent = n === 0 ? "No unsaved changes." : n + (n === 1 ? " setting" : " settings") + " changed, not saved yet.";
}
/* Saves each moved setting through the board's one write, one after another; a refusal is said on its row. */
async function save() {
  $("save").disabled = $("cancel").disabled = true; $("pending").textContent = "Saving";
  const notes = new Map();
  for (const [setting, value] of [...pending]) {
    try {
      const a = await fetch("/api/act", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "turn", target: setting, text: value, confirm: true }) }).then((r) => r.json());
      if (a.error) notes.set(setting, { text: "Not set: " + String(a.error).split(": ").pop(), bad: true });
      else { notes.set(setting, { text: "Set to " + value + ". A process that is already running reads it when it next starts." }); pending.delete(setting); }
    } catch (e) { notes.set(setting, { text: "Not set: " + e.message, bad: true }); }
  }
  pending.clear(); await load(notes);
}
function cancel() { pending.clear(); load(); }
/* The few numbers that say how hard the machine is driven, as one sentence. */
function headline(dials, moving, extra) {
  const of = (name) => dials.find((d) => d.setting === name), cap = of("work_limit.cap"), load = of("dispatch_max_load.limit"), heavy = of("heavy_jobs.cap");
  const changed = dials.filter((d) => d.turned).length;
  const p = $("headline"); p.replaceChildren();
  if (cap && load) p.append("Up to ", h("b", {}, moving ? String(moving.current) : shown(cap)), " Work items at once, and no new session ", h("b", {}, extra && extra.governs && extra.governs.load.side === "Signalbox" ? "while Signalbox's band is short" : "above a load of " + shown(load)), ...(heavy ? [", with ", h("b", {}, shown(heavy)), " heavy jobs at a time"] : []), ".");
  else p.append(dials.length ? "The limits this machine runs the pipeline under." : "No setting can be set from here.");
  p.append(h("small", { id: "cap-line" }, capLine(moving, cap)));
  p.append(h("small", {}, changed ? changed + (changed === 1 ? " setting was" : " settings were") + " set from here. " : "", "A change is kept on this machine only and is never committed."));
}
/* The work cap in one line: where the moving cap stands between its bounds and why, or the fixed cap. */
function capLine(moving, cap) {
  if (!moving) return "Work cap " + (cap ? shown(cap) : "not set") + ", fixed.";
  return "Work cap " + moving.current + ", moving between " + moving.least + " and " + moving.most + ": " + (moving.reason || "holding, no move yet") + ".";
}
/* A value the dial's own bounds do not allow: set by hand in the overlay file, such as a pause at 0. */
const outside = (d) => d.kind !== "switch" && d.kind !== "choice" && !unset(d.value) && (Number(d.value) < Number(d.least) || Number(d.value) > Number(d.most));
/* The three questions the settings answer, the settings under each, and the live numbers each one moves.
   A number the board does not measure yet is said so, not left out. */
const GROUPS = [
  { title: "How much work runs", says: "how many coders start, and whether the fill starts them by itself",
    has: ["work_limit.", "work_cap.", "epic_wip_limit.", "dispatch_roll_forward."],
    moves: [["metric", "working", "coders dispatched"], ["metric", "throughput", "work finished"], ["stage", "Work items", "planned / started / done"], ["metric", "ahead", "commits not pushed"]] },
  { title: "How hard the machine is pushed", says: "when the fill holds back and when it sheds work",
    has: ["dispatch_max_load.", "machine_marks.", "load_shed.", "cpu_budget."],
    moves: [["load", "", "load, last hour"], ["metric", "boots", "boot hours today"], ["metric", "disk", "disk free"], ["band", "", "memory pressure"], ["headroom", "", "memory headroom"]] },
  { title: "Which side decides", says: "the switches that put Signalbox, not the Tickets numbers, in charge",
    has: ["signalbox_pressure.", "signalbox_response.", "admission.", "protection.", "reaping.", "metering."], moves: [] },
  { title: "How landings are verified", says: "what a landed commit is checked with on this machine",
    has: ["main_verification."], moves: [] },
  { title: "How fast landings clear", says: "how many gates and spec runs go at once",
    has: ["heavy_jobs.", "spec_workers.", "rust_build."],
    moves: [["metric", "carry", "landed to pushed"], ["metric", "lead", "commit to green CI"], ["none", "", "heavy-slot queue"], ["none", "", "handed to landed"], ["none", "", "landings an hour"]] },
];
function spark(samples) {
  const pts = samples.slice(-360).map((p) => Number(p[1])).filter((n) => !Number.isNaN(n)); if (pts.length < 2) return null;
  const top = Math.max(...pts, 1), w = 200, hgt = 28, step = w / (pts.length - 1);
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.setAttribute("viewBox", "0 0 " + w + " " + hgt); svg.setAttribute("preserveAspectRatio", "none");
  const line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
  line.setAttribute("points", pts.map((n, i) => (i * step).toFixed(1) + "," + (hgt - (n / top) * (hgt - 2) - 1).toFixed(1)).join(" "));
  line.setAttribute("fill", "none"); line.setAttribute("stroke", "currentColor"); line.setAttribute("stroke-width", "1.5"); svg.append(line); return svg;
}
function move([kind, id, label], state) {
  if (kind === "metric") { const m = (state.metrics || []).find((x) => x.id === id); if (m && m.value !== null && m.value !== undefined) return h("div", { class: "move", title: m.detail || "" }, h("b", {}, m.value + " " + (m.unit || "")), h("span", {}, label)); }
  if (kind === "stage") { const st = (state.stages || []).find((x) => x.name === id); if (st) return h("div", { class: "move", title: st.detail || "" }, h("b", {}, st.count), h("span", {}, label)); }
  if (kind === "load") { const sm = (state.load_history || {}).samples || []; if (sm.length) return h("div", { class: "move" }, h("b", {}, Number(sm[sm.length - 1][1]).toFixed(1)), h("span", {}, label), spark(sm)); }
  if (kind === "band" && lastSignal) return h("div", { class: "move", title: "Signalbox's posted signal" }, h("b", {}, lastSignal.band), h("span", {}, label));
  if (kind === "headroom" && lastSignal) return h("div", { class: "move", title: "Signalbox's posted signal" }, h("b", {}, Math.round(Number(lastSignal.headroom)) + " MB"), h("span", {}, label));
  const dark = kind === "band" || kind === "headroom";
  return h("div", { class: "move none", title: "No reading reaches the board for this" }, h("b", {}, dark ? "signal dark" : "no reading"), h("span", {}, label));
}
let lastState = {}, lastSignal = null;
/* The one switch that stops and starts new work: the fill's roll-forward. The limits stay as they are. */
const ROLL = "dispatch_roll_forward.roll_forward";
function power(d) {
  $("power").hidden = !d; if (!d) return;
  const want = pending.has(ROLL) ? pending.get(ROLL) === "on" : d.value === true, sw = $("power-switch");
  sw.setAttribute("aria-checked", String(want)); sw.classList.toggle("changed", pending.has(ROLL));
  $("power-word").textContent = want ? "New work is running" : "New work is stopped";
  $("power-says").textContent = (want ? "The fill starts planned work by itself, up to the limits below." : "The fill starts nothing; running coders and queued landings finish. The limits below stay as they are.")
    + (pending.has(ROLL) ? " Not saved yet." : "");
  sw.onclick = () => { changed(d, want ? "off" : "on"); power(d); };
}
function draw(dials, note, moving, extra) {
  lastSignal = (extra && extra.signal) || null; governs(extra && extra.governs);
  const marks = (extra && extra.marks) || [];
  headline(dials, moving, extra);
  const taken = new Set(), sections = GROUPS.map((g) => {
    const rows = dials.filter((d) => d.setting !== ROLL && g.has.some((start) => d.setting.startsWith(start))); rows.forEach((d) => taken.add(d.setting));
    return rows.length ? h("section", { class: "group" }, h("h2", {}, g.title, h("small", {}, g.says)), h("div", { class: "moves" }, g.moves.map((m) => move(m, lastState))),
      h("div", { class: "card" }, h("ul", {}, rows.map((d) => row(d, note && note.get(d.setting))), marks.filter((m) => m.group === g.title).map((m) => markRow(m, dials))))) : null;
  });
  const rest = dials.filter((d) => d.setting !== ROLL && !taken.has(d.setting));
  if (rest.length) sections.push(h("section", { class: "group" }, h("h2", {}, "Other"), h("div", { class: "card" }, h("ul", {}, rest.map((d) => row(d, note && note.get(d.setting)))))));
  $("groups").replaceChildren(...sections.filter(Boolean));
  power(dials.find((d) => d.setting === ROLL));
  $("updated").textContent = "read " + new Date().toLocaleTimeString();
  bar();
}
function load(notes) {
  const state = fetch("/api/state", { cache: "no-store" }).then((r) => r.json()).then((st) => { if (st && Array.isArray(st.metrics) && st.metrics.length) lastState = st; }).catch(() => {});
  // A board that has just started has no numbers yet: ask again shortly, unless something is moved and unsaved.
  state.then(() => { if (!(lastState.metrics || []).length) setTimeout(() => { if (!pending.size) load(); }, 10000); });
  return state.then(() => fetch("/api/settings", { cache: "no-store" })).then((r) => r.json()).then((s) => draw(s.dials || [], notes || null, s.cap || null, s))
    .catch((e) => { $("headline").textContent = "The settings could not be read: " + e.message; });
}
$("save").addEventListener("click", save); $("cancel").addEventListener("click", cancel);
load();
</script>
</body>
</html>
