<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Board</title>
<!--style--><style>
.stale-banner { border-left: 4px solid var(--critical); padding: 8px 12px; margin-bottom: 12px; background: var(--page); border-radius: 0 6px 6px 0; font-size: 14px; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
h2 { font-size: 14px; margin: 0 0 8px; color: var(--ink); font-weight: 650; }
.meta { color: var(--ink2); font-size: 13px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--series1); outline-offset: 2px; }
section { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; min-height: 108px; }
.tile .label { color: var(--ink2); font-size: 12px; }
.tile .num { font-size: 30px; line-height: 1.15; font-weight: 600; }
.tile .unit { font-size: 13px; color: var(--ink2); font-weight: 400; margin-left: 4px; }
.tile .note { color: var(--muted); font-size: 12px; margin-top: 2px; }
/* One file, two pages. The Sessions page shows the sessions and nothing else; the board shows everything but them. */
body.view-sessions main > section, body.view-sessions main > details:not(#sessions-panel), body.view-sessions #toggle { display: none; }
body:not(.view-sessions) #sessions-panel { display: none; }
body.view-sessions #sessions-panel > summary { pointer-events: none; } body.view-sessions #sessions-panel > summary::before { display: none; }
/* A box never grows into a wall of text: it shows its first lines, and the row or tile opens the rest. */
/* Machine load: the span chosen as one filled line, green under the limit a fill stops at and red over it. */
.load .label { color: var(--ink2); font-size: 13px; margin-bottom: 6px; } .load .label b { color: var(--ink); font-size: 20px; font-weight: 600; margin-right: 4px; }
.load svg { display: block; width: 100%; height: 120px; border-bottom: 1px solid var(--axis); }
.load .fill { stroke: none; opacity: .28; } .load .line { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.load .under { fill: var(--good); stroke: var(--good); } .load .over { fill: var(--critical); stroke: var(--critical); }
.load .limit { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 5 5; vector-effect: non-scaling-stroke; }
.load .spans { float: right; display: inline-flex; gap: 4px; } .load .spans button { font-size: 11.5px; padding: 1px 9px; border-radius: 999px; }
.load .spans button[aria-pressed="true"] { border-color: var(--run); color: var(--run); }
.causes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 4px 28px; margin-top: 14px; }
.causes:empty { display: none; } .causehead { grid-column: 1 / -1; font-size: 12px; color: var(--ink2); margin-bottom: 2px; }
.cause { display: grid; grid-template-columns: 120px 1fr 48px; gap: 8px; align-items: center; font-size: 12.5px; }
.cause .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .cause small { color: var(--muted); }
.cause .track { height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--ink) 7%, transparent); overflow: hidden; }
.cause .fill { display: block; height: 100%; border-radius: 4px; background: var(--ink2); } .cause .pct { text-align: right; color: var(--ink2); }
.loadaxis { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 4px; }
/* Work finished per day: one bar a day, today's lighter because the day is still open. */
.thru .label { color: var(--ink2); font-size: 13px; margin-bottom: 4px; }
.thru .cols { height: 120px; gap: 6px; } .thru .xlabels { gap: 6px; margin-top: 4px; }
.thru .col .bar { max-width: none; background: var(--good); } .thru .col.today .bar { opacity: .45; }
.thru .col.today .val, .thru .xlabels span:last-child { color: var(--ink); font-weight: 600; }
#resolve-detail { max-height: 50vh; overflow: auto; overflow-wrap: anywhere; font-size: 13px; line-height: 1.5; }
#resolve-detail p { margin: 0; } #resolve-detail .parts { margin: 0; padding: 0; list-style: none; }
#resolve-detail .parts li { padding: 7px 0; border-top: 1px solid var(--border); color: var(--ink2); }
#resolve-detail .parts li:first-child { border-top: 0; padding-top: 0; }
#resolve-detail .parts b { display: block; color: var(--ink); font-weight: 600; }
/* A panel's heading says each thing in one line; the tiles under it hold the detail. */
details.panel > summary .sum > span { max-width: min(100%, 64ch); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.panel.unread > :not(summary) { display: none; } details.panel.unread[open] > summary { border-bottom: 0; border-radius: 10px; }
details.panel.unread > summary { cursor: default; } details.panel.unread > summary::before { visibility: hidden; }
details.panel > h2 { margin: 14px 14px 0; }
.tile .trend { font-size: 12px; color: var(--ink2); }
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0; }
.node { position: relative; border: 1px solid var(--border); padding: 10px; margin-right: 14px; border-radius: 8px; min-height: 112px; }
.node:not(:last-child)::after { content: "\2192"; position: absolute; right: -14px; top: 40%; width: 14px; text-align: center; color: var(--muted); }
.node .name { font-size: 12px; color: var(--ink2); }
.node .count { font-size: 22px; font-weight: 600; overflow-wrap: anywhere; }
.node .detail { font-size: 12px; color: var(--ink2); overflow-wrap: anywhere; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; line-height: 1.3; padding: 1px 7px; border-radius: 999px; color: var(--on-fill); white-space: nowrap; width: max-content; }
.badge.ok { background: var(--good); } .badge.attention { background: var(--warning); color: var(--on-warning); }
.badge.failed { background: var(--critical); } .badge.working { background: var(--series1); }
.badge.unknown { background: transparent; color: var(--ink2); border: 1px dashed var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.cols { display: flex; align-items: flex-end; gap: 4px; height: 140px; border-bottom: 1px solid var(--axis); padding-top: 18px; }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
.col .bar { width: 100%; max-width: 34px; background: var(--series1); border-radius: 4px 4px 0 0; min-height: 0; }
.col .bar.second { background: var(--series2); }
.col .val { font-size: 11px; color: var(--ink2); }
.xlabels { display: flex; gap: 4px; }
.xlabels span { flex: 1; font-size: 10px; color: var(--muted); text-align: center; overflow: hidden; text-overflow: clip; white-space: nowrap; }
.hbar { display: grid; grid-template-columns: minmax(90px, 36%) 1fr 52px; gap: 8px; align-items: center; margin: 5px 0; font-size: 12px; }
.hbar .track { height: 12px; }
.hbar .fill { height: 100%; background: var(--series1); border-radius: 0 4px 4px 0; }
.hbar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cycle { display: grid; grid-template-columns: minmax(90px, 30%) 1fr 64px; gap: 8px; align-items: center; margin: 5px 0; font-size: 12px; }
.cycle .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cycle .bar { display: flex; height: 12px; }
.cycle .seg { height: 100%; min-width: 2px; }
.cycle .s0 { background: var(--series1); } .cycle .s1 { background: var(--series2); }
.cycle .s2 { background: var(--good); } .cycle .s3 { background: var(--warning); }
.cycle .open { background-image: repeating-linear-gradient(45deg, transparent 0 4px, var(--page) 4px 7px); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--ink2); margin: 4px 0 8px; }
.legend .seg { display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: middle; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--ink2); font-weight: 600; font-size: 12px; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
.lanes { position: relative; border-left: 1px solid var(--axis); }
.lane { position: relative; height: 22px; border-bottom: 1px solid var(--grid); }
.lane .tag { position: absolute; left: 4px; top: 2px; font-size: 11px; color: var(--ink2); z-index: 2; white-space: nowrap; pointer-events: none; }
.lane .span { position: absolute; top: 3px; height: 16px; border-radius: 4px; min-width: 6px; opacity: .85; }
.span.busy { background: var(--series1); } .span.done { background: var(--good); } .span.failed { background: var(--critical); } .span.blocked { background: var(--warning); }
.hours { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 2px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink2); margin: 6px 0; flex-wrap: wrap; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
.meter { height: 12px; background: var(--grid); border-radius: 6px; overflow: hidden; margin: 4px 0; }
.meter > div { height: 100%; background: var(--series1); }
.flag { border-left: 4px solid var(--warning); padding: 4px 8px; margin: 4px 0; background: var(--page); border-radius: 0 6px 6px 0; font-size: 13px; }
.flag b { font-weight: 600; }
.feed { max-height: 560px; overflow: auto; }
.ev { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
.ev.fresh { animation: flash 2.4s ease-out; }
@keyframes flash { from { background: color-mix(in srgb, var(--series1) 28%, transparent); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .ev.fresh { animation: none; border-color: var(--series1); } .spin { animation: none; } }
.spin { display: inline-block; animation: spin 1.2s linear infinite; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.filters button.filter { font: inherit; font-size: 12px; color: var(--ink2); background: var(--surface); border: 1px solid var(--axis); border-radius: 999px; padding: 2px 10px; }
.filters button.filter[aria-pressed="true"] { color: var(--ink); border-color: var(--series1); }
.loader { display: flex; align-items: center; gap: 8px; color: var(--ink2); font-size: 13px; padding: 12px 0; }
.loader .bar { height: 8px; flex: 0 1 240px; border-radius: 4px; background: linear-gradient(90deg, var(--grid) 25%, var(--axis) 50%, var(--grid) 75%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .loader .bar { animation: none; } }
@keyframes spin { to { transform: rotate(360deg); } }
.ev .head { display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.ev .time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.ev .name { font-weight: 600; }
.ev .agg { color: var(--ink2); font-size: 12px; overflow-wrap: anywhere; }
.chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; font-size: 12px; }
.chain .arrow { color: var(--muted); }
.chain .step { border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; overflow-wrap: anywhere; }
.chain .step.policy { border-style: dashed; }
.live { font-size: 12px; }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--surface); padding: 4px 8px; border-radius: 6px; font-size: 12px; z-index: 10; display: none; max-width: 280px; }
.unknown-note { color: var(--ink2); font-style: italic; }
.clickable { cursor: pointer; }
.clickable:hover { outline: 2px solid var(--warning); outline-offset: 1px; }
.node.clickable:hover { outline-offset: 0; }
.tilebody.clickable:hover { outline-offset: 6px; }
dialog#resolve { width: min(44rem, 92vw); border: 1px solid var(--axis); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 16px; }
dialog#resolve::backdrop { background: rgba(0,0,0,.35); }
pre.cmd { background: var(--page); border: 1px solid var(--axis); border-radius: 6px; padding: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
.clickable { cursor: pointer; }
a.linked { color: inherit; text-decoration: none; display: contents; }
a.linked:hover .name, a.linked:focus-visible .name { text-decoration: underline; }
.reply { margin-top: 4px; padding: 4px 6px; border-left: 3px solid var(--series1); background: var(--page); border-radius: 0 4px 4px 0; overflow-wrap: anywhere; }
tr.sending td { background: rgba(234, 179, 8, .28); }
.attn { padding: 6px 0; border-bottom: 1px solid var(--grid); }
.askform { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; padding: 10px 12px; border: 1px solid var(--axis); border-radius: 8px; }
.askform h3.sub { margin: 0; font-size: 12px; color: var(--muted); }
.askform select, .askform textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 4px 8px; }
.askform button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 3px 10px; }
.attn-group { background: var(--page); border: 1px solid var(--axis); border-left: 4px solid var(--warning); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
.attn-group:last-child { margin-bottom: 0; }
.attn-group h3.sub { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.tip { white-space: pre-line; }
button.del { font: inherit; font-size: 12px; margin-left: 8px; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 1px 8px; }
button.del:disabled { opacity: .5; }
ol.steps { margin: 4px 0 0 18px; padding: 0; }
ol.steps li { padding: 3px 0; border-bottom: 1px solid var(--grid); overflow-wrap: anywhere; }
tr.clickable { cursor: pointer; } tr.clickable:hover, tr.clickable:focus-visible { background: var(--page); }
/* The item a deep link names: a ring that stays while the link stands, on a session row or a SendTrain event. */
.highlighted { outline: 3px solid var(--series1); outline-offset: 2px; border-radius: 6px; }
tr.highlighted td { background: color-mix(in srgb, var(--series1) 14%, transparent); }
.highlight-banner { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 16px; padding: 10px 14px; border: 1px solid var(--series1); border-left-width: 4px; border-radius: 8px; background: var(--surface); font-size: 13px; }
.highlight-banner[hidden] { display: none; }
.tables-only .chartview { display: none; } body:not(.tables-only) .tableview { display: none; }
@media (max-width: 900px) {
  .strip { grid-template-columns: 1fr; gap: 10px; }
  .node { margin-right: 0; min-height: 0; }
  .node:not(:last-child)::after { display: none; }
}
details.panel > summary .sum { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink2); min-width: 0; }
details.panel > summary .sum b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
details.panel > summary .sum .attention, details.panel > summary .sum .attention b { color: var(--warning); }
details.panel > summary .sum .failed, details.panel > summary .sum .failed b { color: var(--critical); }
details.panel > summary .sum .working b { color: var(--series1); }
details.panel > summary .sum .ok b { color: var(--good-text); }
details.panel { margin: 0; } details.panel > summary .hint { color: var(--ink2); font-size: 12px; text-transform: none; letter-spacing: 0; }
.pager { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 12px; color: var(--ink2); }
.pager button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 2px 8px; }
.pager button:disabled { opacity: .4; }
details.panel { border: 1px solid var(--axis); border-radius: 10px; background: var(--surface); margin: 0 0 8px; }
details.panel > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 10px; }
details.panel[open] > summary { border-bottom: 1px solid var(--axis); border-radius: 10px 10px 0 0; }
details.panel > summary::before { content: "\25B8"; color: var(--ink2); display: inline-block; transition: transform .15s; }
details.panel[open] > summary::before { transform: rotate(90deg); }
details.panel > summary:hover { background: var(--page); }
details.panel > .scroll, details.panel > .feed, details.panel > .strip, details.panel > div:not(summary) { padding: 10px 14px; } details.panel > summary::-webkit-details-marker { display: none; } details.panel > summary h2 { display: inline-block; margin: 0; line-height: 1; }
.agentstrip { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 14px; margin-bottom: 8px; border-color: var(--axis); }
.agentstrip h2 { margin: 0; }
.agentstrip .roles { display: flex; flex-wrap: wrap; gap: 6px; }
.agentstrip a.role { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 3px; border: 1px solid var(--axis); border-radius: 999px; color: var(--ink2); text-decoration: none; font-size: 12px; }
[data-role="planner"] { --role: #7c3aed; } [data-role="orchestrator"] { --role: #0f8f84; }
[data-role="architect"] { --role: #b5179e; } [data-role="coder"] { --role: #15803d; }
[data-role="reviewer"] { --role: #d02752; } [data-role="release_manager"] { --role: #0e7490; }
.agentstrip a.role .code { font: 600 10px ui-monospace, Menlo, monospace; padding: 2px 5px; border-radius: 999px; background: var(--role, var(--grid)); color: #fff; }
.agentstrip a.role .rname { color: var(--ink); text-transform: capitalize; }
.agentstrip a.role.busy { border-color: var(--series1); } .agentstrip a.role.busy .rnote { color: var(--series1); }
.agentstrip a.role.blocked { border-color: var(--warning); } .agentstrip a.role:hover { background: var(--page); }
.agentstrip a.open { margin-left: auto; font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Board</h1>
    <!--nav-->
    <div class="meta">
      <span id="updated">loading</span>
      <span class="live" id="live">stream: connecting</span>
      <button id="toggle" type="button" aria-pressed="false" data-tip="Switch between the charts and plain tables">Show tables</button>
    </div>
  </header>
  <div id="stale-banner" class="stale-banner" role="alert" hidden></div>
  <div id="highlight-banner" class="highlight-banner" role="status" aria-live="polite" hidden></div>

  <section class="agentstrip" aria-labelledby="h-roles"><h2 id="h-roles">Agents</h2><div class="roles" id="roles"></div>
    <a class="open" href="/agents" data-tip="Who hands work to whom, each role's sessions, and the forms that ask the planner and the architect">Open the Agents page →</a></section>
  <details class="panel" open><summary data-tip="Everything that asks for a person: attention pills, failed stages and sessions blocked on a reply. Click a row to act on it"><h2 id="h-attn">Needs attention</h2><span class="sum" id="sum-attn"></span></summary><div class="scroll" id="attention"></div></details>
  <section aria-labelledby="h-load" class="load"><h2 id="h-load">Machine load</h2><div class="label" id="loadnote"></div>
    <svg id="loadchart" viewBox="0 0 1000 120" preserveAspectRatio="none" role="img" aria-label="The machine's load over the last hours, against the limit a fill stops at"></svg>
    <div class="loadaxis" id="loadaxis"></div><div class="causes" id="loadcauses"></div></section>
  <section aria-labelledby="h-tiles"><h2 id="h-tiles">Key metrics</h2><div class="tiles" id="tiles"></div></section>
  <section aria-labelledby="h-thru" class="thru"><h2 id="h-thru">Work finished per day</h2><div class="label" id="thrunote"></div><div id="thru"></div></section>
  <details class="panel" open><summary data-tip="Each stage of a change from planned to released. Click a stage that needs you to resolve it"><h2 id="h-strip">Pipeline</h2><span class="sum" id="sum-strip"></span></summary><div class="strip" id="strip"><div class="node" id="integration"><!--tile:integration--></div><div class="node" id="train"><!--tile:train--></div></div></details>
  <details class="panel" id="sessions-panel"><summary data-tip="Claude sessions dispatched or started by hand: their status, work item and what they are doing. Click a blocked session to answer it"><h2 id="h-sess">Sessions</h2><span class="sum" id="sum-sess"></span></summary><div class="scroll" id="sessions"></div></details>

  <details class="panel"><summary data-tip="How the work fans out across sessions: lanes, who is running what, and what the dispatcher would start next"><h2 id="h-fan">Fan-out</h2><span class="sum" id="sum-fan"></span></summary>
    <div class="grid2">
      <div><div class="legend" id="lanelegend"></div><div id="lanes" class="chartview"></div><div class="tableview scroll" id="lanetable"></div></div>
      <div><div id="meters"></div><div id="flags"></div><div id="fill"><!--tile:fill--></div></div>
    </div>
    <h2>Work by session</h2>
    <div class="scroll" id="mapping"></div>
  </details>
  <details class="panel"><summary data-tip="How long each recent Work item spent in each stage, from the events it emitted. A striped stage is still open"><h2 id="h-cyc">Cycles</h2><span class="sum" id="sum-cyc"></span></summary><div id="cyclelegend"></div><div id="cycles"></div><h2 class="sub">Each stage over the recent items</h2><div class="scroll" id="cyclestats"></div></details>
  <details class="panel"><summary data-tip="Each event the pipeline heard, and the reactions it caused. Hover a row for its full context"><h2 id="h-ev">Events</h2><span class="sum" id="sum-ev"></span></summary><div class="feed" id="feed" aria-live="polite"></div></details>
</main>
<dialog id="resolve" aria-labelledby="resolve-title">
  <h2 id="resolve-title"></h2>
  <div id="resolve-detail"></div>
  <p id="resolve-note" class="unknown-note"></p>
  <p id="resolve-changes" class="unknown-note"></p>
  <pre id="resolve-cmd" class="cmd"></pre>
  <p id="resolve-status" class="status" aria-live="polite"></p>
  <div class="actions"><button type="button" id="resolve-run" data-tip="Run the fix on this board, after a second click">Run</button><button type="button" id="resolve-copy" data-tip="Copy the fix command to the clipboard">Copy command</button><button type="button" id="resolve-close" data-tip="Close without doing anything">Close</button></div>
</dialog>
<div class="tip" id="tip" role="tooltip"></div>
<script src="/stream.js"></script>
<script src="/answer.js"></script>
<script>
"use strict";
const ICON = { ok: "✓", working: "◔", attention: "▲", failed: "✕", unknown: "?" };
const WORD = { ok: "ok", working: "working", attention: "attention", failed: "failed", unknown: "unknown" };
const $ = (id) => document.getElementById(id);
const tip = $("tip");

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v; else if (k === "tip") el.dataset.tip = v; else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined) el.append(kid.nodeType ? kid : String(kid));
  return el;
}
function put(id, ...kids) { const el = $(id); el.replaceChildren(...kids.flat().filter((kid) => kid !== null && kid !== undefined)); }
function badge(state) {
  const icon = state === "working" ? h("span", { class: "spin" }, ICON[state]) : ICON[state] || "?";
  return h("span", { class: "badge " + state }, icon, " ", WORD[state] || state);
}
/* A blocked session is waiting on a person: amber, not green. */
/* Only a session that asks the owner is waiting on you; any other blocked session shows what it is held on. */
function waitingOnYou(s) { return s.status === "blocked" && s.owner === true; }
function sessionBadge(s) {
  if (waitingOnYou(s)) return h("span", { class: "badge attention" }, ICON.attention, " blocked");
  if (s.status === "blocked") return h("span", { class: "badge" }, " " + (s.held || "held"));
  return badge(s.status === "busy" ? "working" : s.status === "failed" ? "failed" : "ok");
}
function isUnknown(x) { return x && !Array.isArray(x) && typeof x === "object" && "unknown" in x; }
// A read still in flight, or held back while the machine is busy, shows Una turning (it runs again when the load
// falls); a read that failed shows why.
function unknown(x) {
  if (String(x.unknown).startsWith("the first read")) {
    return una("Loading", true);
  }
  if (/not run: load [\d.]+ is above [\d.]+/.test(String(x.unknown))) {
    return una(tidy("unknown: " + x.unknown), true);
  }
  return h("p", { class: "unknown-note" }, tidy("unknown: " + x.unknown));
}
// The words a reading or a refusal arrives in, said for a person: a reader the load guard held back is "paused", and
// a refusal drops the name of the Ruby class that carried it.
function tidy(text) {
  return String(text ?? "")
    .replace(/(?:unknown:\s*)*\b\w+ not run: load ([\d.]+) is above ([\d.]+)/g, "paused while the machine is busy (load $1, limit $2)")
    .replace(/\b(?:[A-Z]\w+::)+\w*(?:Failure|Error): /g, "");
}
// A long detail as the resolve dialog shows it: one line for each finding or run, its name in front.
function detailNodes(text) {
  const parts = tidy(text).split(/;\s+|(?<=\)),\s+/).filter(Boolean);
  if (parts.length < 2) return [h("p", {}, parts[0] || "")];
  return [h("ul", { class: "parts" }, parts.map((part) => {
    const m = part.match(/^([^:(]{1,60})([:(].*)$/s);
    return h("li", {}, m ? [h("b", {}, m[1].trim()), h("span", {}, " " + m[2].replace(/^:\s*/, ""))] : part);
  }))];
}
// When a state began, as the board first saw it: the time today, the day and the time before that.
function stood(iso) {
  const d = iso ? new Date(iso) : null; if (!d || isNaN(d)) return "-";
  const day = d.toDateString() === new Date().toDateString() ? "" : d.toLocaleDateString([], { month: "short", day: "numeric" }) + " ";
  return h("span", { title: "In this state since the board first read it so, " + d.toLocaleString() }, day + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
}
function clock(iso) { if (!iso) return "-"; const d = new Date(iso); return isNaN(d) ? String(iso) : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }); }
// A panel title with its count, so the number is visible even when the panel is collapsed.
// A panel's header line: what it holds at a glance, so it can stay collapsed. Each part is a
// string, or [text, tone, lead]: the tone (ok, working, attention, failed) colours it, and the
// lead is the bold part (the first word when none is given).
function summarize(key, parts) {
  const el = $("sum-" + key);
  if (!el) return;
  el.replaceChildren(...parts.filter(Boolean).map((part) => {
    const [raw, tone, lead] = Array.isArray(part) ? part : [part, ""], text = tidy(raw);
    if (lead) return h("span", { class: tone || "" }, h("b", {}, lead), text);
    const m = String(text).match(/^(\S+)(.*)$/s);
    return h("span", { class: tone || "" }, m ? h("b", {}, m[1]) : "", m ? m[2] : text);
  }));
}
function setTitle(id, name, count) { const el = $(id); if (el) el.textContent = name + " (" + count + ")"; }
// A table shown one page at a time; the page is kept across refreshes.
const pages = new Map();
function pager(id, head, rows, size) {
  const at = pageOf(id, rows.length, size);
  return h("div", {}, table(head, rows.slice(at * size, (at + 1) * size)),
    pageBar(id, at, rows.length, size, () => put(id, pager(id, head, rows, size))));
}
// The page a table is on, kept inside the pages its rows now fill.
function pageOf(id, total, size) {
  const at = Math.min(pages.get(id) || 0, Math.max(1, Math.ceil(total / size)) - 1);
  pages.set(id, at);
  return at;
}
// Prev and Next under a paged table, and which rows it shows; `redraw` shows the page chosen.
function pageBar(id, at, total, size, redraw) {
  const count = Math.max(1, Math.ceil(total / size));
  const step = (to) => { pages.set(id, to); redraw(); };
  const prev = h("button", { type: "button" }, "‹ Prev");
  const next = h("button", { type: "button" }, "Next ›");
  prev.disabled = at === 0;
  next.disabled = at >= count - 1;
  prev.addEventListener("click", () => step(at - 1));
  next.addEventListener("click", () => step(at + 1));
  const from = total ? at * size + 1 : 0;
  return h("div", { class: "pager" }, prev, h("span", {}, from + "–" + Math.min(total, (at + 1) * size) + " of " + total), next);
}

function table(head, rows, numeric) {
  return h("table", {}, h("thead", {}, h("tr", {}, head.map((t, i) => h("th", { class: numeric && numeric.includes(i) ? "n" : "" }, t)))),
    h("tbody", {}, rows.map((r) => h("tr", { tip: rowTip(head, r) }, r.map((c, i) => h("td", { class: numeric && numeric.includes(i) ? "n" : "" }, c))))));
}
// Every row's hover: each column's name and its value, so a row reads in full without widening it.
function rowTip(head, row) {
  const text = (c) => (Array.isArray(c) ? c.map(text).join("") : c instanceof Node ? c.textContent : String(c ?? ""));
  const values = row.map(text);
  const lines = values.map((v, i) => head[i] + ": " + v);
  // What a value means, for the words the board shows most, so a hover says what to do.
  for (const v of values) if (MEANING[v.trim()]) lines.push("→ " + v.trim() + ": " + MEANING[v.trim()]);
  return lines.join("\n");
}
// Plain-language meaning of the status words the tables show.
const MEANING = {
  blocked: "waiting on you; open it to answer",
  working: "running now; nothing for you to do",
  busy: "running now; nothing for you to do",
  done: "finished; it can be removed once nobody needs it",
  failed: "ended with an error; check its detail before retrying",
  planned: "not started; the next dispatch can pick it up",
  started: "claimed and running; see who holds it",
  finished: "its session ended; it can be removed",
  landed: "merged into main",
  pushed: "on origin/main",
  held: "a red flag holds it until main is green",
  verified: "checked and ready to promote",
  promoted: "moved to stable; release is next",
  released: "shipped",
  delivered: "the command ran and its reaction was applied",
  refused: "the command's rules refused it; the reason is in its detail",
  waiting: "a reaction is still to run",
  ok: "within its goal",
  attention: "needs a decision from you",
  unknown: "the board cannot read this yet; see the reason in its detail"
};

document.addEventListener("mouseover", (e) => {
  const t = e.target.closest("[data-tip]");
  if (!t) { tip.style.display = "none"; return; }
  tip.textContent = t.dataset.tip; tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 12, innerWidth - 290) + "px"; tip.style.top = (e.clientY + 14) + "px";
});

// What resolves each attention pill, by its label. A pill with no entry names its cause only.
const FIX = {
  "Local main": { act: "board_train", cmd: "hecks send_train.board! --confirm", note: "Local main has commits origin lacks. Boarding the train pushes them.",
    changes: "Pushes the commits on local main that origin lacks to origin/main. A CI run starts on the pushed commit; nothing else changes." },
  "Train": { act: "board_train", cmd: "hecks send_train.board! --confirm", note: "The last pushed commit is not on origin. Boarding the train pushes it.",
    changes: "Pushes the boarded commit to origin/main. A CI run starts on it; nothing else changes." },
  "Commits not pushed": { act: "board_train", cmd: "hecks send_train.board! --confirm", note: "Boarding the train pushes the commits waiting on origin.",
    changes: "Pushes the commits waiting on origin to origin/main. A CI run starts on the newest one." },
  "Promote": { act: "promote", cmd: "hecks promotion_run.promote! lane=stable --confirm --wait", note: "Stable is behind main. This fast-forwards it onto the newest commit every required check passed on.",
    changes: "Moves origin/stable forward to the newest commit every required check passed on. Stable is what clients pin; a bad commit reaches them once it moves." },
  "Release": { note: "Publishing is the owner's decision. The version bump needs a Release-Approved-By line, and only the owner adds it." }
};
let runAction = null, armed = false;
function resolve(label, detail) {
  const fix = FIX[label] || {};
  $("resolve-title").textContent = label;
  $("resolve-detail").replaceChildren(...detailNodes(detail || ""));
  $("resolve-note").textContent = fix.note || "No command resolves this from the board. Read the detail and act in the checkout.";
  $("resolve-changes").textContent = fix.changes ? "What it changes: " + fix.changes : "";
  $("resolve-cmd").textContent = fix.cmd || "";
  $("resolve-cmd").hidden = !fix.cmd; $("resolve-copy").hidden = !fix.cmd;
  runAction = fix.act || null; armed = false;
  $("resolve-run").hidden = !runAction; $("resolve-run").textContent = "Run";
  $("resolve-status").textContent = "";
  $("resolve").showModal();
}
// A step that moves code takes two clicks: the first arms it, the second runs it with confirm.
$("resolve-run").addEventListener("click", async () => {
  if (!armed) { armed = true; $("resolve-run").textContent = "Click again to run"; return; }
  $("resolve-run").disabled = true; $("resolve-status").textContent = "Running…";
  try {
    const res = await fetch("/api/act", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: runAction, confirm: true }) });
    const body = await res.json();
    $("resolve-status").textContent = res.ok ? "Ran " + body.ran + "." : "Not run: " + (body.error || "HTTP " + res.status);
  } catch (e) { $("resolve-status").textContent = "Not run: " + e.message; }

});
$("resolve-close").addEventListener("click", () => $("resolve").close());
$("resolve-copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("resolve-cmd").textContent); $("resolve-copy").textContent = "Copied"; }
  catch (e) { $("resolve-copy").textContent = "Copy failed"; }
});

// The agent roles, pinned at the top: one chip per role with how many of its sessions are live.
// The whole picture (who hands work to whom, reviews, the ask forms) is on the Agents page.
const ROLE_CODES = { planner: "PL", orchestrator: "OR", architect: "AR", coder: "CO", reviewer: "RV", release_manager: "RM" };
// The pruner's chip also says when the owner has paused pruning; the switch is on the Agents page.
function renderRoles(roles, pruning) {
  if (!Array.isArray(roles)) return put("roles", unknown(isUnknown(roles) ? roles : { unknown: "the first read is still running" }));
  put("roles", roles.map((r) => {
    const blocked = (r.working || []).filter(waitingOnYou).length;
    const state = blocked ? " blocked" : r.live > 0 ? " busy" : "";
    const paused = r.name === "pruner" && pruning && pruning.state === "paused";
    const note = (blocked ? blocked + " waiting on you" : r.live > 0 ? r.live + " working" : "idle") + (paused ? " · paused" : "");
    return h("a", { class: "role" + state, href: "/agents", "data-role": r.name, tip: r.name + ": " + note },
      h("span", { class: "code" }, ROLE_CODES[r.name] || r.name.slice(0, 2).toUpperCase()), h("span", { class: "rname" }, r.name.replace("_", " ")),
      h("span", { class: "rnote" }, note));
  }));
}
// The sentence the server computed for the sessions tile; the meters repeat it, never recount.
let sessionsHeadline = "";
function renderTiles(tiles) {
  sessionsHeadline = (tiles.find((t) => t.id === "working") || {}).detail || "";
  put("tiles", tiles.map((t) => {
    const value = t.value === null || t.value === undefined ? "-" : t.value;
    const tr = t.trend ? h("div", { class: "trend" }, (t.trend.delta > 0 ? "▲ +" : t.trend.delta < 0 ? "▼ " : "= ") + t.trend.delta + " " + t.trend.unit,
      t.trend.better === null ? " flat" : t.trend.better ? " better" : " worse", " vs earlier half") : null;
    const el = h("div", { class: "tile" + (needsAttention(t.state) ? " clickable" : ""), tip: t.label + ": " + t.detail },
      h("div", { class: "label" }, t.label), h("div", { class: "num" }, String(value), h("span", { class: "unit" }, t.unit)),
      badge(t.state), tr, h("div", { class: "note clamp" }, tidy(t.detail)));
    if (needsAttention(t.state)) answerable(el, () => resolve(t.label, t.full || t.detail));
    return el;
  }));
}
// A pill that asks for action: attention, or failed.
function needsAttention(state) { return state === "attention" || state === "failed"; }
const STAGE_PAGES = { "Work items": ["/plan", "the plan"], CI: ["/ci", "the CI page"] };
function renderStrip(stages) {
  const off = stages.filter((s) => s.state !== "ok");
  summarize("strip", off.length ? off.map((s) => [": " + s.detail, s.state, s.name]) : [["all " + stages.length + " stages ok", "ok"]]);
  put("strip", stages.map((s) => {
    if (s.name === "Train") return $("train"); // drawn and pushed by the server
    if (s.name === "Integration") return $("integration"); // drawn and pushed by the server; read-only, nothing to click
    const waiting = Array.isArray(s.blocked) ? s.blocked : [];
    const clickable = waiting.length || needsAttention(s.state);
    const node = h("div", { class: "node" + (clickable ? " clickable" : ""), tip: s.name + ": " + s.detail + (waiting.length ? " (click to answer)" : needsAttention(s.state) ? " (click to resolve)" : "") },
      h("div", { class: "name" }, s.name), h("div", { class: "count" }, s.count), badge(s.state), h("div", { class: "detail" }, tidy(s.detail)));
    if (waiting.length) answerable(node, () => openAnswer(waiting, waiting[0].id));
    else if (needsAttention(s.state)) answerable(node, () => resolve(s.name, s.detail));
    // The open Work items are read on the plan page and the runs on the CI page, so each stage is the way to its page.
    else if (STAGE_PAGES[s.name]) { const [href, word] = STAGE_PAGES[s.name]; node.classList.add("clickable"); node.dataset.tip += " (click to open " + word + ")"; answerable(node, () => { location.href = href; }); }
    return node;
  }));
}
// A pushed stage that needs a person carries the words to resolve it with, since its node is drawn by the server.
document.addEventListener("click", (e) => { const t = e.target.closest("[data-resolve]"); if (t) resolve(t.dataset.resolve, t.dataset.detail); });
/* Opens an answer prompt from a click or from Enter and Space on the keyboard. */
function answerable(el, open) {
  el.tabIndex = 0;
  el.addEventListener("click", open);
  el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
}
// Opens the shared answer prompt (/answer.js) on these sessions; the row shows your reply as it goes.
function openAnswer(list, pickId) {
  const show = () => { if (lastState) renderSessions(lastState.sessions); };
  boardAnswer.open(list, pickId, {
    sending: (s, text) => { replies.set(s.id, { text: text, state: "sending" }); show(); },
    sent: (s) => { replies.delete(s.id); refresh(); },
    failed: (s, text, message) => { replies.set(s.id, { text: text, state: "not sent: " + message }); show(); }
  });
}
// A span of seconds as 1h02m, 13m09s or 39s.
function span(s) {
  if (s === null || s === undefined) return "-";
  const two = (n) => String(n).padStart(2, "0");
  if (s >= 3600) return Math.floor(s / 3600) + "h" + two(Math.floor((s % 3600) / 60)) + "m";
  return s >= 60 ? Math.floor(s / 60) + "m" + two(s % 60) + "s" : s + "s";
}
// Each recent Work item's cycle as one bar, a segment per stage, the open stage striped.
function renderCycles(c) {
  if (isUnknown(c) || !c || !Array.isArray(c.cycles)) {
    summarize("cyc", [["unknown: " + ((c && c.unknown) || "no data"), "attention"]]);
    return put("cycles", unknown(c || { unknown: "no data" }));
  }
  const order = c.stats.map((st) => st.stage);
  const max = Math.max(1, ...c.cycles.map((cy) => cy.seconds));
  const slowest = c.stats.filter((st) => st.percentile !== null).sort((a, b) => b.percentile - a.percentile)[0];
  const flying = c.cycles.filter((cy) => cy.open);
  summarize("cyc", [slowest && ["slowest stage " + slowest.stage + " (p" + c.rank + " " + span(slowest.percentile) + ")", "ok"],
    [flying.length + " in flight", flying.length ? "working" : ""]]);
  put("cyclelegend", h("div", { class: "legend" }, order.map((name, i) => h("span", {}, h("span", { class: "seg s" + (i % 4) }), name))));
  put("cycles", c.cycles.map((cy) => h("div", { class: "cycle", tip: cy.stages.map((st) => st.stage + " " + span(st.seconds) + (st.open ? " (open)" : "")).join(" · ") },
    h("div", { class: "name" }, cy.work),
    h("div", { class: "bar" }, cy.stages.map((st) => h("div", { class: "seg s" + (order.indexOf(st.stage) % 4) + (st.open ? " open" : ""), style: "width:" + (100 * st.seconds / max).toFixed(2) + "%" }))),
    h("div", {}, span(cy.seconds) + (cy.open ? " so far" : "")))));

}
// Everything that asks for a person: attention and failed pills, and sessions blocked on a reply.
function renderAttention(metrics, stages, sessions, recommendations) {
  const recs = Array.isArray(recommendations) ? recommendations : [];
  // The first read hands each of these as a reading still in flight; none asks for attention yet.
  [metrics, stages, sessions] = [metrics, stages, sessions].map((rows) => (Array.isArray(rows) ? rows : []));
  const groups = [
    ["Metrics", metrics.filter((t) => needsAttention(t.state)).map((t) => ({ kind: "Metric", item: t.label, state: t.state, value: (t.value ?? "-") + (t.unit || ""), detail: t.detail, since: stood(t.since), act: () => resolve(t.label, t.full || t.detail) }))],
    ["Pipeline stages", stages.filter((s) => needsAttention(s.state)).map((s) => ({ kind: "Stage", item: s.name, state: s.state, value: s.count ?? "-", detail: s.detail, since: stood(s.since), act: () => resolve(s.name, s.detail) }))],
    ["Sessions waiting on you", sessions.filter(waitingOnYou).map((s) => ({ kind: "Session", item: s.name + " " + (s.id || ""), state: "attention", value: s.work_item || s.row || "-", detail: s.detail, since: clock(s.started), act: () => openAnswer([{ id: s.id, name: s.name, run: s.run, repo: s.repo, work_item: s.work_item, question: s.detail, context: s.context, attach: s.attach }], s.id) }))]
  ].filter(([, items]) => items.length);
  setTitle("h-attn", "Needs attention", groups.reduce((n, [, items]) => n + items.length, recs.length));
  const sized = Object.fromEntries(groups.map(([title, items]) => [title, items.length]));
  summarize("attn", !groups.length && !recs.length ? [["nothing needs you", "ok"]] : [
    sized["Sessions waiting on you"] && [sized["Sessions waiting on you"] + " waiting on you", "attention"],
    sized["Pipeline stages"] && [sized["Pipeline stages"] + " stages: " + stages.filter((s) => needsAttention(s.state)).map((s) => s.name).join(", "), "attention"],
    sized["Metrics"] && [sized["Metrics"] + " metrics: " + metrics.filter((m) => needsAttention(m.state)).map((m) => m.label).join(", "), "attention"],
    recs.length && [recs.length + " promotion" + (recs.length > 1 ? "s" : "") + " to settle", "attention"]]);
  if (!groups.length && !recs.length) return put("attention", h("p", { class: "note" }, "Nothing needs attention."));
  put("attention", groups.map(([title, items]) => h("div", { class: "attn-group" }, h("h3", { class: "sub" }, title + " (" + items.length + ")"), attentionTable(items))));
  if (recs.length) $("attention").append(recommendationGroup(recs));
}
// The release manager's recommendations: Promote asks twice and runs the promotion; Dismiss settles.
function recommendationGroup(recs) {
  const rows = recs.map((r) => [r.change, r.reasons || "-", recommendationButtons(r)]);
  const title = h("h3", { class: "sub" }, "Promotions to confirm (" + recs.length + ")");
  return h("div", { class: "attn-group" }, title, table(["Change", "Why", ""], rows));
}
// The buttons live in the shared prompt script (/answer.js), so the agents' page settles the same way.
// The machine's load as the board sampled it, over the span chosen: a filled line, green where it is under the limit
// a fill stops at and red where it is over, broken where the board was away. Every figure drawn is a number.
const LOAD_SPANS = { "15 min": 15, "1 h": 60, "3 h": 180 };
let loadSpan = (() => { try { return LOAD_SPANS[localStorage.getItem("load-span")] ? localStorage.getItem("load-span") : "1 h"; } catch (e) { return "1 h"; } })(), lastLoad = null;
function loadSpans() {
  return Object.keys(LOAD_SPANS).map((name) => { const b = h("button", { type: "button", "aria-pressed": String(name === loadSpan) }, name);
    b.addEventListener("click", () => { loadSpan = name; try { localStorage.setItem("load-span", name); } catch (e) { /* kept for this page only */ } renderLoad(lastLoad); }); return b; });
}
function renderLoad(l) {
  lastLoad = l;
  const all = l && Array.isArray(l.samples) ? l.samples : [];
  if (all.length < 2) { $("loadnote").replaceChildren("Collecting samples: the chart fills as the board runs."); $("loadchart").innerHTML = ""; return; }
  const span = LOAD_SPANS[loadSpan] * 60000, end = Date.parse(all[all.length - 1][0]), samples = all.filter(([time]) => end - Date.parse(time) <= span);
  const loads = samples.map((x) => x[1]), top = Math.max(l.limit * 1.3, ...loads) || 1, limitY = (116 - 112 * l.limit / top).toFixed(1);
  // A stretch is the samples with no gap between them; the board being away for a restart starts a new one.
  const stretches = [];
  samples.forEach((sample, i) => { if (i && Date.parse(sample[0]) - Date.parse(samples[i - 1][0]) <= l.every * 4000) stretches[stretches.length - 1].push(sample); else stretches.push([sample]); });

  const guard = s.load_guard ? ["Machine loaded (load " + s.load_guard.load + " above " + s.load_guard.limit + " since " + clock(s.load_guard.since) + "): the board reads once a minute and runs no program."] : [];
  const sections = Object.entries(s.stale_sections || {}).map(([name, note]) => name.replace(/_/g, " ") + ": stale since " + clock(note.since) + " (" + note.reason + ").");
  return guard.concat(sections);
}
// Asks for the state once, for the first paint and for browsers without EventSource.
async function refresh() {
  try {
    const res = await fetch("/api/state", { cache: "no-store" });
    render(await res.json());
  } catch (e) { $("updated").textContent = "update failed: " + e.message; }
}
// The server pushes the state whenever it changes, so the page renders what it is sent.
function listen() {
  const shared = window.boardStream && boardStream({
    open: () => { $("live").textContent = "stream: live"; },
    error: () => { $("live").textContent = "stream: reconnecting"; },
    pause: () => { $("live").textContent = "stream: paused"; },
    tile: (t) => { const el = document.getElementById(t.id); if (el) el.innerHTML = t.html; },
    state: (data) => { try { render(data.state); } catch (e) { $("updated").textContent = "update failed: " + e.message; } },
    board: (ev) => { if (ev.key) putEvent(ev, true); }
  });
  if (!shared) { $("live").textContent = "stream: unsupported"; setInterval(refresh, 10000); }
}
$("toggle").addEventListener("click", () => {
  const on = document.body.classList.toggle("tables-only");
  $("toggle").setAttribute("aria-pressed", String(on)); $("toggle").textContent = on ? "Show charts" : "Show tables";
});
refresh(); listen();
</script>
</body>
