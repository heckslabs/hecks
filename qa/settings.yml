# Dials for the hecks_qa practice; edit values here and review the diff.
# What each key is and takes is its `QaDial` row in lib/hecks/language/bluebook/vocabulary.bluebook;
# loaded by Hecks::Fuzzing::QaSettings, which rejects missing, extra, or mistyped keys.
#
# automated_engineer stays a literal in the bluebook: spec/quality_control_spec.rb pins it.

cadence_seconds: 0
pr_cap_per_day: 0

widening_tiers:
  - { upto: 4,    seeds: 10, steps: 25 }
  - { upto: 19,   seeds: 25, steps: 50 }
  - { upto: .inf, seeds: 50, steps: 100 }

sweep_max_parallel: 4
liveness_fallback_seconds: 1500

draft_only: false
auto_merge: true

adversarial_fraction: 0.3
guided_generation: true
corpus_splice_probability: 0.0
favor_rare_verbs: 3
runtime_coverage_feedback: false
self_consistency_checks: true
shrink_budget: 200

yield_weight_seconds: 1800
yield_decay_percent: 50
rotation_stale_floor_seconds: 21600

persistence_parity_seed_cap: 5
concurrency_seed_cap: 3

adapter_parity_pairs:
  persistence_parity:
    left: memory
    right: postgres_era
  adapter_parity_sqlite:
    left: memory
    right: sqlite

modes:
  differential: true
  ruby_only: true
  self_consistency: true
  properties_in_differential: true
  structural_skip_report: true
  adapter_parity_sqlite: false
  persistence_parity: true
  adapter_parity_postgres: false
  era_boundary: false
  concurrency: false
  wasm_front: false

role_draw_probability: 0.25
dry_run_fraction: 0.10

generated_domains_per_tick: 2
generated_domains_rust: true
generated_domain_seeds: 5

# The quick gate on local main, the tick's last finding step: each red check becomes a bug, and a
# self-contained one is fixed, gated, landed and pushed.
red_main_check: true

# The event pump, the tick's last step: each attached domain's policies react to the events past their
# cursors. `hecks quality_control event_pump.pump!` runs it by hand whatever this says.
event_pump: true

# The push check, once per tick: a push of local main that is due beyond the QualityControl world's
# `push_nudge` thresholds is one `push-due` Work item, revised while due and finished when not. It reads
# refs git already holds and pushes nothing.
push_nudge: true

# A quiet tick for a mint window: true makes every step print `quiesced: skipped <step>` and the tick exit 0.
# A running tick also stops at the marker `hecks qa_quiesce.hold!` writes (a stale one is ignored), so prefer that
# for a window; this dial is for a standing pause.
quiesced: false

# The main-maintenance chain after the red-main step: the quick gate on main, the reconcile plan, and the push
# through the train when origin is behind. `maintenance_confirm` lets the reconcile write; false keeps it a dry run.
main_maintenance: true
maintenance_confirm: false

# The Rust kernel's mutation test, run by each tick after the generated domains (about 8 minutes).
# The two equivalents compare positions where `<` and `<=` cannot differ.
mutation_files:
  - rust/src/kernel/dispatch.rs
  - rust/src/kernel/orchestrate.rs
mutation_equivalent:
  - "replace < with <= in aggregate_position"
  - "replace < with <= in entity_position"

# Construct families a sweep may skip. Shrink-only: spec/fuzzing/rust_gap_manifest_spec.rb fails
# when a family here is not declared `generated: false` by a committed manifest.
structural_refusal_boundary: []
