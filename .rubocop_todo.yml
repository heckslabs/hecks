# `has_many_impl`/`has_one_impl` (AggregateBuilder, EntityBuilder) are the
# real Ruby implementations a `.bluebook` grammar declaration's `calls:`
# field names BY THIS EXACT STRING (see entity.bluebook / aggregate.bluebook
# `member word: "has_many", ..., calls: "has_many_impl"`), looked up by
# GenericDispatch at boot — not called as ordinary Ruby predicates from
# other Ruby code. Renaming to `many_impl?`/`one_impl?` per the cop would
# mean also updating both `.bluebook` grammar files and the golden IR
# fixtures those generate (spec/golden/ir/Bluebook.json), a much bigger
# change than a lint fix, and would break the deliberate naming symmetry
# with the DSL keywords `has_many`/`has_one` themselves.
Naming/PredicatePrefix:
  Exclude:
    - 'lib/hecks/bluebook/dsl/aggregate_builder.rb'

