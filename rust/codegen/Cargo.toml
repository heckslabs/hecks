[package]
name = "hecks_codegen"
version = "0.1.0"
edition = "2021"

# Empty table makes this crate its own workspace root (own target/ and Cargo.lock).
# Kept out of rust/src/ and rust/parser/: it is build-time only, and parse and codegen are
# separate stages.
[workspace]

[[bin]]
name = "hecks-codegen"
path = "src/main.rs"

# No dependencies beyond std: this crate never ships in a deployed artifact.
[dependencies]

# Debug info is off: CI binaries are run once and never attached to a debugger.
[profile.dev]
debug = 0
