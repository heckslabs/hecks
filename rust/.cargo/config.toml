# Links the main crate (rust/src/generated/, built by most ci.yml jobs) with lld.
# It has no native C dependencies, so lld has nothing to trip over.
#
# Applies only when building for the linux target; a local macOS build never matches.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]
