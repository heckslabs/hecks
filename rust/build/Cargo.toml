[package]
name = "hecks_build"
version = "0.1.0"
edition = "2021"

# Empty table makes this crate its own workspace root (own target/ and Cargo.lock).
# Kept out of rust/src/ so this build-time orchestrator does not inflate the shipped artifacts.
[workspace]

[[bin]]
name = "hecks-build"
path = "src/main.rs"

# No dependencies beyond std: this crate only shells out and never ships in a deployed artifact.
[dependencies]

# Debug info is off: CI binaries are run once and never attached to a debugger.
[profile.dev]
debug = 0
