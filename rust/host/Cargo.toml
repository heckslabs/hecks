[package]
name = "rust_host"
version = "0.1.0"
edition = "2021"

# Empty table: makes this crate its own workspace root instead of joining `rust`'s.
[workspace]

[lib]
name = "rust_host"
path = "src/lib.rs"

[[bin]]
name = "bootstrap"
path = "src/main.rs"

# No path dependency on `rust`: the compiled `.wasm` is loaded through wasmtime as an untrusted
# module, so dispatch runs sandboxed with no access to this crate's Postgres connection.
[dependencies]
# The runtime, free of any driver: this crate (the adapters) implements its backends and transports.
rust_host_core = { path = "core" }
wasmtime = "49.0.4"
wasmtime-wasi = "49.0.4"
lambda_runtime = "0.13"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
# Used by server.rs (HECKS_SERVE_MODE=1) to answer the ALB's HTTP on Fargate. HTTP/1.1 only;
# the features are the minimal set its single fallback route needs.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
# RDS requires TLS. rustls, not OpenSSL: -sys needs a cross-compiled sysroot for
# aarch64-unknown-linux-gnu that is not set up when building from macOS.
# Trust anchor is AWS's own RDS bundle (rds-ca-bundle.pem, embedded via include_bytes!), not
# webpki-roots, which lacks the RDS CA.
# default-features = false: rustls's default pulls in aws_lc_rs (C); "ring" keeps this pure Rust.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
# arbitrary_precision keeps a number as the text Ruby wrote (`1.0e+20`, integers past u64).
# preserve_order keeps JSON object key order (a translation edge's `renames` order is meaningful).
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
anyhow = "1"
# Used by field_hints.rs; pure Rust, no aws-lc/openssl-sys.
regex = "1"
# Google sign-in (auth.rs). rustls-tls, not default-tls: no OpenSSL sysroot for the
# aarch64 cross-compile. jsonwebtoken also uses ring.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
jsonwebtoken = "9"
hmac = "0.12"
# Cookie and token payloads, webhook secrets, request bodies (b64.rs). Pure Rust.
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
# Cross-lambda policy dispatch (lambda_client.rs). Both SDK crates take default-features = false:
# their default TLS features resolve to aws-lc-rs, which needs a C toolchain to cross-compile.
# aws-smithy-http-client with only `rustls-ring` supplies the client, which
# `AwsLambdaInvoker::from_env` passes to `aws_config::ConfigLoader::http_client`.
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest", "credentials-process"] }
aws-sdk-lambda = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# Secrets Manager (secrets.rs). Same default-features = false and rustls-ring treatment as
# aws-sdk-lambda above, to avoid aws-lc-sys.
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }
async-trait = "0.1.92"

[dev-dependencies]
rust_host_core = { path = "core", features = ["test-support"] }

# CI never attaches a debugger to dev binaries, so skip debuginfo to save build time.
[profile.dev]
debug = 0

# The tests compile wasm modules through wasmtime's Cranelift, which is far slower unoptimized.
# Optimize dependencies only, and only for cargo test; the host crate and cargo build stay at opt-level 0.
[profile.test.package."*"]
opt-level = 2

# Clippy beyond its defaults: pedantic and nursery, plus the restriction lints that keep a panic
# out of library code. `hecks gate_run.gate stage=ci only=rust_clippy` makes each of these an error.
# The same table is in every crate's Cargo.toml; change them together.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Lints that ask for prose or an attribute on every item rather than for better code.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
too_long_first_doc_paragraph = "allow"
doc_markdown = "allow"
# Numeric conversions here are deliberate: JSON numbers are f64 and ids are small.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Naming heuristics that fire on ordinary short names.
similar_names = "allow"
many_single_char_names = "allow"
struct_field_names = "allow"
# Heuristics that cost more clarity than they buy here.
redundant_pub_crate = "allow"
future_not_send = "allow"
significant_drop_tightening = "allow"
match_same_arms = "allow"
