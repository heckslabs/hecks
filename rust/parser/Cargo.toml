[package]
name = "hecks_parse"
version = "0.1.0"
edition = "2021"

# Empty table: makes this crate its own workspace root instead of joining `rust`'s.
#
# Kept out of rust/src/ because parser code is build-time-only and would bloat the native, wasm
# and rust/web artifacts (ADR 0012).
[workspace]

[[bin]]
name = "hecks-parse"
path = "src/main.rs"

# No dependencies beyond std: the crate never ships, so a dependency would only cost build time.
[dependencies]

# CI never attaches a debugger to dev binaries, so skip debuginfo to save build time.
[profile.dev]
debug = 0
