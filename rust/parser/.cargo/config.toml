# Links rust/parser with lld, which is faster than GNU ld. Scoped to this crate so a bad lld
# setup on the CI runner breaks one required check instead of all of them.
# Only applies when building for x86_64-unknown-linux-gnu; macOS builds never match it.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]
