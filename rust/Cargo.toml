# ONE FEATURE PER GENERATED DOMAIN — selects which domain's own
# generated::<domain>::merged module `generated::active` re-exports
# (rust/src/generated/mod.rs). Kept in sync by bin/project_rust: a
# feature is added here whenever a new domain is generated, never
# removed (the domain's own generated/<name>/ directory is the
# source of truth for whether it still exists). `default` tracks
# whichever domain was generated MOST RECENTLY, so a bare
# `cargo build`/`cargo test` keeps behaving exactly as it always
# has; any other still-generated domain stays reachable via
# `--no-default-features --features <name>`.
[features]
default = ["embryonautfoundersapp"]
lifeadelics = []
embryonautfoundersapp = []
generated_route_append = []
generated_entity_no_identity = []
generated_revalued_shape = []
generated_reaction_wording = []
bug28_existence_fixture = []
lease_clock = []
referral_chain = []
tenant_ledger = []
corrections = []
has_many_fixture = []
ledger_ordering = []
waybill = []
nested_pieces = []
chess = []
roster = []
compliance = []
meta = []
pizzas = []
embryonaut = []
banking = []

[package]
name = "rust"
version = "0.1.0"
edition = "2021"

# ONE DELIBERATE, DOCUMENTED EXCEPTION to this crate's own zero-Cargo-
# dependency discipline (ADR 0012 — WASM-via-WASI binary size and
# auditability; json.rs's and arithmetic.rs's own headers state the same
# constraint for themselves). `expression_operators/pattern_match.rs`
# (`.match?`) is the reason — see that file's own header for why a
# hand-rolled regex subset was rejected in favour of one well-audited,
# pure-Rust crate. `default-features = false` keeps out `perf` (SIMD/
# `memchr`-driven, unneeded for the small per-call patterns this
# grammar's own predicates use) — `std`/`unicode` alone cover Ruby-
# Regexp-style `\d`/`\w`/case-insensitive matching without the extra
# code size.
[dependencies]
regex = { version = "1", default-features = false, features = ["std", "unicode"] }

[lib]
name = "rust"
path = "src/lib.rs"

[[bin]]
name = "rust"
path = "src/main.rs"

# DEBUG INFO OFF FOR DEV BUILDS — Phase 6 of the CI speed effort. Every
# binary this crate produces in CI is run once and thrown away (never
# attached to a debugger), so the debuginfo a plain `cargo build`/
# `cargo test` normally embeds is pure build time and disk cost with
# nothing reading it. Release builds (none of which CI actually uses
# today) are unaffected — this only touches the dev profile.
[profile.dev]
debug = 0
