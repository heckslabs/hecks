# Selects which domain's generated module `generated::active` re-exports
# (rust/src/generated/mod.rs); hecks project_rust adds an entry per generated
# domain and never removes one, since a domain's own directory is the
# source of truth for whether it still exists. `default` tracks whichever
# domain was generated most recently; any other stays reachable via
# `--no-default-features --features <name>`.
[features]
default = ["reserved_names_fixture"]
ledgerbook = []
outbound = []
grouped_reduction_fixture = []
tally = []
relay = []
meter = []
courier = []
attribute_constraints_fixture = []
optional_nested_value_object_fixture = []
computed_sets_fixture = []
fan_out_row_fields_fixture = []
for_each_identity_fixture = []
projected_single_field_fixture = []
optional_value_object_fixture = []
reserved_names_fixture = []
composite_line_ledger = []
read_model_on_target_fixture = []
group_by_collision_fixture = []
compliance = []
checkout_fixture = []
embryonaut_vendoring_demo = []
generated_route_append = []
generated_entity_no_identity = []
generated_revalued_shape = []
generated_reaction_wording = []
bug28_existence_fixture = []
lease_clock = []
referral_chain = []
tenant_ledger = []
corrections = []
has_many_fixture = []
ledger_ordering = []
waybill = []
nested_pieces = []
chess = []
roster = []
meta = []
pizzas = []
banking = []

[package]
name = "rust"
version = "0.1.0"
edition = "2021"

# The kernel's one dependency is the expression evaluator, a std-only crate of its own that the host
# shares (ADR 0012's regex exception now lives there, for `.match?`).
[dependencies]
hecks_expr = { path = "expr" }

[lib]
name = "rust"
path = "src/lib.rs"

[[bin]]
name = "rust"
path = "src/main.rs"

# CI runs every binary this crate produces once and throws it away, never
# attaching a debugger, so the debuginfo a plain `cargo build`/`cargo test`
# normally embeds is pure build time and disk cost with nothing reading it.
# Only this dev profile is affected; release builds are unchanged.
[profile.dev]
debug = 0

# Clippy beyond its defaults: pedantic and nursery, plus the restriction lints that keep a panic
# out of library code. `hecks gate_run.gate stage=ci only=rust_clippy` makes each of these an error.
# The same table is in every crate's Cargo.toml; change them together.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Lints that ask for prose or an attribute on every item rather than for better code.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
too_long_first_doc_paragraph = "allow"
doc_markdown = "allow"
# Numeric conversions here are deliberate: JSON numbers are f64 and ids are small.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Naming heuristics that fire on ordinary short names.
similar_names = "allow"
many_single_char_names = "allow"
struct_field_names = "allow"
# Heuristics that cost more clarity than they buy here.
redundant_pub_crate = "allow"
future_not_send = "allow"
significant_drop_tightening = "allow"
match_same_arms = "allow"
