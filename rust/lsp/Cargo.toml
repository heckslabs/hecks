[package]
name = "hecks_lsp"
version = "0.1.0"
edition = "2021"

# Empty table: makes this crate its own workspace root instead of joining `rust`'s.
[workspace]

[[bin]]
name = "hecks-lsp"
path = "src/main.rs"

# No dependencies beyond std: a small synchronous local tool. LSP stdio framing is a few lines,
# and src/json.rs vendors a minimal JSON pair as rust/build/src/json.rs does.
# Revisit if it ever needs to serve concurrent requests.
[dependencies]
