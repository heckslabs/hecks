plugins:
  - rubocop-rspec

# Local cops are loaded with `require:` (not `plugins:`) because they are not a gem.
require:
  - ./lib/rubocop/cop/hecks/fallback_hash_lookup
  - ./lib/rubocop/cop/hecks/thread_shared_ivar_mutation
  - ./lib/rubocop/cop/hecks/sequential_hash_rename_in_loop

# `h[a] || h[b]` on one receiver drops a stored `false`; use `key?` first.
Hecks/FallbackHashLookup:
  Enabled: true

# Dispatcher and Registry are shared across threads; a plain ivar mutation is a data race.
Hecks/ThreadSharedIvarMutation:
  Enabled: true
  Include:
    - "lib/hecks/runtime/dispatcher.rb"
    - "lib/hecks/runtime/registry.rb"
    # Verification and SagaPersistence reopen Registry, so their ivar writes count too.
    - "lib/hecks/runtime/registry/*.rb"

# `h[new] = h.delete(old)` looped over one hash loses data on swap or chain renames.
Hecks/SequentialHashRenameInLoop:
  Enabled: true

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Include:
    - "**/*.rb"
  Exclude:
    - "rust/**/*"
    - "vendor/**/*"
    # The comment sweep's one-off scripts; not framework code.
    - "**/docs/decisions/*/sweep-kit/**/*"
    # Generated files: linting the artifact instead of its generator drifts on the next regen.
    # The `**/` prefix is required; a bare relative path stopped matching under rubocop.
    - "**/lib/hecks/vocabulary.rb"
    - "**/lib/hecks/bluebook/dsl/bootstrap_table.rb"
    - "**/lib/hecks/projections/parser_table.rb"
    - "**/lib/hecks/bluebook/policy.rb"

# Everything below is a deliberate override of a RuboCop default. Any cop not named here
# runs at its default; see docs/decisions/0091-rubocop-defaults-with-deliberate-overrides.md.

# frozen_string_literal: this codebase has exactly one file that opts
# in (Gemfile); enforcing it repo-wide would be churn with no bug behind it.
Style/FrozenStringLiteralComment:
  Enabled: false

# The comment linter (style_run.check_comments) owns comment length at 100 columns,
# so a full-line comment is exempt here; code itself still holds to 130.
Layout/LineLength:
  Max: 130
  AllowedPatterns:
    - '\A\s*#'

# Double-quoted strings and table-aligned hashes are the codebase convention.
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
Layout/HashAlignment:
  EnforcedHashRocketStyle: table
  EnforcedColonStyle: table

# Explicit quoted literals are preferred over %w/%i.
Style/WordArray:
  Enabled: false
Style/SymbolArray:
  Enabled: false

# module_function is deliberate: `Hecks::QueryIR.constructs(...)`, never an instance.
Style/ModuleFunction:
  Enabled: false

# Struct-based value types are deliberate.
Style/OpenStructUse:
  Enabled: false

# Persistence and query adapters share one kwarg signature, so an adapter may ignore a kwarg.
# Renaming an unused keyword would break callers that pass it by name.
Lint/UnusedMethodArgument:
  AllowUnusedKeywordArguments: true

# A `.bluebook` file is a Ruby DSL script, so `Kernel.eval` on repo-committed sources or
# spec fixtures is the gem's job, not an untrusted-input hazard.
Security/Eval:
  Enabled: false

# Many spec files describe a WORD ("the DSL reference"), a behavior, or a domain scenario,
# not one Ruby class.
RSpec/DescribeClass:
  Enabled: false

# Specs are not one file per class mirroring lib/: no `hecks/` prefix, one file per
# concern for large classes, and directory names shorter than the namespace.
RSpec/SpecFilePathFormat:
  Enabled: false

# The suite has no transactional rollback to lose; `before(:context)` exists to boot
# Postgres, cargo or deploy dry-runs once per file rather than per example.
RSpec/BeforeAfterAll:
  Enabled: false

# Spec constants are file-local fixtures; spec/load_hygiene_spec.rb fails on colliding
# constant names across spec files, and `stub_const` does not fit a fixture with no
# prior value.
Lint/ConstantDefinitionInBlock:
  Enabled: false
RSpec/LeakyConstantDeclaration:
  Enabled: false

# `let` would rerun `before(:context)` setup per example, or skip unconditional `before`
# side effects that examples depend on without naming the value.
RSpec/InstanceVariable:
  Enabled: false
