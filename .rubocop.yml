inherit_from: .rubocop_todo.yml

inherit_mode:
  merge:
    - Exclude

plugins:
  - rubocop-rspec
  - rubocop-performance
  - rubocop-thread_safety

# Local cops are loaded with `require:` (not `plugins:`) because they are not a gem.
require:
  - ./lib/rubocop/cop/hecks/fallback_hash_lookup
  - ./lib/rubocop/cop/hecks/thread_shared_ivar_mutation
  - ./lib/rubocop/cop/hecks/sequential_hash_rename_in_loop

# `h[a] || h[b]` on one receiver drops a stored `false`; use `key?` first.
Hecks/FallbackHashLookup:
  Enabled: true

# Memoized class-level state is the codebase's norm; only the runtime shared across threads
# is held to it (Hecks/ThreadSharedIvarMutation covers the dispatcher and registry writes).
ThreadSafety/ClassInstanceVariable:
  Include:
    - "lib/hecks/runtime/**/*.rb"

# Dispatcher and Registry are shared across threads; a plain ivar mutation is a data race.
Hecks/ThreadSharedIvarMutation:
  Enabled: true
  Include:
    - "lib/hecks/runtime/dispatcher.rb"
    - "lib/hecks/runtime/registry.rb"
    # Verification and SagaPersistence reopen Registry, so their ivar writes count too.
    - "lib/hecks/runtime/registry/*.rb"

# `h[new] = h.delete(old)` looped over one hash loses data on swap or chain renames.
Hecks/SequentialHashRenameInLoop:
  Enabled: true

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Include:
    - "**/*.rb"
  Exclude:
    - "rust/**/*"
    - "vendor/**/*"
    # The comment sweep's one-off scripts; not framework code.
    - "**/docs/decisions/*/sweep-kit/**/*"
    # Generated files: linting the artifact instead of its generator drifts on the next regen.
    # The `**/` prefix is required; a bare relative path stopped matching under rubocop.
    - "**/lib/hecks/vocabulary.rb"
    - "**/lib/hecks/bluebook/dsl/bootstrap_table.rb"
    - "**/lib/hecks/projections/parser_table.rb"
    - "**/lib/hecks/bluebook/policy.rb"

# frozen_string_literal — this codebase has exactly one file that opts
# in (Gemfile); enforcing it repo-wide would be churn with no bug behind it.
Style/FrozenStringLiteralComment:
  Enabled: false

# Design rationale lives in long comments above methods, so comment-shape cops stay off.
Layout/LineLength:
  Max: 130
  AllowedPatterns:
    - '\A\s*#' # a full-line comment can run long; code itself still holds to 130

Style/DocumentationMethod:
  Enabled: false

# Double-quoted strings and table-aligned hashes are already the codebase convention.
Style/StringLiterals:
  EnforcedStyle: double_quotes
Layout/HashAlignment:
  EnforcedHashRocketStyle: table
  EnforcedColonStyle: table

# Explicit quoted literals are preferred over %w/%i.
Style/WordArray:
  Enabled: false
Style/SymbolArray:
  Enabled: false

Style/CommentedKeyword:
  Enabled: false

# module_function is deliberate: `Hecks::QueryIR.constructs(...)`, never an instance.
Style/ModuleFunction:
  Enabled: false

# Struct-based value types are deliberate.
Style/OpenStructUse:
  Enabled: false

# Limits are loosened to fit large, already-correct builders; they still catch new runaways.
Metrics/ClassLength:
  Max: 400
Metrics/ModuleLength:
  Max: 350
  Exclude:
    - "spec/**/*" # an RSpec describe block is one big module by construction; RSpec/*Length cops below own this instead
Metrics/MethodLength:
  Max: 40
Metrics/AbcSize:
  Max: 45
Metrics/CyclomaticComplexity:
  Max: 12
Metrics/PerceivedComplexity:
  Max: 12
Metrics/BlockLength:
  Exclude:
    - "spec/**/*" # RSpec/*Length below owns spec files' block shape instead

# Persistence and query adapters share one kwarg signature, so an adapter may ignore a kwarg.
# Renaming an unused keyword would break callers that pass it by name.
Lint/UnusedMethodArgument:
  AllowUnusedKeywordArguments: true

# Specs use long `it` strings and deep contexts; limits are loosened, not disabled.
RSpec/ExampleLength:
  Max: 25
RSpec/MultipleExpectations:
  Max: 10
RSpec/NestedGroups:
  Max: 5
RSpec/DescribeClass:
  Enabled: false # many spec files describe a WORD ("the DSL reference"), a behavior, or a domain scenario, not one Ruby class
RSpec/MultipleMemoizedHelpers:
  Max: 12

# Security/Eval and Lint/SuppressedException stay default so inline disables still mean something.

# Control-flow cops are disabled because their autocorrect changes behavior.
# Style/SoleNestedConditional duplicated a condition when autocorrected.
Style/SoleNestedConditional:
  Enabled: false
Style/IfInsideElse:
  Enabled: false
Style/Next:
  Enabled: false
Style/GuardClause:
  Enabled: false

# Lint/UnusedBlockArgument autocorrect renames block params that DSL builders read by
# reflection (`block.parameters`), which breaks them.
Lint/UnusedBlockArgument:
  Enabled: false

# RSpec/ScatteredSetup autocorrect merged two `before` blocks and moved an early `next`
# ahead of seeding, so spec/adapters/query_agreement_spec.rb silently seeded nothing.
# Autocorrect is only run for Layout/* and the Style cops configured above.
RSpec/ScatteredSetup:
  Enabled: false

# Style/CombinableLoops autocorrect merged loops in dispatcher.rb (reordering policies and
# sagas) and produced a syntax error in aggregate_builder.rb.
Style/CombinableLoops:
  Enabled: false

# A `.bluebook` file is a Ruby DSL script, so `Kernel.eval` on repo-committed sources or
# spec fixtures is the gem's job, not an untrusted-input hazard.
Security/Eval:
  Enabled: false

# The suite has no transactional rollback to lose; `before(:context)` exists to boot
# Postgres, cargo or deploy dry-runs once per file rather than per example.
RSpec/BeforeAfterAll:
  Enabled: false

# Specs are not one file per class mirroring lib/: no `hecks/` prefix, one file per
# concern for large classes, and directory names shorter than the namespace.
RSpec/SpecFilePathFormat:
  Enabled: false

# Spec constants are file-local fixtures; spec/load_hygiene_spec.rb fails on colliding
# constant names across spec files, and `stub_const` does not fit a fixture with no
# prior value.
Lint/ConstantDefinitionInBlock:
  Enabled: false
RSpec/LeakyConstantDeclaration:
  Enabled: false

# `let` would rerun `before(:context)` setup per example, or skip unconditional `before`
# side effects that examples depend on without naming the value.
RSpec/InstanceVariable:
  Enabled: false
