plugins:
  - rubocop-rspec
  - rubocop-performance
  - rubocop-thread_safety

# Local cops are loaded with `require:` (not `plugins:`) because they are not a gem.
require:
  - ./lib/rubocop/cop/hecks/fallback_hash_lookup
  - ./lib/rubocop/cop/hecks/thread_shared_ivar_mutation
  - ./lib/rubocop/cop/hecks/sequential_hash_rename_in_loop
  - ./lib/rubocop/cop/hecks/no_wall_clock_in_runtime
  - ./lib/rubocop/cop/hecks/no_transport_in_runtime
  - ./lib/rubocop/cop/hecks/monotonic_duration
  - ./lib/rubocop/cop/hecks/raw_shell_interpolation
  - ./lib/rubocop/cop/hecks/env_dump
  - ./lib/rubocop/cop/hecks/untyped_raise
  - ./lib/rubocop/cop/hecks/swallowed_rescue
  - ./lib/rubocop/cop/hecks/symbol_string_key_mix
  - ./lib/rubocop/cop/hecks/sleep_in_spec
  - ./lib/rubocop/cop/hecks/rails_model_rules
  - ./lib/rubocop/cop/hecks/train_wreck
  - ./lib/rubocop/cop/hecks/unnamed_pipeline
  - ./lib/rubocop/cop/hecks/inline_regexp
  - ./lib/rubocop/cop/hecks/inline_single_field_value_object

# `value_object "X" do attribute :value, T end` with nothing else is the shorthand
# `value_object "X", T`; the block adds nothing. Scope: the Ruby files RuboCop already covers.
Hecks/InlineSingleFieldValueObject:
  Enabled: true

# `h[a] || h[b]` on one receiver drops a stored `false`; use `key?` first.
Hecks/FallbackHashLookup:
  Enabled: true

# Memoized class-level state is the codebase's norm; only the runtime shared across threads
# is held to it (Hecks/ThreadSharedIvarMutation covers the dispatcher and registry writes).
ThreadSafety/ClassInstanceVariable:
  Include:
    - "lib/hecks/runtime/**/*.rb"
  Exclude:
    # Idempotent memoized lookups: a racing first call computes the same value twice.
    - "lib/hecks/runtime/adapter_lookup.rb"
    - "lib/hecks/runtime/refusal_wording.rb"
# Registries and caches are mutable by design; freezing them breaks registration at load.
ThreadSafety/MutableClassInstanceVariable:
  Enabled: false
ThreadSafety/ClassAndModuleAttributes:
  Include:
    - "lib/hecks/runtime/**/*.rb"
# Specs, CLI tools and gates spawn threads and chdir on purpose, in one process they own.
ThreadSafety/NewThread:
  Include:
    - "lib/hecks/runtime/**/*.rb"
ThreadSafety/DirChdir:
  Include:
    - "lib/hecks/runtime/**/*.rb"

# Ruby compiles `[:a, :b].include?(x)` on a literal without allocating, and the rest are cold paths.
Performance/CollectionLiteralInLoop:
  Enabled: false

# `filter_map` drops `false` as well as `nil`, and these chains carry boolean read-model values.
Performance/MapCompact:
  Enabled: false

# `&method(:name)` in a spec reads as the intent; the allocation is irrelevant there.
Performance/MethodObjectAsBlock:
  Exclude:
    - "spec/**/*"

# Dispatcher and Registry are shared across threads; a plain ivar mutation is a data race.
Hecks/ThreadSharedIvarMutation:
  Enabled: true
  Include:
    - "lib/hecks/runtime/dispatcher.rb"
    - "lib/hecks/runtime/registry.rb"
    # Verification and SagaPersistence reopen Registry, so their ivar writes count too.
    - "lib/hecks/runtime/registry/*.rb"

# `h[new] = h.delete(old)` looped over one hash loses data on swap or chain renames.
Hecks/SequentialHashRenameInLoop:
  Enabled: true

# A replay must reproduce the run, so the runtime reads time only through `needs :now` or
# Event.stamp; Event itself is the seam that holds the one wall-clock read.
Hecks/NoWallClockInRuntime:
  Enabled: true
  Include:
    - "lib/hecks/runtime/**/*.rb"
  Exclude:
    - "lib/hecks/runtime/event.rb"

# The hecksagon boundary: the runtime runs the domain and knows no transport. HTTP, Lambda, the
# shell and the environment live in adapters, which call into the runtime and register with it.
Hecks/NoTransportInRuntime:
  Enabled: true
  Include:
    - "lib/hecks/runtime.rb"
    - "lib/hecks/runtime/**/*.rb"
    - "lib/hecks/ports.rb"
    - "lib/hecks/ports/**/*.rb"
    - "lib/hecks/bluebook.rb"
    - "lib/hecks/bluebook/**/*.rb"
  Exclude:
    - "lib/hecks/runtime/adapter_namespace.rb"

# Elapsed time is measured on the monotonic clock; `Time.now - File.mtime(f)` is left alone.
Hecks/MonotonicDuration:
  Enabled: true

# A command string with a value interpolated into it is re-parsed by the shell; the array form
# passes each argument as-is. Shellwords.escape-wrapped values are left alone.
Hecks/RawShellInterpolation:
  Enabled: true

# A Rails model over a Hecks aggregate is a skin: validations, callbacks and associations live in
# the bluebook, where the domain states each rule once.
Hecks/RailsModelRules:
  Enabled: true

# Secrets stay out of strings and output (1Password-only rule): no printing the whole
# environment, no interpolating a *_KEY/_SECRET/_TOKEN/_PASSWORD variable.
Hecks/EnvDump:
  Enabled: true

# A bare `raise "message"` is a RuntimeError, so a caller can only rescue it by rescuing
# everything; library code names the error. Specs raise strings from test doubles on purpose.
Hecks/UntypedRaise:
  Enabled: true
  Include:
    - "lib/**/*.rb"

# A broad rescue that answers a literal hides a crash as "no result"; the runtime names a
# deliberate guard with Runtime::BestEffort.call(default), and rescues a named error otherwise.
Hecks/SwallowedRescue:
  Enabled: true
  Include:
    - "lib/hecks/runtime/**/*.rb"

# A hash is symbol-keyed under one adapter and string-keyed under another; the guess between the
# two spellings is made once, in Hecks::IndifferentKey, not at each reader.
Hecks/SymbolStringKeyMix:
  Enabled: true
  Include:
    - "lib/**/*.rb"

# A fixed sleep guesses how long another thread needs; a spec waits on the thread itself
# (a Queue, or ThreadParking.wait_until_parked for "still blocked").
Hecks/SleepInSpec:
  Enabled: true
  Include:
    - "spec/**/*.rb"

# A caller asks the object it holds; it does not reach through it into a collaborator
# (`runtime.registry.bluebooks`). Conversions and collection calls are not reaches.
Hecks/TrainWreck:
  Enabled: true
  MaxReaches: 1
  Include:
    - "lib/**/*.rb"
  # A cop walks one syntax tree: `node.parent.receiver` is navigation, not a reach.
  Exclude:
    - "lib/rubocop/**/*.rb"

# A pipeline longer than three calls is extracted into a method named for what it makes.
# Naming and Text are where the shared pipelines get their names, so they hold them whole.
Hecks/UnnamedPipeline:
  Enabled: true
  MaxCalls: 3
  Include:
    - "lib/**/*.rb"
  Exclude:
    - "lib/hecks/naming.rb"
    - "lib/hecks/text.rb"

# A regexp is a named constant, so it says what it matches and is written once.
Hecks/InlineRegexp:
  Enabled: true
  Include:
    - "lib/**/*.rb"

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Include:
    - "**/*.rb"
    - "**/*.bluebook"
  Exclude:
    - "rust/**/*"
    - "vendor/**/*"
    # Sentence-form bluebooks are not Ruby; RuboCop cannot parse them.
    - "spec/fixtures/sentence/**/*.bluebook"
    - "spec/fixtures/sentence_examples/**/*.bluebook"
    # Gitignored scratch (probes, fuzz output): never shipped, absent from CI and from a clean
    # checkout, so an untracked file there must not fail the gate on one machine.
    - "tmp/**/*"
    # The comment sweep's one-off scripts; not framework code.
    - "**/docs/decisions/*/sweep-kit/**/*"
    # Generated files: linting the artifact instead of its generator drifts on the next regen.
    # The `**/` prefix is required; a bare relative path stopped matching under rubocop.
    - "**/lib/hecks/vocabulary.rb"
    - "**/lib/hecks/bluebook/dsl/bootstrap_table.rb"
    - "**/lib/hecks/projections/parser_table.rb"
    - "**/lib/hecks/bluebook/policy.rb"

# Everything below is a deliberate override of a RuboCop default. Any cop not named here
# runs at its default; see docs/decisions/0091-rubocop-defaults-with-deliberate-overrides.md.

# frozen_string_literal: this codebase has exactly one file that opts
# in (Gemfile); enforcing it repo-wide would be churn with no bug behind it.
Style/FrozenStringLiteralComment:
  Enabled: false

# The comment linter (style_run.check_comments) owns comment length at 100 columns,
# so a full-line comment is exempt here; code itself still holds to 130.
Layout/LineLength:
  # characterization tables with one long row per line
  Exclude:
    - "spec/runtime/invocation_spec.rb"
  Max: 130
  AllowedPatterns:
    - '\A\s*#'

# Double-quoted strings and table-aligned hashes are the codebase convention.
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
Layout/HashAlignment:
  # the multi-line procs overrun LineLength under table alignment
  Exclude:
    - "spec/translation/language_spec.rb"
  EnforcedHashRocketStyle: table
  EnforcedColonStyle: table

# Explicit quoted literals are preferred over %w/%i.
Style/WordArray:
  Enabled: false
Style/SymbolArray:
  Enabled: false

# module_function is deliberate: `Hecks::QueryIR.constructs(...)`, never an instance.
Style/ModuleFunction:
  Enabled: false

# Struct-based value types are deliberate.
Style/OpenStructUse:
  Enabled: false

# Persistence and query adapters share one kwarg signature, so an adapter may ignore a kwarg.
# Renaming an unused keyword would break callers that pass it by name.
Lint/UnusedMethodArgument:
  AllowUnusedKeywordArguments: true

# A `.bluebook` file is a Ruby DSL script, so `Kernel.eval` on repo-committed sources or
# spec fixtures is the gem's job, not an untrusted-input hazard.
Security/Eval:
  Enabled: false

# Many spec files describe a WORD ("the DSL reference"), a behavior, or a domain scenario,
# not one Ruby class.
RSpec/DescribeClass:
  Enabled: false

# Specs are not one file per class mirroring lib/: no `hecks/` prefix, one file per
# concern for large classes, and directory names shorter than the namespace.
RSpec/SpecFilePathFormat:
  Enabled: false

# The suite has no transactional rollback to lose; `before(:context)` exists to boot
# Postgres, cargo or deploy dry-runs once per file rather than per example.
RSpec/BeforeAfterAll:
  Enabled: false

# Spec constants are file-local fixtures; spec/load_hygiene_spec.rb fails on colliding
# constant names across spec files, and `stub_const` does not fit a fixture with no
# prior value.
Lint/ConstantDefinitionInBlock:
  Enabled: false
RSpec/LeakyConstantDeclaration:
  Enabled: false

# `let` would rerun `before(:context)` setup per example, or skip unconditional `before`
# side effects that examples depend on without naming the value.
RSpec/InstanceVariable:
  Enabled: false

# Overrides moved from inline `rubocop:disable` comments; each cop states its reason once.
# `private` does not reach `def self.`; the entry point is public on purpose
Lint/IneffectiveAccessModifier:
  Exclude:
    - "lib/hecks/bluebook/dsl/port_operation_builder.rb"

# deliberately escapes `rescue => e`, which catches StandardError only
Lint/InheritException:
  Exclude:
    - "spec/runtime/saga_crash_recovery_spec.rb"

# rolls back, then re-raises
Lint/RescueException:
  Exclude:
    - "lib/hecks/framework_bluebooks.rb"

# the member shadows a Struct or Enumerable method on purpose; the file says which, and specs assert on it
Lint/StructNewOverride:
  Exclude:
    - "lib/hecks/bluebook/dsl/attribute_collector.rb"
    - "lib/hecks/bluebook/meta_validator/plan/category.rb"
    - "lib/hecks/bluebook/translation.rb"
    - "lib/hecks/runtime/entity_interpreter.rb"

# the block parameter's name is read by reflection
Lint/UnusedBlockArgument:
  Exclude:
    - "spec/dsl_spec.rb"

# spec boot helpers wire a whole runtime; splitting them hides the wiring
Metrics/AbcSize:
  Exclude:
    - "spec/fuzzing/fan_out_spec.rb"
    - "spec/mutation_arithmetic_absent_current_spec.rb"
    - "spec/runtime/copy_from_state_spec.rb"
    - "spec/runtime/ensures_spec.rb"
    - "spec/runtime/policy_emitter_identity_spec.rb"
    - "spec/runtime/policy_fan_out_key_spec.rb"
    - "spec/runtime/policy_projection_spec.rb"
    - "spec/runtime/policy_spec.rb"
    - "spec/runtime/query_interpreter_entity_paging_spec.rb"

# spec boot helpers wire a whole runtime; splitting them hides the wiring
Metrics/MethodLength:
  Exclude:
    - "spec/fuzzing/fan_out_spec.rb"
    - "spec/mutation_arithmetic_absent_current_spec.rb"
    - "spec/runtime/copy_from_state_spec.rb"
    - "spec/runtime/ensures_spec.rb"
    - "spec/runtime/policy_emitter_identity_spec.rb"
    - "spec/runtime/policy_fan_out_key_spec.rb"
    - "spec/runtime/policy_projection_spec.rb"
    - "spec/runtime/policy_spec.rb"
    - "spec/runtime/query_interpreter_entity_paging_spec.rb"

# keyword and positional signatures every caller spells out; a parameter object would hide the call shape
Metrics/ParameterLists:
  Exclude:
    - "lib/hecks/adapters/driven/tenant_provisioner.rb"
    - "lib/hecks/adapters/driving/cli_runner/answers.rb"
    - "lib/hecks/adapters/driving/cli_runner/settling.rb"
    - "lib/hecks/adapters/driving/cli_runner/streaming.rb"
    - "lib/hecks/cli/interview_run.rb"
    - "lib/hecks/cli/interview_session.rb"
    - "lib/hecks/cli/project_cli/launcher_source.rb"
    - "lib/hecks/hecks/adapters/in_process_operations.rb"
    - "lib/hecks/runtime/command_interpreter.rb"
    - "lib/hecks/runtime/command_rules/admissibility.rb"
    - "lib/hecks/runtime/command_rules/emission.rb"
    - "lib/hecks/runtime/dispatcher.rb"
    - "lib/hecks/runtime/entity_element/location.rb"
    - "lib/hecks/runtime/entity_element/mutations.rb"
    - "lib/hecks/runtime/instance.rb"
    - "lib/hecks/runtime/invocation_builder.rb"
    - "lib/hecks/runtime/reaction_invocation.rb"
    - "lib/hecks/runtime/saga_interpreter/delivery.rb"

# returns the operation's outcome (a row, a value, a verdict); the name is the port's verb, not a question
Naming/PredicateMethod:
  Exclude:
    - "lib/hecks/adapters/driven/heki.rb"
    - "lib/hecks/adapters/driven/in_process_key_vault.rb"
    - "lib/hecks/adapters/driven/memory/outbox_rows.rb"
    - "lib/hecks/adapters/driven/postgres/outbox.rb"
    - "lib/hecks/adapters/driven/postgres/repository.rb"
    - "lib/hecks/adapters/driven/postgres_era.rb"
    - "lib/hecks/adapters/driven/sqlite/dispatch_claims.rb"
    - "lib/hecks/adapters/driven/sqlite/outbox.rb"
    - "lib/hecks/adapters/driven/sqlite/repository.rb"
    - "lib/hecks/composer/jobs.rb"
    - "lib/hecks/ports/key_vault.rb"
    - "lib/hecks/ports/persistence/append_only.rb"
    - "lib/hecks/tools/evolve_run.rb"
    - "lib/hecks/tools/fuzz_sweep/pool.rb"

# the DSL verb is the name a bluebook author writes
Naming/PredicatePrefix:
  Exclude:
    - "lib/hecks/bluebook/dsl/aggregate_builder/relationships.rb"
    - "lib/hecks/bluebook/dsl/entity_builder.rb"

# a scenario example carries its whole bluebook fixture
RSpec/ExampleLength:
  Exclude:
    - "spec/entity_attribute_type_resolution_spec.rb"
    - "spec/rust_conformance_fuzz_spec.rb"
    - "spec/world_binding_settings_spec.rb"

# the spec exercises console output
RSpec/Output:
  Exclude:
    - "spec/adapters/driven/console_capture_spec.rb"
    - "spec/support/fake_codebase_shell.rb"

# the probe constant must not outlive the example
RSpec/RemoveConst:
  Exclude:
    - "spec/facade_constant_isolation_spec.rb"
    - "spec/support/facade_constant_isolation.rb"
    - "spec/support/in_process_launcher.rb"

# reads our own cache or the gem's own file, never external input
Security/MarshalLoad:
  Exclude:
    - "lib/hecks/bluebook/meta_validator/syntax_boot/disk_cache.rb"

# the bluebook expression language refuses between?; the spelling is the case under test
Style/ComparableBetween:
  Exclude:
    - "spec/dsl_spec.rb"

# deliberately without file and line: exercises the untraceable-source refusal
Style/EvalWithLocation:
  Exclude:
    - "spec/dsl_spec.rb"

# the text is curl's own token or table row text, not a Ruby format string
Style/FormatStringToken:
  Exclude:
    - "lib/hecks/projections/ci_pipeline/table/checks.rb"
    - "lib/hecks/projections/deploy/box/roll_scripts.rb"

# a forked child reopens the standard streams to capture its output
Style/GlobalStdStream:
  Exclude:
    - "lib/hecks/tools/regeneration_run/pool.rb"

# registries and caches are mutable by design (see ThreadSafety/MutableClassInstanceVariable)
Style/MutableConstant:
  Exclude:
    - "lib/hecks/adapters/driven/postgres/shared_connection.rb"
    - "lib/hecks/adapters/driven/prism.rb"
    - "lib/hecks/adapters/driving.rb"
    - "lib/hecks/behaviors/expectations/boot.rb"
    - "lib/hecks/ports/persistence/codec_boundary.rb"
    - "lib/hecks/runtime/dependency_planning/expression_reads.rb"
